<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../icon.png" type="image/png"/>
<script>
(function(){
  const t = (localStorage.getItem('ui_theme_v1') || 'light').toLowerCase();
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Login — Sistema Escolar</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #f4f3ff;
  --card:         #ffffff;
  --ink:          #1e1b4b;
  --muted:        #6b7280;
  --line:         #ddd6fe;
  --brand:        #7c3aed;
  --brand-hover:  #6d28d9;
  --brand-faded:  #f5f3ff;
  --brand-border: #ddd6fe;
  --brand-text:   #6d28d9;
  --danger:       #b91c1c;
  --field-bg:     #ffffff;
  --field-border: #ddd6fe;
  --chip:         #f5f3ff;
}
html[data-theme="dark"] {
  --bg:           #0a0e1a;
  --card:         #131c2e;
  --ink:          #e2e8f0;
  --muted:        #94a3b8;
  --line:         #2a3a5c;
  --brand:        #7c3aed;
  --brand-hover:  #6d28d9;
  --brand-faded:  rgba(124,58,237,0.20);
  --brand-border: #7c3aed;
  --brand-text:   #c4b5fd;
  --danger:       #ef4444;
  --field-bg:     #0a1426;
  --field-border: #1e2540;
  --chip:         rgba(124,58,237,0.15);
}

body {
  font-family: 'Nunito', ui-sans-serif, system-ui, sans-serif;
  font-size: 15px;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  transition: background 0.3s;
}
html[data-theme="dark"] body {
  background:
    radial-gradient(900px 500px at 20% 10%, rgba(124,58,237,0.12), transparent 60%),
    radial-gradient(700px 400px at 70% 60%, rgba(59,130,246,0.07), transparent 60%),
    var(--bg);
}

/* ── Barra gradiente ── */
.grad-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 100;
  background: linear-gradient(90deg, #7c3aed, #3b82f6, #06b6d4);
}

/* ── Card ── */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 40px 36px;
  width: 100%; max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.08);
  transition: background 0.3s, border-color 0.3s;
}

/* ── Logo ── */
.logo { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
.mark {
  width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
  background: var(--brand-faded); color: var(--brand-text);
  border: 1px solid var(--brand-border);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px;
  transition: all 0.3s;
}
.logo-text h1 { font-size: 18px; font-weight: 800; color: var(--ink); letter-spacing: -0.2px; }
.logo-text p  { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* ── Campos ── */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--muted); }
.field input {
  width: 100%; padding: 11px 14px;
  border: 1px solid var(--field-border); border-radius: 10px;
  background: var(--field-bg); color: var(--ink);
  font-size: 14px; font-family: inherit; outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
}

/* ── Botão primário ── */
.btn-primary {
  width: 100%; padding: 13px; border-radius: 10px; border: none;
  background: var(--brand); color: #fff;
  font-weight: 800; font-size: 15px; font-family: inherit;
  cursor: pointer; transition: background 0.15s;
}
.btn-primary:hover    { background: var(--brand-hover); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

/* ── Divisor ── */
.divider {
  display: flex; align-items: center; gap: 12px;
  margin: 20px 0; color: var(--muted); font-size: 13px;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* ── Botão Google ── */
.btn-google {
  width: 100%; padding: 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  font-weight: 700; font-size: 14px; font-family: inherit;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: background 0.15s, border-color 0.15s;
}
.btn-google:hover    { background: var(--brand-faded); border-color: var(--brand-border); }
.btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
.google-icon { width: 20px; height: 20px; flex-shrink: 0; }

/* ── Erro ── */
.error {
  background: rgba(185,28,28,0.10); border: 1px solid rgba(185,28,28,0.25);
  color: var(--danger); border-radius: 10px; padding: 10px 14px;
  font-size: 13px; font-weight: 600; margin-bottom: 16px; display: none;
}
.error.show { display: block; }

/* ── Spinner ── */
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Botão tema ── */
.theme-btn {
  position: fixed; top: 18px; right: 18px;
  padding: 8px 14px; border-radius: 8px;
  border: 1px solid var(--brand-border);
  background: var(--brand-faded); color: var(--brand-text);
  font-size: 12px; font-weight: 800; font-family: inherit; cursor: pointer;
  transition: background 0.18s, color 0.18s, border-color 0.18s;
  z-index: 50;
}
.theme-btn:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
</style>
<script src="auth.firebase.js"></script>
</head>
<body>

<div class="grad-bar"></div>

<button class="theme-btn" id="themeBtn">🌙 Escuro</button>

<div class="card">
  <div class="logo">
    <div class="mark">SE</div>
    <div class="logo-text">
      <h1>Sistema Escolar</h1>
      <p>Acesse com sua conta</p>
    </div>
  </div>

  <div class="error" id="errMsg"></div>

  <div class="field">
    <label for="inputEmail">E-mail</label>
    <input type="email" id="inputEmail" placeholder="seu@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label for="inputPassword">Senha</label>
    <input type="password" id="inputPassword" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-primary" id="btnEmail">Entrar</button>

  <div class="divider">ou</div>

  <button class="btn-google" id="btnGoogle">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Entrar com Google
  </button>

  <div style="margin-top:24px;text-align:center;font-size:13px;color:var(--muted)">
    Não tem conta?
    <a href="cadastro_usuario.html" style="color:var(--brand);font-weight:800;text-decoration:none;">Criar cadastro</a>
  </div>
</div>

<script>
(function(){
  /* ── Erro por URL ── */
  const params = new URLSearchParams(location.search);
  if (params.get('erro') === 'conta-pendente') {
    const el = document.getElementById('errMsg');
    if (el) { el.textContent = 'Sua conta ainda está aguardando aprovação de um administrador.'; el.classList.add('show'); }
  }

  /* ── Tema ── */
  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('ui_theme_v1', t);
    themeBtn.textContent = t === 'dark' ? '☀️ Claro' : '🌙 Escuro';
  }
  applyTheme(localStorage.getItem('ui_theme_v1') || 'light');
  themeBtn.addEventListener('click', () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ── Refs ── */
  const btnEmail  = document.getElementById('btnEmail');
  const btnGoogle = document.getElementById('btnGoogle');
  const emailInp  = document.getElementById('inputEmail');
  const passInp   = document.getElementById('inputPassword');
  const errMsg    = document.getElementById('errMsg');

  function showError(msg) { errMsg.textContent = msg; errMsg.classList.add('show'); }
  function clearError()   { errMsg.classList.remove('show'); }

  function setLoading(on) {
    btnEmail.disabled = btnGoogle.disabled = on;
    btnEmail.innerHTML = on ? '<span class="spinner"></span> Entrando...' : 'Entrar';
  }

  function getRedirect() {
    const p = new URLSearchParams(location.search).get('next');
    if (p) try { const url = decodeURIComponent(p); if (url.startsWith(location.origin) || url.startsWith('/')) return url; } catch {}
    return '/index.html';
  }

  document.addEventListener('auth:ready', () => {
    const s = window.Auth && Auth.getSession();
    if (s && s.role !== 'pending') window.location.replace(getRedirect());
  });

  async function doEmailLogin() {
    clearError();
    const email = emailInp.value.trim();
    const pass  = passInp.value;
    if (!email || !pass) { showError('Preencha e-mail e senha.'); return; }
    setLoading(true);
    try {
      await Auth.loginEmail(email, pass);
      window.location.replace(getRedirect());
    } catch(e) {
      const msg = e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found' ? 'E-mail ou senha incorretos.'
                : e.code === 'auth/too-many-requests' ? 'Muitas tentativas. Aguarde alguns minutos.'
                : (e.message || 'Erro ao entrar. Tente novamente.');
      showError(msg);
      setLoading(false);
    }
  }

  btnEmail.addEventListener('click', doEmailLogin);
  passInp.addEventListener('keydown', e => { if (e.key === 'Enter') doEmailLogin(); });

  btnGoogle.addEventListener('click', async () => {
    clearError(); setLoading(true);
    try {
      await Auth.loginGoogle();
      window.location.replace(getRedirect());
    } catch(e) {
      showError(e.message || 'Erro ao entrar com Google.');
      setLoading(false);
    }
  });
})();
</script>
</body>
</html>
