<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<link rel="icon" href="../icon.png" type="image/png"/>

<!-- ══ Theme init (antes de tudo) ══ -->
<script>
(function(){
  const KEY = 'ui_theme_v1';
  const saved = (localStorage.getItem(KEY) || '').toLowerCase();
  const theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<!-- ══ Firebase & System Scripts ══ -->
<script src="../loading-overlay.js"></script>
<script src="../auth.firebase.js"></script>
<script src="../db.firebase.js"></script>
<script src="../theme-colors.js"></script>

<!-- ══ Fonts ══ -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- ══ CSS Externo (ordem correta) ══ -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pesquisa-funcionario.css?v=3">

<style>
/* ── Aliases de marca (par claro/escuro) — mesmos nomes do cadastro-funcionario ──
   var(--primary, #7c3aed) não existe no sistema (caía sempre no roxo fixo). */
:root{
  --pf-brand:var(--brand,#7c3aed);
  --pf-brand-text:var(--brand-text,#6d28d9);
  --pf-brand-faded:var(--brand-faded,#f5f3ff);
  --pf-brand-border:var(--brand-border,#ddd6fe);
}
html[data-theme="dark"]{
  --pf-brand:var(--brand-d,#8b5cf6);
  --pf-brand-text:var(--brand-text-d,#c4b5fd);
  --pf-brand-faded:var(--brand-faded-d,rgba(124,58,237,.18));
  --pf-brand-border:var(--brand-border-d,#7c3aed);
}

/* ── Card de destaque (guia, Parte 1.3b) — contraste vem de ThemeColors.ajustarContraste() ── */
.card.card-destaque{
  --dest-fg:#ffffff;
  --dest-btn-bg:rgba(255,255,255,.18);
  --dest-btn-bd:rgba(255,255,255,.40);
  --dest-btn-hover:rgba(255,255,255,.28);
  --dest-panel-bg:rgba(255,255,255,.10);
  background:var(--btn-home-bg); border-color:var(--btn-home-border);
}
html[data-theme="dark"] .card.card-destaque{ background:var(--btn-home-bg); border-color:var(--btn-home-border); }
.card.card-destaque.contraste-claro{
  --dest-fg:#0f172a;
  --dest-btn-bg:rgba(0,0,0,.08);
  --dest-btn-bd:rgba(0,0,0,.25);
  --dest-btn-hover:rgba(0,0,0,.16);
  --dest-panel-bg:rgba(0,0,0,.06);
  border-color:var(--border);
}
.card.card-destaque h2{ color:var(--dest-fg); }
/* só o rótulo direto do campo: os <label> dentro dos chips de turno herdam a cor do chip */
.card-destaque .field > label{ color:var(--dest-fg); }
.card.card-destaque .btn.primary{ background:var(--dest-btn-bg); border:1.5px solid var(--dest-fg); color:var(--dest-fg); font-weight:800; }
.card.card-destaque .btn.primary:hover:not(:disabled){ background:var(--dest-btn-hover); border-color:var(--dest-fg); color:var(--dest-fg); }
.card.card-destaque .btn.secondary, .card.card-destaque .btn.ghost{ background:transparent; border:1.5px solid var(--dest-btn-bd); color:var(--dest-fg); }
.card.card-destaque .btn.secondary:hover:not(:disabled), .card.card-destaque .btn.ghost:hover:not(:disabled){ background:var(--dest-btn-hover); border-color:var(--dest-fg); color:var(--dest-fg); }
.card.card-destaque .btn:disabled, .card.card-destaque .btn:disabled:hover{
  background:rgba(128,128,128,.28); border:1.5px solid rgba(128,128,128,.5); color:#6b7280; opacity:1; cursor:not-allowed; filter:none; box-shadow:none;
}
/* Chips de turno dentro do destaque: o "marcado" antes era só uma borda --brand (some contra o próprio card).
   Agora: contorno translúcido; marcado = preenchimento sólido com o texto na cor do card (par calculado). */
.card.card-destaque .turno-checkbox-wrap{ background:transparent; border-color:var(--dest-btn-bd); color:var(--dest-fg); }
.card.card-destaque .turno-checkbox-wrap:hover{ background:var(--dest-btn-hover); border-color:var(--dest-fg); color:var(--dest-fg); }
.card.card-destaque .turno-checkbox-wrap.checked{ background:var(--dest-fg); border-color:var(--dest-fg); color:var(--btn-home-bg); }
.card.card-destaque .turno-checkbox-wrap.checked input[type="checkbox"]{ accent-color:var(--btn-home-bg); }
/* Chip de aviso dos turnos: o padrão (--chip-bg) ficava da cor do body no claro e da cor do card no escuro */
.card.card-destaque #turnoHint{ background:var(--dest-panel-bg); border:1px solid var(--dest-btn-bd); color:var(--dest-fg); }
.ano-erro{ margin-top:6px; font-size:12px; font-weight:700; color:var(--dest-fg); }

/* ── Ícone de dica (ⓘ) — tooltip por toque/clique (guia, Parte 2) ── */
.info-tip{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  width:16px; height:16px; margin-left:6px; border-radius:50%;
  border:1.5px solid currentColor; color:inherit; opacity:.72;
  font-size:11px; font-weight:700; font-style:italic; font-family:Georgia, "Times New Roman", serif;
  line-height:1; cursor:pointer; user-select:none; vertical-align:middle;
}
.info-tip:hover, .info-tip.open{ opacity:1; background:rgba(127,127,127,.18); }
.info-tip-bubble{
  display:none; position:absolute; z-index:60; left:0; top:calc(100% + 8px);
  width:min(260px, 70vw); max-height:180px; overflow-y:auto; padding:10px 12px; border-radius:10px;
  background:var(--card); border:1.5px solid var(--border); color:var(--text);
  box-shadow:0 8px 24px rgba(0,0,0,.18); font-size:13px; font-weight:400; font-style:normal; line-height:1.4;
  white-space:normal; cursor:default; text-align:left; text-transform:none; letter-spacing:normal;
}
.info-tip.open .info-tip-bubble{ display:block; }

/* ── Contador de resultados: badge com destaque (substitui o log "X funcionário(s) encontrado(s)") ── */
#countFuncionarios{
  font-size:14px; font-weight:800; padding:5px 14px;
  background:var(--pf-brand); border-color:var(--pf-brand); color:var(--brand-fg,#fff);
}

/* ══ Padrão de exibição do sistema — adaptado de pesquisa-ano-ativo ══ */

/* ── Painel único (sem "turma", diferente do aluno) ── */
.panel         { background: var(--card-bg, var(--card)); border: 1px solid var(--card-border, var(--border)); border-radius: 14px; box-shadow: var(--shadow, 0 4px 20px rgba(0,0,0,0.06)); padding: 16px; margin-top: 16px; }
.panel-head    { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.panel h2      { font-size: 17px; margin: 0; font-weight: 800; }
.count         { background: var(--chip-bg); border: 1px solid var(--line, var(--border)); padding: 3px 10px; border-radius: 999px; font-size: 12px; color: var(--chip-color, var(--text)); font-weight: 700; }
.panel-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.list          { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media(max-width:860px){ .list { grid-template-columns: 1fr; } }
.loading       { font-size: 12px; color: var(--muted); margin-top: 8px; }

/* ── Cards de item (um por funcionário) ── */
.item        { border: 1px solid var(--card-border, var(--border)); border-radius: 10px; padding: 14px; background: var(--card-bg, var(--card)); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; transition: background .2s, border-color .2s; }
.item .left  { min-width: 0; flex: 1; }
.item .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
/* Sempre 3 blocos empilhados: nome / badges / meta-dados — não depende da largura */
.item .title    { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; font-size: 14px; }
.item .nome     { font-weight: 800; }
.item .badges   { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; }
.item .badges .badge { margin: 0; }
/* CPF: neutro (cinza do tema), pra se distinguir do badge de cargo, que é tingido de marca */
.item .badge.badge-cpf { background: color-mix(in srgb, var(--text) 8%, transparent); border-color: color-mix(in srgb, var(--text) 24%, transparent); color: var(--text); }
.item .meta-i { white-space: nowrap; }
/* Botões do card: mesma largura, empilhados */
.item .right { align-items: stretch; min-width: 112px; }
.item .right .btn { justify-content: center; }
.item .right .check { justify-content: center; }
.item .meta  { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.35; }

/* ── Seleção do card inteiro (checkbox oculto) — mesmo padrão do módulo de aluno ── */
.item.selecionavel { cursor: pointer; position: relative; }
.item.selecionavel .check { display: none; }
.item.selecionavel:has(.chkFuncionario:checked) {
  background: var(--brand-faded);
  border-color: var(--brand-hover, var(--brand-border));
}
html[data-theme="dark"] .item.selecionavel:has(.chkFuncionario:checked) {
  background: var(--brand-faded-d);
  border-color: var(--brand-border-d);
}
.item.selecionavel .selo-selecionado {
  display: none;
  position: absolute; bottom: 10px; right: 10px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--pf-brand); color: var(--brand-fg, #fff);
  align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; line-height: 1;
}
.item.selecionavel:has(.chkFuncionario:checked) .selo-selecionado { display: flex; }
.check           { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
.check input     { cursor: pointer; accent-color: var(--pf-brand); width: 18px; height: 18px; margin: 0; }
.check-all       { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 700; cursor: pointer; }
.check-all input { cursor: pointer; accent-color: var(--pf-brand); }
.count-selecionados { background: var(--pf-brand-faded); border: 1px solid var(--pf-brand-border); color: var(--pf-brand-text); }

/* ── Ordenação ── */
.sort-control        { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 10px 14px; background: var(--chip-bg); border: 1px solid var(--card-border, var(--border)); border-radius: 10px; }
.sort-control label  { font-size: 13px; font-weight: 700; color: var(--chip-color, var(--text)); white-space: nowrap; }
.sort-control select { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--field-border, var(--border)); background: var(--field-bg, var(--card)); color: var(--text); font-size: 13px; font-family: 'Nunito', sans-serif; cursor: pointer; outline: none; }
.sort-control select:focus { border-color: var(--pf-brand); }
.sort-control button { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--card-border, var(--border)); background: var(--chip-bg); color: var(--chip-color, var(--text)); font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all .18s; }
.sort-control button:hover { background: var(--pf-brand); border-color: var(--pf-brand); color: var(--brand-fg, #fff); }

/* ── Botões do card de funcionário: agora são .btn.small do sistema.
   Editar = .btn.secondary (tingido de marca, hover já tem par escuro); Visualizar = .btn.neutral ── */
.btn.neutral { background: transparent; border-color: var(--border); color: var(--text); }
.btn.neutral:hover { background: var(--pf-brand-faded); border-color: var(--pf-brand); color: var(--pf-brand-text); }
.link-doc-ver { font-size: 12px; font-weight: 800; color: var(--pf-brand-text); text-decoration: none; }
.link-doc-ver:hover { text-decoration: underline; }

/* ── Badge de vínculo — cores por status ── */
.badge-status.ce { background: rgba(234,179,8,.10);  border-color: rgba(234,179,8,.35);  color: #854d0e; }
.badge-status.ps { background: rgba(59,130,246,.10); border-color: rgba(59,130,246,.35); color: #1d4ed8; }
.badge-status.ef { background: rgba(22,163,74,.10);  border-color: rgba(22,163,74,.30);  color: #166534; }

/* ── Modal (ficha do funcionário) ── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 1000; /* acima do header */ }
.modal-backdrop.open { display: flex; }
.modal          { width: min(900px, 96vw); max-height: 86vh; overflow: auto; background: var(--card-bg, var(--card)); border-radius: 14px; border: 1px solid var(--card-border, var(--border)); box-shadow: 0 30px 60px rgba(0,0,0,.25); }
.modal-head     { position: sticky; top: 0; background: var(--card-bg, var(--card)); display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--card-border, var(--border)); }
.modal-head h3  { margin: 0; font-size: 16px; font-weight: 800; }
.modal-body     { padding: 14px; }
</style>

<!-- ══ Bibliotecas de Exportação (PDF / DOCX) ══ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5/build/index.umd.min.js"></script>

<title>Pesquisa de Funcionários • Ano Ativo</title>
</head>

<body>
<!-- ══ Header Placeholder ══ -->
<div id="header-placeholder"></div>

<!-- ══ MAIN CONTENT ══ -->
<main class="wrap">

  <!-- ══════════════════════════════════════════
       CARD: Filtros de Pesquisa
  ══════════════════════════════════════════ -->
  <section class="card card-destaque" id="cardFiltros">
    <div class="card-head">
      <h2>Filtros de pesquisa</h2>
    </div>

    <!-- Ano Ativo -->
    <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;">
      <div class="field" style="width:220px;flex:0 0 220px;margin:0;">
        <label for="selectAnoAtivo">Ano letivo <span class="info-tip" tabindex="0" onclick="event.stopPropagation(); event.preventDefault(); document.querySelectorAll('.info-tip.open').forEach(o=>{ if(o!==this) o.classList.remove('open'); }); this.classList.toggle('open');">i<span class="info-tip-bubble">Mostra os funcionários cadastrados no ano letivo escolhido. Ao abrir a página, o ano ativo definido pelo administrador já vem selecionado. Para consultar outro ano, escolha-o na lista, que traz os anos que possuem funcionários cadastrados.</span></span></label>
        <select id="selectAnoAtivo" style="width:100%;"></select>
        <div class="ano-erro" id="anoAtivoMsg" style="display:none;"></div>
      </div>
    </div>

    <!-- Grid de Filtros -->
    <div class="filters-grid">
      <div class="field">
        <label for="fBusca">Busca geral</label>
        <input id="fBusca" type="text" placeholder="Nome, CPF, RG/CNH, função, naturalidade..." autocomplete="off"/>
      </div>
      
      <div class="field">
        <label for="fStatus">Status / Vínculo</label>
        <select id="fStatus">
          <option value="">Todos</option>
          <option value="CE">Contrato Emergencial (CE)</option>
          <option value="PS">Processo Seletivo (PS)</option>
          <option value="EF">Concursado / Efetivo (EF)</option>
        </select>
      </div>
      
      <div class="field">
        <label for="fFuncao">Função / Cargo</label>
        <select id="fFuncao">
          <option value="">Todas</option>
        </select>
      </div>
      
      <div class="field">
        <label for="fCargaH">Carga horária</label>
        <select id="fCargaH">
          <option value="">Todas</option>
        </select>
      </div>
    </div>

    <!-- Filtro de Turnos -->
    <div style="margin-top:16px;">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:var(--dest-fg);opacity:.85;text-transform:uppercase;letter-spacing:0.4px;">Turno</label>
      <div class="turnos-row">
        <label class="turno-checkbox-wrap" id="lblFMat">
          <input type="checkbox" id="fMat" value="MAT"/>
          <label for="fMat">🌅 Matutino</label>
        </label>
        <label class="turno-checkbox-wrap" id="lblFVes">
          <input type="checkbox" id="fVes" value="VES"/>
          <label for="fVes">☀️ Vespertino</label>
        </label>
        <label class="turno-checkbox-wrap" id="lblFNot">
          <input type="checkbox" id="fNot" value="NOT"/>
          <label for="fNot">🌙 Noturno</label>
        </label>
        <span id="turnoHint">Sem filtro de turno</span>
      </div>
    </div>

    <!-- Ação: Limpar Filtros -->
    <div class="filter-actions" style="margin-top:16px;">
      <button class="btn ghost" id="btnLimparFiltros" type="button">✕ Limpar filtros</button>
    </div>
  </section>

  <!-- ══════════════════════════════════════════
       PAINEL: Resultados (cards, padrão do sistema)
  ══════════════════════════════════════════ -->
  <div class="panel">
    <div class="panel-head">
      <div style="display:flex;align-items:center;gap:10px;">
        <h2>Funcionários</h2><span class="count" id="countFuncionarios">0</span>
      </div>
      <div class="panel-actions">
        <label class="check-all"><input type="checkbox" id="chkAllFuncionarios"> Todos</label>
        <span class="count count-selecionados" id="countSelecionados" style="display:none;">0 selecionado(s)</span>
        <div style="position:relative;display:inline-block;" id="wrapExportFuncionarios">
          <button class="btn primary" id="btnExportarFuncionarios" type="button">Exportar ▾</button>
          <div id="dropExportFuncionarios" style="display:none;position:absolute;right:0;top:calc(100% + 6px);
            background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:12px;
            box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:200;min-width:230px;padding:6px 0;
            flex-direction:column;">
            <button class="btn" id="btnExportFichaGeral" type="button" style="width:100%;border-radius:0;border:none;justify-content:flex-start;padding:10px 16px;">📋 Ficha geral (PDF)</button>
            <button class="btn" id="btnExportDocx" type="button" style="width:100%;border-radius:0;border:none;justify-content:flex-start;padding:10px 16px;">📄 Tabela completa (Word)</button>
            <button class="btn" id="btnExportCsv" type="button" style="width:100%;border-radius:0;border:none;justify-content:flex-start;padding:10px 16px;">📊 CSV completo (todos os dados)</button>
            <div style="height:1px;background:var(--card-border);margin:6px 0;"></div>
            <button class="btn" id="btnExportFichaIndividual" type="button" style="width:100%;border-radius:0;border:none;justify-content:flex-start;padding:10px 16px;">🧾 Ficha individual (PDF)</button>
          </div>
        </div>
      </div>
    </div>

    <div class="sort-control">
      <label>Ordenar por:</label>
      <select id="sortField">
        <option value="nome">Nome</option>
        <option value="funcao">Função</option>
        <option value="cargaHoraria">Carga horária</option>
        <option value="_idade">Idade</option>
        <option value="status">Vínculo</option>
      </select>
      <button type="button" id="btnToggleSort" title="Alternar ordem">↑↓</button>
    </div>

    <div class="list" id="listaFuncionarios"></div>
    <div class="loading" id="loadingFuncionarios" style="display:none;">Carregando...</div>
  </div>

</main>

<!-- ══════════════════════════════════════════
     MODAL: Ficha do funcionário
══════════════════════════════════════════ -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Ficha</h3>
      <button class="btn ghost small" id="btnFecharModal" type="button">✕ Fechar</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     HEADER LOGIC (sempre primeiro)
══════════════════════════════════════════ -->
<script src="../header-logic.js"></script>

<!-- ══════════════════════════════════════════
     JAVASCRIPT PRINCIPAL
══════════════════════════════════════════ -->
<script src="pesquisa-funcionario.js?v=3"></script>

<!-- ══════════════════════════════════════════
     JAVASCRIPT DE EXPORTAÇÃO
══════════════════════════════════════════ -->
<script src="exportacao-funcionarios.js"></script>


</body>
</html>
