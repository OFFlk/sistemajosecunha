/* Prefixo de variáveis desta página: pf- (pesquisa-funcionario). Hoje não há variável própria.
   Card de destaque, botões, campos, chip (.badge), tooltip, popover/dropdown, modal, toast e .check são GLOBAIS:
   aqui só layout e o que é exclusivo da página. O CSS externo desta página deixou de ser usado. */

/* ── Layout ── */
.wrap   { max-width: 1300px; margin: 0 auto; padding: 24px 16px 48px; }
.muted  { color: var(--ui-muted); }
.col-todo { grid-column: 1 / -1; }

/* ── Card de filtros (destaque global): só layout ── */
.ano-row    { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
.ano-field  { width: 220px; flex: 0 0 220px; margin: 0; }
.ano-field select { width: 100%; }
.ano-erro   { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--dest-fg); }
.filters-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media(max-width:980px){ .filters-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media(max-width:600px){ .filters-grid { grid-template-columns: 1fr; } }
.bloco-turno { margin-top: 16px; }
.lbl-turno   { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: var(--dest-fg); opacity: .85; text-transform: uppercase; letter-spacing: .4px; }
.turnos-row  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filter-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* Chip marcável de turno (receita do guia 4.5): desmarcado = contorno translúcido; marcado = preenchimento sólido --dest-fg */

<!-- ══ Toast (guia 10.2) e dropdown padrão (guia 8): visual 100% em components.css ══ -->
<script>
const _TOAST = {
  ok:      { cls:'toast-ok',      ms:2500 },
  err:     { cls:'toast-err',     ms:4500 },
  warn:    { cls:'toast-warn',    ms:4000 },
  loading: { cls:'toast-loading', ms:0 },       // 0 = sem expirar: fecha quando a operação termina
};
function _showToast(msg, tipo){
  const existing = document.getElementById('_toastGlobal');
  if(existing) existing.remove();
  const cfg = _TOAST[tipo] || _TOAST.warn;
  const toast = document.createElement('div');
  toast.id = '_toastGlobal';
  toast.className = 'toast ' + cfg.cls;
  toast.setAttribute('role', tipo === 'err' ? 'alert' : 'status');
  const span = document.createElement('span');
  span.className = 'toast-msg';
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'toast-close';
  btn.textContent = '✕';
  btn.setAttribute('aria-label','Fechar aviso');
  btn.onclick = () => toast.remove();
  toast.append(span, btn);
  document.body.appendChild(toast);
  if(cfg.ms) setTimeout(() => { if(toast.isConnected) toast.remove(); }, cfg.ms);
}
// só remove o "carregando": nunca apaga um sucesso/erro/aviso que apareceu no meio do caminho
function _toastLimpar(){
  const t = document.getElementById('_toastGlobal');
  if(t && t.classList.contains('toast-loading')) t.remove();
}
function _toastSucesso(m){ _showToast(m,'ok'); }
function _toastErro(m){ _showToast(m,'err'); }
function _toastAviso(m){ _showToast(m,'warn'); }
function _toastCarregando(m){ _showToast(m,'loading'); }

function setMsg(text, kind){
  const t = (text||"").toString();
  if(!t) return;
  if(kind === "err") _toastErro('⚠️ ' + t);
  else if(kind === "ok") _toastSucesso('✅ ' + t);
  else if(kind === "warn") _toastAviso('⚠️ ' + t);
  else if(kind === "loading") _toastCarregando('⏳ ' + t);
  else { console.warn('[toast] kind desconhecido:', JSON.stringify(kind)); _toastAviso(t); }
}
// rede de segurança: promise sem catch com "carregando" aberto troca o azul por erro
window.addEventListener('unhandledrejection', () => {
  const t = document.getElementById('_toastGlobal');
  if(t && t.classList.contains('toast-loading')) _toastErro('⚠️ Não foi possível concluir a operação.');
});

// Dropdown: delegação única por página. Botão com data-dropdown="id-do-menu"; estado por atributo hidden.
function _fecharDropdowns(exceto){
  document.querySelectorAll('[data-dropdown]').forEach(b => {
    const m = document.getElementById(b.dataset.dropdown);
    if(m && m !== exceto){ m.hidden = true; b.setAttribute('aria-expanded', 'false'); }
  });
}
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-dropdown]');
  if(btn){
    const menu = document.getElementById(btn.dataset.dropdown);
    if(!menu) return;
    const abrir = menu.hidden;
    _fecharDropdowns(menu);
    menu.hidden = !abrir;
    btn.setAttribute('aria-expanded', String(abrir));
    return;
  }
  if(e.target.closest('.popover')){                         // clique dentro do popover
    if(e.target.closest('.menu-item')) _fecharDropdowns();  // item de lista fecha; filtro/colunas ficam abertos
    return;
  }
  _fecharDropdowns();                                       // clique fora
});
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') _fecharDropdowns(); });
</script>

<script>
/* ══════════════════════════════════════════════════════════
   PESQUISA-FUNCIONARIO.JS
   Script principal para a página de pesquisa de funcionários
   
   Funcionalidades:
   - Busca e filtros dinâmicos
   - Ordenação
   - Integração com Firebase
   - Filtro por ano letivo

   Fonte dos dados: funcionariosMatriculas (1 query por ano letivo, com cache).
   Cada matrícula já traz uma CÓPIA dos dados pessoais do funcionário, então a
   pesquisa não precisa ler a coleção `funcionarios` (ver cadastro-funcionario.html).
   ══════════════════════════════════════════════════════════ */

(function(){
  /* ══════════════════════════════════════════
     Helpers
  ══════════════════════════════════════════ */
  function formatDate(str){
    if(!str) return '';
    const d = new Date(str + 'T00:00:00');
    if(isNaN(d)) return str;
    return d.toLocaleDateString('pt-BR');
  }

  function calcAge(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d)) return '';
    const today = new Date();
    let age = today.getFullYear() - d.getFullYear();
    const m = today.getMonth() - d.getMonth();
    if(m < 0 || (m===0 && today.getDate() < d.getDate())) age--;
    return age < 0 ? '' : String(age);
  }

  function turnosTexto(arr){
    if(!Array.isArray(arr)||!arr.length) return '—';
    return arr.map(t => t==='MAT'?'🌅 Mat':t==='VES'?'☀️ Ves':'🌙 Not').join(' ');
  }

  function normalize(s){
    return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  }

  function highlight(text, query){
    if(!query||!text) return escapeHtml(text||'—');
    const escaped = escapeHtml(text);
    const q = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try {
      const re = new RegExp('(' + q + ')', 'gi');
      return escaped.replace(re, '<mark>$1</mark>');
    } catch(e) { return escaped; }
  }

  function escapeHtml(s){
    return (s||'').toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const STATUS_LABEL = { CE:'CE', PS:'PS', EF:'EF', OUTRO:'Outro' };
  const SEXO_LABEL   = { F:'Feminino', M:'Masculino', O:'Outro' };

  /* ══════════════════════════════════════════
     Estado Global
  ══════════════════════════════════════════ */
  let funcionarios = [];   // matrículas carregadas (do ano selecionado; todas só em "Todos os anos")
  let filtrados    = [];
  const _cacheAno  = new Map();   // ano ('2026' | '*') -> matrículas já lidas: trocar de ano e voltar não relê o banco
  let _tkAno       = 0;           // descarta resposta atrasada se o usuário trocar de ano rápido
  let _anoAtivo    = '';   // controlado pelo select

  // Ordenação: campo selecionado no <select> + botão de alternar direção
  let currentSortField = 'nome';
  let currentSortOrder = 'asc'; // 'asc' | 'desc'

  /* ══════════════════════════════════════════
     Exportar dados filtrados para outras funções
  ══════════════════════════════════════════ */
  const matIdDe = f => (f && (f.matriculaId || f._id)) || '';

  // funcId dos marcados (contrato antigo, usado pelo export). Em "Todos os anos" o mesmo funcId pode
  // aparecer em mais de uma linha: por isso getParaExportar filtra pela MATRÍCULA.
  function funcionariosMarcadosIds(){
    return new Set(Array.from(document.querySelectorAll('.chkFuncionario:checked')).map(c => c.dataset.func));
  }
  function matriculasMarcadas(){
    return new Set(Array.from(document.querySelectorAll('.chkFuncionario:checked')).map(c => c.dataset.mat));
  }

  window.PesquisaFuncionarios = {
    getFiltrados: () => filtrados,
    getTodos: () => funcionarios,
    getAnoAtivo: () => _anoAtivo,
    getSelecionados: funcionariosMarcadosIds,
    // Regra de exportação: nenhum marcado -> todos os filtrados (na ordem
    // atual); 1+ marcados -> só os marcados (mantendo a ordem de filtrados).
    getParaExportar: () => {
      const ids = matriculasMarcadas();
      return ids.size ? filtrados.filter(f => ids.has(matIdDe(f))) : filtrados;
    }
  };

  /* ══════════════════════════════════════════
     Ano Ativo — Firestore (mesmo padrão de pesquisa-ano-ativo)
  ══════════════════════════════════════════ */
  const selectAnoAtivo = document.getElementById('selectAnoAtivo');
  const anoAtivoMsg    = document.getElementById('anoAtivoMsg');
  let anoAtivoReal = ''; // ano ativo real, configurado no sistema
  let erroCarga    = ''; // mensagem se a leitura do banco falhar (mostrada no estado vazio)

  // Ano do cadastro: `anoLetivo`, com fallback pro campo legado `ano` (mesma regra do cadastro-funcionario).
  function anoDoFuncionario(f){
    return String((f && (f.anoLetivo || f.ano)) || '').trim();
  }

  function atualizarAnoEfetivo(){
    _anoAtivo = selectAnoAtivo.value || anoAtivoReal;
  }

  // Espera sessão + escola ativa uma única vez (as duas leituras abaixo dependem disso).
  let _acessoPromise = null;
  function prepararAcesso(){
    if(!_acessoPromise){
      _acessoPromise = (async () => {
        await new Promise(res => {
          if(window.Auth && window.Auth.getSession && window.Auth.getSession()) return res();
          document.addEventListener('auth:ready', res, {once:true});
        });
        await esperarEscolaAtiva(6000);
      })();
    }
    return _acessoPromise;
  }

  async function carregarAnoAtivo(){
    try{
      await prepararAcesso();
      // 2 leituras pequenas: o doc da escola (ano ativo) e os docs de funcionariosAnos (1 por ano).
      // Antes: DB.loadAll() + varredura de todos os funcionários só para montar este select.
      const [escola, anosDocs] = await Promise.all([
        window.DB.escola.get(),
        window.DB.funcionariosAnos.list(),
      ]);
      anoAtivoReal = (escola?.configAnoAtivo || '').toString().replace(/"/g,'').trim();

      // Só anos que realmente têm funcionários matriculados (mesma lógica de pesquisa-ano-ativo)
      const anosSet = new Set();
      anosDocs.forEach(d => { const y = String(d.anoLetivo || d._id || '').trim(); if(y) anosSet.add(y); });
      if(anoAtivoReal) anosSet.add(anoAtivoReal);
      const anos = Array.from(anosSet).filter(Boolean).sort((a,b) => Number(a) - Number(b));

      selectAnoAtivo.innerHTML = '';
      // Sem ano ativo configurado não há o que pré-selecionar: mantém o comportamento antigo (sem filtro de ano).
      if(!anoAtivoReal){
        const oTodos = document.createElement('option');
        oTodos.value = ''; oTodos.textContent = 'Todos os anos';
        selectAnoAtivo.appendChild(oTodos);
      }
      anos.forEach(y => {
        const o = document.createElement('option');
        o.value = y; o.textContent = y;
        selectAnoAtivo.appendChild(o);
      });
      // Abre já no ano ativo (não existe mais a opção "(usar ano ativo)").
      selectAnoAtivo.value = anoAtivoReal || '';

      atualizarAnoEfetivo();
    }catch(e){
      console.warn('carregarAnoAtivo:', e);
      anoAtivoMsg.textContent = '⚠️ Não foi possível carregar o ano ativo.';
      anoAtivoMsg.hidden = false;
    }
  }

  selectAnoAtivo.addEventListener('change', async function(){
    const tk = ++_tkAno;
    atualizarAnoEfetivo();
    await carregarMatriculas();
    if(tk !== _tkAno) return;          // o usuário já escolheu outro ano
    popularSelects();
    aplicarFiltros();
  });

  /* ══════════════════════════════════════════
     Firestore - Carregar Dados
  ══════════════════════════════════════════ */
  // Espera a escola ativa existir (col() do db_firebase.js lança "Nenhuma escola ativa" antes disso).
  async function esperarEscolaAtiva(maxMs){
    const t0 = Date.now();
    while(Date.now() - t0 < maxMs){
      try{
        const A = window.Auth;
        if(!A || typeof A.getActiveSchoolId !== 'function') return true;
        if(A.db && A.getActiveSchoolId()) return true;
      }catch(_){}
      await new Promise(r => setTimeout(r, 150));
    }
    return false;
  }

  // Lê as matrículas do ano selecionado (1 query por ano; "Todos os anos" lê a coleção inteira).
  async function carregarMatriculas(){
    erroCarga = '';
    const ano = _anoAtivo;
    const chave = ano || '*';
    const elLoading = document.getElementById('loadingFuncionarios');
    try{
      await prepararAcesso();
      if(!window.DB || !window.DB.funcionariosMatriculas){
        throw new Error('db.firebase.js desatualizado: falta a coleção funcionariosMatriculas.');
      }
      if(!_cacheAno.has(chave)){
        if(elLoading) elLoading.hidden = false;
        const buscar = () => ano
          ? window.DB.funcionariosMatriculas.whereEquals('anoLetivo', Number(ano))
          : window.DB.funcionariosMatriculas.list();
        let docs;
        try{
          docs = await buscar();
        }catch(e1){
          console.warn('carregarMatriculas (1ª tentativa):', e1);
          await new Promise(r => setTimeout(r, 800));
          docs = await buscar();
        }
        _cacheAno.set(chave, docs);
      }
      funcionarios = _cacheAno.get(chave);
    }catch(e){
      console.error('carregarMatriculas:', e);
      erroCarga = (e && e.message) ? e.message : String(e);
      funcionarios = [];
    }finally{
      if(elLoading) elLoading.hidden = true;
    }
  }

  /* ══════════════════════════════════════════
     Popular selects dinâmicos (Função e C.H.)
  ══════════════════════════════════════════ */
  function getFuncionariosDoAno(){
    if(!_anoAtivo) return funcionarios;
    return funcionarios.filter(f => anoDoFuncionario(f) === _anoAtivo);
  }

  function popularSelects(){
    const base = getFuncionariosDoAno();

    const funcoes = [...new Set(
      base.map(f => (f.funcao||'').trim()).filter(Boolean)
    )].sort((a,b) => a.localeCompare(b,'pt-BR'));

    const selFuncao = document.getElementById('fFuncao');
    selFuncao.innerHTML = '<option value="">Todas</option>';
    funcoes.forEach(fn => {
      const o = document.createElement('option');
      o.value = fn; o.textContent = fn;
      selFuncao.appendChild(o);
    });

    const cargas = [...new Set(
      base.map(f => (f.cargaHoraria||'').toString().trim()).filter(Boolean)
    )].sort((a,b) => Number(a) - Number(b));

    const selCarga = document.getElementById('fCargaH');
    selCarga.innerHTML = '<option value="">Todas</option>';
    cargas.forEach(ch => {
      const o = document.createElement('option');
      o.value = ch; o.textContent = ch + 'H';
      selCarga.appendChild(o);
    });
  }

  /* ══════════════════════════════════════════
     UI refs
  ══════════════════════════════════════════ */
  const elBusca    = document.getElementById('fBusca');
  const elStatus   = document.getElementById('fStatus');
  const elFuncao   = document.getElementById('fFuncao');
  const elCargaH   = document.getElementById('fCargaH');
  const elSexo     = document.getElementById('fSexo');
  const chkMat     = document.getElementById('fMat');
  const chkVes     = document.getElementById('fVes');
  const chkNot     = document.getElementById('fNot');
  const turnoHint  = document.getElementById('turnoHint');
  const lista      = document.getElementById('listaFuncionarios');
  const countEl    = document.getElementById('countFuncionarios');
  const sortFieldEl = document.getElementById('sortField');
  const btnToggleSort = document.getElementById('btnToggleSort');
  const chkAllFuncionarios  = document.getElementById('chkAllFuncionarios');
  const countSelecionadosEl = document.getElementById('countSelecionados');

  /* ── Turno toggles visual ── */
  [chkMat, chkVes, chkNot].forEach(chk => {
    chk.addEventListener('change', function(){
      const lbl = chk.closest('.turno-checkbox-wrap');
      lbl.classList.toggle('checked', chk.checked);
      atualizarTurnoHint();
      aplicarFiltros();
    });
  });

  function getTurnosSelecionados(){
    const t = [];
    if(chkMat.checked) t.push('MAT');
    if(chkVes.checked) t.push('VES');
    if(chkNot.checked) t.push('NOT');
    return t;
  }

  function atualizarTurnoHint(){
    const t = getTurnosSelecionados();
    if(!t.length){
      turnoHint.textContent = 'Sem filtro de turno aplicado.';
    } else if(t.length === 1){
      turnoHint.textContent = 'Modo OU — exibe funcionários que atuam neste turno (mesmo que atuem em outros também).';
    } else {
      turnoHint.textContent = 'Modo E — exibe apenas funcionários que atuam em TODOS os turnos selecionados.';
    }
  }

  /* ══════════════════════════════════════════
     Filtros
  ══════════════════════════════════════════ */
  function aplicarFiltros(){
    const busca   = normalize(elBusca.value);
    const status  = elStatus.value;
    const funcao  = elFuncao.value;
    const cargaH  = elCargaH.value;
    const turnos  = getTurnosSelecionados();
    const base    = getFuncionariosDoAno();

    filtrados = base.filter(f => {
      // busca geral
      if(busca){
        const campos = [
          f.nome, f.cpf, f.rgCnh, f.funcao, f.naturalidadeCidade || f.naturalidade,
          f.naturalidadeUF, f.corRaca, f.cargaHoraria,
          STATUS_LABEL[f.status]||f.status
        ].map(x => normalize(x||'')).join(' ');
        if(!campos.includes(busca)) return false;
      }
      // status
      if(status && f.status !== status) return false;
      // função
      if(funcao && (f.funcao||'').trim() !== funcao) return false;
      // carga horária — compara como string pois pode ser número ou string no banco
      if(cargaH && String(f.cargaHoraria||'').trim() !== cargaH) return false;
      // sexo
      if(elSexo && elSexo.value && f.sexo !== elSexo.value) return false;
      // turnos: 1 selecionado = OU, 2+ = E
      if(turnos.length){
        const ft = Array.isArray(f.turnos) ? f.turnos : [];
        if(turnos.length === 1){
          // OU: basta ter o turno
          if(!ft.includes(turnos[0])) return false;
        } else {
          // E: precisa ter TODOS os turnos selecionados
          if(!turnos.every(t => ft.includes(t))) return false;
        }
      }
      return true;
    });

    aplicarOrdenacao();
    renderLista();
  }

  /* ══════════════════════════════════════════
     Ordenação
  ══════════════════════════════════════════ */
  function getSortVal(f, col){
    if(col === '_idade')  return parseInt(calcAge(f.dataNascimento)||'0', 10);
    if(col === '_nat')    return normalize([f.naturalidadeCidade || f.naturalidade, f.naturalidadeUF].filter(Boolean).join(' '));
    if(col === '_nTurnos') return Array.isArray(f.turnos) ? f.turnos.length : 0;
    if(col === 'dataNascimento') return f.dataNascimento || '';
    return normalize(f[col]||'');
  }

  function aplicarOrdenacao(){
    const col = currentSortField;
    const dir = currentSortOrder === 'asc' ? 1 : -1;
    filtrados.sort((a, b) => {
      const va = getSortVal(a, col);
      const vb = getSortVal(b, col);
      if(typeof va === 'number' && typeof vb === 'number'){
        return (va - vb) * dir;
      }
      if(va < vb) return -1 * dir;
      if(va > vb) return  1 * dir;
      return 0;
    });
  }

  sortFieldEl.addEventListener('change', function(){
    currentSortField = sortFieldEl.value;
    aplicarOrdenacao();
    renderLista();
  });
  btnToggleSort.addEventListener('click', function(){
    currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
    btnToggleSort.textContent = currentSortOrder === 'asc' ? '↑↓' : '↓↑';
    aplicarOrdenacao();
    renderLista();
  });

  /* ══════════════════════════════════════════
     Render lista (cards) — padrão do sistema, sem paginação
     (lista sempre exibe todos os filtrados, igual ao módulo de aluno)
  ══════════════════════════════════════════ */
  // Diz POR QUE a lista está vazia (falha de leitura, escola não selecionada, ano sem cadastros...).
  function mensagemVazio(){
    if(erroCarga) return '⚠️ Não foi possível carregar os funcionários: ' + escapeHtml(erroCarga);
    let escola = '';
    try{ escola = (window.Auth && window.Auth.getActiveSchoolId && window.Auth.getActiveSchoolId()) || ''; }catch(_){}
    if(!funcionarios.length){
      if(escola === 'ADMIN') return 'Nenhuma escola selecionada. Escolha uma escola no cabeçalho para ver os funcionários.';
      return 'Nenhum funcionário matriculado' + (_anoAtivo ? ' no ano letivo ' + escapeHtml(_anoAtivo) : '') +
             ' na escola ativa' + (escola ? ' (' + escapeHtml(escola) + ')' : '') + '.';
    }
    return 'Nenhum funcionário encontrado para os filtros aplicados.';
  }

  function renderLista(){
    const query = elBusca.value.trim();

    countEl.textContent = filtrados.length;

    if(!filtrados.length){
      lista.innerHTML = '<div class="muted col-todo">' + mensagemVazio() + '</div>';
      syncCheckAllFuncionarios();
      atualizarContadorSelecionados();
      return;
    }

    lista.innerHTML = '';
    filtrados.forEach(f => {
      try{
      const nasc  = formatDate(f.dataNascimento) || '—';
      const idade = calcAge(f.dataNascimento) || '—';
      // Card em 4 linhas: 1 nome · 2 chips (função, CPF) · 3 nascimento e idade · 4 RG/CNH, turnos e chips de NEE.
      // C.H. e vínculo saíram do card (continuam na ficha). Sexo, cor/raça e naturalidade também só na ficha.
      const linha3 = [`Nasc: ${escapeHtml(nasc)}`, `Idade: ${escapeHtml(idade)}`]
        .map(t => `<span class="meta-i">${t}</span>`).join(' • ');
      const linha4 = [`RG/CNH: ${highlight(f.rgCnh, query) || '—'}`, `Turnos: ${escapeHtml(turnosTexto(f.turnos))}`]
        .map(t => `<span class="meta-i">${t}</span>`).join(' • ');
      const neeChips = neeItens(f).map(t => `<span class="badge small gray">${t}</span>`).join('');
      const matId = matIdDe(f);
      const el    = document.createElement('div');
      el.className = 'item selecionavel';
      el.innerHTML = `
        <div class="selo-selecionado">✓</div>
        <div class="left">
          <div class="title">
            <span class="nome">${highlight(f.nome, query) || 'Sem nome'}</span>
            <div class="badges">
              <span class="badge">${highlight(f.funcao, query) || 'Sem função'}</span>
              <span class="badge gray">CPF: ${highlight(f.cpf, query)}</span>
            </div>
          </div>
          <div class="meta"><span class="meta-txt">${linha3}</span></div>
          <div class="meta"><span class="meta-txt">${linha4}</span>${neeChips}</div>
        </div>
        <div class="right">
          <a class="btn small secondary" href="cadastro-funcionario.html?editar=${encodeURIComponent(matId)}">✏️ Editar</a>
          <button type="button" class="btn small primary" data-view-mat="${escapeHtml(matId)}">👁️ Visualizar</button>
          <label class="check">
            <input type="checkbox" class="chkFuncionario" data-func="${escapeHtml(f.funcId)}" data-mat="${escapeHtml(matId)}" />
            <span>Selecionar</span>
          </label>
        </div>
      `;
      lista.appendChild(el);
      }catch(err){ console.error('renderLista: erro no registro', f && matIdDe(f), err); }
    });

    bindFuncionarioSelectionHandlers();
  }

  /* ══════════════════════════════════════════
     Seleção (checkbox) — mesmo padrão do módulo de aluno:
     checkbox escondido, clique em qualquer área vazia do card alterna,
     selo-selecionado (✓) aparece quando marcado, estado lido direto do DOM
     (sem Set — a lista inteira já está sempre renderizada, sem paginação).
     Nenhum card vem marcado por padrão.
  ══════════════════════════════════════════ */
  function bindFuncionarioSelectionHandlers(){
    document.querySelectorAll('.chkFuncionario').forEach(c => {
      c.addEventListener('change', function(){
        syncCheckAllFuncionarios();
        atualizarContadorSelecionados();
      });
    });
    lista.querySelectorAll('.item.selecionavel').forEach(el => {
      el.addEventListener('click', function(e){
        // só conta clique "seco" em área vazia — não em botão/link/checkbox,
        // nem quando o usuário só estava selecionando texto do card.
        if(e.target.closest('button, a, input, label')) return;
        if((window.getSelection()?.toString() || '').length > 0) return;
        const chk = el.querySelector('.chkFuncionario');
        if(!chk) return;
        chk.checked = !chk.checked;
        chk.dispatchEvent(new Event('change', { bubbles: true }));
      });
    });
    syncCheckAllFuncionarios();
    atualizarContadorSelecionados();
  }

  function syncCheckAllFuncionarios(){
    const chks = Array.from(document.querySelectorAll('.chkFuncionario'));
    if(!chks.length){
      chkAllFuncionarios.checked = false;
      chkAllFuncionarios.indeterminate = false;
      return;
    }
    const checked = chks.filter(c => c.checked).length;
    chkAllFuncionarios.checked = checked === chks.length;
    chkAllFuncionarios.indeterminate = checked > 0 && checked < chks.length;
  }

  function atualizarContadorSelecionados(){
    const n = document.querySelectorAll('.chkFuncionario:checked').length;
    countSelecionadosEl.textContent = `${n} selecionado(s)`;
    countSelecionadosEl.hidden = !(n > 0);
  }

  chkAllFuncionarios.addEventListener('change', function(){
    document.querySelectorAll('.chkFuncionario').forEach(c => { c.checked = chkAllFuncionarios.checked; });
    syncCheckAllFuncionarios();
    atualizarContadorSelecionados();
  });

  /* ══════════════════════════════════════════
     Eventos
  ══════════════════════════════════════════ */
  elBusca.addEventListener('input',   aplicarFiltros);
  elStatus.addEventListener('change', aplicarFiltros);
  elFuncao.addEventListener('change', aplicarFiltros);
  elCargaH.addEventListener('change', aplicarFiltros);
  if(elSexo) elSexo.addEventListener('change', aplicarFiltros);

  document.getElementById('btnLimparFiltros').addEventListener('click', function(){
    elBusca.value  = '';
    elStatus.value = '';
    elFuncao.value = '';
    elCargaH.value = '';
    if(elSexo) elSexo.value = '';
    chkMat.checked = false; document.getElementById('lblFMat').classList.remove('checked');
    chkVes.checked = false; document.getElementById('lblFVes').classList.remove('checked');
    chkNot.checked = false; document.getElementById('lblFNot').classList.remove('checked');
    currentSortField = 'nome';
    currentSortOrder  = 'asc';
    sortFieldEl.value = 'nome';
    btnToggleSort.textContent = '↑↓';
    atualizarTurnoHint();
    aplicarFiltros(); // ano permanece o mesmo
  });

  /* ══════════════════════════════════════════
     Modal — Ficha do funcionário
  ══════════════════════════════════════════ */
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalTitle     = document.getElementById('modalTitle');
  const modalBody       = document.getElementById('modalBody');

  const ESCOLARIDADE_LABEL = {
    SEM_ESCOLARIDADE:    'Sem escolaridade',
    FUND_INCOMPLETO:     'Ensino fundamental incompleto',
    FUND_COMPLETO:       'Ensino fundamental completo',
    MEDIO_INCOMPLETO:    'Ensino médio incompleto',
    MEDIO_COMPLETO:      'Ensino médio completo',
    SUPERIOR_INCOMPLETO: 'Ensino superior incompleto',
    SUPERIOR_COMPLETO:   'Ensino superior completo',
  };

  function abrirModal(titulo, htmlBody){
    modalTitle.textContent = titulo;
    modalBody.innerHTML = htmlBody;
    modalBackdrop.classList.add('open');
  }
  function fecharModal(){
    modalBackdrop.classList.remove('open');
  }
  document.getElementById('btnFecharModal').addEventListener('click', fecharModal);
  modalBackdrop.addEventListener('click', function(e){
    if(e.target === modalBackdrop) fecharModal();
  });

  // Rótulos de NEE (já escapados). Usado na ficha (completo) e no card (linha 4).
  function neeItens(f){
    const d = f.deficiencia || {};
    const itens = [];
    if(d.tea)              itens.push('🧩 TEA');
    if(d.altasHabilidades) itens.push('⭐ Altas habilidades / superdotação');
    if(d.defFisica)        itens.push('♿ Deficiência física');
    if(d.defIntelectual)   itens.push('🧠 Deficiência intelectual');
    if(d.defVisual)        itens.push('👁️ Deficiência visual' + (d.defVisualSub ? ` (${escapeHtml(d.defVisualSub)})` : ''));
    if(d.defAuditiva)      itens.push('👂 Deficiência auditiva / surdez' + (d.defAuditivaSub ? ` (${escapeHtml(d.defAuditivaSub)})` : ''));
    return itens;
  }

  function montarNeeDetalhado(f){
    const itens = neeItens(f);
    if(!itens.length){
      return `<div class="ficha-vazio">Nenhuma</div>`;
    }
    return `<div class="ficha-chips">` +
      itens.map(t => `<span class="badge gray">${t}</span>`).join('') +
      `</div>`;
  }

  function montarFormacao(f){
    const blocos = [];
    if(Array.isArray(f.graduacoes) && f.graduacoes.length){
      blocos.push(`<div class="ficha-sub">Graduações</div>` +
        `<div class="ficha-chips">` + f.graduacoes.map(g => `<span class="badge">${escapeHtml(g.curso||g.nome||'—')}${g.ano?' · '+escapeHtml(String(g.ano)):''}</span>`).join('') + `</div>`);
    }
    if(Array.isArray(f.posGraduacoes) && f.posGraduacoes.length){
      blocos.push(`<div class="ficha-sub">Pós-graduações</div>` +
        `<div class="ficha-chips">` + f.posGraduacoes.map(x => `<span class="badge neutral">${escapeHtml(x.area||'—')}${x.ano?' · '+escapeHtml(String(x.ano)):''}</span>`).join('') + `</div>`);
    }
    // Complementações — array novo OU o campo único legado (registros mais antigos)
    const complementacoes = Array.isArray(f.complementacoes) && f.complementacoes.length
      ? f.complementacoes
      : (f.complementacaoPedagogica && f.complementacaoNome ? [{ nome: f.complementacaoNome }] : []);
    if(complementacoes.length){
      blocos.push(`<div class="ficha-sub">Complementações</div>` +
        complementacoes.map(c => `<div class="ficha-linha">• ${escapeHtml(c.nome||'—')}${c.ano?' · '+escapeHtml(String(c.ano)):''}</div>`).join(''));
    }
    if(Array.isArray(f.outrosCursos) && f.outrosCursos.length){
      blocos.push(`<div class="ficha-sub">Outros cursos</div>` +
        f.outrosCursos.map(o => `<div class="ficha-linha">• ${escapeHtml(typeof o === 'string' ? o : (o.nome||o.curso||'—'))}</div>`).join(''));
    }
    return blocos.length ? blocos.join('') : `<div class="ficha-vazio">Nenhuma formação adicional registrada.</div>`;
  }

  function abrirFichaFuncionario(matId){
    const f = funcionarios.find(x => matIdDe(x) === matId);
    if(!f) return;
    const funcId = f.funcId || '';              // documentos e foto são da PESSOA (pasta por funcId)
    // Naturalidade: modelo novo (naturalidadeEstrangeiro) e registros antigos (naturalidadePais != 'BR')
    const natEstr  = f.naturalidadeEstrangeiro != null ? f.naturalidadeEstrangeiro === true : (!!f.naturalidadePais && f.naturalidadePais !== 'BR');
    const natLocal = [f.naturalidadeCidade || f.naturalidade, f.naturalidadeUF].filter(Boolean).join(natEstr ? ' - ' : ' / ');
    const nat  = natEstr ? ('Estrangeiro' + (natLocal ? ' — ' + natLocal : '')) : (natLocal || '—');
    const nasc = formatDate(f.dataNascimento) || '—';
    const idade = calcAge(f.dataNascimento) || '—';

    const fotoHtml = f.fotoUrl
      ? `<img class="foto-ficha" src="${escapeHtml(f.fotoUrl)}" alt="Foto do funcionário" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'foto-ficha vazia',textContent:'🧑'}))">`
      : `<div class="foto-ficha vazia">🧑</div>`;

    const cabecalho = `
      <div class="ficha-cab">
        ${fotoHtml}
        <div>
          <b>${escapeHtml(f.nome || 'Sem nome')}</b> &nbsp;•&nbsp; ID: ${escapeHtml(f.funcId||'—')}
          &nbsp;•&nbsp; Ano: ${escapeHtml(anoDoFuncionario(f) || '—')}
          &nbsp;•&nbsp; Vínculo: ${escapeHtml(STATUS_LABEL[f.status]||f.status||'—')}
        </div>
      </div>`;

    const camposBasicos = [
      ['CPF', f.cpf], ['RG/CNH', f.rgCnh], ['Nascimento', nasc], ['Idade', idade],
      ['Sexo', SEXO_LABEL[f.sexo]||f.sexo], ['Cor/Raça', f.corRaca],
      ['Naturalidade', nat], ['Mãe', f.filiacaoMae], ['Pai', f.filiacaoPai],
      ['Função', f.funcao], ['Carga horária', f.cargaHoraria ? f.cargaHoraria+'H' : ''],
      ['Turnos', turnosTexto(f.turnos)],
      ['CEP', f.cep], ['Cidade', f.endCidade], ['UF', f.endUF], ['Zona', f.zonaResidencia],
      ['Escolaridade', ESCOLARIDADE_LABEL[f.escolaridade] || f.escolaridade],
    ];
    const campos = camposBasicos.map(([label, v]) => `
      <div class="ficha-campo">
        <div class="ficha-rot">${escapeHtml(label)}</div>
        <div class="ficha-val">${escapeHtml(String(v || '—'))}</div>
      </div>`).join('');

    const docsPlaceholderId = `docsFicha_${matId.replace(/[^a-zA-Z0-9_-]/g,'')}`;

    const rows = `${cabecalho}
      <div class="ficha-grid">${campos}</div>
      <div class="ficha-sec">
        <div class="ficha-rot">NEE / Deficiência</div>
        ${montarNeeDetalhado(f)}
      </div>
      <div class="ficha-sec">
        <div class="ficha-rot">Formação</div>
        ${montarFormacao(f)}
      </div>
      <div class="ficha-sec">
        <div class="ficha-rot">Documentos</div>
        <div id="${docsPlaceholderId}" class="ficha-txt">Carregando documentos…</div>
      </div>
    `;
    abrirModal('Ficha do funcionário', rows);
    carregarDocsFicha(funcId, docsPlaceholderId);
  }

  async function carregarDocsFicha(funcId, targetId){
    const el = document.getElementById(targetId);
    if(!el) return;
    try{
      const resp = await fetch(`/api/drive-list-funcionario?funcionarioId=${encodeURIComponent(funcId)}`);
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error || 'Erro ao buscar documentos');
      const files = data.files || [];
      if(!files.length){
        el.innerHTML = `<div class="ficha-txt">Nenhum documento anexado</div>`;
        return;
      }
      el.innerHTML = files.map(f => {
        const icon = (f.mimeType||'').startsWith('image/') ? '🖼️' : '📄';
        return `<div class="doc-linha">
          <span>${icon}</span>
          <span class="doc-nome">${escapeHtml(f.label||f.fileName)}</span>
          <a class="btn secondary small" href="${f.webViewLink}" target="_blank" rel="noopener">👁️ Ver</a>
        </div>`;
      }).join('');
    }catch(e){
      el.innerHTML = `<div class="ficha-erro">Erro ao carregar documentos.</div>`;
    }
  }

  lista.addEventListener('click', function(e){
    const btn = e.target.closest('[data-view-mat]');
    if(!btn) return;
    abrirFichaFuncionario(btn.dataset.viewMat);
  });

  /* ══════════════════════════════════════════
     Init
  ══════════════════════════════════════════ */
  // Ícone(s) de dica (ⓘ) — fecha qualquer um aberto ao clicar fora.
  document.addEventListener('click', () => {
    document.querySelectorAll('.info-tip.open').forEach(el => el.classList.remove('open'));
  });

  // Contraste do texto do card de destaque (cálculo centralizado em theme-colors.js).
  // Isolado em try/catch: um problema visual nunca pode impedir o carregamento da lista.
  try{
    if(window.ThemeColors && typeof ThemeColors.ajustarContraste === 'function') ThemeColors.ajustarContraste();
  }catch(e){ console.warn('ajustarContraste:', e); }

  (async function init(){
    try{
      await carregarAnoAtivo();       // 1º: precisa saber o ano para ler só as matrículas dele
      await carregarMatriculas();
      popularSelects();
      aplicarFiltros();
    } finally {
      if(window.Loading) Loading.esconder();
    }
  })();
})();
</script>

<!-- ══════════════════════════════════════════
     JAVASCRIPT DE EXPORTAÇÃO
══════════════════════════════════════════ -->
<script id="exportacao-funcionarios-js">
/* ══════════════════════════════════════════════════════════
   EXPORTACAO-FUNCIONARIOS.JS
   Exportação da pesquisa de funcionários:
     1. Ficha geral (PDF)  — tabela enxuta, respeita filtro/ordenação da tela
     2. Tabela completa (DOCX) — todos os campos, em Word (softwares de RH
        específicos só abrem Word)
     3. CSV completo — todos os campos, exceto imagem/documento
     4. Ficha individual (PDF) — uma página por funcionário, com foto (3x
        maior que a usada na ficha individual do aluno, a pedido)

   Fonte dos dados: window.PesquisaFuncionarios (exposto pelo script
   principal desta página, acima). Cada item é uma MATRÍCULA (pessoa × ano)
   com a cópia dos dados pessoais:
     - getFiltrados()    -> todos que passam pelo filtro atual, já ordenados
     - getParaExportar() -> regra de seleção já aplicada:
         nenhum card marcado  = getFiltrados()
         1+ cards marcados    = só os marcados, mantendo a ordem
   Os 4 exports abaixo usam sempre getParaExportar().
   ══════════════════════════════════════════════════════════ */
(function(){

  /* ══════════════════════════════════════════
     Helpers
     (parecidos com os do script principal; ficam em escopo próprio)
  ══════════════════════════════════════════ */
  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
  }

  function formatDate(str){
    if(!str) return '';
    const d = new Date(str + 'T00:00:00');
    if(isNaN(d)) return str;
    return d.toLocaleDateString('pt-BR');
  }

  function calcAge(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d)) return '';
    const today = new Date();
    let age = today.getFullYear() - d.getFullYear();
    const m = today.getMonth() - d.getMonth();
    if(m < 0 || (m===0 && today.getDate() < d.getDate())) age--;
    return age < 0 ? '' : String(age);
  }

  function turnosTexto(arr){
    if(!Array.isArray(arr) || !arr.length) return '—';
    return arr.map(t => t==='MAT'?'Matutino':t==='VES'?'Vespertino':'Noturno').join(', ');
  }

  const STATUS_LABEL = { CE:'Contrato Emergencial', PS:'Processo Seletivo', EF:'Concursado/Efetivo', OUTRO:'Outro' };
  const SEXO_LABEL   = { F:'Feminino', M:'Masculino', O:'Outro' };
  const ESCOLARIDADE_LABEL = {
    SEM_ESCOLARIDADE:    'Sem escolaridade',
    FUND_INCOMPLETO:     'Ensino fundamental incompleto',
    FUND_COMPLETO:       'Ensino fundamental completo',
    MEDIO_INCOMPLETO:    'Ensino médio incompleto',
    MEDIO_COMPLETO:      'Ensino médio completo',
    SUPERIOR_INCOMPLETO: 'Ensino superior incompleto',
    SUPERIOR_COMPLETO:   'Ensino superior completo',
  };

  // Naturalidade: modelo novo (naturalidadeEstrangeiro) e registros antigos (naturalidadePais != 'BR')
  function ehEstrangeiro(f){
    return f.naturalidadeEstrangeiro != null ? f.naturalidadeEstrangeiro === true : (!!f.naturalidadePais && f.naturalidadePais !== 'BR');
  }
  function naturalidadeTexto(f){
    const est = ehEstrangeiro(f);
    const local = [f.naturalidadeCidade || f.naturalidade, f.naturalidadeUF].filter(Boolean).join(est ? ' - ' : ' / ');
    return est ? ('Estrangeiro' + (local ? ' — ' + local : '')) : local;
  }

  function neeResumo(f){
    const d = f.deficiencia || {};
    const itens = [];
    if(d.tea)              itens.push('TEA');
    if(d.altasHabilidades) itens.push('Altas habilidades');
    if(d.defFisica)        itens.push('Def. física');
    if(d.defIntelectual)   itens.push('Def. intelectual');
    if(d.defVisual)        itens.push('Def. visual' + (d.defVisualSub ? ` (${d.defVisualSub})` : ''));
    if(d.defAuditiva)      itens.push('Def. auditiva' + (d.defAuditivaSub ? ` (${d.defAuditivaSub})` : ''));
    return itens.join('; ') || 'Nenhuma';
  }

  // Achata um array de objetos (graduações, pós, cursos...) num texto único
  function formacaoResumo(lista, campoPrincipal){
    if(!Array.isArray(lista) || !lista.length) return '';
    return lista.map(item => {
      if(typeof item === 'string') return item;           // outrosCursos é uma lista de textos
      const nome = item[campoPrincipal] || item.nome || item.curso || item.area || '—';
      return item.ano ? `${nome} (${item.ano})` : nome;
    }).join('; ');
  }

  function complementacoesResumo(f){
    const lista = Array.isArray(f.complementacoes) && f.complementacoes.length
      ? f.complementacoes
      : (f.complementacaoPedagogica && f.complementacaoNome ? [{ nome: f.complementacaoNome }] : []);
    return formacaoResumo(lista, 'nome');
  }

  // Enriquece o funcionário com campos derivados/textuais, usados nos 3 exports
  function enriquecerFuncionario(f){
    return {
      ...f,
      _nasc:                 formatDate(f.dataNascimento),
      _idade:                calcAge(f.dataNascimento),
      _sexoTexto:            SEXO_LABEL[f.sexo] || f.sexo || '',
      _statusTexto:          STATUS_LABEL[f.status] || f.status || '',
      _turnosTexto:          turnosTexto(f.turnos),
      _naturalidadeTexto:    naturalidadeTexto(f),
      _estrangeiroTexto:     ehEstrangeiro(f) ? 'Sim' : 'Não',
      _escolaridadeTexto:    ESCOLARIDADE_LABEL[f.escolaridade] || f.escolaridade || '',
      _graduacoesTexto:      formacaoResumo(f.graduacoes, 'curso'),
      _posGraduacoesTexto:   formacaoResumo(f.posGraduacoes, 'area'),
      _complementacoesTexto: complementacoesResumo(f),
      _outrosCursosTexto:    formacaoResumo(f.outrosCursos, 'nome'),
      _neeTexto:             neeResumo(f),
    };
  }

  /* ══════════════════════════════════════════
     Colunas
  ══════════════════════════════════════════ */

  // Ficha geral (PDF) — colunas essenciais, legíveis numa tabela impressa
  const COLS_ESSENCIAIS = [
    {key:'nome',         label:'NOME',       width:130},
    {key:'funcao',       label:'FUNÇÃO',     width:95},
    {key:'cargaHoraria', label:'CARGA H.',   width:55},
    {key:'_turnosTexto', label:'TURNO',      width:75},
    {key:'_statusTexto', label:'VÍNCULO',    width:95},
    {key:'cpf',          label:'CPF',        width:90},
    {key:'_nasc',        label:'NASCIMENTO', width:70},
    {key:'_idade',       label:'IDADE',      width:40},
  ];

  // Tabela completa (DOCX) e CSV — todos os campos, exceto imagem/documento
  const COLS_COMPLETO = [
    {key:'funcId',                 label:'ID'},
    {key:'anoLetivo',              label:'ANO LETIVO'},
    {key:'nome',                   label:'NOME'},
    {key:'cpf',                    label:'CPF'},
    {key:'rgCnh',                  label:'RG/CNH'},
    {key:'_nasc',                  label:'DATA DE NASCIMENTO'},
    {key:'_idade',                 label:'IDADE'},
    {key:'_sexoTexto',             label:'SEXO'},
    {key:'corRaca',                label:'COR/RAÇA'},
    {key:'_naturalidadeTexto',     label:'NATURALIDADE'},
    {key:'_estrangeiroTexto',      label:'ESTRANGEIRO'},
    {key:'filiacaoMae',            label:'MÃE'},
    {key:'filiacaoPai',            label:'PAI'},
    {key:'funcao',                 label:'FUNÇÃO'},
    {key:'cargaHoraria',           label:'CARGA HORÁRIA'},
    {key:'_turnosTexto',           label:'TURNOS'},
    {key:'_statusTexto',           label:'VÍNCULO'},
    {key:'cep',                    label:'CEP'},
    {key:'endCidade',              label:'CIDADE'},
    {key:'endUF',                  label:'UF'},
    {key:'zonaResidencia',         label:'ZONA'},
    {key:'_escolaridadeTexto',     label:'ESCOLARIDADE'},
    {key:'tipoEnsino',             label:'TIPO DE ENSINO'},
    {key:'_graduacoesTexto',       label:'GRADUAÇÕES'},
    {key:'_posGraduacoesTexto',    label:'PÓS-GRADUAÇÕES'},
    {key:'_complementacoesTexto',  label:'COMPLEMENTAÇÕES'},
    {key:'_outrosCursosTexto',     label:'OUTROS CURSOS'},
    {key:'_neeTexto',              label:'NEE / DEFICIÊNCIA'},
  ];

  function linhaColunas(f, cols){
    return cols.map(c => String(f[c.key] ?? '') || '—');
  }

  /* ══════════════════════════════════════════
     Dados da escola (cabeçalho institucional) — mesmo padrão do aluno
  ══════════════════════════════════════════ */
  async function _carregarDadosEscola(){
    try{
      if(window.DB && window.DB.escola && window.DB.escola.get){
        const e = await window.DB.escola.get();
        if(e && e.nome) return e;
      }
    }catch(_){}
    try{
      const schoolId = window.Auth?.getActiveSchoolId?.() || '';
      const key = schoolId ? `schools:${schoolId}:dadosEscola` : 'dadosEscola';
      const cached = localStorage.getItem(key);
      if(cached) return JSON.parse(cached);
    }catch(_){}
    return null;
  }

  function _getSchoolDisplayName(escola){
    try{
      const s = window.Auth?.getSession?.() || JSON.parse(localStorage.getItem('auth_session_v2')||'null');
      if(!s) return (escola && escola.nome) || '';
      const schools = (window.Auth?.listSchools?.() || JSON.parse(localStorage.getItem('auth_schools_v1')||'[]'));
      const effective = (s.schoolId||'').toString().toUpperCase() === 'ADMIN'
        ? (localStorage.getItem('admin_active_school_v1')||'').trim() || 'ADMIN'
        : (s.schoolId||'').toString();
      const matched = schools.find(x => (x.schoolId||x.id||'').toString() === effective);
      return matched ? (matched.displayName || matched.name || matched.nome || '').toString().trim() : ((escola && escola.nome) || '');
    }catch(_){ return (escola && escola.nome) || ''; }
  }

  // Monta nome de arquivo: [prefixo]_[escola]_[DD-MM-AAAA].[ext]
  function _buildFilename(prefixo, escola, ext){
    const hoje = new Date();
    const d = String(hoje.getDate()).padStart(2,'0');
    const m = String(hoje.getMonth()+1).padStart(2,'0');
    const a = hoje.getFullYear();
    const rawName = _getSchoolDisplayName(escola);
    const nomeEscola = rawName
      ? rawName.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
          .toUpperCase().replace(/[^\w\d]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'').slice(0,40)
      : '';
    const partes = [prefixo, nomeEscola, `${d}-${m}-${a}`].filter(Boolean);
    return partes.join('_') + '.' + ext;
  }

  function _baixarBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  /* ══════════════════════════════════════════
     1) Ficha geral (PDF) — tabela enxuta, autotable, paisagem
  ══════════════════════════════════════════ */
  const _TABLE_STYLES = {
    styles:     { fontSize: 8.5, cellPadding: {top:3,bottom:3,left:4,right:4}, overflow: 'linebreak', lineColor: [210,220,240], lineWidth: 0.3 },
    headStyles: { fillColor: [11,63,191], textColor: 255, fontStyle: 'bold', fontSize: 8.5, cellPadding: {top:4,bottom:4,left:4,right:4} },
    alternateRowStyles: { fillColor: [243,246,255] },
    bodyStyles: { textColor: [30,30,50] },
    margin: { left: 20, right: 20 },
  };

  function _desenharCabecalhoEscola(doc, escola, titulo, pageWidth){
    const L = 28, R = pageWidth - 28;
    let y = 20;

    let logoW = 0;
    if(escola && escola.escudo){
      try{
        const imgW = 48, imgH = 48;
        doc.addImage(escola.escudo, 'PNG', L, y, imgW, imgH);
        logoW = imgW + 10;
      }catch(_){}
    }

    const tx = L + logoW;
    if(escola && escola.nome){
      doc.setFontSize(13); doc.setFont(undefined,"bold"); doc.setTextColor(11,63,191);
      doc.text(escola.nome.toUpperCase(), tx, y + 13);
      doc.setFont(undefined,"normal"); doc.setTextColor(60);
      let subY = y + 24;
      const partes = [];
      if(escola.endereco) partes.push(escola.endereco);
      const cidade = [escola.cidade||escola.municipio, escola.uf||escola.UF].filter(Boolean).join('/');
      if(cidade) partes.push(cidade);
      if(escola.inep||escola.codigoInep) partes.push(`INEP: ${escola.inep||escola.codigoInep}`);
      if(escola.email) partes.push(`E-mail: ${escola.email}`);
      if(escola.telefone||escola.tel) partes.push(`Tel: ${escola.telefone||escola.tel}`);
      if(partes.length){
        doc.setFontSize(8);
        const linha = doc.splitTextToSize(partes.join('  •  '), R - tx - 10);
        doc.text(linha, tx, subY);
        subY += linha.length * 10;
      }
      y = Math.max(y + 50, subY + 4);
    } else {
      y = y + (logoW ? 52 : 0);
    }

    doc.setDrawColor(11,63,191); doc.setLineWidth(1.2);
    doc.line(L, y, R, y);
    y += 8;

    doc.setFontSize(11); doc.setFont(undefined,"bold"); doc.setTextColor(20);
    doc.text(titulo, L, y + 8);
    doc.setFont(undefined,"normal"); doc.setTextColor(0);
    y += 18;

    return y;
  }

  async function exportFichaGeralPdf(titulo, lista){
    if(!lista.length){ setMsg('Nenhum funcionário para exportar.', 'warn'); return; }
    const { jsPDF } = window.jspdf || {};
    if(!jsPDF){ setMsg('Falha ao carregar jsPDF. Verifique sua conexão.', 'err'); return; }

    const escola = await _carregarDadosEscola();
    const enriquecidos = lista.map(enriquecerFuncionario);

    const doc = new jsPDF({ orientation: 'l', unit: 'pt', format: 'a4' });
    const pw = doc.internal.pageSize.getWidth();
    const startY = _desenharCabecalhoEscola(doc, escola, titulo, pw);

    doc.autoTable({
      head: [COLS_ESSENCIAIS.map(c => c.label)],
      body: enriquecidos.map(f => linhaColunas(f, COLS_ESSENCIAIS)),
      startY,
      ..._TABLE_STYLES,
      columnStyles: Object.fromEntries(COLS_ESSENCIAIS.map((c,i) => [i, { cellWidth: c.width }])),
    });

    doc.save(_buildFilename('Ficha_Geral_Funcionarios', escola, 'pdf'));
  }

  /* ══════════════════════════════════════════
     2) Tabela completa (DOCX) — todos os campos, em Word
  ══════════════════════════════════════════ */
  async function exportTabelaDocx(titulo, lista){
    if(!lista.length){ setMsg('Nenhum funcionário para exportar.', 'warn'); return; }
    const docxLib = window.docx;
    if(!docxLib){ setMsg('Falha ao carregar a biblioteca de exportação Word. Verifique sua conexão.', 'err'); return; }
    const { Document, Packer, Table, TableRow, TableCell, Paragraph, TextRun,
            WidthType, HeadingLevel, AlignmentType } = docxLib;

    const escola = await _carregarDadosEscola();
    const enriquecidos = lista.map(enriquecerFuncionario);

    const headerRow = new TableRow({
      tableHeader: true,
      children: COLS_COMPLETO.map(c => new TableCell({
        shading: { fill: '0B3FBF' },
        children: [new Paragraph({
          children: [new TextRun({ text: c.label, bold: true, color: 'FFFFFF', size: 15 })],
        })],
      })),
    });

    const bodyRows = enriquecidos.map((f, i) => new TableRow({
      children: COLS_COMPLETO.map(c => new TableCell({
        shading: i % 2 === 1 ? { fill: 'F3F6FF' } : undefined,
        children: [new Paragraph({
          children: [new TextRun({ text: String(f[c.key] ?? '') || '—', size: 15 })],
        })],
      })),
    }));

    const nomeEscola = _getSchoolDisplayName(escola) || (escola && escola.nome) || '';

    const doc = new Document({
      sections: [{
        properties: {
          page: {
            size: { orientation: 'landscape' },
            margin: { top: 500, bottom: 500, left: 500, right: 500 },
          },
        },
        children: [
          ...(nomeEscola ? [new Paragraph({
            children: [new TextRun({ text: nomeEscola.toUpperCase(), bold: true, size: 26, color: '0B3FBF' })],
          })] : []),
          new Paragraph({
            children: [new TextRun({ text: titulo, bold: true, size: 22 })],
            spacing: { after: 200 },
          }),
          new Table({
            width: { size: 100, type: WidthType.PERCENTAGE },
            rows: [headerRow, ...bodyRows],
          }),
        ],
      }],
    });

    const blob = await Packer.toBlob(doc);
    _baixarBlob(blob, _buildFilename('Tabela_Completa_Funcionarios', escola, 'docx'));
  }

  /* ══════════════════════════════════════════
     3) CSV completo — todos os campos, exceto imagem/documento
  ══════════════════════════════════════════ */
  async function exportCsvCompleto(lista){
    if(!lista.length){ setMsg('Nenhum funcionário para exportar.', 'warn'); return; }
    const enriquecidos = lista.map(enriquecerFuncionario);
    const linhas = [
      COLS_COMPLETO.map(c => c.label),
      ...enriquecidos.map(f => linhaColunas(f, COLS_COMPLETO)),
    ];
    const csv = linhas
      .map(cols => cols.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(';'))
      .join('\r\n');

    const escola = await _carregarDadosEscola();
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    _baixarBlob(blob, _buildFilename('Completo_Funcionarios', escola, 'csv'));
  }

  /* ══════════════════════════════════════════
     4) Ficha individual (PDF) — uma página por funcionário, todos os dados
     em formato de ficha (rótulo: valor). Foto 3x maior que a do aluno
     (aluno usa 40pt; aqui 120pt), a pedido.
  ══════════════════════════════════════════ */
  function _fetchImagemComoDataUrl(url){
    return fetch(url)
      .then(r => r.blob())
      .then(blob => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      }))
      .catch(() => null); // sem foto ou falha de rede — ficha segue sem ela
  }

  async function exportFichaIndividualPdf(titulo, lista){
    if(!lista.length){ setMsg('Nenhum funcionário para exportar.', 'warn'); return; }
    const { jsPDF } = window.jspdf || {};
    if(!jsPDF){ setMsg('Falha ao carregar jsPDF. Verifique sua conexão.', 'err'); return; }

    const escola = await _carregarDadosEscola();
    const enriquecidos = lista.map(enriquecerFuncionario);

    // Busca todas as fotos em paralelo antes de montar as páginas
    const comFoto = enriquecidos.filter(f => f.fotoUrl);
    const pares = await Promise.all(comFoto.map(f => _fetchImagemComoDataUrl(f.fotoUrl)));
    const fotoDataUrls = {};
    comFoto.forEach((f, i) => { if(pares[i]) fotoDataUrls[f.funcId] = pares[i]; });

    const doc = new jsPDF({ orientation: 'p', unit: 'pt', format: 'a4' });
    const pw = doc.internal.pageSize.getWidth();

    const secoes = [
      { titulo: 'Identificação', campos: [
        ['Nome', 'nome'], ['Função', 'funcao'], ['CPF', 'cpf'],
        ['RG/CNH', 'rgCnh'], ['Nascimento', '_nasc'], ['Idade', '_idade'],
        ['Sexo', '_sexoTexto'], ['Cor/Raça', 'corRaca'], ['Naturalidade', '_naturalidadeTexto'],
        ['Estrangeiro', '_estrangeiroTexto'],
      ]},
      { titulo: 'Filiação', campos: [ ['Mãe', 'filiacaoMae'], ['Pai', 'filiacaoPai'] ] },
      { titulo: 'Vínculo funcional', campos: [
        ['Vínculo', '_statusTexto'], ['Carga horária', 'cargaHoraria'],
        ['Turnos', '_turnosTexto'], ['Ano letivo', 'anoLetivo'],
      ]},
      { titulo: 'Endereço', campos: [
        ['CEP', 'cep'], ['Cidade', 'endCidade'], ['UF', 'endUF'], ['Zona', 'zonaResidencia'],
      ]},
      { titulo: 'Escolaridade e formação', campos: [
        ['Escolaridade', '_escolaridadeTexto'], ['Tipo de ensino', 'tipoEnsino'],
        ['Graduações', '_graduacoesTexto'], ['Pós-graduações', '_posGraduacoesTexto'],
        ['Complementações', '_complementacoesTexto'], ['Outros cursos', '_outrosCursosTexto'],
      ]},
    ];

    enriquecidos.forEach((f, i) => {
      if(i > 0) doc.addPage();
      let y = _desenharCabecalhoEscola(doc, escola, titulo, pw);

      const bX = 20, bW = pw - 40, colW = bW / 2;
      const fotoDataUrl = fotoDataUrls[f.funcId];
      const fotoSize = 120; // 3x o tamanho usado na ficha do aluno (40pt)
      const bannerH = 26;
      const bannerW = fotoDataUrl ? bW - fotoSize - 10 : bW;

      // Faixa com o nome do funcionário em destaque (encolhe se houver foto)
      doc.setFillColor(11, 63, 191);
      doc.roundedRect(bX, y, bannerW, bannerH, 3, 3, 'F');
      doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.setTextColor(255);
      doc.text((f.nome||'—').toUpperCase(), bX + 10, y + 17, { maxWidth: bannerW - 20 });

      if(fotoDataUrl){
        try{
          doc.addImage(fotoDataUrl, 'JPEG', bX + bannerW + 10, y, fotoSize, fotoSize, undefined, 'FAST');
        }catch(e){ /* imagem corrompida/formato inesperado — segue sem travar a ficha */ }
      }
      // Avança o Y pelo que for mais alto: a faixa do nome ou a foto (bem
      // maior aqui, então normalmente é ela quem manda no espaço reservado)
      y += Math.max(bannerH, fotoDataUrl ? fotoSize : 0) + 14;

      secoes.forEach(sec => {
        doc.setFontSize(9.5); doc.setFont(undefined,'bold'); doc.setTextColor(11,63,191);
        doc.text(sec.titulo.toUpperCase(), bX, y);
        y += 4;
        doc.setDrawColor(210,220,240); doc.setLineWidth(0.6);
        doc.line(bX, y, bX + bW, y);
        y += 14;

        doc.setFontSize(9); doc.setTextColor(30,30,50);
        for(let idx=0; idx<sec.campos.length; idx+=2){
          for(let c=0; c<2; c++){
            const campo = sec.campos[idx+c];
            if(!campo) continue;
            const [label, key] = campo;
            const valor = String(f[key] ?? '').trim() || '—';
            const colX = bX + c * colW;
            doc.setFont(undefined,'bold');
            doc.text(`${label}:`, colX, y);
            const labelW = doc.getTextWidth(`${label}: `);
            doc.setFont(undefined,'normal');
            doc.text(valor, colX + labelW + 2, y, { maxWidth: colW - labelW - 14 });
          }
          y += 16;
        }
        y += 12;
      });

      // NEE / Deficiência
      doc.setFontSize(9.5); doc.setFont(undefined,'bold'); doc.setTextColor(11,63,191);
      doc.text('NEE / DEFICIÊNCIA', bX, y);
      y += 4;
      doc.setDrawColor(210,220,240); doc.setLineWidth(0.6);
      doc.line(bX, y, bX + bW, y);
      y += 14;
      doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.setTextColor(30,30,50);
      doc.text(f._neeTexto || 'Nenhuma', bX, y, { maxWidth: bW });
    });

    doc.save(_buildFilename('Fichas_Individuais', escola, 'pdf'));
  }

  /* ══════════════════════════════════════════
     Wiring — dropdown "Exportar" + botões
  ══════════════════════════════════════════ */
  function _tituloContexto(){
    const ano = (window.PesquisaFuncionarios && window.PesquisaFuncionarios.getAnoAtivo()) || '';
    return `Ano Ativo ${ano || ''}`.trim();
  }

  function iniciarExport(){
    if(!document.getElementById('btnExportarFuncionarios')) return;
    const lista = () => window.PesquisaFuncionarios.getParaExportar();
    // O menu fecha sozinho ao clicar num item (delegação [data-dropdown]); o clique do item roda primeiro.
    document.getElementById('btnExportFichaGeral').addEventListener('click', function(){
      exportFichaGeralPdf(`${_tituloContexto()} • Ficha Geral de Funcionários`, lista());
    });
    document.getElementById('btnExportDocx').addEventListener('click', function(){
      exportTabelaDocx(`${_tituloContexto()} • Tabela Completa de Funcionários`, lista());
    });
    document.getElementById('btnExportCsv').addEventListener('click', function(){
      exportCsvCompleto(lista());
    });
    document.getElementById('btnExportFichaIndividual').addEventListener('click', function(){
      exportFichaIndividualPdf(`${_tituloContexto()} • Ficha Individual`, lista());
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciarExport);
  else iniciarExport();

})();
</script>
