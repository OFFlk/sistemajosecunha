<head>

<!-- ══ Theme init (antes de tudo) ══ -->
<script>
(function(){
  const KEY = 'ui_theme_v1';
  const saved = (localStorage.getItem(KEY) || '').toLowerCase();
  const theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<!-- ══ Firebase & System Scripts ══ -->
<script src="../loading-overlay.js"></script>
<script src="../auth.firebase.js"></script>
<script src="../db.firebase.js?v=8"></script>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- ══ CSS Externo (ordem correta) ══ -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pesquisa-funcionario.css?v=4">

<style>
/* ── Aliases de marca (par claro/escuro) — mesmos nomes do cadastro-funcionario ──
   var(--primary, #7c3aed) não existe no sistema (caía sempre no roxo fixo). */
:root{
  --pf-brand:var(--brand,#7c3aed);
  --pf-brand-text:var(--brand-text,#6d28d9);
  --pf-brand-faded:var(--brand-faded,#f5f3ff);
  --pf-brand-border:var(--brand-border,#ddd6fe);
}
html[data-theme="dark"]{
  --pf-brand:var(--brand-d,#8b5cf6);
  --pf-brand-text:var(--brand-text-d,#c4b5fd);
  --pf-brand-faded:var(--brand-faded-d,rgba(124,58,237,.18));
  --pf-brand-border:var(--brand-border-d,#7c3aed);
}

/* ── Card de destaque (guia, Parte 1.3b) — contraste vem de ThemeColors.ajustarContraste() ── */
.card.card-destaque{
  --dest-fg:#ffffff;
  --dest-btn-bg:rgba(255,255,255,.18);
  --dest-btn-bd:rgba(255,255,255,.40);
  --dest-btn-hover:rgba(255,255,255,.28);
  --dest-panel-bg:rgba(255,255,255,.10);
  background:var(--btn-home-bg); border-color:var(--btn-home-border);
}
html[data-theme="dark"] .card.card-destaque{ background:var(--btn-home-bg); border-color:var(--btn-home-border); }
.card.card-destaque.contraste-claro{
  --dest-fg:#0f172a;
  --dest-btn-bg:rgba(0,0,0,.08);
  --dest-btn-bd:rgba(0,0,0,.25);
  --dest-btn-hover:rgba(0,0,0,.16);
  --dest-panel-bg:rgba(0,0,0,.06);
  border-color:var(--border);
}
.card.card-destaque h2{ color:var(--dest-fg); }
/* só o rótulo direto do campo: os <label> dentro dos chips de turno herdam a cor do chip */
.card-destaque .field > label{ color:var(--dest-fg); }
.card.card-destaque .btn.primary{ background:var(--dest-btn-bg); border:1.5px solid var(--dest-fg); color:var(--dest-fg); font-weight:800; }
.card.card-destaque .btn.primary:hover:not(:disabled){ background:var(--dest-btn-hover); border-color:var(--dest-fg); color:var(--dest-fg); }
.card.card-destaque .btn.secondary, .card.card-destaque .btn.ghost{ background:transparent; border:1.5px solid var(--dest-btn-bd); color:var(--dest-fg); }
.card.card-destaque .btn.secondary:hover:not(:disabled), .card.card-destaque .btn.ghost:hover:not(:disabled){ background:var(--dest-btn-hover); border-color:var(--dest-fg); color:var(--dest-fg); }
.card.card-destaque .btn:disabled, .card.card-destaque .btn:disabled:hover{
  background:rgba(128,128,128,.28); border:1.5px solid rgba(128,128,128,.5); color:#6b7280; opacity:1; cursor:not-allowed; filter:none; box-shadow:none;
}
/* Chips de turno dentro do destaque: o "marcado" antes era só uma borda --brand (some contra o próprio card).
   Agora: contorno translúcido; marcado = preenchimento sólido com o texto na cor do card (par calculado). */
.card.card-destaque .turno-checkbox-wrap{ background:transparent; border-color:var(--dest-btn-bd); color:var(--dest-fg); }
.card.card-destaque .turno-checkbox-wrap:hover{ background:var(--dest-btn-hover); border-color:var(--dest-fg); color:var(--dest-fg); }
.card.card-destaque .turno-checkbox-wrap.checked{ background:var(--dest-fg); border-color:var(--dest-fg); color:var(--btn-home-bg); }
.card.card-destaque .turno-checkbox-wrap.checked input[type="checkbox"]{ accent-color:var(--btn-home-bg); }
/* Chip de aviso dos turnos: o padrão (--chip-bg) ficava da cor do body no claro e da cor do card no escuro */
.card.card-destaque #turnoHint{ background:var(--dest-panel-bg); border:1px solid var(--dest-btn-bd); color:var(--dest-fg); }
.ano-erro{ margin-top:6px; font-size:12px; font-weight:700; color:var(--dest-fg); }

/* ── Ícone de dica (ⓘ) — tooltip por toque/clique (guia, Parte 2) ── */
.info-tip{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  width:16px; height:16px; margin-left:6px; border-radius:50%;
  border:1.5px solid currentColor; color:inherit; opacity:.72;
  font-size:11px; font-weight:700; font-style:italic; font-family:Georgia, "Times New Roman", serif;
  line-height:1; cursor:pointer; user-select:none; vertical-align:middle;
}
.info-tip:hover, .info-tip.open{ opacity:1; background:rgba(127,127,127,.18); }
.info-tip-bubble{
  display:none; position:absolute; z-index:60; left:0; top:calc(100% + 8px);
  width:min(260px, 70vw); max-height:180px; overflow-y:auto; padding:10px 12px; border-radius:10px;
  background:var(--card); border:1.5px solid var(--border); color:var(--text);
  box-shadow:0 8px 24px rgba(0,0,0,.18); font-size:13px; font-weight:400; font-style:normal; line-height:1.4;
  white-space:normal; cursor:default; text-align:left; text-transform:none; letter-spacing:normal;
}
.info-tip.open .info-tip-bubble{ display:block; }

/* ── Contador de resultados: badge com destaque (substitui o log "X funcionário(s) encontrado(s)") ── */
#countFuncionarios{
  font-size:14px; font-weight:800; padding:5px 14px;
  background:var(--pf-brand); border-color:var(--pf-brand); color:var(--brand-fg,#fff);
}

/* ══ Padrão de exibição do sistema — adaptado de pesquisa-ano-ativo ══ */

/* ── Painel único (sem "turma", diferente do aluno) ── */
.panel         { background: var(--card-bg, var(--card)); border: 1px solid var(--card-border, var(--border)); border-radius: 14px; box-shadow: var(--shadow, 0 4px 20px rgba(0,0,0,0.06)); padding: 16px; margin-top: 16px; }
.panel-head    { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.panel h2      { font-size: 17px; margin: 0; font-weight: 800; }
.count         { background: var(--chip-bg); border: 1px solid var(--line, var(--border)); padding: 3px 10px; border-radius: 999px; font-size: 12px; color: var(--chip-color, var(--text)); font-weight: 700; }
.panel-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.list          { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media(max-width:860px){ .list { grid-template-columns: 1fr; } }
.loading       { font-size: 12px; color: var(--muted); margin-top: 8px; }

/* ── Cards de item (um por funcionário) ── */
.item        { border: 1px solid var(--card-border, var(--border)); border-radius: 10px; padding: 14px; background: var(--card-bg, var(--card)); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; transition: background .2s, border-color .2s; }
.item .left  { min-width: 0; flex: 1; }
.item .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
/* Sempre 3 blocos empilhados: nome / badges / meta-dados — não depende da largura */
.item .title    { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; font-size: 14px; }
.item .nome     { font-weight: 800; }
.item .badges   { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; }
.item .badges .badge { margin: 0; }
/* CPF: neutro (cinza do tema), pra se distinguir do badge de cargo, que é tingido de marca */
.item .badge.badge-cpf { background: color-mix(in srgb, var(--text) 8%, transparent); border-color: color-mix(in srgb, var(--text) 24%, transparent); color: var(--text); }
.item .meta-i { white-space: nowrap; }
/* Botões do card: mesma largura, empilhados */
.item .right { align-items: stretch; min-width: 112px; }
.item .right .btn { justify-content: center; }
.item .right .check { justify-content: center; }
.item .meta  { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.35; }

/* ── Seleção do card inteiro (checkbox oculto) — mesmo padrão do módulo de aluno ── */
.item.selecionavel { cursor: pointer; position: relative; }
.item.selecionavel .check { display: none; }
.item.selecionavel:has(.chkFuncionario:checked) {
  background: var(--brand-faded);
  border-color: var(--brand-hover, var(--brand-border));
}
html[data-theme="dark"] .item.selecionavel:has(.chkFuncionario:checked) {
  background: var(--brand-faded-d);
  border-color: var(--brand-border-d);
}
.item.selecionavel .selo-selecionado {
  display: none;
  position: absolute; bottom: 10px; right: 10px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--pf-brand); color: var(--brand-fg, #fff);
  align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; line-height: 1;
}
.item.selecionavel:has(.chkFuncionario:checked) .selo-selecionado { display: flex; }
.check           { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
.check input     { cursor: pointer; accent-color: var(--pf-brand); width: 18px; height: 18px; margin: 0; }
.check-all       { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 700; cursor: pointer; }
.check-all input { cursor: pointer; accent-color: var(--pf-brand); }
.count-selecionados { background: var(--pf-brand-faded); border: 1px solid var(--pf-brand-border); color: var(--pf-brand-text); }

/* ── Ordenação ── */
.sort-control        { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 10px 14px; background: var(--chip-bg); border: 1px solid var(--card-border, var(--border)); border-radius: 10px; }
.sort-control label  { font-size: 13px; font-weight: 700; color: var(--chip-color, var(--text)); white-space: nowrap; }
.sort-control select { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--field-border, var(--border)); background: var(--field-bg, var(--card)); color: var(--text); font-size: 13px; font-family: 'Nunito', sans-serif; cursor: pointer; outline: none; }
.sort-control select:focus { border-color: var(--pf-brand); }
.sort-control button { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--card-border, var(--border)); background: var(--chip-bg); color: var(--chip-color, var(--text)); font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all .18s; }
.sort-control button:hover { background: var(--pf-brand); border-color: var(--pf-brand); color: var(--brand-fg, #fff); }

/* ── Botões do card de funcionário: agora são .btn.small do sistema.
   Editar = .btn.secondary (tingido de marca, hover já tem par escuro); Visualizar = .btn.neutral ── */
.btn.neutral { background: transparent; border-color: var(--border); color: var(--text); }
.btn.neutral:hover { background: var(--pf-brand-faded); border-color: var(--pf-brand); color: var(--pf-brand-text); }
.link-doc-ver { font-size: 12px; font-weight: 800; color: var(--pf-brand-text); text-decoration: none; }
.link-doc-ver:hover { text-decoration: underline; }

/* ── Badge de vínculo — cores por status ── */
.badge-status.ce { background: rgba(234,179,8,.10);  border-color: rgba(234,179,8,.35);  color: #854d0e; }
.badge-status.ps { background: rgba(59,130,246,.10); border-color: rgba(59,130,246,.35); color: #1d4ed8; }
.badge-status.ef { background: rgba(22,163,74,.10);  border-color: rgba(22,163,74,.30);  color: #166534; }

/* ── Modal (ficha do funcionário) ── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 1000; /* acima do header */ }
.modal-backdrop.open { display: flex; }
.modal          { width: min(900px, 96vw); max-height: 86vh; overflow: auto; background: var(--card-bg, var(--card)); border-radius: 14px; border: 1px solid var(--card-border, var(--border)); box-shadow: 0 30px 60px rgba(0,0,0,.25); }
.modal-head     { position: sticky; top: 0; background: var(--card-bg, var(--card)); display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--card-border, var(--border)); }
.modal-head h3  { margin: 0; font-size: 16px; font-weight: 800; }
.modal-body     { padding: 14px; }

/* ── Ficha (modal): blocos de formação e NEE ── */
.ficha-sub{font-size:11px;font-weight:800;color:var(--ui-muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px;}
.ficha-chips{display:flex;flex-wrap:wrap;gap:6px;}
.ficha-linha{font-size:13px;}
.ficha-vazio{font-size:13px;color:var(--ui-muted);}
</style>

<body>
<!-- ══ Header Placeholder ══ -->
<div id="header-placeholder"></div>

<!-- ══ MAIN CONTENT ══ -->
<main class="wrap">

  <!-- ══════════════════════════════════════════
       CARD: Filtros de Pesquisa
  ══════════════════════════════════════════ -->
  <section class="card card-destaque" id="cardFiltros">
    <div class="card-head">
      <h2>Filtros de pesquisa</h2>
    </div>

    <!-- Ano Ativo -->
    <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;">
      <div class="field" style="width:220px;flex:0 0 220px;margin:0;">
        <label for="selectAnoAtivo">Ano letivo <span class="info-tip" tabindex="0" onclick="event.stopPropagation(); event.preventDefault(); document.querySelectorAll('.info-tip.open').forEach(o=>{ if(o!==this) o.classList.remove('open'); }); this.classList.toggle('open');">i<span class="info-tip-bubble">Mostra os funcionários cadastrados no ano letivo escolhido. Ao abrir a página, o ano ativo definido pelo administrador já vem selecionado. Para consultar outro ano, escolha-o na lista, que traz os anos que possuem funcionários cadastrados.</span></span></label>
        <select id="selectAnoAtivo" style="width:100%;"></select>
        <div class="ano-erro" id="anoAtivoMsg" style="display:none;"></div>
      </div>

    <!-- Grid de Filtros -->
    <div class="filters-grid">
      <div class="field">
        <label for="fBusca">Busca geral</label>
        <input id="fBusca" type="text" placeholder="Nome, CPF, RG/CNH, função, naturalidade..." autocomplete="off"/>
      </div>
      
      <div class="field">
        <label for="fStatus">Status / Vínculo</label>
        <select id="fStatus">
          <option value="">Todos</option>
          <option value="CE">Contrato Emergencial (CE)</option>
          <option value="PS">Processo Seletivo (PS)</option>
          <option value="EF">Concursado / Efetivo (EF)</option>
        </select>
      </div>
      
      <div class="field">
        <label for="fFuncao">Função / Cargo</label>
        <select id="fFuncao">
          <option value="">Todas</option>
        </select>
      </div>
      
      <div class="field">
        <label for="fCargaH">Carga horária</label>
        <select id="fCargaH">
          <option value="">Todas</option>
        </select>
      </div>
    </div>

    <!-- Filtro de Turnos -->
    <div style="margin-top:16px;">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:var(--dest-fg);opacity:.85;text-transform:uppercase;letter-spacing:0.4px;">Turno</label>
      <div class="turnos-row">
        <label class="turno-checkbox-wrap" id="lblFMat">
          <input type="checkbox" id="fMat" value="MAT"/>
          <label for="fMat">🌅 Matutino</label>
        </label>
        <label class="turno-checkbox-wrap" id="lblFVes">
          <input type="checkbox" id="fVes" value="VES"/>
          <label for="fVes">☀️ Vespertino</label>
        </label>
        <label class="turno-checkbox-wrap" id="lblFNot">
          <input type="checkbox" id="fNot" value="NOT"/>
          <label for="fNot">🌙 Noturno</label>
        </label>

      </div>
    </div>

    <!-- Ação: Limpar Filtros -->
    <div class="filter-actions" style="margin-top:16px;">
      <button class="btn ghost" id="btnLimparFiltros" type="button">✕ Limpar filtros</button>
    </div>

  <!-- ══════════════════════════════════════════
       PAINEL: Resultados (cards, padrão do sistema)
  ══════════════════════════════════════════ -->
  <div class="panel">
    <div class="panel-head">
      <div style="display:flex;align-items:center;gap:10px;">
        <h2>Funcionários</h2><span class="count" id="countFuncionarios">0</span>
      </div>
      <div class="panel-actions">
        <label class="check-all"><input type="checkbox" id="chkAllFuncionarios"> Todos</label>
        <span class="count count-selecionados" id="countSelecionados" style="display:none;">0 selecionado(s)</span>
        <div class="rel-inline" id="wrapExportFuncionarios">
          <button class="btn primary" id="btnExportarFuncionarios" type="button">Exportar ▾</button>
          <!-- Dropdown no padrão global (.popover.menu). Abre/fecha pelo script de exportação (legado: style.display) -->
          <div class="popover menu align-right" id="dropExportFuncionarios" style="display:none;">
            <button class="btn quiet menu-item" id="btnExportFichaGeral" type="button">📋 Ficha geral (PDF)</button>
            <button class="btn quiet menu-item" id="btnExportDocx" type="button">📄 Tabela completa (Word)</button>
            <button class="btn quiet menu-item" id="btnExportCsv" type="button">📊 CSV completo (todos os dados)</button>
            <div class="pop-div"></div>
            <button class="btn quiet menu-item" id="btnExportFichaIndividual" type="button">🧾 Ficha individual (PDF)</button>
          </div>
        </div>
      </div>
    </div>

    <div class="sort-control">
      <label>Ordenar por:</label>
      <select id="sortField">
        <option value="nome">Nome</option>
        <option value="funcao">Função</option>
        <option value="cargaHoraria">Carga horária</option>
        <option value="_idade">Idade</option>
        <option value="status">Vínculo</option>
      </select>
      <button type="button" id="btnToggleSort" title="Alternar ordem">↑↓</button>
    </div>

    <div class="list" id="listaFuncionarios"></div>
    <div class="loading" id="loadingFuncionarios" style="display:none;">Carregando...</div>
  </div>

</main>

<!-- ══════════════════════════════════════════

<!-- ══════════════════════════════════════════
     JAVASCRIPT PRINCIPAL (interno, como nas demais páginas)
══════════════════════════════════════════ -->
<script>
/* ══════════════════════════════════════════════════════════
   PESQUISA-FUNCIONARIO.JS
   Script principal para a página de pesquisa de funcionários
   
   Funcionalidades:
   - Busca e filtros dinâmicos
   - Ordenação
   - Integração com Firebase
   - Filtro por ano letivo

   Fonte dos dados: funcionariosMatriculas (1 query por ano letivo, com cache).
   Cada matrícula já traz uma CÓPIA dos dados pessoais do funcionário, então a
   pesquisa não precisa ler a coleção `funcionarios` (ver cadastro-funcionario.html).
   ══════════════════════════════════════════════════════════ */

(function(){
  /* ══════════════════════════════════════════
     Helpers
  ══════════════════════════════════════════ */
  function formatDate(str){
    if(!str) return '';
    const d = new Date(str + 'T00:00:00');
    if(isNaN(d)) return str;
    return d.toLocaleDateString('pt-BR');
  }

  function calcAge(dateStr){
    if(!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d)) return '';
    const today = new Date();
    let age = today.getFullYear() - d.getFullYear();
    const m = today.getMonth() - d.getMonth();
    if(m < 0 || (m===0 && today.getDate() < d.getDate())) age--;
    return age < 0 ? '' : String(age);
  }

  function turnosTexto(arr){
    if(!Array.isArray(arr)||!arr.length) return '—';
    return arr.map(t => t==='MAT'?'🌅 Mat':t==='VES'?'☀️ Ves':'🌙 Not').join(' ');
  }

  function normalize(s){
    return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  }

  function highlight(text, query){
    if(!query||!text) return escapeHtml(text||'—');
    const escaped = escapeHtml(text);
    const q = query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try {
      const re = new RegExp('(' + q + ')', 'gi');
      return escaped.replace(re, '<mark>$1</mark>');
    } catch(e) { return escaped; }
  }

  function escapeHtml(s){
    return (s||'').toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const STATUS_LABEL = { CE:'CE', PS:'PS', EF:'EF', OUTRO:'Outro' };
  const SEXO_LABEL   = { F:'Feminino', M:'Masculino', O:'Outro' };

  /* ══════════════════════════════════════════
     Estado Global
  ══════════════════════════════════════════ */
  let funcionarios = [];   // matrículas carregadas (do ano selecionado; todas só em "Todos os anos")
  let filtrados    = [];
  const _cacheAno  = new Map();   // ano ('2026' | '*') -> matrículas já lidas: trocar de ano e voltar não relê o banco
  let _tkAno       = 0;           // descarta resposta atrasada se o usuário trocar de ano rápido
  let _anoAtivo    = '';   // controlado pelo select

  // Ordenação: campo selecionado no <select> + botão de alternar direção
  let currentSortField = 'nome';
  let currentSortOrder = 'asc'; // 'asc' | 'desc'

  /* ══════════════════════════════════════════
     Exportar dados filtrados para outras funções
  ══════════════════════════════════════════ */
  const matIdDe = f => (f && (f.matriculaId || f._id)) || '';

  // funcId dos marcados (contrato antigo, usado pelo export). Em "Todos os anos" o mesmo funcId pode
  // aparecer em mais de uma linha: por isso getParaExportar filtra pela MATRÍCULA.
  function funcionariosMarcadosIds(){
    return new Set(Array.from(document.querySelectorAll('.chkFuncionario:checked')).map(c => c.dataset.func));
  }
  function matriculasMarcadas(){
    return new Set(Array.from(document.querySelectorAll('.chkFuncionario:checked')).map(c => c.dataset.mat));
  }

  window.PesquisaFuncionarios = {
    getFiltrados: () => filtrados,
    getTodos: () => funcionarios,
    getAnoAtivo: () => _anoAtivo,
    getSelecionados: funcionariosMarcadosIds,
    // Regra de exportação: nenhum marcado -> todos os filtrados (na ordem
    // atual); 1+ marcados -> só os marcados (mantendo a ordem de filtrados).
    getParaExportar: () => {
      const ids = matriculasMarcadas();
      return ids.size ? filtrados.filter(f => ids.has(matIdDe(f))) : filtrados;
    }
  };

  /* ══════════════════════════════════════════
     Ano Ativo — Firestore (mesmo padrão de pesquisa-ano-ativo)
  ══════════════════════════════════════════ */
  const selectAnoAtivo = document.getElementById('selectAnoAtivo');
  const anoAtivoMsg    = document.getElementById('anoAtivoMsg');
  let anoAtivoReal = ''; // ano ativo real, configurado no sistema
  let erroCarga    = ''; // mensagem se a leitura do banco falhar (mostrada no estado vazio)

  // Ano do cadastro: `anoLetivo`, com fallback pro campo legado `ano` (mesma regra do cadastro-funcionario).
  function anoDoFuncionario(f){
    return String((f && (f.anoLetivo || f.ano)) || '').trim();
  }

  function atualizarAnoEfetivo(){
    _anoAtivo = selectAnoAtivo.value || anoAtivoReal;
  }

  // Espera sessão + escola ativa uma única vez (as duas leituras abaixo dependem disso).
  let _acessoPromise = null;
  function prepararAcesso(){
    if(!_acessoPromise){
      _acessoPromise = (async () => {
        await new Promise(res => {
          if(window.Auth && window.Auth.getSession && window.Auth.getSession()) return res();
          document.addEventListener('auth:ready', res, {once:true});
        });
        await esperarEscolaAtiva(6000);
      })();
    }
    return _acessoPromise;
  }

  async function carregarAnoAtivo(){
    try{
      await prepararAcesso();
      // 2 leituras pequenas: o doc da escola (ano ativo) e os docs de funcionariosAnos (1 por ano).
      // Antes: DB.loadAll() + varredura de todos os funcionários só para montar este select.
      const [escola, anosDocs] = await Promise.all([
        window.DB.escola.get(),
        window.DB.funcionariosAnos.list(),
      ]);
      anoAtivoReal = (escola?.configAnoAtivo || '').toString().replace(/"/g,'').trim();

      // Só anos que realmente têm funcionários matriculados (mesma lógica de pesquisa-ano-ativo)
      const anosSet = new Set();
      anosDocs.forEach(d => { const y = String(d.anoLetivo || d._id || '').trim(); if(y) anosSet.add(y); });
      if(anoAtivoReal) anosSet.add(anoAtivoReal);
      const anos = Array.from(anosSet).filter(Boolean).sort((a,b) => Number(a) - Number(b));

      selectAnoAtivo.innerHTML = '';
      // Sem ano ativo configurado não há o que pré-selecionar: mantém o comportamento antigo (sem filtro de ano).
      if(!anoAtivoReal){
        const oTodos = document.createElement('option');
        oTodos.value = ''; oTodos.textContent = 'Todos os anos';
        selectAnoAtivo.appendChild(oTodos);
      }
      anos.forEach(y => {
        const o = document.createElement('option');
        o.value = y; o.textContent = y;
        selectAnoAtivo.appendChild(o);
      });
      // Abre já no ano ativo (não existe mais a opção "(usar ano ativo)").
      selectAnoAtivo.value = anoAtivoReal || '';

      atualizarAnoEfetivo();
    }catch(e){
      console.warn('carregarAnoAtivo:', e);
      anoAtivoMsg.textContent = '⚠️ Não foi possível carregar o ano ativo.';
      anoAtivoMsg.style.display = 'block';
    }
  }

  selectAnoAtivo.addEventListener('change', async function(){
    const tk = ++_tkAno;
    atualizarAnoEfetivo();
    await carregarMatriculas();
    if(tk !== _tkAno) return;          // o usuário já escolheu outro ano
    popularSelects();
    aplicarFiltros();
  });

  /* ══════════════════════════════════════════
     Firestore - Carregar Dados
  ══════════════════════════════════════════ */
  // Espera a escola ativa existir (col() do db_firebase.js lança "Nenhuma escola ativa" antes disso).
  async function esperarEscolaAtiva(maxMs){
    const t0 = Date.now();
    while(Date.now() - t0 < maxMs){
      try{
        const A = window.Auth;
        if(!A || typeof A.getActiveSchoolId !== 'function') return true;
        if(A.db && A.getActiveSchoolId()) return true;
      }catch(_){}
      await new Promise(r => setTimeout(r, 150));
    }
    return false;
  }

  // Lê as matrículas do ano selecionado (1 query por ano; "Todos os anos" lê a coleção inteira).
  async function carregarMatriculas(){
    erroCarga = '';
    const ano = _anoAtivo;
    const chave = ano || '*';
    const elLoading = document.getElementById('loadingFuncionarios');
    try{
      await prepararAcesso();
      if(!window.DB || !window.DB.funcionariosMatriculas){
        throw new Error('db.firebase.js desatualizado: falta a coleção funcionariosMatriculas.');
      }
      if(!_cacheAno.has(chave)){
        if(elLoading) elLoading.style.display = 'block';
        const buscar = () => ano
          ? window.DB.funcionariosMatriculas.whereEquals('anoLetivo', Number(ano))
          : window.DB.funcionariosMatriculas.list();
        let docs;
        try{
          docs = await buscar();
        }catch(e1){
          console.warn('carregarMatriculas (1ª tentativa):', e1);
          await new Promise(r => setTimeout(r, 800));
          docs = await buscar();
        }
        _cacheAno.set(chave, docs);
      }
      funcionarios = _cacheAno.get(chave);
    }catch(e){
      console.error('carregarMatriculas:', e);
      erroCarga = (e && e.message) ? e.message : String(e);
      funcionarios = [];
    }finally{
      if(elLoading) elLoading.style.display = 'none';
    }
  }

  /* ══════════════════════════════════════════
     Popular selects dinâmicos (Função e C.H.)
  ══════════════════════════════════════════ */
  function getFuncionariosDoAno(){
    if(!_anoAtivo) return funcionarios;
    return funcionarios.filter(f => anoDoFuncionario(f) === _anoAtivo);
  }

  function popularSelects(){
    const base = getFuncionariosDoAno();

    const funcoes = [...new Set(
      base.map(f => (f.funcao||'').trim()).filter(Boolean)
    )].sort((a,b) => a.localeCompare(b,'pt-BR'));

    const selFuncao = document.getElementById('fFuncao');
    selFuncao.innerHTML = '<option value="">Todas</option>';
    funcoes.forEach(fn => {
      const o = document.createElement('option');
      o.value = fn; o.textContent = fn;
      selFuncao.appendChild(o);
    });

    const cargas = [...new Set(
      base.map(f => (f.cargaHoraria||'').toString().trim()).filter(Boolean)
    )].sort((a,b) => Number(a) - Number(b));

    const selCarga = document.getElementById('fCargaH');
    selCarga.innerHTML = '<option value="">Todas</option>';
    cargas.forEach(ch => {
      const o = document.createElement('option');
      o.value = ch; o.textContent = ch + 'H';
      selCarga.appendChild(o);
    });
  }

  /* ══════════════════════════════════════════
     UI refs
  ══════════════════════════════════════════ */
  const elBusca    = document.getElementById('fBusca');
  const elStatus   = document.getElementById('fStatus');
  const elFuncao   = document.getElementById('fFuncao');
  const elCargaH   = document.getElementById('fCargaH');
  const elSexo     = document.getElementById('fSexo');
  const chkMat     = document.getElementById('fMat');
  const chkVes     = document.getElementById('fVes');
  const chkNot     = document.getElementById('fNot');
  const turnoHint  = document.getElementById('turnoHint');
  const lista      = document.getElementById('listaFuncionarios');
  const countEl    = document.getElementById('countFuncionarios');
  const sortFieldEl = document.getElementById('sortField');
  const btnToggleSort = document.getElementById('btnToggleSort');
  const chkAllFuncionarios  = document.getElementById('chkAllFuncionarios');
  const countSelecionadosEl = document.getElementById('countSelecionados');

  /* ── Turno toggles visual ── */
  [chkMat, chkVes, chkNot].forEach(chk => {
    chk.addEventListener('change', function(){
      const lbl = chk.closest('.turno-checkbox-wrap');
      lbl.classList.toggle('checked', chk.checked);
      atualizarTurnoHint();
      aplicarFiltros();
    });
  });

  function getTurnosSelecionados(){
    const t = [];
    if(chkMat.checked) t.push('MAT');
    if(chkVes.checked) t.push('VES');
    if(chkNot.checked) t.push('NOT');
    return t;
  }

  function atualizarTurnoHint(){
    const t = getTurnosSelecionados();
    if(!t.length){
      turnoHint.textContent = 'Sem filtro de turno aplicado.';
    } else if(t.length === 1){
      turnoHint.textContent = 'Modo OU — exibe funcionários que atuam neste turno (mesmo que atuem em outros também).';
    } else {
      turnoHint.textContent = 'Modo E — exibe apenas funcionários que atuam em TODOS os turnos selecionados.';
    }
  }

  /* ══════════════════════════════════════════
     Filtros
  ══════════════════════════════════════════ */
  function aplicarFiltros(){
    const busca   = normalize(elBusca.value);
    const status  = elStatus.value;
    const funcao  = elFuncao.value;
    const cargaH  = elCargaH.value;
    const turnos  = getTurnosSelecionados();
    const base    = getFuncionariosDoAno();

    filtrados = base.filter(f => {
      // busca geral
      if(busca){
        const campos = [
          f.nome, f.cpf, f.rgCnh, f.funcao, f.naturalidadeCidade || f.naturalidade,
          f.naturalidadeUF, f.corRaca, f.cargaHoraria,
          STATUS_LABEL[f.status]||f.status
        ].map(x => normalize(x||'')).join(' ');
        if(!campos.includes(busca)) return false;
      }
      // status
      if(status && f.status !== status) return false;
      // função
      if(funcao && (f.funcao||'').trim() !== funcao) return false;
      // carga horária — compara como string pois pode ser número ou string no banco
      if(cargaH && String(f.cargaHoraria||'').trim() !== cargaH) return false;
      // sexo
      if(elSexo && elSexo.value && f.sexo !== elSexo.value) return false;
      // turnos: 1 selecionado = OU, 2+ = E
      if(turnos.length){
        const ft = Array.isArray(f.turnos) ? f.turnos : [];
        if(turnos.length === 1){
          // OU: basta ter o turno
          if(!ft.includes(turnos[0])) return false;
        } else {
          // E: precisa ter TODOS os turnos selecionados
          if(!turnos.every(t => ft.includes(t))) return false;
        }
      }
      return true;
    });

    aplicarOrdenacao();
    renderLista();
  }

  /* ══════════════════════════════════════════
     Ordenação
  ══════════════════════════════════════════ */
  function getSortVal(f, col){
    if(col === '_idade')  return parseInt(calcAge(f.dataNascimento)||'0', 10);
    if(col === '_nat')    return normalize([f.naturalidadeCidade || f.naturalidade, f.naturalidadeUF].filter(Boolean).join(' '));
    if(col === '_nTurnos') return Array.isArray(f.turnos) ? f.turnos.length : 0;
    if(col === 'dataNascimento') return f.dataNascimento || '';
    return normalize(f[col]||'');
  }

  function aplicarOrdenacao(){
    const col = currentSortField;
    const dir = currentSortOrder === 'asc' ? 1 : -1;
    filtrados.sort((a, b) => {
      const va = getSortVal(a, col);
      const vb = getSortVal(b, col);
      if(typeof va === 'number' && typeof vb === 'number'){
        return (va - vb) * dir;
      }
      if(va < vb) return -1 * dir;
      if(va > vb) return  1 * dir;
      return 0;
    });
  }

  sortFieldEl.addEventListener('change', function(){
    currentSortField = sortFieldEl.value;
    aplicarOrdenacao();
    renderLista();
  });
  btnToggleSort.addEventListener('click', function(){
    currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
    btnToggleSort.textContent = currentSortOrder === 'asc' ? '↑↓' : '↓↑';
    aplicarOrdenacao();
    renderLista();
  });

  /* ══════════════════════════════════════════
     Render lista (cards) — padrão do sistema, sem paginação
     (lista sempre exibe todos os filtrados, igual ao módulo de aluno)
  ══════════════════════════════════════════ */
  // Diz POR QUE a lista está vazia (falha de leitura, escola não selecionada, ano sem cadastros...).
  function mensagemVazio(){
    if(erroCarga) return '⚠️ Não foi possível carregar os funcionários: ' + escapeHtml(erroCarga);
    let escola = '';
    try{ escola = (window.Auth && window.Auth.getActiveSchoolId && window.Auth.getActiveSchoolId()) || ''; }catch(_){}
    if(!funcionarios.length){
      if(escola === 'ADMIN') return 'Nenhuma escola selecionada. Escolha uma escola no cabeçalho para ver os funcionários.';
      return 'Nenhum funcionário matriculado' + (_anoAtivo ? ' no ano letivo ' + escapeHtml(_anoAtivo) : '') +
             ' na escola ativa' + (escola ? ' (' + escapeHtml(escola) + ')' : '') + '.';
    }
    return 'Nenhum funcionário encontrado para os filtros aplicados.';
  }

  function renderLista(){
    const query = elBusca.value.trim();

    countEl.textContent = filtrados.length;

    if(!filtrados.length){
      lista.innerHTML = '<div class="muted" style="grid-column:1/-1;">' + mensagemVazio() + '</div>';
      syncCheckAllFuncionarios();
      atualizarContadorSelecionados();
      return;
    }

    lista.innerHTML = '';
    filtrados.forEach(f => {
      try{
      const nasc  = formatDate(f.dataNascimento) || '—';
      const idade = calcAge(f.dataNascimento) || '—';
      const ch    = f.cargaHoraria ? escapeHtml(f.cargaHoraria) + 'H' : '—';
      const vinc  = escapeHtml(STATUS_LABEL[f.status] || f.status || '—');
      // Resumo do card: só o essencial. Sexo, cor/raça e naturalidade ficam só na ficha (Visualizar).
      const meta = [
        `Nasc: ${escapeHtml(nasc)}`,
        `RG/CNH: ${highlight(f.rgCnh, query)}`,
        `Idade: ${escapeHtml(idade)}`,
        `Turnos: ${escapeHtml(turnosTexto(f.turnos))}`,
        `C.H.: ${ch}`,
        `Vínculo: ${vinc}`
      ].map(t => `<span class="meta-i">${t}</span>`).join(' • ');
      const matId = matIdDe(f);
      const el    = document.createElement('div');
      el.className = 'item selecionavel';
      el.innerHTML = `
        <div class="selo-selecionado">✓</div>
        <div class="left">
          <div class="title">
            <span class="nome">${highlight(f.nome, query) || 'Sem nome'}</span>
            <div class="badges">
              <span class="badge">${highlight(f.funcao, query) || 'Sem função'}</span>
              <span class="badge badge-cpf">CPF: ${highlight(f.cpf, query)}</span>
            </div>
          </div>
          <div class="meta">${meta}</div>
        </div>
        <div class="right">
          <a class="btn small secondary" href="cadastro-funcionario.html?editar=${encodeURIComponent(matId)}">✏️ Editar</a>
          <button type="button" class="btn small outline" data-view-mat="${escapeHtml(matId)}">👁️ Visualizar</button>
          <label class="check">
            <input type="checkbox" class="chkFuncionario" data-func="${escapeHtml(f.funcId)}" data-mat="${escapeHtml(matId)}" />
            <span>Selecionar</span>
          </label>
        </div>
      `;
      lista.appendChild(el);
      }catch(err){ console.error('renderLista: erro no registro', f && matIdDe(f), err); }
    });

    bindFuncionarioSelectionHandlers();
  }

  /* ══════════════════════════════════════════
     Seleção (checkbox) — mesmo padrão do módulo de aluno:
     checkbox escondido, clique em qualquer área vazia do card alterna,
     selo-selecionado (✓) aparece quando marcado, estado lido direto do DOM
     (sem Set — a lista inteira já está sempre renderizada, sem paginação).
     Nenhum card vem marcado por padrão.
  ══════════════════════════════════════════ */
  function bindFuncionarioSelectionHandlers(){
    document.querySelectorAll('.chkFuncionario').forEach(c => {
      c.addEventListener('change', function(){
        syncCheckAllFuncionarios();
        atualizarContadorSelecionados();
      });
    });
    lista.querySelectorAll('.item.selecionavel').forEach(el => {
      el.addEventListener('click', function(e){
        // só conta clique "seco" em área vazia — não em botão/link/checkbox,
        // nem quando o usuário só estava selecionando texto do card.
        if(e.target.closest('button, a, input, label')) return;
        if((window.getSelection()?.toString() || '').length > 0) return;
        const chk = el.querySelector('.chkFuncionario');
        if(!chk) return;
        chk.checked = !chk.checked;
        chk.dispatchEvent(new Event('change', { bubbles: true }));
      });
    });
    syncCheckAllFuncionarios();
    atualizarContadorSelecionados();
  }

  function syncCheckAllFuncionarios(){
    const chks = Array.from(document.querySelectorAll('.chkFuncionario'));
    if(!chks.length){
      chkAllFuncionarios.checked = false;
      chkAllFuncionarios.indeterminate = false;
      return;
    }
    const checked = chks.filter(c => c.checked).length;
    chkAllFuncionarios.checked = checked === chks.length;
    chkAllFuncionarios.indeterminate = checked > 0 && checked < chks.length;
  }

  function atualizarContadorSelecionados(){
    const n = document.querySelectorAll('.chkFuncionario:checked').length;
    countSelecionadosEl.textContent = `${n} selecionado(s)`;
    countSelecionadosEl.style.display = n > 0 ? 'inline-block' : 'none';
  }

  chkAllFuncionarios.addEventListener('change', function(){
    document.querySelectorAll('.chkFuncionario').forEach(c => { c.checked = chkAllFuncionarios.checked; });
    syncCheckAllFuncionarios();
    atualizarContadorSelecionados();
  });

  /* ══════════════════════════════════════════
     Eventos
  ══════════════════════════════════════════ */
  elBusca.addEventListener('input',   aplicarFiltros);
  elStatus.addEventListener('change', aplicarFiltros);
  elFuncao.addEventListener('change', aplicarFiltros);
  elCargaH.addEventListener('change', aplicarFiltros);
  if(elSexo) elSexo.addEventListener('change', aplicarFiltros);

  document.getElementById('btnLimparFiltros').addEventListener('click', function(){
    elBusca.value  = '';
    elStatus.value = '';
    elFuncao.value = '';
    elCargaH.value = '';
    if(elSexo) elSexo.value = '';
    chkMat.checked = false; document.getElementById('lblFMat').classList.remove('checked');
    chkVes.checked = false; document.getElementById('lblFVes').classList.remove('checked');
    chkNot.checked = false; document.getElementById('lblFNot').classList.remove('checked');
    currentSortField = 'nome';
    currentSortOrder  = 'asc';
    sortFieldEl.value = 'nome';
    btnToggleSort.textContent = '↑↓';
    atualizarTurnoHint();
    aplicarFiltros(); // ano permanece o mesmo
  });

  /* ══════════════════════════════════════════
     Modal — Ficha do funcionário
  ══════════════════════════════════════════ */
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalTitle     = document.getElementById('modalTitle');
  const modalBody       = document.getElementById('modalBody');

  const ESCOLARIDADE_LABEL = {
    SEM_ESCOLARIDADE:    'Sem escolaridade',
    FUND_INCOMPLETO:     'Ensino fundamental incompleto',
    FUND_COMPLETO:       'Ensino fundamental completo',
    MEDIO_INCOMPLETO:    'Ensino médio incompleto',
    MEDIO_COMPLETO:      'Ensino médio completo',
    SUPERIOR_INCOMPLETO: 'Ensino superior incompleto',
    SUPERIOR_COMPLETO:   'Ensino superior completo',
  };

  function abrirModal(titulo, htmlBody){
    modalTitle.textContent = titulo;
    modalBody.innerHTML = htmlBody;
    modalBackdrop.classList.add('open');
  }
  function fecharModal(){
    modalBackdrop.classList.remove('open');
  }
  document.getElementById('btnFecharModal').addEventListener('click', fecharModal);
  modalBackdrop.addEventListener('click', function(e){
    if(e.target === modalBackdrop) fecharModal();
  });

  function montarNeeDetalhado(f){
    const d = f.deficiencia || {};
    const itens = [];
    if(d.tea)              itens.push('🧩 TEA');
    if(d.altasHabilidades) itens.push('⭐ Altas habilidades / superdotação');
    if(d.defFisica)        itens.push('♿ Deficiência física');
    if(d.defIntelectual)   itens.push('🧠 Deficiência intelectual');
    if(d.defVisual)        itens.push('👁️ Deficiência visual' + (d.defVisualSub ? ` (${escapeHtml(d.defVisualSub)})` : ''));
    if(d.defAuditiva)      itens.push('👂 Deficiência auditiva / surdez' + (d.defAuditivaSub ? ` (${escapeHtml(d.defAuditivaSub)})` : ''));
    if(!itens.length){
      return `<div class="ficha-vazio">Nenhuma</div>`;
    }
    return `<div class="ficha-chips">` +
      itens.map(t => `<span class="badge gray">${t}</span>`).join('') +
      `</div>`;
  }

  function montarFormacao(f){
    const blocos = [];
    if(Array.isArray(f.graduacoes) && f.graduacoes.length){
      blocos.push(`<div class="ficha-sub">Graduações</div>` +
        `<div class="ficha-chips">` + f.graduacoes.map(g => `<span class="badge">${escapeHtml(g.curso||g.nome||'—')}${g.ano?' · '+escapeHtml(String(g.ano)):''}</span>`).join('') + `</div>`);
    }
    if(Array.isArray(f.posGraduacoes) && f.posGraduacoes.length){
      blocos.push(`<div class="ficha-sub">Pós-graduações</div>` +
        `<div class="ficha-chips">` + f.posGraduacoes.map(x => `<span class="badge neutral">${escapeHtml(x.area||'—')}${x.ano?' · '+escapeHtml(String(x.ano)):''}</span>`).join('') + `</div>`);
    }
    // Complementações — array novo OU o campo único legado (registros mais antigos)
    const complementacoes = Array.isArray(f.complementacoes) && f.complementacoes.length
      ? f.complementacoes
      : (f.complementacaoPedagogica && f.complementacaoNome ? [{ nome: f.complementacaoNome }] : []);
    if(complementacoes.length){
      blocos.push(`<div class="ficha-sub">Complementações</div>` +
        complementacoes.map(c => `<div class="ficha-linha">• ${escapeHtml(c.nome||'—')}${c.ano?' · '+escapeHtml(String(c.ano)):''}</div>`).join(''));
    }
    if(Array.isArray(f.outrosCursos) && f.outrosCursos.length){
      blocos.push(`<div class="ficha-sub">Outros cursos</div>` +
        f.outrosCursos.map(o => `<div class="ficha-linha">• ${escapeHtml(typeof o === 'string' ? o : (o.nome||o.curso||'—'))}</div>`).join(''));
    }
    return blocos.length ? blocos.join('') : `<div class="ficha-vazio">Nenhuma formação adicional registrada.</div>`;
  }

  function abrirFichaFuncionario(matId){
    const f = funcionarios.find(x => matIdDe(x) === matId);
    if(!f) return;
    const funcId = f.funcId || '';              // documentos e foto são da PESSOA (pasta por funcId)
    // Naturalidade: modelo novo (naturalidadeEstrangeiro) e registros antigos (naturalidadePais != 'BR')
    const natEstr  = f.naturalidadeEstrangeiro != null ? f.naturalidadeEstrangeiro === true : (!!f.naturalidadePais && f.naturalidadePais !== 'BR');
    const natLocal = [f.naturalidadeCidade || f.naturalidade, f.naturalidadeUF].filter(Boolean).join(natEstr ? ' - ' : ' / ');
    const nat  = natEstr ? ('Estrangeiro' + (natLocal ? ' — ' + natLocal : '')) : (natLocal || '—');
    const nasc = formatDate(f.dataNascimento) || '—';
    const idade = calcAge(f.dataNascimento) || '—';

    const fotoHtml = f.fotoUrl
      ? `<img src="${escapeHtml(f.fotoUrl)}" alt="Foto do funcionário" style="width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--card-border,var(--border));" onerror="this.replaceWith(Object.assign(document.createElement('div'),{innerHTML:'🧑',style:'width:56px;height:56px;border-radius:50%;flex-shrink:0;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--card-border,var(--border));'}))">`
      : `<div style="width:56px;height:56px;border-radius:50%;flex-shrink:0;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--card-border,var(--border));">🧑</div>`;

    const cabecalho = `
      <div style="margin-bottom:14px;padding:12px 14px;border:1px solid var(--card-border,var(--border));border-radius:10px;background:var(--chip-bg);display:flex;align-items:center;gap:12px;">
        ${fotoHtml}
        <div>
          <b>${escapeHtml(f.nome || 'Sem nome')}</b> &nbsp;•&nbsp; ID: ${escapeHtml(f.funcId||'—')}
          &nbsp;•&nbsp; Ano: ${escapeHtml(anoDoFuncionario(f) || '—')}
          &nbsp;•&nbsp; Vínculo: ${escapeHtml(STATUS_LABEL[f.status]||f.status||'—')}
        </div>
      </div>`;

    const camposBasicos = [
      ['CPF', f.cpf], ['RG/CNH', f.rgCnh], ['Nascimento', nasc], ['Idade', idade],
      ['Sexo', SEXO_LABEL[f.sexo]||f.sexo], ['Cor/Raça', f.corRaca],
      ['Naturalidade', nat], ['Mãe', f.filiacaoMae], ['Pai', f.filiacaoPai],
      ['Função', f.funcao], ['Carga horária', f.cargaHoraria ? f.cargaHoraria+'H' : ''],
      ['Turnos', turnosTexto(f.turnos)],
      ['CEP', f.cep], ['Cidade', f.endCidade], ['UF', f.endUF], ['Zona', f.zonaResidencia],
      ['Escolaridade', ESCOLARIDADE_LABEL[f.escolaridade] || f.escolaridade],
    ];
    const campos = camposBasicos.map(([label, v]) => `
      <div style="padding:8px 10px;border:1px solid var(--card-border,var(--border));border-radius:8px;">
        <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">${escapeHtml(label)}</div>
        <div style="font-size:13px;margin-top:2px;">${escapeHtml(String(v || '—'))}</div>
      </div>`).join('');

    const docsPlaceholderId = `docsFicha_${matId.replace(/[^a-zA-Z0-9_-]/g,'')}`;

    const rows = `${cabecalho}
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;">${campos}</div>
      <div style="margin-top:16px;">
        <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">NEE / Deficiência</div>
        ${montarNeeDetalhado(f)}
      </div>
      <div style="margin-top:16px;">
        <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">Formação</div>
        ${montarFormacao(f)}
      </div>
      <div style="margin-top:16px;">
        <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">Documentos</div>
        <div id="${docsPlaceholderId}" style="font-size:13px;color:var(--muted);">Carregando documentos…</div>
      </div>
    `;
    abrirModal('Ficha do funcionário', rows);
    carregarDocsFicha(funcId, docsPlaceholderId);
  }

  async function carregarDocsFicha(funcId, targetId){
    const el = document.getElementById(targetId);
    if(!el) return;
    try{
      const resp = await fetch(`/api/drive-list-funcionario?funcionarioId=${encodeURIComponent(funcId)}`);
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error || 'Erro ao buscar documentos');
      const files = data.files || [];
      if(!files.length){
        el.innerHTML = `<div style="font-size:13px;color:var(--muted);">Nenhum documento anexado</div>`;
        return;
      }
      el.innerHTML = files.map(f => {
        const icon = (f.mimeType||'').startsWith('image/') ? '🖼️' : '📄';
        return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--card-border,var(--border));">
          <span>${icon}</span>
          <span style="flex:1;font-size:13px;">${escapeHtml(f.label||f.fileName)}</span>
          <a href="${f.webViewLink}" target="_blank" rel="noopener" class="link-doc-ver">👁️ Ver</a>
        </div>`;
      }).join('');
    }catch(e){
      el.innerHTML = `<div style="font-size:13px;color:#b91c1c;">Erro ao carregar documentos.</div>`;
    }
  }

  lista.addEventListener('click', function(e){
    const btn = e.target.closest('[data-view-mat]');
    if(!btn) return;
    abrirFichaFuncionario(btn.dataset.viewMat);
  });

  /* ══════════════════════════════════════════
     Init
  ══════════════════════════════════════════ */
  // Ícone(s) de dica (ⓘ) — fecha qualquer um aberto ao clicar fora.
  document.addEventListener('click', () => {
    document.querySelectorAll('.info-tip.open').forEach(el => el.classList.remove('open'));
  });

  // Contraste do texto do card de destaque (cálculo centralizado em theme-colors.js).
  // Isolado em try/catch: um problema visual nunca pode impedir o carregamento da lista.
  try{
    if(window.ThemeColors && typeof ThemeColors.ajustarContraste === 'function') ThemeColors.ajustarContraste();
  }catch(e){ console.warn('ajustarContraste:', e); }

  (async function init(){
    try{
      await carregarAnoAtivo();       // 1º: precisa saber o ano para ler só as matrículas dele
      await carregarMatriculas();
      popularSelects();
      aplicarFiltros();
    } finally {
      if(window.Loading) Loading.esconder();
    }
  })();
})();
</script>
