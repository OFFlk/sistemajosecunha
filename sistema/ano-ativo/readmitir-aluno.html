  --card-border:  #2a3a5c;

html[data-theme="dark"] .ok { color: #4ade80; }

<!-- 2. Lógica específica desta página -->
<script>
(function(){
'use strict';

/* =========================
   Util
========================= */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function normSerie(s){
  if(!s) return "";
  let t = String(s).trim().replace(/\s+/g,' ');
  t = t.replace(/^EIXO\s*([12345])$/i, "EIXO $1");
  return t.toUpperCase();
}
function calcIdade(dataStr){
  if(!dataStr) return "";
  const s = String(dataStr).trim();
  let d=null;
  const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  const m2 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m1){ d = new Date(+m1[3], +m1[2]-1, +m1[1]); }
  else if(m2){ d = new Date(+m2[1], +m2[2]-1, +m2[3]); }
  else { const tmp = new Date(s); if(!isNaN(tmp)) d = tmp; }
  if(!d || isNaN(d)) return "";
  const hoje = new Date();
  let idade = hoje.getFullYear() - d.getFullYear();
  const mm = hoje.getMonth() - d.getMonth();
  if(mm < 0 || (mm === 0 && hoje.getDate() < d.getDate())) idade--;
  return (idade>=0 && idade<=130) ? String(idade) : "";
}
function montarNeeDetalhado(a){
  const itens = [];
  if(a.tea)              itens.push('🧩 TEA');
  if(a.altasHabilidades) itens.push('⭐ Altas habilidades / superdotação');
  if(a.defFisica)        itens.push('♿ Deficiência física');
  if(a.defIntelectual)   itens.push('🧠 Deficiência intelectual');
  if(a.defVisual)        itens.push('👁️ Deficiência visual' + (a.defVisualTipo ? ` (${a.defVisualTipo})` : ''));
  if(a.defAuditiva)      itens.push('👂 Deficiência auditiva / surdez' + (a.defAuditivaTipo ? ` (${a.defAuditivaTipo})` : ''));
  if(a.discalculia)      itens.push('🔢 Discalculia');
  if(a.disgrafia)        itens.push('✏️ Disgrafia / disortografia');
  if(a.dislalia)         itens.push('🗣️ Dislalia');
  if(a.dislexia)         itens.push('📖 Dislexia');
  if(a.tdah)             itens.push('⚡ TDAH');
  if(a.tpac)             itens.push('🔊 TPAC');
  if(!itens.length) return `<div style="font-size:13px;color:var(--muted);">Nenhuma</div>`;
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;">` +
    itens.map(t => `<span style="padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip-bg);font-size:12px;">${escapeHtml(t)}</span>`).join('') +
    `</div>`;
}

/* =========================
   Foto do aluno (adaptado do widget de cadastro-aluno-ativo.html)
   — na readmissão não editamos uma matrícula existente, então não há
   "initFoto"; em vez disso, sempre sugerimos a foto mais recente do
   aluno (de qualquer matrícula/ano) e deixamos escolher outra. A cópia
   de fato só acontece em _enviarFotoPendenteReadmissao, já com a
   matrícula nova confirmada — a matrícula de origem nunca é tocada.
========================= */
let _fotoPendente = null; // { base64, mimeType } ou { reaproveitar:true, fotoUrl }

function _comprimirFoto(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const MAX = 480;
        let { width, height } = img;
        if(width > height && width > MAX){ height = Math.round(height * MAX / width); width = MAX; }
        else if(height >= width && height > MAX){ width = Math.round(width * MAX / height); height = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', preview: dataUrl });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Chamado toda vez que o formulário é (re)montado — precisa reconsultar
// os elementos porque o painel inteiro é substituído a cada render
// (ex.: ao trocar o ano letivo).
function _setupFotoWidget(alunoId){
  const inpFoto    = document.getElementById('inpFotoAluno');
  const previewImg = document.getElementById('fotoAlunoPreview');
  const placeholder= document.getElementById('fotoAlunoPlaceholder');
  const btnRemover = document.getElementById('btnRemoverFoto');
  const statusEl   = document.getElementById('fotoAlunoStatus');
  if(!inpFoto) return;

  _fotoPendente = null;

  function setStatus(txt, cor){
    statusEl.textContent = txt || '';
    statusEl.style.color = cor || 'var(--muted)';
  }

  inpFoto.addEventListener('change', async () => {
    const file = inpFoto.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){
      setStatus('⚠️ Selecione um arquivo de imagem.', '#b91c1c');
      return;
    }
    setStatus('Comprimindo...');
    try{
      const { base64, mimeType, preview } = await _comprimirFoto(file);
      previewImg.src = preview;
      previewImg.style.display = 'block';
      placeholder.style.display = 'none';
      btnRemover.style.display = '';
      _fotoPendente = { base64, mimeType };
      setStatus('Foto pronta — será enviada ao confirmar a readmissão.', '#166534');
    }catch(e){
      setStatus('❌ Falha ao processar a foto: ' + e.message, '#b91c1c');
    }
  });

  btnRemover.addEventListener('click', () => {
    previewImg.style.display = 'none';
    previewImg.src = '';
    placeholder.style.display = '';
    btnRemover.style.display = 'none';
    inpFoto.value = '';
    setStatus('');
    // Nada foi copiado/salvo ainda nesse ponto (a cópia só acontece ao
    // confirmar a readmissão) — então só precisamos limpar o estado local,
    // sem chamar drive-delete. A foto de origem (matrícula anterior) nunca
    // foi tocada e continua intacta.
    _fotoPendente = null;
  });

  // Sugere a foto mais recente já salva (qualquer matrícula/ano) pra esse aluno.
  (async () => {
    try{
      const mats = await window.DB.anoAtivoMatriculas.list();
      const maisRecente = mats
        .filter(m => m.alunoId === String(alunoId) && m.fotoUrl)
        .sort((a, b) => Number(b.anoLetivo) - Number(a.anoLetivo))[0];
      if(maisRecente){
        _fotoPendente = { reaproveitar: true, fotoUrl: maisRecente.fotoUrl };
        previewImg.src = maisRecente.fotoUrl;
        previewImg.style.display = 'block';
        placeholder.style.display = 'none';
        btnRemover.style.display = '';
        setStatus(`Foto de uma matrícula anterior (${maisRecente.anoLetivo}) — mantenha ou clique em "Remover" pra trocar.`, 'var(--muted)');
      }
    }catch(e){ console.warn('[foto-readmissao] falha ao buscar foto anterior:', e); }
  })();
}

// Chamado depois que a matrícula nova é salva com sucesso. Resolve o que
// estiver pendente no widget: uma foto nova escolhida manualmente, ou a
// sugestão de matrícula anterior aceita (precisa ser COPIADA pro
// public_id desta matrícula/ano — cada ano tem seu próprio arquivo no
// Cloudinary). A matrícula de origem nunca é alterada.
async function enviarFotoPendenteReadmissao(alunoId, ano, matriculaId){
  if(!_fotoPendente) return;

  if(_fotoPendente.reaproveitar){
    const { fotoUrl } = _fotoPendente;
    _fotoPendente = null;
    try{
      const resp = await fetch('/api/avatar-upload', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ tipo: 'aluno', entidadeId: alunoId, ano, sourceUrl: fotoUrl }),
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error || 'erro desconhecido');
      await window.DB.anoAtivoMatriculas.save({ _id: matriculaId, fotoUrl: data.fotoUrl, fotoFileId: data.fotoFileId });
    }catch(e){ console.warn('[foto-readmissao] erro ao copiar foto reaproveitada:', e); }
    return;
  }

  const { base64, mimeType } = _fotoPendente;
  _fotoPendente = null;
  try{
    const resp = await fetch('/api/avatar-upload', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ tipo: 'aluno', entidadeId: alunoId, ano, fileBase64: base64, mimeType }),
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'erro desconhecido');
    await window.DB.anoAtivoMatriculas.save({ _id: matriculaId, fotoUrl: data.fotoUrl, fotoFileId: data.fotoFileId });
  }catch(e){ console.warn('[foto-readmissao] erro ao enviar foto nova:', e); }
}

/* =========================
   Documentos já anexados (somente leitura)
   — a readmissão não é o lugar de anexar/remover documentos (isso
   continua na tela de cadastro/edição); aqui é só pra confirmar
   visualmente que é o aluno certo antes de readmitir.
========================= */
async function _carregarDocsExistentes(alunoId){
  const wrap  = document.getElementById('docsExistentesWrap');
  const lista = document.getElementById('docsExistentesLista');
  if(!wrap || !lista) return;
  try{
    const resp = await fetch(`/api/drive-list?alunoId=${encodeURIComponent(alunoId)}`);
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error);
    const files = data.files || [];
    if(!files.length) return;
    wrap.style.display = '';
    lista.innerHTML = files.map(f => {
      const icon = (f.mimeType||'').startsWith('image/') ? '🖼️' : '📄';
      const dataFmt = f.createdAt ? new Date(f.createdAt).toLocaleDateString('pt-BR') : '';
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--card-border,#ddd6fe);border-radius:10px;background:var(--card-bg,#fff);">`+
        `<span style="font-size:18px;">${icon}</span>`+
        `<div style="flex:1;min-width:0;">`+
          `<div style="font-size:13px;font-weight:700;">${escapeHtml(f.label||f.fileName)}</div>`+
          `<div style="font-size:11px;color:var(--muted);">${escapeHtml(f.fileName)}${dataFmt ? ' · ' + dataFmt : ''}</div>`+
        `</div>`+
        `<a href="${f.webViewLink}" target="_blank" rel="noopener" style="padding:4px 10px;border-radius:8px;font-size:12px;font-weight:800;border:1px solid var(--card-border,#ddd6fe);background:var(--field-bg,#fff);color:inherit;text-decoration:none;white-space:nowrap;">👁️ Ver</a>`+
      `</div>`;
    }).join('');
  }catch(e){ console.warn('[docs-readmissao] erro ao carregar documentos:', e); }
}


/* =========================
   Toasts padronizados (ver guia-toasts.md)
========================= */
function _showToast(msg, bg, shadow, duration){
  const existing = document.getElementById('_toastGlobal');
  if(existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = '_toastGlobal';
  toast.style.cssText =
    `position:fixed;bottom:28px;left:50%;transform:translateX(-50%);`+
    `display:flex;align-items:center;gap:12px;`+
    `background:${bg};color:#fff;font-family:'Nunito',sans-serif;`+
    `font-size:14px;font-weight:800;padding:12px 16px 12px 20px;border-radius:12px;`+
    `box-shadow:0 4px 24px ${shadow||'rgba(0,0,0,0.25)'};z-index:9999;`+
    `animation:toastSubir .25s ease;max-width:min(90vw,480px);text-align:left;`;
  const span = document.createElement('span');
  span.textContent = msg;
  span.style.cssText = 'flex:1;line-height:1.4;';
  toast.appendChild(span);
  const btnClose = document.createElement('button');
  btnClose.type = 'button';
  btnClose.textContent = '✕';
  btnClose.setAttribute('aria-label','Fechar aviso');
  btnClose.style.cssText =
    'background:rgba(255,255,255,0.15);border:none;color:#fff;'+
    'width:22px;height:22px;border-radius:6px;cursor:pointer;'+
    'font-size:12px;font-weight:800;line-height:1;flex:0 0 auto;';
  btnClose.onclick = () => toast.remove();
  toast.appendChild(btnClose);
  document.body.appendChild(toast);
  setTimeout(() => { if(toast.isConnected) toast.remove(); }, duration || 2500);
}

function _toastSucesso(msg){
  _showToast(msg, '#166534', 'rgba(22,163,74,0.95)', 2500);
}
function _toastErro(msg){
  _showToast(msg, '#991b1b', 'rgba(185,28,28,0.95)', 4500);
}
function _toastAviso(msg){
  _showToast(msg, '#92400e', 'rgba(217,119,6,0.95)', 4000);
}
function _toastCarregando(msg){
  _showToast(msg, '#1e3a8a', 'rgba(37,99,235,0.95)', 8000);
}

function setMsg(text, kind){
  const t = (text||"").toString();
  if(!t) return;
  if(kind === "err") _toastErro('⚠️ ' + t);
  else if(kind === "ok") _toastSucesso('✅ ' + t);
  else if(kind === "warn") _toastAviso('⚠️ ' + t);
  else if(kind === "loading") _toastCarregando('⏳ ' + t);
  else {
    console.warn('[toast] kind desconhecido:', JSON.stringify(kind), '— usando "aviso" (amarelo) como padrão seguro.');
    _toastAviso(t);
  }
}

/* ── Modal de confirmação (substitui confirm() nativo) ── */
function _confirmModal({ titulo, corpo, corDestaque, textoConfirmar, textoCancelar }){
  return new Promise((resolve) => {
    const cor = corDestaque || '#b45309'; // amber-700 — padrão pra avisos
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.style.display = 'flex';
    backdrop.innerHTML =
      `<div style="background:var(--card-bg,#fff);border-radius:14px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);">`+
        `<h3 style="margin:0 0 6px;font-size:16px;font-weight:800;color:${cor};">${escapeHtml(titulo || 'Confirmar ação')}</h3>`+
        `<p style="margin:0 0 18px;font-size:13px;color:var(--muted);white-space:pre-line;line-height:1.5;">${corpo || ''}</p>`+
        `<div style="display:flex;justify-content:flex-end;gap:8px;">`+
          `<button type="button" class="btn ghost" id="_confirmModalCancelar">${escapeHtml(textoCancelar || 'Cancelar')}</button>`+
          `<button type="button" id="_confirmModalOk" style="padding:9px 16px;border-radius:8px;font-size:13px;font-weight:800;`+
            `background:${cor};border:1px solid ${cor};color:#fff;cursor:pointer;font-family:'Nunito',sans-serif;">`+
            `${escapeHtml(textoConfirmar || 'Continuar')}`+
          `</button>`+
        `</div>`+
      `</div>`;
    document.body.appendChild(backdrop);

    function fechar(resultado){
      backdrop.remove();
      resolve(resultado);
    }
    backdrop.querySelector('#_confirmModalOk').addEventListener('click', () => fechar(true));
    backdrop.querySelector('#_confirmModalCancelar').addEventListener('click', () => fechar(false));
    backdrop.addEventListener('click', (ev) => { if(ev.target === backdrop) fechar(false); });
  });
}

/* =========================
   Estado
========================= */
const params = new URLSearchParams(window.location.search);
const alunoId = (params.get('alunoId') || '').trim();
const conteudo = document.getElementById('conteudo');

let alunos = [], turmas = [], mats = [], anoAtivo = '';

function erro(msg){
  conteudo.innerHTML = `<div class="panel"><div class="warn">${escapeHtml(msg)}</div></div>`;
}

async function init(){
  if(!alunoId){
    erro('Nenhum aluno informado. Acesse esta página a partir da pesquisa, pelo botão "🔁 Readmitir".');
    setMsg('Nenhum aluno informado.', 'err');
    return;
  }

  await new Promise(res=>{
    if(window.Auth && window.Auth.getSession && window.Auth.getSession()) return res();
    document.addEventListener('auth:ready', res, {once:true});
  });

  try{
    const dados = await window.DB.loadAllAnoAtivo();
    alunos = Array.isArray(dados.alunosDB) ? dados.alunosDB : [];
    mats   = Array.isArray(dados.matriculasDB) ? dados.matriculasDB : [];
    turmas = Array.isArray(dados.turmasDB) ? dados.turmasDB : [];
    anoAtivo = (dados.dadosEscola?.configAnoAtivo || '').toString().replace(/"/g,'').trim();
  }catch(e){
    console.error(e);
    erro('Erro ao carregar dados do Firestore. Tente novamente.');
    setMsg('Erro ao carregar dados do Firestore. Tente novamente.', 'err');
    return;
  }

  const aluno = alunos.find(a => (a.alunoId || a.id || '').toString().trim() === alunoId);
  if(!aluno){
    erro(`Aluno com ID "${alunoId}" não encontrado.`);
    setMsg(`Aluno com ID "${alunoId}" não encontrado.`, 'err');
    return;
  }

  if(!anoAtivo){
    const anos = new Set();
    mats.forEach(m => m.anoLetivo && anos.add(String(m.anoLetivo)));
    turmas.forEach(t => t.anoLetivo && anos.add(String(t.anoLetivo)));
    const arr = Array.from(anos).sort();
    anoAtivo = arr.length ? arr[arr.length-1] : String(new Date().getFullYear());
  }

  renderFicha(aluno);
  await renderFormulario(aluno);
}

function renderFicha(a){
  const nasc = a.dataNascimento || '—';
  const idade = a.idade || calcIdade(a.dataNascimento) || '—';

  const camposFicha = [
    {label:'CPF', v:a.cpf},
    {label:'DATA DE NASCIMENTO', v:nasc},
    {label:'IDADE', v:idade},
    {label:'MÃE', v:a.mae},
    {label:'PAI', v:a.pai},
    {label:'NATURALIDADE', v:[a.naturalidadeCidade,a.naturalidadeUF].filter(Boolean).join('/') || a.naturalidade},
    {label:'SEXO', v:a.sexo},
    {label:'COR/RAÇA', v:a.corRaca || 'Não declarada'},
  ];

  const html = `
    <div class="panel">
      <h2>📋 Ficha do aluno <span class="badge">somente leitura</span></h2>
      <div class="ficha-header">
        <div><b>${escapeHtml(a.nome || 'Sem nome')}</b> &nbsp;•&nbsp; ID: ${escapeHtml(alunoId)}</div>
      </div>
      <div class="ficha-grid">
        ${camposFicha.map(c => `
          <div class="ficha-item">
            <div class="lbl">${escapeHtml(c.label)}</div>
            <div class="val">${escapeHtml(c.v || '—')}</div>
          </div>`).join('')}
      </div>
      <div style="margin-top:14px;">
        <div class="lbl" style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">NEE / Transtornos</div>
        ${montarNeeDetalhado(a)}
      </div>
    </div>
    <div id="painelFormulario"></div>
  `;
  conteudo.innerHTML = html;
}

async function renderFormulario(aluno){
  const painel = document.getElementById('painelFormulario');
  painel.innerHTML = `<div class="panel"><div class="loading">Verificando matrícula atual…</div></div>`;

  const anosDisponiveis = Array.from(new Set(turmas.map(t => String(t.anoLetivo||'')).filter(Boolean)))
    .sort((a,b)=>Number(a)-Number(b));
  if(anoAtivo && !anosDisponiveis.includes(anoAtivo)) anosDisponiveis.push(anoAtivo);

  await montarFormularioPara(painel, aluno, anoAtivo || anosDisponiveis[anosDisponiveis.length-1] || '', anosDisponiveis);
}

async function montarFormularioPara(painel, aluno, anoEscolhido, anosDisponiveis){
  const matAtual = await window.MatriculaUtils.getMatriculaAtual(alunoId, anoEscolhido);

  if(matAtual && (matAtual.status||'').toUpperCase() === 'ATIVO'){
    painel.innerHTML = `
      <div class="panel">
        <h2>Matrícula</h2>
        <div class="warn">
          Este aluno já possui uma matrícula <b>ATIVA</b> no ano letivo ${escapeHtml(anoEscolhido)}
          (turma: ${escapeHtml(matAtual.turmaId || '—')}). Não é possível readmitir — se a intenção é
          transferir de turma, use a edição de matrícula na tela de cadastro.
        </div>
      </div>`;
    return;
  }

  const turmasDoAno = turmas.filter(t => String(t.anoLetivo||'') === String(anoEscolhido));

  painel.innerHTML = `
    <div class="panel">
      <h2>Nova matrícula</h2>
      ${matAtual ? `<div class="info">Última matrícula encontrada: <b>${escapeHtml(matAtual.status||'—')}</b>${matAtual.situacao ? ' • ' + escapeHtml(matAtual.situacao) : ''} em ${escapeHtml(matAtual.anoLetivo||'—')} (turma ${escapeHtml(matAtual.turmaId||'—')}). A readmissão cria uma matrícula nova, independente da situação anterior.</div>` : ''}

      <!-- Foto do aluno (herdada da matrícula anterior, se houver) -->
      <div id="fotoAlunoBox" style="display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:14px;
        border:1.5px dashed var(--card-border,#ddd6fe);border-radius:14px;background:var(--card-bg,#fff);">
        <div style="width:88px;height:88px;border-radius:50%;overflow:hidden;
          background:var(--field-bg,#f3f0ff);display:flex;align-items:center;justify-content:center;flex-shrink:0;
          border:2px solid var(--field-border,#ddd6fe);">
          <img id="fotoAlunoPreview" src="" alt="Foto do aluno" style="display:none;width:100%;height:100%;object-fit:cover;">
          <span id="fotoAlunoPlaceholder" style="font-size:30px;">🧑</span>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:13px;margin-bottom:4px;">Foto do aluno (opcional)</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">
            Puxamos automaticamente a foto mais recente já salva para este aluno, se houver. Mantenha ou troque abaixo.
          </div>
          <input type="file" id="inpFotoAluno" accept="image/*" style="display:none;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="btn small" id="btnEscolherFoto" onclick="document.getElementById('inpFotoAluno').click()">📷 Escolher foto</button>
            <button type="button" class="btn small" id="btnRemoverFoto" style="display:none;">🗑️ Remover</button>
          </div>
          <div id="fotoAlunoStatus" style="font-size:12px;margin-top:6px;"></div>
        </div>
      </div>

      <!-- Documentos já anexados (somente leitura — pra confirmar que é o aluno certo) -->
      <div id="docsExistentesWrap" style="display:none;margin-bottom:16px;">
        <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">
          Documentos já anexados
        </div>
        <div id="docsExistentesLista" style="display:flex;flex-direction:column;gap:6px;"></div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="selAnoReadmissao">Ano letivo</label>
          <select id="selAnoReadmissao">
            ${anosDisponiveis.map(y => `<option value="${escapeHtml(y)}" ${y===anoEscolhido?'selected':''}>${escapeHtml(y)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="selTurmaReadmissao">Turma</label>
          <select id="selTurmaReadmissao">
            <option value="">(selecione)</option>
            ${turmasDoAno.map(t => `<option value="${escapeHtml(t.turmaId)}">${escapeHtml(t.nome || t.turmaId)}${t.turno ? ' — ' + escapeHtml(t.turno) : ''}</option>`).join('')}
          </select>
          ${turmasDoAno.length===0 ? `<div class="help" style="color:var(--danger);font-size:12px;">Nenhuma turma cadastrada para este ano.</div>` : ''}
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="selSerieReadmissao">Série</label>
          <select id="selSerieReadmissao" disabled>
            <option value="">(selecione a turma primeiro)</option>
          </select>
        </div>
        <div class="field">
          <label for="inpTurnoReadmissao">Turno</label>
          <input id="inpTurnoReadmissao" type="text" disabled placeholder="(selecione a turma)"/>
        </div>
      </div>

      <div id="avisoReadmissao"></div>

      <div class="actions">
        <button class="btn ghost" type="button" onclick="location.href='pesquisa-ano-ativo.html'">Cancelar</button>
        <button class="btn primary" type="button" id="btnConfirmarReadmissao">✅ Confirmar readmissão</button>
      </div>
    </div>
  `;

  _setupFotoWidget(alunoId);
  _carregarDocsExistentes(alunoId);

  const selAno   = document.getElementById('selAnoReadmissao');
  const selTurma = document.getElementById('selTurmaReadmissao');
  const selSerie = document.getElementById('selSerieReadmissao');
  const inpTurno = document.getElementById('inpTurnoReadmissao');
  const aviso    = document.getElementById('avisoReadmissao');
  const btn      = document.getElementById('btnConfirmarReadmissao');

  // Ano mudou → recarrega a seção inteira (turmas do ano + recheca matrícula ATIVO)
  selAno.addEventListener('change', () => {
    montarFormularioPara(painel, aluno, selAno.value, anosDisponiveis);
  });

  selTurma.addEventListener('change', () => {
    const t = turmasDoAno.find(x => x.turmaId === selTurma.value);
    aviso.innerHTML = '';
    if(!t){
      selSerie.innerHTML = '<option value="">(selecione a turma primeiro)</option>';
      selSerie.disabled = true;
      inpTurno.value = '';
      inpTurno.disabled = true;
      return;
    }
    const series = Array.isArray(t.series) && t.series.length ? t.series : (t.serie ? [t.serie] : []);
    if(series.length){
      selSerie.innerHTML = series.map(s => `<option value="${escapeHtml(normSerie(s))}">${escapeHtml(normSerie(s))}</option>`).join('');
      selSerie.disabled = series.length <= 1;
    } else {
      selSerie.innerHTML = '<option value="">—</option>';
      selSerie.disabled = true;
    }
    inpTurno.value = t.turno || '';
    inpTurno.disabled = true; // turno é herdado da turma, não editável aqui
  });

  btn.addEventListener('click', async () => {
    aviso.innerHTML = '';
    const ano = selAno.value;
    const turmaId = selTurma.value;
    const serie = selSerie.value;

    if(!ano || !turmaId){
      aviso.innerHTML = `<div class="warn">Selecione o ano letivo e a turma antes de confirmar.</div>`;
      setMsg('Selecione o ano letivo e a turma antes de confirmar.', 'warn');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Salvando…';
    setMsg('Salvando matrícula…', 'loading');

    try{
      // Re-checagem final antes de gravar, evita corrida entre abrir a tela e confirmar
      const existente = await window.MatriculaUtils.getMatriculaAtual(alunoId, ano);
      if(existente && (existente.status||'').toUpperCase() === 'ATIVO'){
        aviso.innerHTML = `<div class="warn">Uma matrícula ativa para este aluno neste ano foi criada enquanto você preenchia o formulário. Recarregue a página.</div>`;
        setMsg('Uma matrícula ativa foi criada enquanto você preenchia o formulário. Recarregue a página.', 'warn');
        btn.disabled = false;
        btn.textContent = '✅ Confirmar readmissão';
        return;
      }

      const turmaObj = turmasDoAno.find(x => x.turmaId === turmaId);
      const matriculaId = window.MatriculaUtils.buildMatriculaId(turmaId, alunoId, ano);

      const novaMatricula = window.MatriculaUtils.validarMatricula({
        _id: matriculaId,
        alunoId,
        turmaId,
        anoLetivo: String(ano),
        serie: serie || '',
        turno: (turmaObj && turmaObj.turno) || '',
        modelo: (turmaObj && turmaObj.modelo) || 'REGULAR',
        status: 'ATIVO',
        situacao: null,
      });

      await window.DB.anoAtivoMatriculas.save(novaMatricula);
      await enviarFotoPendenteReadmissao(alunoId, ano, matriculaId);
      setMsg('Readmissão concluída com sucesso!', 'ok');

      painel.innerHTML = `
        <div class="panel">
          <h2>Nova matrícula</h2>
          <div class="ok">✅ Readmissão concluída! Matrícula criada em ${escapeHtml(ano)}, turma ${escapeHtml(turmaObj ? (turmaObj.nome||turmaId) : turmaId)}.</div>
          <div class="actions">
            <a class="btn primary" href="pesquisa-ano-ativo.html">Voltar à pesquisa</a>
          </div>
        </div>`;
      // Padrão do sistema: redireciona automaticamente pra pesquisa depois
      // de uma ação concluída (mesmo comportamento do "encerrar matrícula").
      // O link acima fica como atalho pra quem não quiser esperar.
      setTimeout(() => { location.href = 'pesquisa-ano-ativo.html'; }, 2000);
    }catch(e){
      console.error(e);
      aviso.innerHTML = `<div class="warn">Erro ao gravar matrícula: ${escapeHtml(e.message || String(e))}</div>`;
      setMsg('Erro ao gravar matrícula: ' + (e.message || String(e)), 'err');
      btn.disabled = false;
      btn.textContent = '✅ Confirmar readmissão';
    }
  });
}

init();

})();
</script>

</body>
</html>
