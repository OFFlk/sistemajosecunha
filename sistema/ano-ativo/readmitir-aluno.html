<!-- 2. Lógica específica desta página -->
<script>
(function(){
'use strict';

/* =========================
   Util
========================= */
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }
function normSerie(s){
  if(!s) return "";
  let t = String(s).trim().replace(/\s+/g,' ');
  t = t.replace(/^EIXO\s*([12345])$/i, "EIXO $1");
  return t.toUpperCase();
}
function calcIdade(dataStr){
  if(!dataStr) return "";
  const s = String(dataStr).trim();
  let d=null;
  const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  const m2 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m1){ d = new Date(+m1[3], +m1[2]-1, +m1[1]); }
  else if(m2){ d = new Date(+m2[1], +m2[2]-1, +m2[3]); }
  else { const tmp = new Date(s); if(!isNaN(tmp)) d = tmp; }
  if(!d || isNaN(d)) return "";
  const hoje = new Date();
  let idade = hoje.getFullYear() - d.getFullYear();
  const mm = hoje.getMonth() - d.getMonth();
  if(mm < 0 || (mm === 0 && hoje.getDate() < d.getDate())) idade--;
  return (idade>=0 && idade<=130) ? String(idade) : "";
}
function montarNeeDetalhado(a){
  const itens = [];
  if(a.tea)              itens.push('🧩 TEA');
  if(a.altasHabilidades) itens.push('⭐ Altas habilidades / superdotação');
  if(a.defFisica)        itens.push('♿ Deficiência física');
  if(a.defIntelectual)   itens.push('🧠 Deficiência intelectual');
  if(a.defVisual)        itens.push('👁️ Deficiência visual' + (a.defVisualTipo ? ` (${a.defVisualTipo})` : ''));
  if(a.defAuditiva)      itens.push('👂 Deficiência auditiva / surdez' + (a.defAuditivaTipo ? ` (${a.defAuditivaTipo})` : ''));
  if(a.discalculia)      itens.push('🔢 Discalculia');
  if(a.disgrafia)        itens.push('✏️ Disgrafia / disortografia');
  if(a.dislalia)         itens.push('🗣️ Dislalia');
  if(a.dislexia)         itens.push('📖 Dislexia');
  if(a.tdah)             itens.push('⚡ TDAH');
  if(a.tpac)             itens.push('🔊 TPAC');
  if(!itens.length) return `<div class="ficha-txt">Nenhuma</div>`;
  return `<div class="chips-row">` +
    itens.map(t => `<span class="badge gray small">${escapeHtml(t)}</span>`).join('') +
    `</div>`;
}

/* =========================
   Foto do aluno (adaptado do widget de cadastro-aluno-ativo.html)
   — na readmissão não editamos uma matrícula existente, então não há
   "initFoto"; em vez disso, sempre sugerimos a foto mais recente do
   aluno (de qualquer matrícula/ano) e deixamos escolher outra. A cópia
   de fato só acontece em _enviarFotoPendenteReadmissao, já com a
   matrícula nova confirmada — a matrícula de origem nunca é tocada.
========================= */
let _fotoPendente = null; // { base64, mimeType } ou { reaproveitar:true, fotoUrl }

function _comprimirFoto(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const MAX = 480;
        let { width, height } = img;
        if(width > height && width > MAX){ height = Math.round(height * MAX / width); width = MAX; }
        else if(height >= width && height > MAX){ width = Math.round(width * MAX / height); height = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', preview: dataUrl });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Chamado toda vez que o formulário é (re)montado — precisa reconsultar
// os elementos porque o painel inteiro é substituído a cada render
// (ex.: ao trocar o ano letivo).
function _setupFotoWidget(alunoId){
  const inpFoto    = document.getElementById('inpFotoAluno');
  const previewImg = document.getElementById('fotoAlunoPreview');
  const placeholder= document.getElementById('fotoAlunoPlaceholder');
  const btnRemover = document.getElementById('btnRemoverFoto');
  const statusEl   = document.getElementById('fotoAlunoStatus');
  if(!inpFoto) return;

  _fotoPendente = null;

  function setStatus(txt, tipo){            // tipo: 'err' | 'ok' | omitido (neutro) — .help do guia 5-B
    statusEl.textContent = txt || '';
    statusEl.className = txt ? ('help' + (tipo ? ' ' + tipo : '')) : 'help';
  }

  inpFoto.addEventListener('change', async () => {
    const file = inpFoto.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){
      setStatus('⚠️ Selecione um arquivo de imagem.', 'err');
      return;
    }
    setStatus('Comprimindo...');
    try{
      const { base64, mimeType, preview } = await _comprimirFoto(file);
      previewImg.src = preview;
      previewImg.hidden = false;
      placeholder.hidden = true;
      btnRemover.hidden = false;
      _fotoPendente = { base64, mimeType };
      setStatus('Foto pronta — será enviada ao confirmar a readmissão.', 'ok');
    }catch(e){
      setStatus('❌ Falha ao processar a foto: ' + e.message, 'err');
    }
  });

  btnRemover.addEventListener('click', () => {
    previewImg.hidden = true;
    previewImg.src = '';
    placeholder.hidden = false;
    btnRemover.hidden = true;
    inpFoto.value = '';
    setStatus('');
    // Nada foi copiado/salvo ainda nesse ponto (a cópia só acontece ao
    // confirmar a readmissão) — então só precisamos limpar o estado local,
    // sem chamar drive-delete. A foto de origem (matrícula anterior) nunca
    // foi tocada e continua intacta.
    _fotoPendente = null;
  });

  // Sugere a foto mais recente já salva (qualquer matrícula/ano) pra esse aluno.
  (async () => {
    try{
      const mats = await window.DB.anoAtivoMatriculas.whereEquals('alunoId', String(alunoId));   // só as deste aluno
      const maisRecente = mats
        .filter(m => m.alunoId === String(alunoId) && m.fotoUrl)
        .sort((a, b) => Number(b.anoLetivo) - Number(a.anoLetivo))[0];
      if(maisRecente){
        _fotoPendente = { reaproveitar: true, fotoUrl: maisRecente.fotoUrl };
        previewImg.src = maisRecente.fotoUrl;
        previewImg.hidden = false;
        placeholder.hidden = true;
        btnRemover.hidden = false;
        setStatus(`Foto de uma matrícula anterior (${maisRecente.anoLetivo}) — mantenha ou clique em "Remover" pra trocar.`);
      }
    }catch(e){ console.warn('[foto-readmissao] falha ao buscar foto anterior:', e); }
  })();
}

// Chamado depois que a matrícula nova é salva com sucesso. Resolve o que
// estiver pendente no widget: uma foto nova escolhida manualmente, ou a
// sugestão de matrícula anterior aceita (precisa ser COPIADA pro
// public_id desta matrícula/ano — cada ano tem seu próprio arquivo no
// Cloudinary). A matrícula de origem nunca é alterada.
async function enviarFotoPendenteReadmissao(alunoId, ano, matriculaId){
  if(!_fotoPendente) return;

  if(_fotoPendente.reaproveitar){
    const { fotoUrl } = _fotoPendente;
    _fotoPendente = null;
    try{
      const resp = await fetch('/api/avatar-upload', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ tipo: 'aluno', entidadeId: alunoId, ano, sourceUrl: fotoUrl }),
      });
      const data = await resp.json();
      if(!resp.ok) throw new Error(data.error || 'erro desconhecido');
      await window.DB.anoAtivoMatriculas.save({ _id: matriculaId, fotoUrl: data.fotoUrl, fotoFileId: data.fotoFileId });
    }catch(e){ console.warn('[foto-readmissao] erro ao copiar foto reaproveitada:', e); }
    return;
  }

  const { base64, mimeType } = _fotoPendente;
  _fotoPendente = null;
  try{
    const resp = await fetch('/api/avatar-upload', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ tipo: 'aluno', entidadeId: alunoId, ano, fileBase64: base64, mimeType }),
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'erro desconhecido');
    await window.DB.anoAtivoMatriculas.save({ _id: matriculaId, fotoUrl: data.fotoUrl, fotoFileId: data.fotoFileId });
  }catch(e){ console.warn('[foto-readmissao] erro ao enviar foto nova:', e); }
}

/* =========================
   Documentos já anexados (somente leitura)
   — a readmissão não é o lugar de anexar/remover documentos (isso
   continua na tela de cadastro/edição); aqui é só pra confirmar
   visualmente que é o aluno certo antes de readmitir.
========================= */
async function _carregarDocsExistentes(alunoId){
  const wrap  = document.getElementById('docsExistentesWrap');
  const lista = document.getElementById('docsExistentesLista');
  if(!wrap || !lista) return;
  try{
    const resp = await fetch(`/api/drive-list?alunoId=${encodeURIComponent(alunoId)}`);
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error);
    const files = data.files || [];
    if(!files.length) return;
    wrap.hidden = false;
    lista.innerHTML = files.map(f => {
      const icon = (f.mimeType||'').startsWith('image/') ? '🖼️' : '📄';
      const dataFmt = f.createdAt ? new Date(f.createdAt).toLocaleDateString('pt-BR') : '';
      return `<div class="doc-item">`+
        `<span class="doc-icone">${icon}</span>`+
        `<div class="doc-info">`+
          `<div class="doc-nome">${escapeHtml(f.label||f.fileName)}</div>`+
          `<div class="doc-meta">${escapeHtml(f.fileName)}${dataFmt ? ' · ' + dataFmt : ''}</div>`+
        `</div>`+
        `<a class="btn secondary small" href="${f.webViewLink}" target="_blank" rel="noopener">👁️ Ver</a>`+
      `</div>`;
    }).join('');
  }catch(e){ console.warn('[docs-readmissao] erro ao carregar documentos:', e); }
}


/* =========================
   Toasts (visual em components.css: .toast .toast-ok|err|warn|loading) — guia v6, 8.2
========================= */
const _TOAST = {
  ok:      { cls:'toast-ok',      ms:2500 },
  err:     { cls:'toast-err',     ms:4500 },
  warn:    { cls:'toast-warn',    ms:4000 },
  loading: { cls:'toast-loading', ms:0 },       // 0 = sem expirar: some quando a operação termina
};
function _showToast(msg, tipo){
  const existing = document.getElementById('_toastGlobal');
  if(existing) existing.remove();
  const cfg = _TOAST[tipo] || _TOAST.warn;
  const toast = document.createElement('div');
  toast.id = '_toastGlobal';
  toast.className = 'toast ' + cfg.cls;
  toast.setAttribute('role', tipo === 'err' ? 'alert' : 'status');
  const span = document.createElement('span');
  span.className = 'toast-msg';
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'toast-close';
  btn.textContent = '✕';
  btn.setAttribute('aria-label','Fechar aviso');
  btn.onclick = () => toast.remove();
  toast.append(span, btn);
  document.body.appendChild(toast);
  if(cfg.ms) setTimeout(() => { if(toast.isConnected) toast.remove(); }, cfg.ms);
}
// só remove o "carregando": nunca apaga um sucesso/erro/aviso que apareceu no meio do caminho
function _toastLimpar(){
  const t = document.getElementById('_toastGlobal');
  if(t && t.classList.contains('toast-loading')) t.remove();
}
function _toastSucesso(m){ _showToast(m,'ok'); }
function _toastErro(m){ _showToast(m,'err'); }
function _toastAviso(m){ _showToast(m,'warn'); }
function _toastCarregando(m){ _showToast(m,'loading'); }

function setMsg(text, kind){
  const t = (text||"").toString();
  if(!t) return;
  if(kind === "err") _toastErro('⚠️ ' + t);
  else if(kind === "ok") _toastSucesso('✅ ' + t);
  else if(kind === "warn") _toastAviso('⚠️ ' + t);
  else if(kind === "loading") _toastCarregando('⏳ ' + t);
  else {
    console.warn('[toast] kind desconhecido:', JSON.stringify(kind), '— usando "aviso" como padrão seguro.');
    _toastAviso(t);
  }
}

// Rede de segurança: promise sem catch com "carregando" aberto vira erro (não fica preso)
window.addEventListener('unhandledrejection', () => {
  const t = document.getElementById('_toastGlobal');
  if(t && t.classList.contains('toast-loading')) _toastErro('⚠️ Não foi possível concluir a operação.');
});

// Tooltips (ⓘ): fecha ao clicar fora (guia v6, seção 6)
document.addEventListener('click', () => {
  document.querySelectorAll('.info-tip.open').forEach(el => el.classList.remove('open'));
});

/* ── Modal de confirmação (substitui confirm() nativo) — guia v6, 8.3 ── */
// corDestaque: 'danger' = ação destrutiva (título e botão vermelhos); 'ok' = contraponto positivo (verde);
// qualquer outro = cor de marca.
function _confirmModal({ titulo, corpo, corDestaque, textoConfirmar, textoCancelar, digitar }){
  return new Promise((resolve) => {
    const perigo = corDestaque === 'danger';
    const positivo = corDestaque === 'ok';
    const variante = perigo ? ' perigo' : positivo ? ' ok' : '';
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop open';
    backdrop.innerHTML =
      `<div class="cm-box" role="dialog" aria-modal="true">`+
        `<h3 class="cm-titulo${variante}">${escapeHtml(titulo || 'Confirmar ação')}</h3>`+
        `<p class="cm-corpo">${corpo || ''}</p>`+
        (digitar ? `<input type="text" class="cm-input" id="_confirmModalInput" autocomplete="off" placeholder="${escapeHtml(digitar)}">` : '')+
        `<div class="cm-acoes">`+
          `<button type="button" class="btn secondary" id="_confirmModalCancelar">${escapeHtml(textoCancelar || 'Cancelar')}</button>`+
          `<button type="button" class="cm-ok${variante}" id="_confirmModalOk"${digitar ? ' disabled' : ''}>${escapeHtml(textoConfirmar || 'Continuar')}</button>`+
        `</div>`+
      `</div>`;
    document.body.appendChild(backdrop);
    const ok = backdrop.querySelector('#_confirmModalOk');
    const cancelar = backdrop.querySelector('#_confirmModalCancelar');
    const input = backdrop.querySelector('#_confirmModalInput');
    function fechar(r){ document.removeEventListener('keydown', onKey); backdrop.remove(); resolve(r); }
    function onKey(ev){ if(ev.key === 'Escape') fechar(false); }
    document.addEventListener('keydown', onKey);
    ok.addEventListener('click', () => fechar(true));
    cancelar.addEventListener('click', () => fechar(false));
    backdrop.addEventListener('click', (ev) => { if(ev.target === backdrop) fechar(false); });
    if(input) input.addEventListener('input', () => { ok.disabled = (input.value !== digitar); });
    cancelar.focus();
  });
}

/* =========================
   Estado
========================= */
const params = new URLSearchParams(window.location.search);
const alunoId = (params.get('alunoId') || '').trim();
const conteudo = document.getElementById('conteudo');

let alunos = [], turmas = [], mats = [], anoAtivo = '';

  // ── Cópia dos dados de BUSCA na matrícula + contadores da turma (igual ao cadastro-aluno-ativo) ──
  // A pesquisa (pesquisa-ano-ativo) consulta a matrícula no servidor e não lê a coleção de alunos.
  // Fonte da verdade = doc do aluno; a matrícula guarda uma cópia (nome, sexo, dia/mês/ano de nascimento).
  // Quem altera dado pessoal grava aluno + TODAS as matrículas dele no mesmo batch (tudo ou nada).
  function _camposBuscaMat(p){
    const m = String((p && p.dataNascimento) || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
    return {
      nome:    String((p && (p.nome || p.nomeOficial)) || '').trim(),
      sexo:    String((p && p.sexo) || '').trim().toUpperCase(),
      nascDia: m ? Number(m[3]) : null,
      nascMes: m ? Number(m[2]) : null,
      nascAno: m ? Number(m[1]) : null,
    };
  }
  // Atualiza a cópia em cada matrícula que difere; se a matrícula já tem op no batch, mescla nela (não repete documento)
  function _opsSyncBusca(matsDoAluno, campos, ops){
    (matsDoAluno || []).forEach(m => {
      if(!Object.keys(campos).some(k => (m[k] === undefined ? null : m[k]) !== campos[k])) return;
      const ja = ops.find(o => o.col === 'anoAtivoMatriculas' && o.id === m._id);
      if(ja) Object.assign(ja.data, campos);
      else ops.push({ col:'anoAtivoMatriculas', op:'update', id: m._id, data: { ...campos } });
    });
  }
  // Contadores no doc da turma (só matrículas ATIVAS do ano ativo): qtdAlunos e qtdIntegral. increment() = atômico.
  const _ehIntegral = m => String(m || '').toUpperCase() === 'INTEGRAL';
  function _turmaDocId(turmaId){
    const t = turmas.find(x => x.turmaId === turmaId);
    return t ? (t._id || t.turmaId) : null;
  }
  function _opContadorTurma(turmaId, dQtd, dInt){
    if(!dQtd && !dInt) return null;
    const id = _turmaDocId(turmaId); if(!id) return null;
    const inc = window.Auth.firebase.firestore.FieldValue.increment;
    const data = {}; if(dQtd) data.qtdAlunos = inc(dQtd); if(dInt) data.qtdIntegral = inc(dInt);
    return { col:'anoAtivoTurmas', op:'update', id, data };
  }


function erro(msg){
  conteudo.innerHTML = `<div class="card"><div class="aviso-warn">⚠️ ${escapeHtml(msg)}</div></div>`;
}

async function init(){
  if(!alunoId){
    erro('Nenhum aluno informado. Acesse esta página a partir da pesquisa, pelo botão "🔁 Readmitir".');
    setMsg('Nenhum aluno informado.', 'err');
    return;
  }

  await new Promise(res=>{
    if(window.Auth && window.Auth.getSession && window.Auth.getSession()) return res();
    document.addEventListener('auth:ready', res, {once:true});
  });

  try{
    const [alunoDoc, matsDoAluno, turmasDB, dadosEscola] = await Promise.all([
      window.DB.anoAtivoAlunos.get(alunoId),
      window.DB.anoAtivoMatriculas.whereEquals('alunoId', alunoId),   // só as deste aluno
      window.DB.anoAtivoTurmas.list(),
      window.DB.escola.get(),
    ]);
    alunos = alunoDoc ? [alunoDoc] : [];
    mats   = Array.isArray(matsDoAluno) ? matsDoAluno : [];
    turmas = Array.isArray(turmasDB) ? turmasDB : [];
    anoAtivo = (dadosEscola?.configAnoAtivo || '').toString().replace(/"/g,'').trim();
  }catch(e){
    console.error(e);
    erro('Erro ao carregar dados do Firestore. Tente novamente.');
    setMsg('Erro ao carregar dados do Firestore. Tente novamente.', 'err');
    return;
  }

  const aluno = alunos.find(a => (a.alunoId || a._id || a.id || '').toString().trim() === alunoId);
  if(!aluno){
    erro(`Aluno com ID "${alunoId}" não encontrado.`);
    setMsg(`Aluno com ID "${alunoId}" não encontrado.`, 'err');
    return;
  }

  if(!anoAtivo){
    const anos = new Set();
    mats.forEach(m => m.anoLetivo && anos.add(String(m.anoLetivo)));
    turmas.forEach(t => t.anoLetivo && anos.add(String(t.anoLetivo)));
    const arr = Array.from(anos).sort();
    anoAtivo = arr.length ? arr[arr.length-1] : String(new Date().getFullYear());
  }

  renderFicha(aluno);
  await renderFormulario(aluno);
}

function renderFicha(a){
  const nasc = a.dataNascimento || '—';
  const idade = a.idade || calcIdade(a.dataNascimento) || '—';

  const camposFicha = [
    {label:'CPF', v:a.cpf},
    {label:'DATA DE NASCIMENTO', v:nasc},
    {label:'IDADE', v:idade},
    {label:'MÃE', v:a.mae},
    {label:'PAI', v:a.pai},
    {label:'NATURALIDADE', v:[a.naturalidadeCidade,a.naturalidadeUF].filter(Boolean).join('/') || a.naturalidade},
    {label:'SEXO', v:a.sexo},
    {label:'COR/RAÇA', v:a.corRaca || 'Não declarada'},
  ];

  const html = `
    <div class="card">
      <h2>📋 Ficha do aluno <span class="badge gray small">somente leitura</span></h2>
      <div class="ficha-header">
        <div><b>${escapeHtml(a.nome || 'Sem nome')}</b> <span class="badge gray">ID: ${escapeHtml(alunoId)}</span></div>
      </div>
      <div class="ficha-grid">
        ${camposFicha.map(c => `
          <div class="ficha-item">
            <div class="ficha-rot">${escapeHtml(c.label)}</div>
            <div class="ficha-val">${escapeHtml(c.v || '—')}</div>
          </div>`).join('')}
      </div>
      <div class="ficha-sec">
        <div class="ficha-rot">NEE / Transtornos</div>
        ${montarNeeDetalhado(a)}
      </div>
    </div>
    <div id="painelFormulario"></div>
  `;
  conteudo.innerHTML = html;
}

async function renderFormulario(aluno){
  const painel = document.getElementById('painelFormulario');

  const anosDisponiveis = Array.from(new Set(turmas.map(t => String(t.anoLetivo||'')).filter(Boolean)))
    .sort((a,b)=>Number(a)-Number(b));
  if(anoAtivo && !anosDisponiveis.includes(anoAtivo)) anosDisponiveis.push(anoAtivo);

  await montarFormularioPara(painel, aluno, anoAtivo || anosDisponiveis[anosDisponiveis.length-1] || '', anosDisponiveis);
}

async function montarFormularioPara(painel, aluno, anoEscolhido, anosDisponiveis){
  const matAtual = await window.MatriculaUtils.getMatriculaAtual(alunoId, anoEscolhido);

  if(matAtual && (matAtual.status||'').toUpperCase() === 'ATIVO'){
    painel.innerHTML = `
      <div class="card">
        <h2>Matrícula</h2>
        <div class="aviso-warn">
          ⚠️ Este aluno já possui uma matrícula <b>ATIVA</b> no ano letivo ${escapeHtml(anoEscolhido)}
          (turma: ${escapeHtml(matAtual.turmaId || '—')}). Não é possível readmitir — se a intenção é
          transferir de turma, use a edição de matrícula na tela de cadastro.
        </div>
      </div>`;
    return;
  }

  const turmasDoAno = turmas.filter(t => String(t.anoLetivo||'') === String(anoEscolhido));

  painel.innerHTML = `
    <div class="card">
      <h2>Nova matrícula</h2>
      ${matAtual ? `<div class="aviso-warn">ℹ️ Última matrícula encontrada: <b>${escapeHtml(matAtual.status||'—')}</b>${matAtual.situacao ? ' • ' + escapeHtml(matAtual.situacao) : ''} em ${escapeHtml(matAtual.anoLetivo||'—')} (turma ${escapeHtml(matAtual.turmaId||'—')}). A readmissão cria uma matrícula nova, independente da situação anterior.</div>` : ''}

      <!-- Foto do aluno (herdada da matrícula anterior, se houver) -->
      <div id="fotoAlunoBox" class="foto-box">
        <div class="foto-circulo">
          <img id="fotoAlunoPreview" src="" alt="Foto do aluno" hidden>
          <span id="fotoAlunoPlaceholder" class="foto-vazia">🧑</span>
        </div>
        <div class="foto-info">
          <div class="foto-tit">Foto do aluno (opcional) <span class="info-tip" tabindex="0" onclick="event.stopPropagation(); event.preventDefault(); document.querySelectorAll('.info-tip.open').forEach(o=>{ if(o!==this) o.classList.remove('open'); }); this.classList.toggle('open');">i<span class="info-tip-bubble">Puxamos automaticamente a foto mais recente já salva para este aluno, se houver. Mantenha ou troque abaixo.</span></span></div>
          <input type="file" id="inpFotoAluno" accept="image/*" hidden>
          <div class="foto-acoes">
            <button type="button" class="btn small" id="btnEscolherFoto" onclick="document.getElementById('inpFotoAluno').click()">📷 Escolher foto</button>
            <button type="button" class="btn small" id="btnRemoverFoto" hidden>🗑️ Remover</button>
          </div>
          <div id="fotoAlunoStatus" class="help"></div>
        </div>
      </div>

      <!-- Documentos já anexados (somente leitura — pra confirmar que é o aluno certo) -->
      <div id="docsExistentesWrap" class="docs-wrap" hidden>
        <div class="ficha-rot">Documentos já anexados</div>
        <div id="docsExistentesLista" class="docs-lista"></div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="selAnoReadmissao">Ano letivo</label>
          <select id="selAnoReadmissao">
            ${anosDisponiveis.map(y => `<option value="${escapeHtml(y)}" ${y===anoEscolhido?'selected':''}>${escapeHtml(y)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="selTurmaReadmissao">Turma</label>
          <select id="selTurmaReadmissao">
            <option value="" disabled hidden selected></option>
            ${turmasDoAno.map(t => `<option value="${escapeHtml(t.turmaId)}">${escapeHtml(t.nome || t.turmaId)}${t.turno ? ' — ' + escapeHtml(t.turno) : ''}</option>`).join('')}
          </select>
          ${turmasDoAno.length===0 ? `<div class="help err">Nenhuma turma cadastrada para este ano.</div>` : ''}
        </div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="selSerieReadmissao">Série</label>
          <select id="selSerieReadmissao" disabled>
            <option value="" disabled hidden selected></option>
          </select>
        </div>
        <div class="field">
          <label for="selModeloReadmissao">Modelo de ensino</label>
          <select id="selModeloReadmissao">
            <option value="" disabled hidden selected></option>
            <option value="REGULAR">Regular</option>
            <option value="INTEGRAL">Integral</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="btn secondary" type="button" onclick="location.href='pesquisa-ano-ativo.html'">Cancelar</button>
        <button class="btn primary" type="button" id="btnConfirmarReadmissao">✅ Confirmar readmissão</button>
      </div>
    </div>
  `;

  _setupFotoWidget(alunoId);
  _carregarDocsExistentes(alunoId);

  const selAno   = document.getElementById('selAnoReadmissao');
  const selTurma = document.getElementById('selTurmaReadmissao');
  const selSerie = document.getElementById('selSerieReadmissao');
  const selModelo = document.getElementById('selModeloReadmissao');
  // sugestão: modelo da última matrícula do aluno (ou do cadastro dele); continua obrigatório e editável
  const _ult = mats.slice().sort((a, b) => (Number(b.anoLetivo) - Number(a.anoLetivo)) || String(b.criadoEm || '').localeCompare(String(a.criadoEm || '')))[0];
  const _mod = String((_ult && _ult.modelo) || aluno.modeloEnsino || '').toUpperCase();
  if(_mod === 'REGULAR' || _mod === 'INTEGRAL') selModelo.value = _mod;
  const btn      = document.getElementById('btnConfirmarReadmissao');

  // Ano mudou → recarrega a seção inteira (turmas do ano + recheca matrícula ATIVO)
  selAno.addEventListener('change', () => {
    montarFormularioPara(painel, aluno, selAno.value, anosDisponiveis);
  });

  selTurma.addEventListener('change', () => {
    const t = turmasDoAno.find(x => x.turmaId === selTurma.value);
    if(!t){
      selSerie.innerHTML = '<option value="" disabled hidden selected></option>';
      selSerie.disabled = true;
      return;
    }
    const series = Array.isArray(t.series) && t.series.length ? t.series : (t.serie ? [t.serie] : []);
    if(series.length){
      selSerie.innerHTML = series.map(s => `<option value="${escapeHtml(normSerie(s))}">${escapeHtml(normSerie(s))}</option>`).join('');
      selSerie.disabled = series.length <= 1;
    } else {
      selSerie.innerHTML = '<option value="">—</option>';
      selSerie.disabled = true;
    }
  });

  btn.addEventListener('click', async () => {
    const ano = selAno.value;
    const turmaId = selTurma.value;
    const serie = selSerie.value;

    if(!ano || !turmaId){
      setMsg('Selecione o ano letivo e a turma antes de confirmar.', 'warn');
      return;
    }
    if(!selModelo.value){
      setMsg('Selecione o modelo de ensino (Regular ou Integral).', 'warn');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Salvando…';
    setMsg('Salvando matrícula…', 'loading');

    try{
      // Re-checagem final antes de gravar, evita corrida entre abrir a tela e confirmar
      const existente = await window.MatriculaUtils.getMatriculaAtual(alunoId, ano);
      if(existente && (existente.status||'').toUpperCase() === 'ATIVO'){
        setMsg('Uma matrícula ativa foi criada enquanto você preenchia o formulário. Recarregue a página.', 'warn');
        btn.disabled = false;
        btn.textContent = '✅ Confirmar readmissão';
        return;
      }

      const turmaObj = turmasDoAno.find(x => x.turmaId === turmaId);
      const matriculaId = window.MatriculaUtils.buildMatriculaId(turmaId, alunoId, ano);

      const modelo = selModelo.value;   // escolhido no formulário (a turma não define Regular/Integral)

      let novaMatricula = window.MatriculaUtils.validarMatricula({
        _id: matriculaId,
        alunoId,
        turmaId,
        anoLetivo: String(ano),
        serie: serie || '',
        turno: (turmaObj && turmaObj.turno) || '',
        modelo,
        status: 'ATIVO',
        situacao: null,
      });
      const camposBusca = _camposBuscaMat(aluno);
      novaMatricula = { ...novaMatricula, ...camposBusca,
        anoLetivo: Number(ano), serie: normSerie(serie || ''), turno: String((turmaObj && turmaObj.turno) || '').toUpperCase(),
        modelo, criadoEm: novaMatricula.criadoEm || new Date().toISOString(),
        encerradoEm: window.Auth.firebase.firestore.FieldValue.delete() };   // readmitir na mesma turma/ano reaproveita o doc: limpa o encerramento antigo

      const ops = [{ col:'anoAtivoMatriculas', op:'set', id: matriculaId, data: novaMatricula }];
      // O sistema mantém UMA matrícula por aluno/ano (a troca de turma também apaga a antiga). Ao readmitir, a matrícula ENCERRADA deste
      // aluno no mesmo ano, em outra turma, é um resíduo: se ficar, o ID dela continua ocupado e trava voltar para aquela turma.
      // (Na mesma turma o documento é reaproveitado, por isso fica de fora. Anos anteriores nunca são tocados.)
      const todas = await window.DB.anoAtivoMatriculas.whereEquals('alunoId', alunoId);   // leitura fresca, só deste aluno
      const residuos = todas.filter(m => m._id !== matriculaId && String(m.anoLetivo).trim() === String(ano).trim()
        && (m.status || 'ATIVO').toString().trim().toUpperCase() === 'INATIVO');
      residuos.forEach(m => ops.push({ col:'anoAtivoMatriculas', op:'delete', id: m._id }));
      const idsResiduo = new Set(residuos.map(m => m._id));
      _opsSyncBusca(todas.filter(m => m._id !== matriculaId && !idsResiduo.has(m._id)), camposBusca, ops);   // demais matrículas do aluno acompanham o dado pessoal
      if(String(ano) === String(anoAtivo)){                                        // contador da turma (+1 aluno; +1 integral)
        const cTurma = _opContadorTurma(turmaId, 1, _ehIntegral(modelo) ? 1 : 0);
        if(cTurma) ops.push(cTurma);
      }
      await window.DB.batchWrite(ops);
      // Log: 1 registro por readmissão (contador da turma, cópia de busca nas outras matrículas e foto não entram).
      // Mesma turma/ano com matrícula encerrada = reativação (editar); caso contrário nasce uma matrícula (criar).
      if(window.Log){
        const _reaproveitada = todas.find(m => m._id === matriculaId) || null;   // já lida acima: sem leitura extra
        const _resumoLog = `Readmissão — ${aluno.nome || aluno.nomeOficial || alunoId} — turma ${(turmaObj && (turmaObj.nome || turmaObj.turmaId)) || turmaId}, ${ano}`
          + (_reaproveitada ? ' (reativou matrícula encerrada)' : '')
          + (residuos.length ? ` (apagou ${residuos.length} matrícula(s) encerrada(s) residual(is) do mesmo ano)` : '');
        const _depoisLog = { ...novaMatricula, encerradoEm: null };   // o delete() do Firestore não aparece no log: null mostra a limpeza
        if(residuos.length) _depoisLog._residuosApagados = residuos.map(m => ({ id: m._id, turmaId: m.turmaId, status: m.status || null, situacao: m.situacao || null }));
        if(_reaproveitada) await Log.registrar({ acao: 'editar', colecao: 'anoAtivoMatriculas', docId: matriculaId, resumo: _resumoLog,
          antes: _reaproveitada, depois: _depoisLog, parcial: true });
        else await Log.registrar({ acao: 'criar', colecao: 'anoAtivoMatriculas', docId: matriculaId, resumo: _resumoLog, depois: _depoisLog });
      }
      await enviarFotoPendenteReadmissao(alunoId, ano, matriculaId);
      setMsg('Readmissão concluída com sucesso!', 'ok');

      btn.textContent = '✅ Readmitido';   // sem bloco de sucesso: toast + redirecionamento (decisão do usuário)
      // Padrão do sistema: redireciona automaticamente pra pesquisa depois
      // de uma ação concluída (mesmo comportamento do "encerrar matrícula").
      // "Cancelar" também leva à pesquisa para quem não quiser esperar.
      setTimeout(() => { location.href = 'pesquisa-ano-ativo.html'; }, 2000);
    }catch(e){
      console.error(e);
      setMsg('Erro ao gravar matrícula: ' + (e.message || String(e)), 'err');
      btn.disabled = false;
      btn.textContent = '✅ Confirmar readmissão';
    }
  });
}

init()
  .catch(e => { console.error('init:', e); _toastErro('Erro ao iniciar a página.'); })
  .finally(() => { if (window.Loading) Loading.esconder(); });

})();
</script>
