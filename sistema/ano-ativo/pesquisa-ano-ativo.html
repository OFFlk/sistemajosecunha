/* =========================
   Salvar/Restaurar estado da página
========================= */
function salvarEstadoPagina(){
  const estado = {
    checkboxesMarcadas: Array.from(document.querySelectorAll('.chkTurma:checked'))
      .map(cb => cb.dataset.turma).filter(Boolean),
    anoSelecionado: selAno.value,
    seriesSelecionadas: seriesSelecionadas,
    busca: inpBusca.value,
    sortField: currentSortField,
    sortOrder: currentSortOrder,
    turnoFiltro: document.getElementById("selTurno")?.value || '',
    modeloFiltro: document.getElementById("selModelo")?.value || '',
    readmissaoMarcado: document.getElementById("chkReadmissao")?.checked || false,
    situacaoFiltro: document.getElementById("selSituacao")?.value || '',
    naoConcluintesMarcado: document.getElementById("chkNaoConcluintes")?.checked || false,
    situacaoPassadoFiltro: document.getElementById("selSituacaoPassado")?.value || '',
    modoFiltro: document.querySelector('input[name="modoFiltro"]:checked')?.value || 'turma',
    turmaSort: currentTurmaSort,
    defMarcado: document.getElementById("chkFiltroDef")?.checked || false,
    defSubtipos: Array.from(document.querySelectorAll(".filtroDefItem:checked")).map(c=>c.value),
    transMarcado: document.getElementById("chkFiltroTrans")?.checked || false,
    transSubtipos: Array.from(document.querySelectorAll(".filtroTransItem:checked")).map(c=>c.value),
    aeeMarcado: document.getElementById("chkFiltroAee")?.checked || false,
  };
  sessionStorage.setItem('pesquisaAnoAtivoEstado', JSON.stringify(estado));
}

function restaurarEstadoPagina(){
  try {
    const estadoSalvo = sessionStorage.getItem('pesquisaAnoAtivoEstado');
    if(!estadoSalvo) return false;
    
    const estado = JSON.parse(estadoSalvo);
    
    // Restaurar filtros
    if(estado.anoSelecionado) selAno.value = estado.anoSelecionado;
    if(estado.seriesSelecionadas) seriesSelecionadas = estado.seriesSelecionadas;
    if(estado.busca) inpBusca.value = estado.busca;
    if(estado.sortField) currentSortField = estado.sortField;
    if(estado.sortOrder) currentSortOrder = estado.sortOrder;
    if(estado.turnoFiltro) document.getElementById("selTurno").value = estado.turnoFiltro;
    if(estado.modeloFiltro) document.getElementById("selModelo").value = estado.modeloFiltro;
    if(estado.readmissaoMarcado){
      const chk = document.getElementById("chkReadmissao");
      if(chk){ chk.checked = true; const sel = document.getElementById("selSituacao"); if(sel) sel.style.display = ""; }
    }
    if(estado.situacaoFiltro) document.getElementById("selSituacao").value = estado.situacaoFiltro;
    if(estado.naoConcluintesMarcado){
      const chk = document.getElementById("chkNaoConcluintes");
      if(chk) chk.checked = true;
    }
    _atualizarOpcoesSituacaoPassado();
    if(estado.situacaoPassadoFiltro) document.getElementById("selSituacaoPassado").value = estado.situacaoPassadoFiltro;
    _blocoStatusAtualizarVisibilidade();
    if(estado.defMarcado){
      const chk = document.getElementById("chkFiltroDef");
      if(chk){ chk.checked = true; document.getElementById("subFiltroDef").style.display = "flex"; }
      (estado.defSubtipos||[]).forEach(v=>{
        const el = document.querySelector(`.filtroDefItem[value="${v}"]`);
        if(el) el.checked = true;
      });
    }
    if(estado.transMarcado){
      const chk = document.getElementById("chkFiltroTrans");
      if(chk){ chk.checked = true; document.getElementById("subFiltroTrans").style.display = "flex"; }
      (estado.transSubtipos||[]).forEach(v=>{
        const el = document.querySelector(`.filtroTransItem[value="${v}"]`);
        if(el) el.checked = true;
      });
    }
    if(estado.aeeMarcado){
      const chk = document.getElementById("chkFiltroAee");
      if(chk) chk.checked = true;
    }
    if(window._atualizarBadgePesquisaAvancada) window._atualizarBadgePesquisaAvancada();
    if(estado.modoFiltro){
      const radio = document.querySelector(`input[name="modoFiltro"][value="${estado.modoFiltro}"]`);
      if(radio) radio.checked = true;
    }
    
    // Restaurar ordenação de turmas
    if(estado.turmaSort){
      currentTurmaSort = estado.turmaSort;
      const sel = document.getElementById("sortTurmaField");
      if(sel) sel.value = currentTurmaSort;
    }
    // Atualizar UI de ordenação de alunos
    if(sortField) sortField.value = currentSortField;
    if(btnToggleSort) btnToggleSort.textContent = currentSortOrder === 'asc' ? '↑↓' : '↓↑';
    
    // Renderizar e depois restaurar checkboxes
    renderChips();
    _jaFoiPesquisado = true;
    atualizarListas();
    
    setTimeout(() => {
      estado.checkboxesMarcadas.forEach(id => {
        const cb = document.querySelector(`.chkTurma[data-turma="${id}"]`);
        if(cb) cb.checked = true;
      });
      if(estado.checkboxesMarcadas.length){ syncCheckAllTurmas(); atualizarListaAlunos(); }
    }, 100);
    
    return true;
  } catch(e){
    console.warn('Erro ao restaurar estado:', e);
    return false;
  }
}

/* =========================
   Init
========================= */
(async function init(){
  await carregarDB();
  if(_semEscola){
    listaTurmas.innerHTML = `<div class="muted" style="padding:12px;">Selecione uma escola no cabeçalho para pesquisar. Os dados de todas as escolas ficam na gestão do ano ativo.</div>`;
    listaAlunos.innerHTML = ""; countTurmas.textContent = "—"; countAlunos.textContent = "—";
    Loading.esconder(); return;
  }
  if(!anoAtivo){
    listaTurmas.innerHTML = `<div class="muted" style="padding:12px;">⚠️ Ano ativo não definido. Defina-o no módulo de administração.</div>`;
    listaAlunos.innerHTML = ""; countTurmas.textContent = "—"; countAlunos.textContent = "—";
    Loading.esconder(); return;
  }
  
  // Tentar restaurar estado salvo (matrículas do ano salvo precisam estar carregadas antes)
  try{ const _e = JSON.parse(sessionStorage.getItem('pesquisaAnoAtivoEstado')||'null'); if(_e && _e.anoSelecionado) await garantirMatsDoAno(_e.anoSelecionado); }catch(e){ console.warn(e); }
  const estadoRestaurado = restaurarEstadoPagina();
  
  if(!estadoRestaurado){
    renderChips();
    _blocoStatusAtualizarVisibilidade();
    if(anoAtivo && selAno.value){
      _jaFoiPesquisado = true;
      atualizarListas();
    } else {
      listaTurmas.innerHTML = `<div class="muted" style="padding:12px;">Selecione o ano letivo ou clique em <b>Pesquisar</b> para carregar as turmas.</div>`;
      listaAlunos.innerHTML = `<div class="muted" style="padding:12px;">As turmas e alunos aparecerão após a pesquisa.</div>`;
      countTurmas.textContent = "—"; countAlunos.textContent = "—";
    }
  }
  
  // Salvar estado apenas ao navegar para edição (não ao fechar/recarregar)
  // Isso garante que ao abrir a página do zero, nenhum estado antigo seja restaurado
  window.addEventListener('beforeunload', ()=>{
    // Só salva se estiver indo para a página de edição
    const destino = document.__pesquisaDestino || '';
    if(destino.includes('cadastro-aluno-ativo') || destino.includes('readmitir-aluno')) salvarEstadoPagina();
    else sessionStorage.removeItem('pesquisaAnoAtivoEstado');
  });
  Loading.esconder();
})().catch(e => { console.error('init:', e); _toastErro('Erro ao iniciar a página.'); Loading.esconder(); });

})();
</script>
