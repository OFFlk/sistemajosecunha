<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="../icon.png" type="image/png"/>

<!-- Tema antecipado (evita flash de tema errado) -->
<script>
(function(){
  var saved = (localStorage.getItem('ui_theme_v1') || '').toLowerCase();
  var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<!-- Scripts globais -->
<script src="../loading-overlay.js"></script>
<script src="../auth.firebase.js"></script>
<script src="../db.firebase.js"></script>
<script src="../theme-colors.js"></script>

<!-- Fonte -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- CSS globais -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/components.css">

<!-- CSS exclusivo desta página -->
<style>
/* ── Variáveis que esta página sobrescreve ── */
:root {
  --card-bg:             #ffffff;
  --card-border:         var(--brand-border, #ddd6fe);
  --field-bg:            #ffffff;
  --field-border:        var(--brand-border, #ddd6fe);
  --shadow:              0 4px 20px rgba(0,0,0,0.06);
  --danger:              #b91c1c;
  --chip-neutral-bg:     #f3f4f6;
  --chip-neutral-border: #d1d5db;
  --chip-neutral-color:  #4b5563;
}
html[data-theme="dark"] {
  --card-bg:             #131c2e;
  --card-border:         #2a3a5c;
  --field-bg:            #0a1426;
  --field-border:        #1e2540;
  --shadow:              0 4px 24px rgba(0,0,0,0.4);
  --chip-neutral-bg:     rgba(148,163,184,0.15);
  --chip-neutral-border: rgba(148,163,184,0.3);
  --chip-neutral-color:  #cbd5e1;
}

/* ── Layout ── */
.wrap   { max-width: 1300px; margin: 0 auto; padding: 24px 16px 48px; }
.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1      { font-size: 26px; margin: 0 0 4px; font-weight: 800; }
.sub    { color: var(--muted); font-size: 13px; margin: 0; }

/* ── Grids ── */
.grid  { display: grid; grid-template-columns: 220px 1fr 200px; gap: 14px; align-items: start; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
@media(max-width:980px){ .grid { grid-template-columns: 1fr; } .split { grid-template-columns: 1fr !important; } }
@media(max-width:640px){ .grid2, .grid3 { grid-template-columns: 1fr; } }

/* ── Misc ── */
.statusline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.chips      { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip       { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--chip-bg); background: var(--chip-bg); color: var(--chip-color); padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }

/* Badge do ano ativo */
.pill-ano-ativo {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--brand-faded); border: 1.5px solid var(--brand-border, #ddd6fe);
  color: var(--brand-text); padding: 8px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 800; white-space: nowrap;
}
.pill-ano-ativo b { font-weight: 900; }
html[data-theme="dark"] .pill-ano-ativo {
  background: var(--brand-faded-d); border-color: var(--brand-border-d);
  color: var(--brand-text-d);
}
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--chip-color); font-weight: 900; font-size: 14px; line-height: 1; }
.divider    { height: 1px; background: var(--line); margin: 14px 0; }
.right-col  { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.stack      { display: flex; flex-direction: column; }
.help       { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 14px; }
.loading    { font-size: 12px; color: var(--muted); margin-top: 8px; }

/* ── Split (dois painéis lado a lado) ── */
.split         { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.panel         { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; min-height: 200px; transition: background 0.3s, border-color 0.3s; }
.panel-head    { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.panel h2      { font-size: 17px; margin: 0; font-weight: 800; }
.count         { background: var(--chip-bg); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; font-size: 12px; color: var(--chip-color); font-weight: 700; }
.panel-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; overflow: visible; }
.check-all     { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 700; cursor: pointer; }
.list          { display: flex; flex-direction: column; gap: 8px; }

/* ── Items ── */
.item        { border: 1px solid var(--card-border); border-radius: 10px; padding: 14px; background: var(--card-bg); display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; transition: background 0.3s, border-color 0.3s; }
.item .left  { min-width: 0; flex: 1; }
.item .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item .title { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 800; font-size: 14px; }
.item .meta  { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.35; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* Seleção pelo card inteiro — a checkbox continua existindo e funcional
   (mesma lógica de sempre), só que fica escondida; o card em si vira o
   controle visual e o clique alterna o checked dela. */
.item.selecionavel { cursor: pointer; position: relative; }
.item.selecionavel .check-all,
.item.selecionavel .check { display: none; }
.item.selecionavel:has(.chkTurma:checked),
.item.selecionavel:has(.chkAluno:checked) {
  background: var(--brand-faded);
  border-color: var(--brand-hover, var(--brand-border));
}
html[data-theme="dark"] .item.selecionavel:has(.chkTurma:checked),
html[data-theme="dark"] .item.selecionavel:has(.chkAluno:checked) {
  background: var(--brand-faded-d);
  border-color: var(--brand-border-d);
}
.item.selecionavel .selo-selecionado {
  display: none;
  position: absolute; bottom: 10px; right: 10px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--brand, #6d28d9); color: #fff;
  align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; line-height: 1;
}
.item.selecionavel:has(.chkTurma:checked) .selo-selecionado,
.item.selecionavel:has(.chkAluno:checked) .selo-selecionado {
  display: flex;
}

/* ── Badge neutro e separador ── */
.badge-neutral  { background: var(--chip-neutral-bg); color: var(--chip-neutral-color); border-color: var(--chip-neutral-border); }
.separator-line { border: none; border-top: 1px solid rgba(148,163,184,0.3); margin: 8px 0; }
html[data-theme="dark"] .separator-line { border-top-color: rgba(148,163,184,0.2); }

/* ── Aperfeiçoamentos gerais do .btn nesta página ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 10px;
  padding: 8px 14px;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 13px;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, color 0.18s, box-shadow 0.18s, opacity 0.18s;
  white-space: nowrap;
}
.btn:active { opacity: 0.85; }

/* .btn base (sem modificador) — modo claro */
.btn:not(.primary):not(.ghost):not(.secondary):not(.danger) {
  background: var(--chip-bg);
  border-color: var(--card-border);
  color: var(--chip-color);
}
.btn:not(.primary):not(.ghost):not(.secondary):not(.danger):hover {
  background: var(--brand-faded);
  border-color: var(--brand-hover);
  color: var(--brand-text);
}

/* .btn base — modo escuro */
html[data-theme="dark"] .btn:not(.primary):not(.ghost):not(.secondary):not(.danger) {
  background: rgba(148,163,184,0.10);
  border-color: rgba(148,163,184,0.25);
  color: #cbd5e1;
}
html[data-theme="dark"] .btn:not(.primary):not(.ghost):not(.secondary):not(.danger):hover {
  background: var(--brand-faded-d);
  border-color: var(--brand-border-d);
  color: var(--brand-text-d);
}

/* .btn.primary — modo escuro */
html[data-theme="dark"] .btn.primary {
  background: var(--brand-d);
  border-color: var(--brand-d);
  color: #fff;
}
html[data-theme="dark"] .btn.primary:hover {
  background: var(--brand-hover-d);
  border-color: var(--brand-hover-d);
}

/* ── Variantes de botão não cobertas pelo components.css ── */
.btn.ghost           { background: var(--chip-bg); border-color: var(--card-border); color: var(--chip-color); }
.btn.ghost:hover     { background: var(--brand-faded); border-color: var(--brand-hover); color: var(--brand-text); }
html[data-theme="dark"] .btn.ghost       { background: rgba(148,163,184,0.10); border-color: rgba(148,163,184,0.25); color: #94a3b8; }
html[data-theme="dark"] .btn.ghost:hover { background: var(--brand-faded-d); border-color: var(--brand-border-d); color: var(--brand-text-d); }

.btn.secondary       { background: var(--chip-bg); border-color: var(--card-border); color: var(--chip-color); }
.btn.secondary:hover { background: var(--brand-faded); border-color: var(--brand-hover); color: var(--brand-text); }
html[data-theme="dark"] .btn.secondary       { background: rgba(148,163,184,0.10); border-color: rgba(148,163,184,0.25); color: #94a3b8; }
html[data-theme="dark"] .btn.secondary:hover { background: var(--brand-faded-d); border-color: var(--brand-border-d); color: var(--brand-text-d); }

.btn.danger          { background: rgba(185,28,28,0.10); border-color: rgba(185,28,28,0.30); color: #b91c1c; }
.btn.danger:hover    { background: rgba(185,28,28,0.18); border-color: rgba(185,28,28,0.55); }
html[data-theme="dark"] .btn.danger       { background: rgba(185,28,28,0.15); border-color: rgba(239,68,68,0.40); color: #fca5a5; }
html[data-theme="dark"] .btn.danger:hover { background: rgba(185,28,28,0.28); border-color: rgba(239,68,68,0.65); }

.btn.small           { padding: 6px 11px; font-size: 12px; }

/* ── Botão Editar/Readmitir — meio-termo entre o chip neutro e o brand sólido,
   mesmo hover de sempre. Usa color-mix() pra continuar 100% na cor de marca
   escolhida pelo usuário, só que mais forte que o chip-bg original. ── */
.btn-edit {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 10px;
  border: 1.5px solid var(--brand-hover, var(--brand));
  background: color-mix(in srgb, var(--brand) 30%, var(--card-bg));
  color: var(--brand-text, var(--brand));
  cursor: pointer;
  font-weight: 700;
  font-size: 12px;
  font-family: 'Nunito', sans-serif;
  white-space: nowrap;
  transition: background 0.18s, border-color 0.18s, color 0.18s, box-shadow 0.18s;
}
.btn-edit:hover {
  background: var(--brand);
  border-color: var(--brand-hover);
  color: #fff;
}
html[data-theme="dark"] .btn-edit {
  background: color-mix(in srgb, var(--brand-d) 30%, var(--card-bg));
  border-color: var(--brand-border-d, var(--brand-d));
  color: var(--brand-text-d);
}
html[data-theme="dark"] .btn-edit:hover {
  background: var(--brand-d);
  border-color: var(--brand-hover-d);
  color: #fff;
}

/* ── Actions row ── */
.actions     { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.actions .btn { border-radius: 10px; padding: 10px 16px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; }

/* ── Checkbox ── */
.check              { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
.check input        { cursor: pointer; accent-color: var(--brand); }
.check-all input    { cursor: pointer; accent-color: var(--brand); }
.item input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--brand); }

/* ── Ordenação ── */
.sort-control        { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 10px 14px; background: var(--chip-bg); border: 1px solid var(--card-border); border-radius: 10px; }
.sort-control label  { font-size: 13px; font-weight: 700; color: var(--chip-color); white-space: nowrap; }
.sort-control select { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--field-border); background: var(--field-bg); color: var(--ink); font-size: 13px; font-family: 'Nunito', sans-serif; cursor: pointer; outline: none; transition: border-color 0.18s; }
.sort-control select:focus { border-color: var(--brand); }
.sort-control button { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--card-border); background: var(--chip-bg); color: var(--chip-color); font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.18s; }
.sort-control button:hover { background: var(--brand); border-color: var(--brand-hover); color: #fff; }
html[data-theme="dark"] .sort-control { background: rgba(148,163,184,0.07); border-color: rgba(148,163,184,0.18); }
html[data-theme="dark"] .sort-control button { background: rgba(148,163,184,0.10); border-color: rgba(148,163,184,0.25); color: #94a3b8; }
html[data-theme="dark"] .sort-control button:hover { background: var(--brand-d); border-color: var(--brand-hover-d); color: #fff; }

/* ── Modal ── */
@keyframes toastSubir {
  from { opacity: 0; transform: translateX(-50%) translateY(16px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 50; }
.modal          { width: min(1100px, 96vw); max-height: 86vh; overflow: auto; background: var(--card-bg); border-radius: 14px; border: 1px solid var(--card-border); box-shadow: 0 30px 60px rgba(0,0,0,.25); }
.modal-head     { position: sticky; top: 0; background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--card-border); }
.modal-head h3  { margin: 0; font-size: 16px; font-weight: 800; }
.modal-body     { padding: 14px; }

/* ── Toast ── */
@keyframes slideUpToast  { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

/* ── Chips de turma ── */
.turma-chips     { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.turma-chips-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge-prof      { white-space: normal; word-break: break-word; max-width: 100%; }

/* ── Badge integral ── */
.badge-integral { background: #d1fae5; border-color: #6ee7b7; color: #065f46; }
html[data-theme="dark"] .badge-integral { background: rgba(52,211,153,0.18); border-color: #34d399; color: #6ee7b7; }

/* ── Avisos ── */
.warn { margin: 10px 0; padding: 10px 12px; border-radius: 10px; background: rgba(185,28,28,0.08); border: 1px solid rgba(185,28,28,0.25); color: var(--danger); font-size: 14px; }
.ok   { margin: 10px 0; padding: 10px 12px; border-radius: 10px; background: rgba(22,163,74,0.10); border: 1px solid rgba(22,163,74,0.25); color: #16a34a; font-size: 14px; }
html[data-theme="dark"] .ok { color: #4ade80; }

</style>

<title>Ano Ativo • Pesquisa e Lista</title>
</head>
<body>

<script>window.Auth && window.Auth.requireAuth();</script>

<!-- Header via fetch -->
<div id="header-placeholder"></div>

<div class="wrap">

  <div class="card">
    <!-- Linha 1: ano + busca + pesquisar -->
    <div class="grid">
      <div class="field stack">
        <label for="selAno">Ano letivo</label>
        <select id="selAno"></select>
        <div class="help" id="helpAno">Por padrão, usa o ano ativo detectado.</div>
      </div>

      <div class="field stack">
        <label for="inpBusca">Buscar aluno (nome ou CPF)</label>
        <div style="display:flex;gap:8px;align-items:stretch;">
          <input id="inpBusca" type="text" placeholder="Início do nome (mín. 3 letras) ou CPF" style="flex:1;"/>
          <button class="btn primary" id="btnAtualizar" style="white-space:nowrap;flex-shrink:0;">🔍 Pesquisar</button>
          <button class="btn ghost" id="btnLimparFiltros" style="flex-shrink:0;white-space:nowrap;">🧹 Limpar filtros</button>
          <div class="pill pill-ano-ativo" style="flex-shrink:0;margin-left:auto;">📅 ano ativo: <b id="lblAnoAtivo">—</b></div>
        </div>
        <div class="help">&nbsp;</div>
      </div>
    </div>

    <!-- Linha 2: filtros de série + turno + status -->
    <div style="margin-top:10px;">
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
        <div class="field" style="flex:1;min-width:160px;margin:0;">
          <label for="selSerieAdd">Filtrar por série</label>
          <select id="selSerieAdd">
            <option value="">(selecione)</option>
          </select>
        </div>
        <button class="btn primary" id="btnAddSerie" style="flex-shrink:0;white-space:nowrap;">+ Adicionar</button>
        <div class="field" style="min-width:160px;margin:0;">
          <label for="selTurno">Filtrar por turno</label>
          <select id="selTurno">
            <option value="">Todos os turnos</option>
            <option value="MATUTINO">🌤️ Matutino</option>
            <option value="VESPERTINO">☀️ Vespertino</option>
            <option value="NOTURNO">🌙 Noturno</option>
          </select>
        </div>
        <div class="field" style="min-width:160px;margin:0;">
          <label for="selModelo">Filtrar por modelo</label>
          <select id="selModelo">
            <option value="">Todos</option>
            <option value="REGULAR">Regular</option>
            <option value="INTEGRAL">📚 Integral</option>
          </select>
        </div>
        <div class="field" id="blocoStatusAtivo" style="min-width:230px;margin:0;position:relative;">
          <label style="visibility:hidden;">Pesquisa avançada</label>
          <button type="button" class="btn ghost" id="btnPesquisaAvancada" style="width:100%;white-space:nowrap;position:relative;">
            🔎 Pesquisa avançada
            <span id="badgePesquisaAvancada" style="display:none;position:absolute;top:-7px;right:-7px;background:var(--brand,#6d28d9);color:#fff;border-radius:999px;font-size:11px;font-weight:800;line-height:1;padding:3px 6px;">0</span>
          </button>

          <div id="painelPesquisaAvancada" style="display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:250;
              background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:12px;
              box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px;min-width:300px;max-width:340px;">

            <div>
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;font-weight:700;font-size:13px;">
                <input type="checkbox" id="chkReadmissao" style="width:auto;margin:0;">
                🔁 Somente readmissão (inativos)
              </label>
              <select id="selSituacao" style="display:none;margin-top:6px;width:100%;">
                <option value="">Todas as situações</option>
                <option value="TRANSFERIDO">Transferido</option>
                <option value="DESISTENTE">Desistente</option>
                <option value="FALECIDO">Faleceu</option>
              </select>
            </div>

            <div style="height:1px;background:var(--card-border);margin:12px 0;"></div>

            <div>
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:13px;">
                <input type="checkbox" id="chkFiltroDef">
                ♿ Deficiência
              </label>
              <div id="subFiltroDef" style="display:none;flex-direction:column;gap:6px;margin:8px 0 0 22px;">
                <label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;"><input type="checkbox" class="filtroDefItem" value="tea">🧩 TEA</label>
                <label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;"><input type="checkbox" class="filtroDefItem" value="altasHabilidades">⭐ Altas habilidades / superdotação</label>
                <label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;"><input type="checkbox" class="filtroDefItem" value="defFisica">🦽 Deficiência física</label>
                <label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;"><input type="checkbox" class="filtroDefItem" value="defIntelectual">🧠 Deficiência intelectual</label>
                <label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;"><input type="checkbox" class="filtroDefItem" value="defVisual">👁️ Deficiência visual</label>
                <label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;"><input type="checkbox" class="filtroDefItem" value="defAuditiva">👂 Deficiência auditiva / surdez</label>
              </div>
            </div>

            <div style="height:1px;background:var(--card-border);margin:12px 0;"></div>

            <div>
              <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:13px;">
                <input type="checkbox" id="chkFiltroTrans">

function _showToast(msg, bg, shadow, duration){
  const existing = document.getElementById('_toastGlobal');
  if(existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = '_toastGlobal';
  toast.style.cssText =
    `position:fixed;bottom:28px;left:50%;transform:translateX(-50%);`+
    `display:flex;align-items:center;gap:12px;`+
    `background:${bg};color:#fff;font-family:'Nunito',sans-serif;`+
    `font-size:14px;font-weight:800;padding:12px 16px 12px 20px;border-radius:12px;`+
    `box-shadow:0 4px 24px ${shadow||'rgba(0,0,0,0.25)'};z-index:9999;`+
    `animation:toastSubir .25s ease;max-width:min(90vw,480px);text-align:left;`;
  const span = document.createElement('span');
  span.textContent = msg;
  span.style.cssText = 'flex:1;line-height:1.4;';
  toast.appendChild(span);
  const btnClose = document.createElement('button');
  btnClose.type = 'button';
  btnClose.textContent = '✕';
  btnClose.setAttribute('aria-label','Fechar aviso');
  btnClose.style.cssText =
    'background:rgba(255,255,255,0.15);border:none;color:#fff;'+
    'width:22px;height:22px;border-radius:6px;cursor:pointer;'+
    'font-size:12px;font-weight:800;line-height:1;flex:0 0 auto;';
  btnClose.onclick = () => toast.remove();
  toast.appendChild(btnClose);
  document.body.appendChild(toast);
  setTimeout(() => { if(toast.isConnected) toast.remove(); }, duration || 2500);
}

function _toastSucesso(msg){
  _showToast(msg, '#166534', 'rgba(22,163,74,0.95)', 2500);
}
function _toastErro(msg){
  _showToast(msg, '#991b1b', 'rgba(185,28,28,0.95)', 4500);
}
function _toastAviso(msg){
  _showToast(msg, '#92400e', 'rgba(217,119,6,0.95)', 4000);
}
function _toastCarregando(msg){
  _showToast(msg, '#1e3a8a', 'rgba(37,99,235,0.95)', 8000);
}

function setMsg(text, kind){
  const t = (text||"").toString();
  if(!t) return;
  if(kind === "err") _toastErro('⚠️ ' + t);
  else if(kind === "ok") _toastSucesso('✅ ' + t);

  else {

/* ── Modal de confirmação (substitui confirm() nativo) ── */
function _confirmModal({ titulo, corpo, corDestaque, textoConfirmar, textoCancelar }){
  return new Promise((resolve) => {
    const cor = corDestaque || '#b45309'; // amber-700 — padrão pra avisos
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.style.display = 'flex';
    backdrop.innerHTML =
      `<div style="background:var(--card-bg,#fff);border-radius:14px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);">`+
        `<h3 style="margin:0 0 6px;font-size:16px;font-weight:800;color:${cor};">${escapeHtml(titulo || 'Confirmar ação')}</h3>`+
        `<p style="margin:0 0 18px;font-size:13px;color:var(--muted,#6b7280);white-space:pre-line;line-height:1.5;">${corpo || ''}</p>`+
        `<div style="display:flex;justify-content:flex-end;gap:8px;">`+
          `<button type="button" class="btn ghost" id="_confirmModalCancelar">${escapeHtml(textoCancelar || 'Cancelar')}</button>`+
          `<button type="button" id="_confirmModalOk" style="padding:9px 16px;border-radius:8px;font-size:13px;font-weight:800;`+
            `background:${cor};border:1px solid ${cor};color:#fff;cursor:pointer;font-family:'Nunito',sans-serif;">`+
            `${escapeHtml(textoConfirmar || 'Continuar')}`+
          `</button>`+
        `</div>`+
      `</div>`;
    document.body.appendChild(backdrop);

    function fechar(resultado){
      backdrop.remove();
      resolve(resultado);
    }
    backdrop.querySelector('#_confirmModalOk').addEventListener('click', () => fechar(true));
    backdrop.querySelector('#_confirmModalCancelar').addEventListener('click', () => fechar(false));
    backdrop.addEventListener('click', (ev) => { if(ev.target === backdrop) fechar(false); });
  });
}

function normSerie(s){
  if(!s) return "";
  let t = String(s).trim();
  t = t.replace(/\s+/g,' ');
  t = t.replace(/^EIXO\s*([12345])$/i, "EIXO $1");
  t = t.replace(/^EIXO([12345])$/i, "EIXO $1");
  return t.toUpperCase();
}
function normText(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();

function calcIdade(dataStr){
  if(!dataStr) return "";
  const s = String(dataStr).trim();
  let d=null;
  const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  const m2 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m1){ d = new Date(+m1[3], +m1[2]-1, +m1[1]); }
  else if(m2){ d = new Date(+m2[1], +m2[2]-1, +m2[3]); }
  else { const tmp = new Date(s); if(!isNaN(tmp)) d = tmp; }
  if(!d || isNaN(d)) return "";
  const hoje = new Date();
  let idade = hoje.getFullYear() - d.getFullYear();
  const m = hoje.getMonth() - d.getMonth();
  if(m < 0 || (m === 0 && hoje.getDate() < d.getDate())) idade--;
  return (idade>=0 && idade<=130) ? String(idade) : "";
}

// Converte qualquer data reconhecida (YYYY-MM-DD, DD/MM/YYYY, etc.) para o
// formato brasileiro DD-MM-YYYY, usado em toda a exibição da página
// (lista, ficha, tabelas, PDFs e CSV). O valor ARMAZENADO continua em ISO —
// isso é só formatação de exibição, não altera o dado salvo no banco.
function formatarDataBR(dataStr){
  if(!dataStr) return "";
  const s = String(dataStr).trim();
  if(!s || s === '—') return s;
  const m1 = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);      // DD/MM/YYYY
  const m2 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);        // YYYY-MM-DD
  const m3 = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);        // já em DD-MM-YYYY
  let dd, mm, yyyy;
  if(m1){ dd=m1[1]; mm=m1[2]; yyyy=m1[3]; }
  else if(m2){ yyyy=m2[1]; mm=m2[2]; dd=m2[3]; }
  else if(m3){ dd=m3[1]; mm=m3[2]; yyyy=m3[3]; }
  else { return s; } // formato não reconhecido — exibe como veio, sem quebrar
  return `${String(dd).padStart(2,'0')}-${String(mm).padStart(2,'0')}-${yyyy}`;
}

function _normalizarAlunos(lista){

      naturalidade:   (a.naturalidade || a.NATURALIDADE || "").trim(),

      corRaca:        (a.corRaca || a["COR/RAÇA"] || a["COR OU RAÇA"] || a.cor || "").trim(),
      alunoId:        (a.alunoId || a.ALUNOID || a.id || "").trim(),
      idade:          idadeRaw || calcIdade(nasc), // calculado uma única vez no carregamento
    };
  });

function _dedupMats(arr){
  const seen = new Map();
  arr.forEach(m => {
    const key = `${m.turmaId}|${m.alunoId}|${m.anoLetivo}`;
    if(!seen.has(key)){ seen.set(key, m); }
    else { const prev = seen.get(key); if(!prev.serie && m.serie) seen.set(key, m); }
  });
  return Array.from(seen.values());
}
async function garantirMatsDoAno(ano){
  ano = String(ano || '').trim();
  if(!ano){ mats = []; return; }
  if(!_matsPorAno.has(ano)){
    const vals = isNaN(Number(ano)) ? [ano] : [ano, Number(ano)];   // anoLetivo pode estar como texto ou número
    _matsPorAno.set(ano, _dedupMats(await window.DB.anoAtivoMatriculas.whereIn('anoLetivo', vals)));
  }
  mats = _matsPorAno.get(ano);
}
async function garantirAlunos(ids){
  const falt = Array.from(new Set(ids)).filter(id => id && !_alunosCarregados.has(id));
  if(!falt.length) return;
  const lotes = [];
  for(let i = 0; i < falt.length; i += 10) lotes.push(falt.slice(i, i + 10));
  let r = [];
  for(let i = 0; i < lotes.length; i += 10){     // até 10 consultas em paralelo por onda
    const ondas = await Promise.all(lotes.slice(i, i + 10).map(l => window.DB.anoAtivoAlunos.whereIn('alunoId', l)));
    r = r.concat(ondas.flat());
  }
  alunos = alunos.concat(_normalizarAlunos(r));
  falt.forEach(id => _alunosCarregados.add(id));
}

/* Buscas por consulta (só rodam ao clicar em Pesquisar / Enter) */
async function _idsPorTexto(termo){
  const t = termo.trim();
  const dig = t.replace(/\D/g, '');
  let r = [];
  if(dig.length === 11 && /^[\d.\-\s]+$/.test(t)){            // CPF exato, com ou sem pontuação
    const fmt = dig.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    const [a, b] = await Promise.all([
      window.DB.anoAtivoAlunos.whereEquals('cpfNum', dig, { limit: 1 }),
      window.DB.anoAtivoAlunos.whereEquals('cpf', fmt, { limit: 1 })   // docs antigos sem cpfNum
    ]);
    r = [...a, ...b];
  } else {
    const nome = t.toUpperCase().replace(/\s+/g, ' ');
    if(nome.replace(/[^A-ZÀ-Ü]/g, '').length < 3) return null;
    r = await window.DB.anoAtivoAlunos.whereRange('nome', nome, nome + '\uf8ff', { limit: 50 });   // só início do nome
  }
  return new Set(r.map(x => x.alunoId || x._id));
}

function ordenarSeries(arr){
  // Categorias pedagógicas em prioridade:
  // 0 = Ed. Infantil  (G1-G5 / GRUPO 1-5)
  // 1 = EF1           (1º ANO ao 5º ANO)
  // 2 = EF2           (6º ANO ao 9º ANO)
  // 3 = Ensino Médio  (1º EM ao 3º EM)
  // 4 = EJA           (EIXO 1 ao EIXO 5)
  // 5 = Especiais     (ALFABETIZAÇÃO, MULTI, SERIADA)
  // 6 = Número genérico
  // 9 = Outros
  function key(s){
    const t = s.toUpperCase().trim();
    // Ed. Infantil: G1-G5, GRUPO 1-5
    const mG = t.match(/^G(?:RUPO\s*)?([1-5])$/);
    if(mG) return [0, Number(mG[1]), t];
    // EF1: 1º ao 5º ANO
    const mEF1 = t.match(/^([1-5])[º°O]?\s*ANO?$/);
    if(mEF1) return [1, Number(mEF1[1]), t];
    // EF2: 6º ao 9º ANO
    const mEF2 = t.match(/^([6-9])[º°O]?\s*ANO?$/);
    if(mEF2) return [2, Number(mEF2[1]), t];
    // Ensino Médio: 1EM-3EM, 1º EM, etc.
    const mEM = t.match(/^([1-3])[º°O]?\s*E\.?M\.?$/);
    if(mEM) return [3, Number(mEM[1]), t];
    // EJA: EIXO 1-5
    const mEixo = t.match(/^EIXO\s*([1-5])$/);
    if(mEixo) return [4, Number(mEixo[1]), t];
    // Especiais
    if(t === "ALFABETIZACAO" || t === "ALFABETIZAÇÃO") return [5, 0, t];
    if(t === "MULTI")   return [5, 1, t];
    if(t === "SERIADA") return [5, 2, t];
    // Fallback numérico
    const mN = t.match(/^(\d{1,2})/);
    if(mN) return [6, Number(mN[1]), t];
    return [9, 0, t];
  }
  return arr.slice().sort((a,b)=>{
    const ka=key(a), kb=key(b);
    for(let i=0;i<ka.length;i++){ if(ka[i]<kb[i]) return -1; if(ka[i]>kb[i]) return 1; }
    return 0;
  });
}

function _serieKeyDaTurma(t){
  // Pega a primeira série da turma para usar na ordenação
  const seriesArr = Array.isArray(t.series) && t.series.length ? t.series : (t.serie ? [t.serie] : []);
  return seriesArr[0] || '';
}

function sortTurmas(lista){
  const crit = currentTurmaSort;
  return lista.slice().sort((a, b) => {
    if(crit === 'serie'){
      // Usa a lógica pedagógica de ordenarSeries
      const sa = _serieKeyDaTurma(a), sb = _serieKeyDaTurma(b);
      const sorted = ordenarSeries([sa, sb]);
      if(sorted[0] !== sorted[1]) return sorted[0] === sa ? -1 : 1;
      // Desempate pelo nome da turma
      return normText(a.nome||'').localeCompare(normText(b.nome||''));
    }
    if(crit === 'nome'){
      return normText(a.nome||'').localeCompare(normText(b.nome||''));
    }
    if(crit === 'alunos'){
      return _qtdTurma(b.turmaId) - _qtdTurma(a.turmaId); // maior primeiro
    }
    if(crit === 'turno'){
      const order = ['MATUTINO','VESPERTINO','NOTURNO',''];
      const ia = order.indexOf((a.turno||'').toUpperCase()); 
      const ib = order.indexOf((b.turno||'').toUpperCase());
      const va = ia < 0 ? 99 : ia, vb = ib < 0 ? 99 : ib;
      if(va !== vb) return va - vb;
      return normText(a.nome||'').localeCompare(normText(b.nome||''));
    }
    return 0;
  });
}

function anoSelecionadoOuAtivo(){ return selAno.value || anoAtivo || ""; }

function turmasFiltradas(){
  const ano = anoSelecionadoOuAtivo();
  const setSeries = new Set(seriesSelecionadas.map(s => normSerie(s)));
  return turmas.filter(t=>{
    // Turma legada usada como "bucket" pra alunos aguardando readmissão —
    // hoje isso já é coberto pelo filtro de situação, não precisa aparecer
    // como card de turma na pesquisa. Comparação pelo turmaId fixo (mais
    // confiável que o nome, que pode variar/ter sido digitado diferente).
    if((t.turmaId||'').trim().toUpperCase() === 'TURMA_INATIVA') return false;
    // Turma inativada pelo módulo de ano ativo (cadastro-turma-ativa.html)
    // não deve aparecer na pesquisa — dado continua no banco, só some da lista.
    if((t.status||'').toString().trim().toUpperCase() === 'INATIVA') return false;
    if(!(!ano || String(t.anoLetivo) === String(ano))) return false;
    if(setSeries.size === 0) return true;
    const seriesDaTurma = new Set();
    if(Array.isArray(t.series) && t.series.length){
      t.series.forEach(s => { const n = normSerie(s); if(n) seriesDaTurma.add(n); });
    } else if(t.serie){
      String(t.serie).split(/[,;]+/).forEach(s => { const n = normSerie(s.trim()); if(n) seriesDaTurma.add(n); });
    }
    return [...setSeries].some(s => seriesDaTurma.has(s));
  });
}

function _aplicarFiltrosComuns(list){
  const turnoFiltro = _turnoFiltroAtual();
  if(turnoFiltro) list = list.filter(a => (a._turno||'').toUpperCase() === turnoFiltro);
  const modeloFiltro = _modeloFiltroAtual();
  if(modeloFiltro) list = list.filter(a => (a._modelo||'REGULAR').toUpperCase() === modeloFiltro);
  const { status: statusFiltro, situacao: situacaoFiltro, situacaoIn, semSituacao } = _statusSituacaoFiltroAtual();
  if(semSituacao) list = list.filter(a => !(a._situacao||''));
  if(statusFiltro) list = list.filter(a => (a._status||'ATIVO') === statusFiltro);
  if(situacaoFiltro) list = list.filter(a => (a._situacao||'') === situacaoFiltro);
  else if(situacaoIn) list = list.filter(a => situacaoIn.includes(a._situacao||''));

  // Pesquisa avançada — Deficiência: com a checkbox principal marcada e
  // nenhum subtipo específico selecionado, filtra QUALQUER aluno com
  // deficiencia===true. Com subtipo(s) marcado(s), filtra quem tem qualquer
  // um deles (OR entre os selecionados).
  if(document.getElementById("chkFiltroDef")?.checked){
    const subtipos = Array.from(document.querySelectorAll(".filtroDefItem:checked")).map(c=>c.value);
    list = subtipos.length
      ? list.filter(a => subtipos.some(k => a[k] === true))
      : list.filter(a => a.deficiencia === true);
  }
  // Mesma lógica para Transtornos
  if(document.getElementById("chkFiltroTrans")?.checked){
    const subtipos = Array.from(document.querySelectorAll(".filtroTransItem:checked")).map(c=>c.value);
    list = subtipos.length
      ? list.filter(a => subtipos.some(k => a[k] === true))
      : list.filter(a => a.transtorno === true);
  }
  // AEE — filtro simples de Sim/Não, sem subtipos
  if(document.getElementById("chkFiltroAee")?.checked){
    list = list.filter(a => a.aee === true);
  }

  return list;
}

function _buildMatsMap(ano){
  // Map alunoId → matrícula "atual". Um aluno pode ter mais de uma
  // matrícula no mesmo ano (ex.: encerrada na turma A + nova ativa na
  // turma B após uma readmissão) — o antigo código pegava sempre a
  // primeira que aparecesse na lista, o que fazia o status mostrado
  // depender da ordem (arbitrária) de retorno do Firestore. Agora:
  //  1) entre as matrículas do aluno NO ANO filtrado, prioriza status
  //     ATIVO;
  //  2) se não achar nenhuma do ano filtrado, cai pra qualquer matrícula
  //     do aluno (comportamento antigo, mantido como fallback);
  //  3) em empate (ex.: duas ATIVO, o que não deveria acontecer mas não
  //     travamos por isso), desempata pela mais recente.
  const porAluno = new Map();
  mats.forEach(m => {
    if(!porAluno.has(m.alunoId)) porAluno.set(m.alunoId, []);
    porAluno.get(m.alunoId).push(m);
  });

  const byAluno = new Map();
  porAluno.forEach((lista, alunoId) => {
    byAluno.set(alunoId, _matriculaAtualEntre(lista, ano));
  });
  return byAluno;
}

// Escolhe, dentre uma lista de matrículas de UM aluno, qual é "a atual".
// Usado tanto por _buildMatsMap quanto por enriquecerAlunos, pra não
// duplicar (e voltar a divergir) essa regra em dois lugares.
// Dado um turmaId e um ano, retorna 1 matrícula "atual" por aluno daquela
// turma naquele ano (usado em qualquer lugar que precise "quantos alunos"
// — badge de turma, tabela, export).
// Substituiu o antigo _apenasAtivas (que só aceitava status ATIVO): no ano
// ativo isso ainda dá prioridade à matrícula ATIVO do aluno, mas em anos
// passados — onde TODA matrícula já está INATIVO/encerrada (aprovado,
// reprovado, transferido etc.) — o filtro por status sempre dava zero.
// Reaproveitando _matriculaAtualEntre (mesma regra de "matrícula atual"
// já usada pra resolver duplicidade de readmissão) o fallback pega a mais
// recente quando não há nenhuma ATIVO, o que resolve o zero nos anos
// retroativos sem voltar a contar matrícula duplicada por aluno.
function _matsAtuaisDaTurma(turmaId, ano){
  // Resolve a matrícula "atual" de CADA aluno olhando TODAS as matrículas
  // dele naquele ano (não só as desta turma) — é o mesmo _buildMatsMap já
  // usado pra decidir status/situação exibidos. Só depois disso checa se
  // essa matrícula atual aponta pra esta turma.
  const mapaAtualPorAluno = _buildMatsMap(ano);
  const ehAnoAtivo = String(ano).trim() === String(anoAtivo).trim();
  const atuais = [];
  mapaAtualPorAluno.forEach(m => {
    if(!m || m.turmaId !== turmaId) return;
    // No ANO ATIVO, só conta o aluno na turma se a matrícula atual dele
    // estiver realmente ATIVO. Se a mais recente já foi encerrada (ex.:
    // aluno foi readmitido numa turma nova e depois essa matrícula nova
    // também foi encerrada), ele não está de fato ocupando turma nenhuma
    // agora — só aparece pendente de readmissão — então não deve contar
    // em lugar nenhum, nem na turma antiga nem na nova.
    // Em ANOS PASSADOS não aplicamos esse filtro: lá TODA matrícula já
    // está naturalmente encerrada (o ano acabou), então exigir ATIVO
    // zeraria tudo de novo — o fallback de "mais recente" do
    // _buildMatsMap já resolve a turma correta nesse caso.
    if(ehAnoAtivo && (m.status||'ATIVO').toUpperCase() !== 'ATIVO') return;
    atuais.push(m);
  });
  return atuais;
}

function _matriculaAtualEntre(lista, ano){
  if(!lista || !lista.length) return null;
  const doAno = ano ? lista.filter(m => String(m.anoLetivo) === String(ano)) : lista;
  const candidatos = doAno.length ? doAno : lista;
  const ativos = candidatos.filter(m => (m.status||'ATIVO').toUpperCase() === 'ATIVO');
  const pool = ativos.length ? ativos : candidatos;
  function ts(m){
    const t = m.encerradoEm || m.criadoEm || null;
    const d = t ? new Date(t) : null;
    return (d && !isNaN(d)) ? d.getTime() : 0;
  }
  return pool.reduce((melhor, atual) => (!melhor || ts(atual) > ts(melhor)) ? atual : melhor, null);
}

function _enriquecerComMeta(list){
  const ano = anoSelecionadoOuAtivo();
  const matsMap = _buildMatsMap(ano);
  return list.map(a => {
    const mat = matsMap.get(a.alunoId);
    return {
      ...a,
      _turno:  (mat && mat.turno)  ? mat.turno.toUpperCase()  : (a.turno||''),
      _status: (mat && mat.status) ? mat.status.toUpperCase() : 'ATIVO',
      _situacao: (mat && mat.situacao) ? mat.situacao.toUpperCase() : '',
      _situacaoRotulo: _rotuloSituacao(mat && mat.status, mat && mat.situacao),
      _modelo: (mat && mat.modelo) ? mat.modelo.toUpperCase() : 'REGULAR',
      // A foto agora vive na MATRÍCULA (anoAtivoMatriculas), não mais no
      // documento do aluno — por isso sobrescreve fotoUrl/fotoFileId aqui
      // em vez de herdar do spread de `a`. _matriculaId fica disponível
      // pra quem precisar buscar/atualizar essa matrícula depois (ex.:
      // abrirFichaAluno, mais abaixo).
      _matriculaId: (mat && mat._id) || null,
      fotoUrl:     (mat && mat.fotoUrl)    || null,
      fotoFileId:  (mat && mat.fotoFileId) || null,
    };
  });
}

function alunosFiltradosPorTurmas(turmasScope){
  const ano = anoSelecionadoOuAtivo();
  const turmaIds = new Set(turmasScope.map(t=>t.turmaId));

  // Agrupa TODAS as matrículas de cada aluno (não só as que já batem com
  // o escopo de turmas) — precisamos disso pra decidir qual é a matrícula
  // ATUAL do aluno. Antes, um aluno que já passou por outras turmas nesse
  // mesmo ano (readmissão em turma diferente, por ex.) continuava sendo
  // listado em TODAS elas pra sempre, porque qualquer registro histórico
  // de matrícula (mesmo já encerrado/substituído) bastava pra incluí-lo.
  const matsPorAluno = new Map();
  mats.forEach(m => {
    if(!matsPorAluno.has(m.alunoId)) matsPorAluno.set(m.alunoId, []);
    matsPorAluno.get(m.alunoId).push(m);
  });

  let alunoIds = new Set();
  if(mats.length){
    matsPorAluno.forEach((lista, alunoId) => {
      const atual = _matriculaAtualEntre(lista, ano);
      if(atual && turmaIds.has(atual.turmaId)) alunoIds.add(alunoId);
    });
  }
  let list = alunos.filter(a=>a.alunoId && alunoIds.has(a.alunoId));
  list = list.map(a => {
    const mat = _matriculaAtualEntre(matsPorAluno.get(a.alunoId) || [], ano);
    return { ...a, serie: mat?.serie || '', turmaId: mat?.turmaId || '' };
  });
  const _seriesFiltroSet = new Set(seriesSelecionadas.map(s => normSerie(s)));
  if(_seriesFiltroSet.size > 0) list = list.filter(a => _seriesFiltroSet.has(normSerie(a.serie)));
  list = _enriquecerComMeta(list);
  const _seen = new Set();
  list = list.filter(a => { if(_seen.has(a.alunoId)) return false; _seen.add(a.alunoId); return true; });
  return _aplicarFiltrosComuns(list);
}

function alunosFiltradosPorSeries(){
  const ano = anoSelecionadoOuAtivo();
  const seriesSel = seriesSelecionadasNorm();
  const matsPorAluno = new Map();
  mats.forEach(m => { if(!matsPorAluno.has(m.alunoId)) matsPorAluno.set(m.alunoId, []); matsPorAluno.get(m.alunoId).push(m); });
  let list = [];
  alunos.forEach(a => {
    const mat = _matriculaAtualEntre(matsPorAluno.get(a.alunoId) || [], ano);
    if(mat && (!ano || String(mat.anoLetivo) === String(ano))) list.push({ ...a, serie: mat.serie || '', turmaId: mat.turmaId || '' });
  });
  if(seriesSel.size) list = list.filter(a=>seriesSel.has(normSerie(a.serie)));
  list = _enriquecerComMeta(list);
  const _seen = new Set();
  list = list.filter(a => { if(_seen.has(a.alunoId)) return false; _seen.add(a.alunoId); return true; });
  return _aplicarFiltrosComuns(list);
}

function seriesSelecionadasNorm(){ return new Set(seriesSelecionadas.map(s=>normSerie(s))); }

function turmaIdsSelecionadasNoDOM(){
  const ids = new Set();
  document.querySelectorAll('.chkTurma').forEach(c=>{ if(c.checked) ids.add(c.dataset.turma); });
  return ids;
}

/* =========================
   Ordenação
========================= */
function sortAlunos(alunosList){
  const field = currentSortField, order = currentSortOrder;
  return alunosList.slice().sort((a, b) => {
    let valA, valB;
    if(field === 'idade'){
      valA = parseInt(a.idade || calcIdade(a.dataNascimento) || '0');
      valB = parseInt(b.idade || calcIdade(b.dataNascimento) || '0');
      if(valA !== valB) return order === 'asc' ? valA - valB : valB - valA;
    } else if(field === 'serie'){
      const sa = a.serie || '', sb = b.serie || '';
      if(sa !== sb){
        const sorted = ordenarSeries([sa, sb]);
        return order === 'asc' ? (sorted[0] === sa ? -1 : 1) : (sorted[0] === sa ? 1 : -1);
      }
      // mesma série: desempate alfabético por nome (sempre asc)
    } else {
      valA = normText(a[field] || ''); valB = normText(b[field] || '');
      if(valA !== valB) return order === 'asc' ? (valA < valB ? -1 : 1) : (valA < valB ? 1 : -1);
    }
    // desempate final sempre alfabético por nome
    return normText(a.nome || '').localeCompare(normText(b.nome || ''));
  });
}

function _bindCliqueSelecao(container, checkboxSelector){
  container.querySelectorAll('.item.selecionavel').forEach(el=>{

      // o usuário estava arrastando pra copiar algum texto do card (CPF,
      // nome, ID etc.) — só um clique "seco" em área vazia conta.
      if(e.target.closest('button, a, input, label')) return;
      if((window.getSelection()?.toString() || '').length > 0) return;
      const chk = el.querySelector(checkboxSelector);

async function _atualizarListaAlunos(_tScope){
  const tScope = _tScope || turmasFiltradas();
  const turmaIdsMarcadas = turmaIdsSelecionadasNoDOM();
  const tMarcadas = tScope.filter(t=>turmaIdsMarcadas.has(t.turmaId));
  const modo = modoFiltroAtual();
  const tok = ++_listaTok;
  const busca = _busca;
  if(!busca && modo !== "serie" && !tMarcadas.length){
    alunosOrdenados = []; countAlunos.textContent = "—";
    listaAlunos.innerHTML = `<div class="muted" style="padding:12px;">Selecione uma ou mais turmas (ou marque <b>Todos</b>) para ver os alunos.</div>`;
    return;
  }
  listaAlunos.innerHTML = `<div class="muted" style="padding:12px;">Carregando alunos…</div>`;
  try{
    const idsT = new Set(tMarcadas.map(t => t.turmaId));
    await garantirAlunos(busca ? Array.from(busca.ids) : mats.filter(m => modo === "serie" || idsT.has(m.turmaId)).map(m => m.alunoId));
  }catch(e){ console.warn('alunos:', e); _toastErro('Erro ao carregar os alunos.'); return; }
  if(tok !== _listaTok) return;   // outra seleção chegou depois
  let aScope = [];
  if(busca){
    aScope = alunosFiltradosPorSeries().filter(a => busca.ids.has(a.alunoId));
  } else if(modo === "turma"){
    aScope = alunosFiltradosPorTurmas(tMarcadas.length ? tMarcadas : tScope);
  } else if(modo === "serie"){
    aScope = alunosFiltradosPorSeries();
  } else {
    const base = alunosFiltradosPorTurmas(tMarcadas.length ? tMarcadas : tScope);
    const sset = seriesSelecionadasNorm();
    aScope = sset.size ? base.filter(a=>sset.has(normSerie(a.serie))) : base;
  }
  aScope = sortAlunos(aScope);
  alunosOrdenados = aScope;  // Salvar lista ordenada para tabela/export
  listaAlunos.innerHTML = "";
  countAlunos.textContent = aScope.length;
  if(aScope.length===0){
    listaAlunos.innerHTML = `<div class="muted">Nenhum aluno encontrado para os filtros.</div>`;
  } else {
    aScope.forEach(a=>{
      const el=document.createElement("div");

      const camposComp = [a.rg, a.certidao, a.cep, a.obs];
      const necFaltando  = camposNec.filter(v  => !v || !String(v).trim() || v === '--').length;
      const compFaltando = camposComp.filter(v => !v || !String(v).trim()).length;
      const badgeCompletude = necFaltando > 0
        ? `<span class="badge" style="background:rgba(239,68,68,0.10);border-color:rgba(239,68,68,0.35);color:#b91c1c;">🔴 Dados obrigatórios faltando</span>`
        : compFaltando > 0
          ? `<span class="badge" style="background:rgba(234,179,8,0.10);border-color:rgba(234,179,8,0.40);color:#854d0e;">⚠️ Complementares pendentes</span>`
          : `<span class="badge" style="background:rgba(22,163,74,0.10);border-color:rgba(22,163,74,0.30);color:#166534;">✅ Completo</span>`;

      // NEE badges
      const neeList = [];
      if(a.tea)            neeList.push('TEA');
      if(a.altasHabilidades) neeList.push('Altas hab.');
      if(a.defFisica)      neeList.push('Def. física');

      const neeBadge = neeList.length > 0
        ? `<span class="badge" style="background:rgba(124,58,237,0.10);border-color:rgba(124,58,237,0.30);color:#6d28d9;">♿ ${neeList.join(', ')}</span>`
        : '';
      el.innerHTML = `

          <div class="title" style="flex-direction:column;align-items:flex-start;gap:4px;">
            <span style="font-weight:800;font-size:14px;">${a.nome || "Sem nome"}</span>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              <span class="badge">${a.alunoId || "—"}</span>
              <span class="badge">📚 ${a.serie || "—"}</span>
            </div>
          </div>
          <div class="meta" style="margin-top:6px;display:block;">
            CPF: ${a.cpf||"—"} • Nasc: ${nasc} • Idade: ${idade}<br>

        <div class="right" style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">

            : ``}
          <label class="check">

            <span>Selecionar</span>

        </div>
      `;
      listaAlunos.appendChild(el);
    });
  }
  document.querySelectorAll(".chkAluno").forEach(c=>{ c.addEventListener("change", ()=>{ syncCheckAllAlunos(); }); });
  _bindCliqueSelecao(listaAlunos, '.chkAluno');
  syncCheckAllAlunos();

      if(!id) return;
      let url = `cadastro-aluno-ativo.html?editar=${encodeURIComponent(id)}`;
      if(turma) url += `&turmaId=${encodeURIComponent(turma)}`;
      if(ano)   url += `&anoLetivo=${encodeURIComponent(ano)}`;
      document.__pesquisaDestino = url;
      location.href = url;
    });
  });
  document.querySelectorAll("[data-readmitir-aluno]").forEach(btn=>{

      const id = btn.dataset.readmitirAluno;

      document.__pesquisaDestino = url;

  document.querySelectorAll("[data-view-aluno]").forEach(btn=>{

}

async function abrirFichaAluno(alunoId){
  const raw = alunosOrdenados.find(x => x.alunoId === alunoId);
  if(!raw) return;
  // A lista em memória (alunosOrdenados) só é buscada uma vez, no carregamento
  // da página — se algo mudou no Firestore depois disso (ex.: foto enviada
  // numa aba/sessão de cadastro separada), o "raw" fica desatualizado. Como a
  // ficha é justamente onde a pessoa quer ver o dado mais atual, buscamos o
  // documento do aluno fresco aqui, e mesclamos por cima do "raw" (que já traz
  // turno/status/situação calculados a partir da matrícula).
  let frescoAluno = null;
  try{ frescoAluno = await window.DB.anoAtivoAlunos.get(alunoId); }catch(e){ /* segue só com o raw */ }
  console.log('[ficha-aluno] doc fresco do Firestore (aluno):', frescoAluno);

  // A FOTO não vem mais do documento do aluno — vive na matrícula
  // (anoAtivoMatriculas), específica desta matrícula/ano. Busca ela à
  // parte, usando o _matriculaId que _enriquecerComMeta já calculou pro
  // "raw". Sem isso, a ficha mostraria a foto salva no carregamento da
  // página em vez da mais recente.
  let frescoMat = null;
  if(raw._matriculaId){
    try{ frescoMat = await window.DB.anoAtivoMatriculas.get(raw._matriculaId); }catch(e){ /* segue só com o raw */ }
  }
  console.log('[ficha-aluno] doc fresco do Firestore (matrícula, foto):', frescoMat);

  const base = {
    ...raw,
    ...(frescoAluno || {}),
    // Sobrescreve por último: frescoAluno pode trazer fotoUrl/fotoFileId
    // antigos (campo legado em anoAtivoAlunos, ainda não migrado/apagado —
    // ver TAREFA de migração) e não queremos que eles pisem na foto real
    // desta matrícula.
    fotoUrl:    (frescoMat && frescoMat.fotoUrl)    ?? raw.fotoUrl    ?? null,
    fotoFileId: (frescoMat && frescoMat.fotoFileId) ?? raw.fotoFileId ?? null,
  };
  // alunosOrdenados só passa por _enriquecerComMeta (turno/status/modelo);
  // aqui garantimos também o cálculo de _neeResumo/etc via enriquecerAlunos.
  const a = enriquecerAlunos([base])[0];

  const fotoHtml = a.fotoUrl
    ? `<img src="${escapeHtml(a.fotoUrl)}" alt="Foto do aluno" style="width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--line);" onerror="this.replaceWith(Object.assign(document.createElement('div'),{innerHTML:'🧑',style:'width:56px;height:56px;border-radius:50%;flex-shrink:0;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--line);'}))">`
    : `<div style="width:56px;height:56px;border-radius:50%;flex-shrink:0;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--line);">🧑</div>`;

  const cabecalho = `
    <div style="margin-bottom:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--chip-bg);display:flex;align-items:center;gap:12px;">
      ${fotoHtml}
      <div>
        <b>${escapeHtml(a.nome || 'Sem nome')}</b> &nbsp;•&nbsp; ID: ${escapeHtml(a.alunoId||'—')}
        &nbsp;•&nbsp; Situação: ${escapeHtml(a._situacaoRotulo || _rotuloSituacao(a._status, a._situacao))}
      </div>
    </div>`;

  // Turma e professor(a) desta matrícula — vêm do cadastro de turmas, não do
  // objeto do aluno em si.
  const turmaDaFicha = turmas.find(t => t.turmaId === a.turmaId) || null;
  a._turmaNome     = turmaDaFicha?.nome      || '—';
  a._professorNome = turmaDaFicha?.professor || '—';

  const camposExtras = [
    {key:'_turmaNome',     label:'TURMA'},
    {key:'_professorNome', label:'PROFESSOR(A)'},
    {key:'rgOrgao', label:'RG - ÓRGÃO EMISSOR'},
    {key:'pais',    label:'PAÍS'},
    {key:'obs',     label:'OBSERVAÇÕES'},
  ];

  const campos = [...COLS.filter(c => c.key !== '_neeResumo' && c.key !== 'profissionalApoioNome'), ...camposExtras].map(c => {
    let v = a[c.key] ?? '';
    if(c.key === 'idade')          v = v || calcIdade(a.dataNascimento) || '';
    if(c.key === 'dataNascimento') v = formatarDataBR(v);
    if(c.key === 'corRaca' && !v) v = 'Não declarada';
    if(c.key === 'pais'    && !v) v = 'BR';
    return `<div style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;">
      <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">${c.label}</div>
      <div style="font-size:13px;margin-top:2px;">${escapeHtml(String(v || '—'))}</div>
    </div>`;
  }).join('');

  const docsPlaceholderId = `docsFicha_${alunoId.replace(/[^a-zA-Z0-9_-]/g,'')}`;

  const rows = `${cabecalho}
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;">${campos}</div>
    <div style="margin-top:16px;">
      <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">NEE / Transtornos</div>
      ${montarNeeDetalhado(a)}
      <div style="font-size:13px;margin-top:8px;"><b>Profissional de apoio:</b> ${escapeHtml(a.profissionalApoioNome || '—')}</div>
    </div>
    <div style="margin-top:16px;">
      <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">Documentos</div>
      <div id="${docsPlaceholderId}" style="font-size:13px;color:var(--muted);">Carregando documentos…</div>
    </div>
  `;
  abrirModal('Ficha do aluno', rows);
  carregarDocsFicha(alunoId, docsPlaceholderId);
}

function montarNeeDetalhado(a){
  const itens = [];
  if(a.tea)              itens.push('🧩 TEA');
  if(a.altasHabilidades) itens.push('⭐ Altas habilidades / superdotação');
  if(a.defFisica)        itens.push('♿ Deficiência física');
  if(a.defIntelectual)   itens.push('🧠 Deficiência intelectual');
  if(a.defVisual)        itens.push('👁️ Deficiência visual' + (a.defVisualTipo ? ` (${a.defVisualTipo})` : ''));
  if(a.defAuditiva)      itens.push('👂 Deficiência auditiva / surdez' + (a.defAuditivaTipo ? ` (${a.defAuditivaTipo})` : ''));
  if(a.discalculia)      itens.push('🔢 Discalculia / raciocínio lógico-matemático');

async function carregarDocsFicha(alunoId, targetId){
  const el = document.getElementById(targetId);
  if(!el) return;
  try{
    const resp = await fetch(`/api/drive-list?alunoId=${encodeURIComponent(alunoId)}`);
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'Erro ao buscar documentos');
    // A foto de perfil vive na mesma pasta do Cloudinary, mas tem exibição
    // própria no cabeçalho da ficha — não deve aparecer aqui como documento.
    const files = data.files || [];
    if(!files.length){
      el.innerHTML = `<div style="font-size:13px;color:var(--muted);">Nenhum documento anexado</div>`;
      return;
    }
    el.innerHTML = files.map(f => {
      const icon = (f.mimeType||'').startsWith('image/') ? '🖼️' : '📄';
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);">
        <span>${icon}</span>
        <span style="flex:1;font-size:13px;">${escapeHtml(f.label||f.fileName)}</span>
        <a href="${f.webViewLink}" target="_blank" rel="noopener" style="font-size:12px;font-weight:800;color:var(--brand);text-decoration:none;">👁️ Ver</a>
      </div>`;
    }).join('');
  }catch(e){
    el.innerHTML = `<div style="font-size:13px;color:#b91c1c;">Erro ao carregar documentos.</div>`;
  }
}

function enriquecerAlunos(lista){
  const ano = anoSelecionadoOuAtivo();
  const _mpa = new Map();
  mats.forEach(m => { if(!_mpa.has(m.alunoId)) _mpa.set(m.alunoId, []); _mpa.get(m.alunoId).push(m); });
  return lista.map(a => {
    const matsDoAluno = _mpa.get(a.alunoId) || [];
    const matMeta = _matriculaAtualEntre(matsDoAluno, ano);
    const matSerie = (!a.serie) ? matMeta : null;
    // turmaId: usa o da matrícula do ano correto se existir, senão mantém o que vier no objeto
    const turmaIdResolvido = (matMeta && matMeta.turmaId) ? matMeta.turmaId : (a.turmaId || '');
    const neeItens = [];
    if(a.tea)              neeItens.push('TEA');
    if(a.altasHabilidades) neeItens.push('Altas hab.');
    if(a.defFisica)        neeItens.push('Def. física');
    if(a.defIntelectual)   neeItens.push('Def. intelectual');
    if(a.defVisual)        neeItens.push(a.defVisualTipo    || 'Def. visual');
    if(a.defAuditiva)      neeItens.push(a.defAuditivaTipo  || 'Def. auditiva');
    if(a.tdah)             neeItens.push('TDAH');
    if(a.tpac)             neeItens.push('TPAC');
    if(a.dislexia)         neeItens.push('Dislexia');
    if(a.discalculia)      neeItens.push('Discalculia');
    if(a.disgrafia)        neeItens.push('Disgrafia');
    if(a.dislalia)         neeItens.push('Dislalia');

    return {
      ...a,
      serie:      matSerie ? (matSerie.serie || a.serie) : a.serie,
      turmaId:    turmaIdResolvido,
      _turno:     (matMeta && matMeta.turno)  ? matMeta.turno.toUpperCase()  : (a.turno  || ''),
      _status:    (matMeta && matMeta.status) ? matMeta.status.toUpperCase() : 'ATIVO',
      _situacao:  (matMeta && matMeta.situacao) ? matMeta.situacao.toUpperCase() : '',
      _situacaoRotulo: _rotuloSituacao(matMeta && matMeta.status, matMeta && matMeta.situacao),
      _modelo:    (matMeta && matMeta.modelo) ? matMeta.modelo.toUpperCase() : 'REGULAR',
      _neeResumo: neeItens.join(', ') || '—',
    };
  });
}

// Valor de EXIBIÇÃO de uma célula (mesmas regras especiais que já existiam
// nas tabelas estáticas: idade calculada, data em BR, cor/raça padrão, e
// agora também série(s) de turma, que vem como array).
function _tabInterativaValor(col, row){
  let v = row[col.key] ?? "";
  if(col.key === "idade") v = v || calcIdade(row.dataNascimento) || "";
  if(col.key === "dataNascimento") v = formatarDataBR(v);
  if(col.key === "corRaca" && !v) v = "Não declarada";
  if(col.key === "series" && Array.isArray(row.series)) v = row.series.join(", ");
  return v;
}

// Valor de ORDENAÇÃO — precisa ser diferente do valor de exibição em alguns
// casos (data de nascimento ordena pelo ISO original, não pelo DD-MM-YYYY
// exibido; campos numéricos ordenam como número, não como texto).
function _tabInterativaSortVal(col, row){
  if(col.key === "dataNascimento") return row.dataNascimento || "";
  if(col.key === "idade") return Number(row.idade || calcIdade(row.dataNascimento) || 0);
  if(["_qtdAlunos","_qtdIntegral","_qtdRegular","anoLetivo"].includes(col.key)) return Number(row[col.key] || 0);
  return normText(String(_tabInterativaValor(col, row) ?? ""));
}

function _tabInterativaRenderTabela(){
  const cols = _tabInterativa.colunas.filter(c => !_tabInterativa.ocultas.has(c.key));
  if(!cols.length) return `<div class="muted" style="padding:20px;text-align:center;">Nenhuma coluna visível — marque ao menos uma em "☰ Colunas".</div>`;

  const headers = cols.map(c => {
    const ativo = _tabInterativa.sortKey === c.key;
    const seta = ativo ? (_tabInterativa.sortDir === 1 ? " ▲" : " ▼") : "";
    return `<th data-key="${c.key}" style="cursor:pointer;white-space:nowrap;user-select:none;${ativo ? "color:var(--brand,#7c3aed);" : ""}">${escapeHtml(c.label)}${seta}</th>`;
  }).join("");

  let linhas = _tabInterativa.linhas;
  if(_tabInterativa.sortKey){
    const col = _tabInterativa.colunas.find(c => c.key === _tabInterativa.sortKey);
    linhas = linhas.slice().sort((a,b) => {
      const va = _tabInterativaSortVal(col, a), vb = _tabInterativaSortVal(col, b);
      if(typeof va === "number" && typeof vb === "number") return (va - vb) * _tabInterativa.sortDir;
      return String(va).localeCompare(String(vb), 'pt-BR') * _tabInterativa.sortDir;
    });
  }

  const body = linhas.map(row => {
    const tds = cols.map(c => `<td>${escapeHtml(String(_tabInterativaValor(c, row) ?? ""))}</td>`).join("");
    return `<tr>${tds}</tr>`;
  }).join("");

  return `<div style="overflow:auto;max-height:60vh;border:1px solid var(--card-border);border-radius:8px;">
    <table style="min-width:100%;"><thead style="position:sticky;top:0;background:var(--card-bg);z-index:2;"><tr>${headers}</tr></thead>
    <tbody>${body}</tbody></table>
  </div>`;
}

// Recria só o conteúdo da tabela (ordenação/colunas), preservando a posição
// de rolagem horizontal/vertical que o usuário já tinha — sem isso, cada
// clique num cabeçalho jogava o scroll de volta pro início, obrigando a
// rolar de novo pra ver a coluna que acabou de ordenar.
function _tabInterativaAtualizarTabela(){
  const wrap = document.getElementById("tabInterativaTabelaWrap");
  const scrollDivAntigo = wrap.querySelector(":scope > div");
  const scrollLeft = scrollDivAntigo ? scrollDivAntigo.scrollLeft : 0;
  const scrollTop  = scrollDivAntigo ? scrollDivAntigo.scrollTop  : 0;

  wrap.innerHTML = _tabInterativaRenderTabela();

  const scrollDivNovo = wrap.querySelector(":scope > div");
  if(scrollDivNovo){ scrollDivNovo.scrollLeft = scrollLeft; scrollDivNovo.scrollTop = scrollTop; }

  _tabInterativaLigarEventosTabela();
}

function _tabInterativaLigarEventosTabela(){
  document.querySelectorAll("#tabInterativaTabelaWrap th[data-key]").forEach(th=>{
    th.addEventListener("click", ()=>{
      const key = th.dataset.key;
      if(_tabInterativa.sortKey === key) _tabInterativa.sortDir *= -1;
      else { _tabInterativa.sortKey = key; _tabInterativa.sortDir = 1; }
      _tabInterativaAtualizarTabela();
    });
  });
}

function _tabInterativaLigarEventos(headerExtraHtml){
  const btnCol = document.getElementById("btnTabInterativaColunas");

    chk.addEventListener("change", ()=>{
      const key = chk.dataset.key;
      if(chk.checked) _tabInterativa.ocultas.delete(key); else _tabInterativa.ocultas.add(key);

    _tabInterativa.ocultas.clear();
    _tabInterativaRenderCompleto(headerExtraHtml);

  document.getElementById("btnTabInterativaOcultarTudo").addEventListener("click", ()=>{
    _tabInterativa.colunas.forEach(c => _tabInterativa.ocultas.add(c.key));

  _tabInterativaLigarEventosTabela();
}

function _ordenarAlunosPedagogico(lista){
  return lista.slice().sort((a, b) => {

// Desenha cabeçalho institucional no topo do doc; retorna o Y final
function _desenharCabecalhoEscola(doc, escola, titulo, pageWidth){
  const L = 28, R = pageWidth - 28;
  let y = 20;

  // Escudo
  let logoW = 0;
  if(escola && escola.escudo){
    try{
      const imgW = 48, imgH = 48;
      doc.addImage(escola.escudo, 'PNG', L, y, imgW, imgH);
      logoW = imgW + 10;
    }catch(_){}
  }

  const tx = L + logoW;
  if(escola && escola.nome){
    doc.setFontSize(13); doc.setFont(undefined,"bold"); doc.setTextColor(11,63,191);
    doc.text(escola.nome.toUpperCase(), tx, y + 13);
    doc.setFont(undefined,"normal"); doc.setTextColor(60);
    let subY = y + 24;
    const partes = [];
    if(escola.endereco) partes.push(escola.endereco);
    const cidade = [escola.cidade||escola.municipio, escola.uf||escola.UF].filter(Boolean).join('/');
    if(cidade) partes.push(cidade);
    if(escola.inep||escola.codigoInep) partes.push(`INEP: ${escola.inep||escola.codigoInep}`);
    if(escola.email) partes.push(`E-mail: ${escola.email}`);
    if(escola.telefone||escola.tel) partes.push(`Tel: ${escola.telefone||escola.tel}`);
    if(partes.length){
      doc.setFontSize(8);
      const linha = doc.splitTextToSize(partes.join('  •  '), R - tx - 10);
      doc.text(linha, tx, subY);
      subY += linha.length * 10;
    }
    y = Math.max(y + 50, subY + 4);
  } else {
    y = y + (logoW ? 52 : 0);
  }

  // Linha separadora
  doc.setDrawColor(11,63,191); doc.setLineWidth(1.2);
  doc.line(L, y, R, y);
  y += 8;

  // Título do relatório
  doc.setFontSize(11); doc.setFont(undefined,"bold"); doc.setTextColor(20);
  doc.text(titulo, L, y + 8);
  doc.setFont(undefined,"normal"); doc.setTextColor(0);
  y += 18;

  return y;
}

// Monta nome de arquivo: [prefixo]_[escola]_[DD-MM-AAAA]
function _buildFilename(prefixo, escola){
  const hoje = new Date();
  const d = String(hoje.getDate()).padStart(2,'0');
  const m = String(hoje.getMonth()+1).padStart(2,'0');
  const a = hoje.getFullYear();

  // Usa exatamente a mesma lógica do header-logic.js: matched.displayName
  function _getSchoolDisplayName(){
    try{
      const s = window.Auth?.getSession?.();
      if(!s) return null;
      if(s.schoolName) return s.schoolName;     // usuário comum: o Auth já grava o nome na sessão
      const sid = window.Auth?.getActiveSchoolId?.() || '';
      const m = (window.Auth?.listSchools?.() || []).find(x => String(x.schoolId || x.id || '') === sid);
      return m ? String(m.displayName || m.name || m.nome || '').trim() : null;
    }catch(_){ return null; }
  }

  const rawName = _getSchoolDisplayName() || (escola && escola.nome) || '';
  const nomeEscola = rawName
    ? rawName.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .toUpperCase().replace(/[^\w\d]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'').slice(0,40)
    : '';
  const partes = [prefixo, nomeEscola, `${d}-${m}-${a}`].filter(Boolean);
  return partes.join('_') + '.pdf';
}

function exportTurmasPdf(titulo, turmasList){
  if(!turmasList.length){ setMsg("Nenhuma turma selecionada para exportar.", "warn"); return; }
  const { jsPDF } = window.jspdf || {};

  _carregarDadosEscola().then(escola => {
    const doc = new jsPDF({orientation:"l", unit:"pt", format:"a4"});
    const pw = doc.internal.pageSize.getWidth();
    const startY = _desenharCabecalhoEscola(doc, escola, titulo, pw);
    const ano = anoSelecionadoOuAtivo();
    const head = [COLS_TURMAS.map(c => c.label)];
    const body = turmasList.map(t => {
      const matsT = _matsAtuaisDaTurma(t.turmaId, ano);
      const qtd = matsT.length, qtdI = matsT.filter(m => (m.modelo||'').toUpperCase() === 'INTEGRAL').length;
      const seriesTxt = Array.isArray(t.series) ? t.series.join(", ") : (t.serie || "—");
      return COLS_TURMAS.map(col => {
        if(col.key==="_qtdAlunos")  return String(qtd);
        if(col.key==="_qtdIntegral") return String(qtdI);
        if(col.key==="_qtdRegular")  return String(qtd-qtdI);
        if(col.key==="series")       return seriesTxt;
        return String(t[col.key] ?? "");
      });
    });
    doc.autoTable({ head, body, startY, ..._TABLE_STYLES_TURMAS });
    doc.save(_buildFilename('Turmas', escola));
  });
}

// Export separado por turma
function exportPdfPorTurma(titulo, alunosList){
  if(!alunosList.length){ setMsg("Nenhum aluno selecionado para exportar.", "warn"); return; }
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF){ setMsg("Falha ao carregar jsPDF.", "err"); return; }
  _carregarDadosEscola().then(escola => {
    const doc = new jsPDF({orientation:"l", unit:"pt", format:"a4"});
    const pw = doc.internal.pageSize.getWidth();

    // Agrupar por turmaId
    const grupos = [];
    const idxTurma = new Map();
    alunosList.forEach(a => {
      const tid = a.turmaId || '__sem_turma__';
      if(!idxTurma.has(tid)){ idxTurma.set(tid, grupos.length); grupos.push({ turmaId: tid, alunos: [] }); }
      grupos[idxTurma.get(tid)].alunos.push(a);
    });

    // Ordenar grupos pela serie pedagogica da turma
    grupos.sort((ga, gb) => {
      const ta = turmas.find(t => t.turmaId === ga.turmaId);
      const tb = turmas.find(t => t.turmaId === gb.turmaId);
      const sa = ta ? (_serieKeyDaTurma(ta) || ga.alunos[0]?.serie || '') : (ga.alunos[0]?.serie || '');
      const sb = tb ? (_serieKeyDaTurma(tb) || gb.alunos[0]?.serie || '') : (gb.alunos[0]?.serie || '');
      const ord = ordenarSeries([sa, sb]);
      if(ord[0] !== ord[1]) return ord[0] === sa ? -1 : 1;
      const na = ta ? normText(ta.nome||'') : '';
      const nb = tb ? normText(tb.nome||'') : '';
      return na.localeCompare(nb);
    });

    grupos.forEach((g, i) => {
      // Ordenar alunos do grupo: série pedagógica primeiro, depois nome alfabético
      g.alunos.sort((a, b) => {
        const sa = normSerie(a.serie)||'', sb = normSerie(b.serie)||'';
        if(sa !== sb){ const ord = ordenarSeries([sa, sb]); return ord[0] === sa ? -1 : 1; }
        return normText(a.nome||'').localeCompare(normText(b.nome||''));
      });
      if(i > 0) doc.addPage();

      // Redesenha cabeçalho institucional em cada página
      let y = _desenharCabecalhoEscola(doc, escola, titulo, pw);

      const turma = turmas.find(t => t.turmaId === g.turmaId);
      const nomeTurma = turma ? (turma.nome || `Turma ${turma.serie||''}`) : 'Sem turma';
      const serTxt = turma ? (Array.isArray(turma.series) ? turma.series.join(', ') : (turma.serie||'')) : '';
      const meta = [
        serTxt            ? `Série(s): ${serTxt}`    : '',
        turma?.anoLetivo  ? `Ano: ${turma.anoLetivo}` : '',
        turma?.turno      ? `Turno: ${turma.turno}`   : '',
        turma?.professor  ? `Prof.: ${turma.professor}` : '',
        `${g.alunos.length} aluno(s)`,
      ].filter(Boolean).join('   •   ');

      // Bloco azul da seção de turma
      const bX = 20, bW = pw - 40, bH = 28;
      doc.setFillColor(11, 63, 191);
      doc.roundedRect(bX, y, bW, bH, 3, 3, 'F');
      doc.setFontSize(10); doc.setFont(undefined,'bold'); doc.setTextColor(255);
      doc.text(nomeTurma.toUpperCase(), bX + 10, y + 11);
      doc.setFontSize(7.5); doc.setFont(undefined,'normal');
      doc.text(meta, bX + 10, y + 22);
      y += bH + 6;

      doc.autoTable({ head:[COLS_ESSENCIAIS.map(c=>c.label)], body:_bodyAlunos(g.alunos, COLS_ESSENCIAIS), startY: y, ..._TABLE_STYLES_ESSENCIAIS });
    });

    doc.save(_buildFilename('Turma', escola));
  });
}

// Export CSV completo — TODOS os campos (os 20 de COLS), sem formatação
// nenhuma, pra quem precisa conferir dado a dado ou importar em outro

function exportCsvCompleto(alunosList){
  if(!alunosList.length){ setMsg("Nenhum aluno selecionado para exportar.", "warn"); return; }
  const linhas = [COLS.map(c => c.label), ..._bodyAlunos(alunosList, COLS)];
  const csv = linhas
    .map(cols => cols.map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(';'))
    .join('\r\n');
  _carregarDadosEscola().then(escola => {
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });

// Ficha individual — uma página por aluno, TODOS os dados em formato de
// ficha (rótulo: valor), pra imprimir/arquivar um aluno de cada vez.
function _fetchImagemComoDataUrl(url){
  return fetch(url)
    .then(r => r.blob())
    .then(blob => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload  = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    }))
    .catch(() => null); // sem foto ou falha de rede — ficha segue sem ela
}

function exportFichasIndividuais(titulo, alunosList){
  if(!alunosList.length){ setMsg("Nenhum aluno selecionado para exportar.", "warn"); return; }
  const { jsPDF } = window.jspdf || {};
  if(!jsPDF){ setMsg("Falha ao carregar jsPDF.", "err"); return; }
  _carregarDadosEscola().then(async escola => {
    // Busca todas as fotos em paralelo antes de montar as páginas
    const comFoto = alunosList.filter(a => a.fotoUrl);
    const pares = await Promise.all(comFoto.map(a => _fetchImagemComoDataUrl(a.fotoUrl)));
    const fotoDataUrls = {};
    comFoto.forEach((a, i) => { if(pares[i]) fotoDataUrls[a.alunoId] = pares[i]; });

    const doc = new jsPDF({orientation:"p", unit:"pt", format:"a4"});
    const pw = doc.internal.pageSize.getWidth();

    const secoes = [
      { titulo: 'Identificação', campos: [
        ['Nome', 'nome'], ['Série', 'serie'], ['CPF', 'cpf'],
        ['Nascimento', 'dataNascimento'], ['Idade', '_idadeCalc'],
        ['Sexo', 'sexo'], ['Cor/Raça', 'corRaca'], ['Naturalidade', 'naturalidade'],
        ['RG', 'rg'], ['Certidão de nascimento', 'certidao'],
      ]},
      { titulo: 'Filiação', campos: [ ['Mãe', 'mae'], ['Pai', 'pai'] ] },
      { titulo: 'Matrícula', campos: [
        ['Turma', '_turmaNome'], ['Professor(a)', '_professorNome'],
        ['Turno', '_turno'], ['Modelo', '_modelo'],
        ['Situação', '_situacaoRotulo'],
      ]},
      { titulo: 'Endereço', campos: [
        ['País', 'pais'], ['Zona', 'zona'], ['CEP', 'cep'],
        ['Logradouro', 'logradouro'], ['UF', 'endUF'], ['Cidade', 'cidade'],
      ]},
    ];

    alunosList.forEach((a, i) => {
      if(i > 0) doc.addPage();
      a._idadeCalc = a.idade || calcIdade(a.dataNascimento) || '';
      const turmaDaFicha = turmas.find(t => t.turmaId === a.turmaId) || null;
      a._turmaNome     = turmaDaFicha?.nome      || '—';
      a._professorNome = turmaDaFicha?.professor || '—';
      let y = _desenharCabecalhoEscola(doc, escola, titulo, pw);

      const bX = 20, bW = pw - 40, colW = bW / 2;
      const fotoDataUrl = fotoDataUrls[a.alunoId];
      const fotoSize = 100; // 2,5x do tamanho antigo (40pt)
      const bannerW = fotoDataUrl ? bW - fotoSize - 10 : bW;

      // Faixa com o nome do aluno em destaque (encolhe se houver foto)
      doc.setFillColor(11, 63, 191);
      doc.roundedRect(bX, y, bannerW, 26, 3, 3, 'F');
      doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.setTextColor(255);
      doc.text((a.nome||'—').toUpperCase(), bX + 10, y + 17, { maxWidth: bannerW - 20 });

      if(fotoDataUrl){
        try{
          // Alinhada pelo topo com a faixa do nome (antes era centralizada
          // com um offset fixo de -7, pensado pra quando a foto era do
          // mesmo tamanho da faixa — com a foto maior que a faixa agora,
          // top-align fica mais previsível).
          doc.addImage(fotoDataUrl, 'JPEG', bX + bannerW + 10, y, fotoSize, fotoSize, undefined, 'FAST');
        }catch(e){ /* imagem corrompida/formato inesperado — segue sem travar a ficha */ }
      }
      // Reserva o maior entre a faixa (26pt) e a foto (fotoSize), senão a
      // foto grande invadiria a seção "Identificação" logo abaixo.
      y += Math.max(26, fotoDataUrl ? fotoSize : 0) + 14;

      secoes.forEach(sec => {
        doc.setFontSize(9.5); doc.setFont(undefined,'bold'); doc.setTextColor(11,63,191);
        doc.text(sec.titulo.toUpperCase(), bX, y);
        y += 4;
        doc.setDrawColor(210,220,240); doc.setLineWidth(0.6);
        doc.line(bX, y, bX + bW, y);
        y += 14;

        doc.setFontSize(9); doc.setTextColor(30,30,50);
        for(let idx=0; idx<sec.campos.length; idx+=2){
          // Primeiro calculamos quantas linhas cada valor da linha vai ocupar
          // (nomes muito longos, como o de alguns professores, podem quebrar
          // em 2+ linhas) para então desenhar tudo com a MESMA altura de
          // linha — assim a 2ª linha de um campo nunca invade o campo vizinho
          // de baixo.
          const desenhos = [];
          let maxLinhas = 1;
          for(let c=0; c<2; c++){
            const campo = sec.campos[idx+c];
            if(!campo) continue;
            const [label, key] = campo;
            const valorBruto = key === 'dataNascimento' ? formatarDataBR(a[key]) : a[key];
            const valor = String(valorBruto ?? '').trim() || '—';
            const colX = bX + c * colW;
            const labelW = doc.getTextWidth(`${label}: `);
            const availW = colW - labelW - 14;
            doc.setFont(undefined,'normal');
            const linhas = doc.splitTextToSize(valor, availW);
            maxLinhas = Math.max(maxLinhas, linhas.length);
            desenhos.push({ label, colX, labelW, linhas });
          }
          desenhos.forEach(d => {
            doc.setFont(undefined,'bold');
            doc.text(`${d.label}:`, d.colX, y);
            doc.setFont(undefined,'normal');
            doc.text(d.linhas, d.colX + d.labelW + 2, y);
          });
          y += 16 + (maxLinhas - 1) * 11;
        }
        y += 12;
      });

      // NEE / Transtornos
      doc.setFontSize(9.5); doc.setFont(undefined,'bold'); doc.setTextColor(11,63,191);
      doc.text('NEE / TRANSTORNOS', bX, y);
      y += 4;
      doc.setDrawColor(210,220,240); doc.setLineWidth(0.6);
      doc.line(bX, y, bX + bW, y);
      y += 14;
      doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.setTextColor(30,30,50);
      const neeTxt = (a._neeResumo && a._neeResumo !== '—') ? a._neeResumo : 'Nenhuma';
      const neeLinhas = doc.splitTextToSize(neeTxt, bW);
      doc.text(neeLinhas, bX, y);
      y += neeLinhas.length * 11 + 12;

      doc.setFont(undefined,'bold');
      doc.text('Profissional de apoio:', bX, y);
      const labelApoioW = doc.getTextWidth('Profissional de apoio: ');
      doc.setFont(undefined,'normal');
      doc.text(a.profissionalApoioNome || '—', bX + labelApoioW + 2, y, { maxWidth: bW - labelApoioW - 14 });
    });

    doc.save(_buildFilename('Fichas', escola));
  });
}

      meta.nome      ? `<b>Turma:</b> ${escapeHtml(meta.nome)}`                 : "",
      serTxt         ? `<b>Série(s):</b> ${escapeHtml(serTxt)}`                  : "",
      meta.anoLetivo ? `<b>Ano letivo:</b> ${escapeHtml(String(meta.anoLetivo))}` : "",
      meta.turno     ? `<b>Turno:</b> ${escapeHtml(meta.turno)}`                 : "",
      meta.professor ? `<b>Professor(a):</b> ${escapeHtml(meta.professor)}`      : "",
    ].filter(Boolean);
    headerExtraHtml = `<div style="margin-bottom:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--chip-bg);font-size:13px;line-height:1.8;">${linhas.join(" &nbsp;|&nbsp; ")}</div>`;
  }
  abrirTabelaInterativa("Tabela • Alunos selecionados", COLS, aSel, headerExtraHtml);
});
