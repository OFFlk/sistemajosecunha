<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/icon.png" type="image/png"/>

<!-- Tema antecipado (evita flash de tema errado) -->
<script>
(function(){
  const saved = (localStorage.getItem('ui_theme_v1') || '').toLowerCase();
  const theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<!-- Loading: antes dos scripts globais (seção 18.1 do guia) -->
<script src="/loading-overlay.js"></script>

<!-- Scripts globais (esta página não carrega theme-colors.js: ninguém logado) -->
<script src="/auth.firebase.js"></script>

<!-- Fonte -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- CSS globais (ordem fixa) -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/components.css">

<title>Login — Sistema Escolar</title>
<style>
/* Sigla desta página: lg (nenhuma variável própria é necessária). */

/* ── EXCEÇÃO: cor de marca padrão ──
   Como esta página não carrega theme-colors.js (ninguém logado ainda pra ter
   cor personalizada), o roxo padrão é definido aqui, claro e escuro (-d) ao
   mesmo tempo. É a única coisa que esta página declara no :root. */
:root {
  --brand:          #7c3aed;
  --brand-hover:    #6d28d9;
  --brand-faded:    #f5f3ff;
  --brand-border:   #ddd6fe;
  --brand-text:     #6d28d9;
  --brand-fg:       #ffffff;
  --brand-d:        #7c3aed;
  --brand-hover-d:  #6d28d9;
  --brand-faded-d:  rgba(124,58,237,0.20);
  --brand-border-d: #7c3aed;
  --brand-text-d:   #c4b5fd;
  --brand-fg-d:     #ffffff;
}

/* ── Layout ── */
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
body > .l-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
body > .theme-toggle { position: fixed; top: 18px; right: 18px; z-index: 50; }
body > .card { width: 100%; max-width: 420px; --card-pad-y: 40px; --card-pad-x: 36px; --card-gap: 0; }

/* ── Logo ── */
.lg-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
.lg-mark {
  width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
  background: var(--ui-brand-faded); color: var(--ui-brand-text);
  border: 1px solid var(--ui-brand-border);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px;
}
.lg-logo h1 { font-size: 18px; font-weight: 800; color: var(--title-color); letter-spacing: -0.2px; }
.lg-logo p  { font-size: 12px; color: var(--ui-muted); margin-top: 3px; }

/* ── Formulário ── */
#avisoUrl { margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; min-width: 0; }
#btnEmail, #btnGoogle { width: 100%; justify-content: center; }
.google-icon { width: 20px; height: 20px; flex-shrink: 0; }

.lg-ou { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--ui-muted); font-size: 13px; }
.lg-ou::before, .lg-ou::after { content: ''; flex: 1; height: 1px; background: var(--ui-border); }

.lg-links { margin-top: 24px; text-align: center; }
.lg-links a { color: var(--ui-brand-text); font-weight: 800; text-decoration: none; }

/* ── Spinner do botão (segue a cor do texto do botão) ── */
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: -3px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="l-bar"></div>

<button class="theme-toggle" id="themeToggle" type="button">
  <span id="themeIcon">🌙</span><span id="themeText">Escuro</span>
</button>

<div class="card">
  <div class="lg-logo">
    <div class="lg-mark">SE</div>
    <div>
      <h1>Sistema Escolar</h1>
      <p>Acesse com sua conta</p>
    </div>
  </div>

  <div class="aviso-warn" id="avisoUrl" hidden></div>

  <div class="field">
    <label for="inputEmail">E-mail</label>
    <input type="email" id="inputEmail" placeholder="seu@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label for="inputPassword">Senha</label>
    <input type="password" id="inputPassword" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn primary" id="btnEmail" type="button">Entrar</button>

  <div class="lg-ou">ou</div>

  <button class="btn neutral" id="btnGoogle" type="button">
    <!-- Logo do Google: cores oficiais da marca, não seguem o tema -->
    <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Entrar com Google
  </button>

  <p class="help lg-links">Não tem conta? <a href="cadastro_usuario.html">Criar cadastro</a></p>
</div>

<!-- SCRIPT — Helpers padrão do sistema (toast) -->
<script>
// ── Toasts (visual em components.css: .toast .toast-ok|err|warn|loading) ──
const _TOAST = {
  ok:      { cls:'toast-ok',      ms:2500 },
  err:     { cls:'toast-err',     ms:4500 },
  warn:    { cls:'toast-warn',    ms:4000 },
  loading: { cls:'toast-loading', ms:0 },
};
function _showToast(msg, tipo){
  const existing = document.getElementById('_toastGlobal');
  if(existing) existing.remove();
  const cfg = _TOAST[tipo] || _TOAST.warn;
  const toast = document.createElement('div');
  toast.id = '_toastGlobal';
  toast.className = 'toast ' + cfg.cls;
  toast.setAttribute('role', tipo === 'err' ? 'alert' : 'status');
  const span = document.createElement('span');
  span.className = 'toast-msg';
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'toast-close';
  btn.textContent = '✕';
  btn.setAttribute('aria-label','Fechar aviso');
  btn.onclick = () => toast.remove();
  toast.append(span, btn);
  document.body.appendChild(toast);
  if(cfg.ms) setTimeout(() => { if(toast.isConnected) toast.remove(); }, cfg.ms);
}
function _toastLimpar(){
  const t = document.getElementById('_toastGlobal');
  if(t && t.classList.contains('toast-loading')) t.remove();
}
function _toastSucesso(m){ _showToast(m,'ok'); }
function _toastErro(m){ _showToast(m,'err'); }
function _toastAviso(m){ _showToast(m,'warn'); }
function _toastCarregando(m){ _showToast(m,'loading'); }

function setMsg(text, kind){
  const t = (text||"").toString();
  if(!t) return;
  if(kind === "err") _toastErro('⚠️ ' + t);
  else if(kind === "ok") _toastSucesso('✅ ' + t);
  else if(kind === "warn") _toastAviso('⚠️ ' + t);
  else if(kind === "loading") _toastCarregando('⏳ ' + t);
  else { console.warn('[toast] kind desconhecido:', JSON.stringify(kind)); _toastAviso(t); }
}
</script>

<!-- SCRIPT — Lógica do login (exclusiva desta página) -->
<script>
(function(){
  /* ── Tema (exceção: sem header-logic nesta página) ── */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('ui_theme_v1', t); } catch {}
    document.getElementById('themeIcon').textContent = t === 'dark' ? '☀️' : '🌙';
    document.getElementById('themeText').textContent = t === 'dark' ? 'Claro' : 'Escuro';
  }
  applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
  document.getElementById('themeToggle').addEventListener('click', () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ── Refs ── */
  const btnEmail  = document.getElementById('btnEmail');
  const btnGoogle = document.getElementById('btnGoogle');
  const emailInp  = document.getElementById('inputEmail');
  const passInp   = document.getElementById('inputPassword');
  const avisoUrl  = document.getElementById('avisoUrl');

  /* ── Aviso vindo da URL (?erro=...) ── */
  const AVISOS_URL = {
    'conta-pendente': '⚠️ Sua conta ainda está aguardando aprovação de um administrador.',
    'acesso-negado':  '⚠️ Você não tem acesso a essa área. Entre com uma conta autorizada.',
  };
  const erroUrl = new URLSearchParams(location.search).get('erro');
  if (erroUrl && AVISOS_URL[erroUrl]) {
    avisoUrl.textContent = AVISOS_URL[erroUrl];
    avisoUrl.hidden = false;
  }
  // Quem foi barrado por falta de permissão não deve ser mandado de volta automaticamente
  const semRedirecionar = erroUrl === 'acesso-negado';

  // Espera o Auth terminar de iniciar (Firebase carregado e usuário restaurado).
  // Aqui NÃO basta getSession(): ele responde do cache antes de o Firebase estar pronto.
  // O limite de tempo evita loading infinito se o Firebase não carregar.
  function _authPronto(ms){
    return new Promise((resolve, reject) => {
      if(!window.Auth || !Auth.onReady) return reject(new Error('Auth indisponível.'));
      const t = setTimeout(() => reject(new Error('Tempo esgotado ao conectar. Recarregue a página.')), ms || 15000);
      Auth.onReady(() => { clearTimeout(t); resolve(); });
    });
  }

  function setLoading(on, qual) {
    btnEmail.disabled = btnGoogle.disabled = on;
    btnEmail.innerHTML = (on && qual === 'email') ? '<span class="spinner"></span> Entrando...' : 'Entrar';
  }

  // Destino depois do login: só aceita endereço do próprio site (bloqueia //outro-site.com)
  function getRedirect() {
    const next = new URLSearchParams(location.search).get('next');
    if (next) {
      try {
        const u = new URL(next, location.origin);
        if (u.origin === location.origin && !/\/login\.html$/i.test(u.pathname)) {
          return u.pathname + u.search + u.hash;
        }
      } catch (e) { /* next inválido: cai no padrão */ }
    }
    return '/index.html';
  }

  // Mensagens amigáveis; null = não mostrar nada (ex.: fechou a janela do Google)
  function _erroLogin(e){
    switch (e && e.code) {
      case 'auth/wrong-password':
      case 'auth/user-not-found':
      case 'auth/invalid-credential':
      case 'auth/invalid-login-credentials': return 'E-mail ou senha incorretos.';
      case 'auth/invalid-email':             return 'E-mail inválido.';
      case 'auth/user-disabled':             return 'Esta conta está desativada. Contate o administrador.';
      case 'auth/too-many-requests':         return 'Muitas tentativas. Aguarde alguns minutos.';
      case 'auth/network-request-failed':    return 'Sem conexão. Verifique a internet e tente de novo.';
      case 'auth/popup-blocked':             return 'O navegador bloqueou a janela do Google. Permita pop-ups e tente de novo.';
      case 'auth/popup-closed-by-user':
      case 'auth/cancelled-popup-request':   return null;
      default:
        // Erros sem código são as mensagens do próprio auth.firebase.js (ex.: conta pendente)
        return (e && !e.code && e.message) ? e.message : 'Erro ao entrar. Tente novamente.';
    }
  }

  async function doEmailLogin() {
    const email = emailInp.value.trim().toLowerCase();
    const pass  = passInp.value;
    if (!email || !pass) { setMsg('Preencha e-mail e senha.', 'err'); return; }
    setLoading(true, 'email');
    let ok = false;
    try {
      await _authPronto();
      await Auth.loginEmail(email, pass);
      ok = true;
      window.location.replace(getRedirect());
    } catch (e) {
      console.error('login: e-mail', e);
      const msg = _erroLogin(e);
      if (msg) setMsg(msg, 'err');
    } finally {
      if (!ok) setLoading(false);
    }
  }

  async function doGoogleLogin() {
    setLoading(true, 'google');
    let ok = false;
    try {
      await _authPronto();
      await Auth.loginGoogle();
      ok = true;
      window.location.replace(getRedirect());
    } catch (e) {
      console.error('login: google', e);
      const msg = _erroLogin(e);
      if (msg) setMsg(msg, 'err');
    } finally {
      if (!ok) setLoading(false);
    }
  }

  btnEmail.addEventListener('click', doEmailLogin);
  btnGoogle.addEventListener('click', doGoogleLogin);
  emailInp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); passInp.focus(); } });
  passInp.addEventListener('keydown',  e => { if (e.key === 'Enter' && !btnEmail.disabled) doEmailLogin(); });

  /* ── Boot (seção 18.1): quem já está logado vai direto para o destino ── */
  let redirecionando = false;
  async function init(){
    try{
      await _authPronto();
      const s = Auth.getSession();
      if (s && s.role !== 'pending' && !semRedirecionar) {
        redirecionando = true;                    // mantém o overlay até a navegação terminar
        window.location.replace(getRedirect());
      }
    } finally {
      if (!redirecionando) { try{ Loading.esconder(); }catch(_){} }
    }
  }
  init().catch((e) => {
    console.error('init:', e);
    setMsg((e && e.message) || 'Erro ao carregar a página.', 'err');
  });
})();
</script>
