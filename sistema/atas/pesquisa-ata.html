<script>
(function(){
  var saved = (localStorage.getItem('ui_theme_v1') || '').toLowerCase();
  var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<style>
/* ── Variáveis que esta página sobrescreve ── */
:root {
  --card-bg:             #ffffff;
  --card-border:         var(--brand-border, #ddd6fe);
  --field-bg:            #ffffff;
  --field-border:        var(--brand-border, #ddd6fe);
  --shadow:              0 4px 20px rgba(0,0,0,0.06);
  --danger:              #b91c1c;
  --chip-neutral-bg:     #f3f4f6;
  --chip-neutral-border: #d1d5db;
  --chip-neutral-color:  #4b5563;
}
html[data-theme="dark"] {
  --card-bg:             #131c2e;
  --card-border:         #2a3a5c;
  --field-bg:            #0a1426;
  --field-border:        #1e2540;
  --shadow:              0 4px 24px rgba(0,0,0,0.4);
  --chip-neutral-bg:     rgba(148,163,184,0.15);
  --chip-neutral-border: rgba(148,163,184,0.3);
  --chip-neutral-color:  #cbd5e1;
}

/* ── Aperfeiçoamentos do .btn ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 10px;
  padding: 8px 14px;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 13px;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s, color 0.18s, box-shadow 0.18s, opacity 0.18s;
  white-space: nowrap;
}
.btn:active { opacity: 0.85; }

/* .btn base (sem modificador) */
.btn:not(.primary):not(.ghost):not(.secondary):not(.danger):not(.ldanger) {
  background: var(--chip-bg);
  border-color: var(--card-border);
  color: var(--chip-color);
}
.btn:not(.primary):not(.ghost):not(.secondary):not(.danger):not(.ldanger):hover {
  background: var(--brand-faded);
  border-color: var(--brand-hover);
  color: var(--brand-text);
}
html[data-theme="dark"] .btn:not(.primary):not(.ghost):not(.secondary):not(.danger):not(.ldanger) {
  background: rgba(148,163,184,0.10);
  border-color: rgba(148,163,184,0.25);
  color: #cbd5e1;
}
html[data-theme="dark"] .btn:not(.primary):not(.ghost):not(.secondary):not(.danger):not(.ldanger):hover {
  background: var(--brand-faded-d);
  border-color: var(--brand-border-d);
  color: var(--brand-text-d);
}

/* .btn.primary dark */
html[data-theme="dark"] .btn.primary {
  background: var(--brand-d);
  border-color: var(--brand-d);
  color: #fff;
}
html[data-theme="dark"] .btn.primary:hover {
  background: var(--brand-hover-d);
  border-color: var(--brand-hover-d);
}

/* .btn.ghost */
.btn.ghost           { background: var(--chip-bg); border-color: var(--card-border); color: var(--chip-color); }
.btn.ghost:hover     { background: var(--brand-faded); border-color: var(--brand-hover); color: var(--brand-text); }
html[data-theme="dark"] .btn.ghost       { background: rgba(148,163,184,0.10); border-color: rgba(148,163,184,0.25); color: #94a3b8; }
html[data-theme="dark"] .btn.ghost:hover { background: var(--brand-faded-d); border-color: var(--brand-border-d); color: var(--brand-text-d); }

/* .btn.secondary */
.btn.secondary           { background: var(--chip-bg); border-color: var(--card-border); color: var(--chip-color); }
.btn.secondary:hover     { background: var(--brand-faded); border-color: var(--brand-hover); color: var(--brand-text); }
html[data-theme="dark"] .btn.secondary       { background: rgba(148,163,184,0.10); border-color: rgba(148,163,184,0.25); color: #94a3b8; }
html[data-theme="dark"] .btn.secondary:hover { background: var(--brand-faded-d); border-color: var(--brand-border-d); color: var(--brand-text-d); }

/* .btn.danger */
.btn.danger          { background: rgba(185,28,28,0.10); border-color: rgba(185,28,28,0.30); color: #b91c1c; }
.btn.danger:hover    { background: rgba(185,28,28,0.18); border-color: rgba(185,28,28,0.55); }
html[data-theme="dark"] .btn.danger       { background: rgba(185,28,28,0.15); border-color: rgba(239,68,68,0.40); color: #fca5a5; }
html[data-theme="dark"] .btn.danger:hover { background: rgba(185,28,28,0.28); border-color: rgba(239,68,68,0.65); }

/* .btn.small */
.btn.small { padding: 6px 11px; font-size: 12px; }

/* ── Título TURMAS clicável (ordenador) ── */
#sidebarTitulo {
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
#sidebarTitulo:hover { opacity: 0.75; }
#sortIndicator {
  font-size: 11px;
  opacity: 0.6;
  transition: transform 0.2s;
}

/* ── Sidebar expandida: compacta ao máximo ── */
.layout-expandido #card-esquerda .list-item .item-meta {
  display: none !important; /* oculta metadados extras */
}
.layout-expandido #card-esquerda .list-item .badges-row {
  flex-wrap: nowrap;
  overflow: hidden;
}
.layout-expandido #card-esquerda .list-item .badges-row .badge {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 90px;
  font-size: 10px;
  padding: 1px 5px;
}

/* ── Cards mesma altura no estado normal ── */
#container.split.layout-normal {
  align-items: stretch;
}
#container.split.layout-normal #card-esquerda,
#container.split.layout-normal #card-direita {
  align-self: stretch;
}

/* ── Hover do list-item no estado normal ── */
#card-esquerda .list-item:not(.selected):hover {
  background: color-mix(in srgb, var(--primary) 8%, transparent);
  cursor: pointer;
}

/* ── Checkbox da pesquisa por aluno ── */
.aluno-search-checkbox {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}
.aluno-search-checkbox input {
  cursor: pointer;
  accent-color: var(--brand);
}

/* ── Card de destaque na cor do usuário (mesmo mecanismo de gestão-atas) ── */
.card.card-destaque {
  background: var(--btn-home-bg);
  border-color: var(--btn-home-border);
  --dest-fg: #ffffff;
  --dest-btn-bg: rgba(255,255,255,0.16);
  --dest-btn-bd: rgba(255,255,255,0.55);
  --dest-btn-hover: rgba(255,255,255,0.26);
}
html[data-theme="dark"] .card.card-destaque { background: var(--btn-home-bg); border-color: var(--btn-home-border); }
.card.card-destaque.contraste-claro {
  --dest-fg: #1e293b;
  --dest-btn-bg: rgba(15,23,42,0.08);
  --dest-btn-bd: rgba(15,23,42,0.35);
  --dest-btn-hover: rgba(15,23,42,0.14);
}
.card-destaque .section-title { color: var(--dest-fg); }
.card-destaque .muted { color: color-mix(in srgb, var(--dest-fg) 75%, transparent); }
.card-destaque label { color: var(--dest-fg); }
.card-destaque .aluno-search-checkbox { color: var(--dest-fg); }
.card-destaque .btn {
  background: var(--dest-btn-bg); border-color: var(--dest-btn-bd); color: var(--dest-fg);
}
.card-destaque .btn:hover:not(:disabled) { background: var(--dest-btn-hover); border-color: var(--dest-fg); color: var(--dest-fg); }
/* Sem isto, "html[data-theme=dark] .btn.primary" (mais específico) vence e o
   botão "Pesquisar" volta pra cor de marca padrão — ilegível sobre o card
   já colorido pela cor do usuário no tema escuro. */
html[data-theme="dark"] .card-destaque .btn { background: var(--dest-btn-bg); border-color: var(--dest-btn-bd); color: var(--dest-fg); }
html[data-theme="dark"] .card-destaque .btn:hover:not(:disabled) { background: var(--dest-btn-hover); border-color: var(--dest-fg); color: var(--dest-fg); }

/* ── Toasts + modal de confirmação (ver guia-toasts.md) ── */
@keyframes toastSubir {
  from { opacity: 0; transform: translateX(-50%) translateY(16px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,23,42,.55);
  display: none; align-items: center; justify-content: center;
  padding: 18px; z-index: 50;
}
</style>

<!-- SCRIPT 3 — DB por escola (Namespacing) + lógica principal da página -->
<script>
/* =========================
   Toasts padronizados + modal de confirmação (ver guia-toasts.md)
========================= */
function _showToast(msg, bg, shadow, duration){
  const existing = document.getElementById('_toastGlobal');
  if(existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = '_toastGlobal';
  toast.style.cssText =
    `position:fixed;bottom:28px;left:50%;transform:translateX(-50%);`+
    `display:flex;align-items:center;gap:12px;`+
    `background:${bg};color:#fff;font-family:'Nunito',sans-serif;`+
    `font-size:14px;font-weight:800;padding:12px 16px 12px 20px;border-radius:12px;`+
    `box-shadow:0 4px 24px ${shadow||'rgba(0,0,0,0.25)'};z-index:9999;`+
    `animation:toastSubir .25s ease;max-width:min(90vw,480px);text-align:left;`;
  const span = document.createElement('span');
  span.textContent = msg;
  span.style.cssText = 'flex:1;line-height:1.4;';
  toast.appendChild(span);
  const btnClose = document.createElement('button');
  btnClose.type = 'button';
  btnClose.textContent = '✕';
  btnClose.setAttribute('aria-label','Fechar aviso');
  btnClose.style.cssText =
    'background:rgba(255,255,255,0.15);border:none;color:#fff;'+
    'width:22px;height:22px;border-radius:6px;cursor:pointer;'+
    'font-size:12px;font-weight:800;line-height:1;flex:0 0 auto;';
  btnClose.onclick = () => toast.remove();
  toast.appendChild(btnClose);
  document.body.appendChild(toast);
  // duration 0 = fica até virar outro toast ou ser fechado (usado só pelo "carregando")
  if (duration !== 0) setTimeout(() => { if(toast.isConnected) toast.remove(); }, duration || 2500);
}
function _toastSucesso(msg){ _showToast(msg, '#166534', 'rgba(22,163,74,0.95)', 2500); }
function _toastErro(msg){ _showToast(msg, '#991b1b', 'rgba(185,28,28,0.95)', 4500); }
function _toastAviso(msg){ _showToast(msg, '#92400e', 'rgba(217,119,6,0.95)', 4000); }
function _toastCarregando(msg){
  _showToast(msg, '#1e3a8a', 'rgba(37,99,235,0.95)', 0);
  const t = document.getElementById('_toastGlobal');
  if(t) t.dataset.loading = '1';
}
// Remove o toast atual SÓ se ele for um "carregando" — nunca apaga um
// sucesso/erro/aviso que tenha aparecido no meio do caminho.
function _toastLimpar(){
  const t = document.getElementById('_toastGlobal');
  if(t && t.dataset.loading === '1') t.remove();
}
function setMsg(text, kind){
  const t = (text||"").toString();
  if(!t) return;
  if(kind === "err") _toastErro('⚠️ ' + t);
  else if(kind === "ok") _toastSucesso('✅ ' + t);
  else if(kind === "warn") _toastAviso('⚠️ ' + t);
  else if(kind === "loading") _toastCarregando('⏳ ' + t);
  else {
    console.warn('[toast] kind desconhecido:', JSON.stringify(kind), '— usando "aviso" (amarelo) como padrão seguro.');
    _toastAviso(t);
  }
}
// Card de destaque: decide texto claro/escuro pela luminância real da cor
// escolhida em perfil.html (mesmo cálculo usado em gestão-atas), e reajusta
// sozinho quando a pessoa troca de cor sem recarregar a página.
function ajustarContrasteDestaque(){
  const el = document.querySelector('.card-destaque');
  if(!el) return;
  const bg = getComputedStyle(el).backgroundColor;
  const m = bg.match(/\d+(\.\d+)?/g);
  if(!m || m.length < 3) return;
  const [r,g,b] = m.map(Number);
  const lin = (c) => { c/=255; return c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); };
  const luminancia = 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
  el.classList.toggle('contraste-claro', luminancia > 0.5);
}
document.addEventListener('colorchange', ajustarContrasteDestaque);

window.addEventListener('unhandledrejection', (ev) => {
  const t = document.getElementById('_toastGlobal');
  if(t && t.dataset.loading === '1'){
    console.error('[unhandledrejection]', ev.reason);
    setMsg('Algo deu errado — veja o console.', 'err');
  }
});

function _escHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function _confirmModal({ titulo, corpo, corDestaque, textoConfirmar, textoCancelar }){
  return new Promise((resolve) => {
    const cor = corDestaque || '#b45309';
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.style.display = 'flex';
    backdrop.innerHTML =
      `<div style="background:var(--card-bg,#fff);border-radius:14px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);">`+
        `<h3 style="margin:0 0 6px;font-size:16px;font-weight:800;color:${cor};">${_escHtml(titulo || 'Confirmar ação')}</h3>`+
        `<p style="margin:0 0 18px;font-size:13px;color:var(--muted);white-space:pre-line;line-height:1.5;">${corpo || ''}</p>`+
        `<div style="display:flex;justify-content:flex-end;gap:8px;">`+
          `<button type="button" class="btn ghost" id="_confirmModalCancelar">${_escHtml(textoCancelar || 'Cancelar')}</button>`+
          `<button type="button" id="_confirmModalOk" style="padding:9px 16px;border-radius:8px;font-size:13px;font-weight:800;`+
            `background:${cor};border:1px solid ${cor};color:#fff;cursor:pointer;font-family:'Nunito',sans-serif;">`+
            `${_escHtml(textoConfirmar || 'Continuar')}`+
          `</button>`+
        `</div>`+
      `</div>`;
    document.body.appendChild(backdrop);
    function fechar(resultado){ backdrop.remove(); resolve(resultado); }
    backdrop.querySelector('#_confirmModalOk').addEventListener('click', () => fechar(true));
    backdrop.querySelector('#_confirmModalCancelar').addEventListener('click', () => fechar(false));
    backdrop.addEventListener('click', (ev) => { if(ev.target === backdrop) fechar(false); });
  });
}

/* =========================
   Permissões
========================= */
const _session = (window.Auth && typeof Auth.getSession === 'function')
  ? Auth.getSession()
  : null;
const _podeEditar = !!_session && _session.role === 'admin';

/* =========================
   Dados: Firestore é a única fonte
   (sem localStorage como cache — mesmo padrão adotado em
   gestao-atas.html: localStorage usado como "guarda pra acessar
   depois" já causou bug real de quota estourada travando o
   salvamento de verdade no Firestore. turmas/atas/matriculas
   não são mais coleções separadas: o dado de atas mora só em
   turmas.alunos[], gravado por gestao-atas.html.)
========================= */

/* =========================
   Catálogo de identidade (nome oficial por alunoId)
   O nome gravado dentro de turma.alunos[].nome é o texto cru
   do momento do import — se o aluno for fundido/corrigido depois
   (idaluno.html), esse campo embutido fica desatualizado. O nome
   correto pra exibir é sempre o do catálogo, por alunoId.
========================= */
let _mapaNomes = new Map(); // alunoId -> nome oficial

async function carregarCatalogoNomes(){
  try{
    if (window.Identidade && window.Identidade.pronto) await window.Identidade.pronto;
    const lista = (window.Identidade && typeof window.Identidade.lerTodos === "function")
      ? window.Identidade.lerTodos() : [];
    _mapaNomes = new Map(lista.map(a => [a.alunoId, a.nome || a.nomeOficial || ""]));
  }catch(e){
    console.warn("[pesquisa-ata] Falha ao carregar catálogo de identidade:", e);
    _mapaNomes = new Map();
  }
}

function nomeAtual(aluno){
  if (!aluno) return "";
  const oficial = aluno.alunoId ? _mapaNomes.get(aluno.alunoId) : null;
  return oficial || aluno.nome || "";
}

/* =========================
   Utilitários
========================= */
// Mantém o filtro "só turmas ativas" que já era o padrão (checkbox desmarcado);
// só a opção de ALTERNAR pra ver as inativas foi removida (legada).
// Schema da turma (schemaSnapshot, gravado no doc da turma na criação — ver
// cadastro-atas.html). Mesmos defaults/normalização usados no resto do
// módulo, pra não divergir do que outras páginas consideram "schema padrão".
function getDefaultConfig() {
  return {
    version: 1,
    nome: "Padrão (arquivo original)",
    serieAtiva: true,
    resultadoAtivo: true,
    ordenarPor: "nome",
    colunas: [
      { key:"port",  label:"Português",  type:"nota", enabled:true },
      { key:"mat",   label:"Matemática", type:"nota", enabled:true },
      { key:"hist",  label:"História",   type:"nota", enabled:true },
      { key:"geo",   label:"Geografia",  type:"nota", enabled:true },
      { key:"cien",  label:"Ciências",   type:"nota", enabled:true },
      { key:"fis",   label:"Ed. Física", type:"nota", enabled:true },
      { key:"arte",  label:"Arte",       type:"nota", enabled:true },
      { key:"relig", label:"Ens. Religioso", type:"nota", enabled:true }
    ]
  };
}
function normalizeSchema(cfg) {
  const def = getDefaultConfig();
  const out = {
    id: String(cfg?.id || cfg?.schemaId || "").trim() || "",
    version: 1,
    nome: String(cfg?.nome ?? def.nome),
    serieAtiva: cfg?.serieAtiva !== undefined ? !!cfg.serieAtiva : def.serieAtiva,
    resultadoAtivo: cfg?.resultadoAtivo !== undefined ? !!cfg.resultadoAtivo : def.resultadoAtivo,
    ordenarPor: (cfg?.ordenarPor === "numero") ? "numero" : "nome",
    colunas: Array.isArray(cfg?.colunas) ? cfg.colunas : def.colunas
  };
  out.colunas = out.colunas
    .map(c => ({
      key: String(c?.key ?? "").trim().toLowerCase(),
      label: String(c?.label ?? "").trim(),
      type: (c?.type === "texto") ? "texto" : "nota",
      enabled: c?.enabled !== false
    }))
    .filter(c => c.key && c.label);
  const seen = new Set();
  out.colunas = out.colunas.filter(c => {
    if (seen.has(c.key)) return false;
    seen.add(c.key);
    return true;
  });
  return out;
}
function getColunasAtivas(schema) {
  return (schema?.colunas || []).filter(c => c.enabled);
}
// Schema de verdade da turma selecionada (schemaSnapshot) — cai no schema
// padrão só se a turma não tiver nenhum salvo (legado/turma antiga).
function schemaDaTurmaSelecionada() {
  return normalizeSchema(turmaSelecionada?.schemaSnapshot || getDefaultConfig());
}
function renderTheadAlunos(schema) {
  const tr = document.getElementById("theadAlunosRow");
  if (!tr) return;
  const colAtivas = getColunasAtivas(schema);
  let html = `<th>Nº</th><th>Nome</th>`;
  if (schema.serieAtiva) html += `<th>Série</th>`;
  // O ID (key) é usado em vez do nome completo (label) de propósito: o campo
  // de ID já tem limite de caracteres na criação do schema, então a coluna
  // fica curta e a tabela não desconfigura o layout da página.
  for (const c of colAtivas) html += `<th>${_escHtml(c.key)}</th>`;
  if (schema.resultadoAtivo) html += `<th>Resultado</th>`;
  tr.innerHTML = html;
}

function recomputarTurmasBase() {
  turmas = turmasTodas.filter(t => String(t.status || "ATIVA").toUpperCase() !== "INATIVA");
}

function norm(v) {
  return String(v ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function formatarListaBonita(arr) {
  if (!arr || arr.length === 0) return "";
  if (arr.length === 1) return arr[0];
  if (arr.length === 2) return `${arr[0]} e ${arr[1]}`;
  return `${arr.slice(0, -1).join(", ")} e ${arr[arr.length - 1]}`;
}

/* ── Ordenação de turmas por série (numérica) + ano letivo (desc) ── */
function numSerie(serie) {
  // Extrai o primeiro número da série para ordenação numérica
  // Ex: "1ª série" → 1, "9º ano" → 9, "Alfabetização" → 0
  const m = String(serie || '').match(/\d+/);
  return m ? parseInt(m[0]) : 0;
}

function ordenarTurmas(lista) {
  return lista.slice().sort((a, b) => {
    const anoA = String(a.anoLetivo || '');
    const anoB = String(b.anoLetivo || '');
    // ordena por ano letivo conforme _ordemAsc
    const cmpAno = _ordemAsc
      ? anoA.localeCompare(anoB, 'pt-BR')   // crescente: mais antigo primeiro
      : anoB.localeCompare(anoA, 'pt-BR');   // decrescente: mais recente primeiro
    if (cmpAno !== 0) return cmpAno;
    // desempata por número de série (sempre crescente)
    const nA = numSerie(a.serieTexto || (a.seriesTurma && a.seriesTurma[0]) || '');
    const nB = numSerie(b.serieTexto || (b.seriesTurma && b.seriesTurma[0]) || '');
    return nA - nB;
  });
}

function selecionarTurma(id) {

  document.getElementById("detalhesVazio").style.display = turmaSelecionada ? "none" : "block";
  document.getElementById("detalhesBox").style.display = turmaSelecionada ? "block" : "none";

  if (!turmaSelecionada) return;


  // 🔥 ATIVA MODO EXPANDIDO (ADICIONADO)

  const serieTxt = turmaSelecionada.serieTexto ||
    (turmaSelecionada.seriesTurma?.length ? formatarListaBonita(turmaSelecionada.seriesTurma) : "?");

  document.getElementById("detalhesMeta").innerHTML =
    `<b>${_escHtml(turmaSelecionada.aba || turmaSelecionada.nome || "Turma")}</b><br>` +
    `ID: ${_escHtml(turmaSelecionada.id || turmaSelecionada._id || turmaSelecionada.turmaId || "?")}<br>` +
    (turmaSelecionada.origemArquivo ? `Arquivo: ${_escHtml(turmaSelecionada.origemArquivo)}<br>` : '') +
    `Ano: <b>${_escHtml(turmaSelecionada.anoLetivo || "?")}</b> · Turno: <b>${_escHtml(turmaSelecionada.turno || "?")}</b> · Série: <b>${_escHtml(serieTxt)}</b>`;

  const btnEditarTurma = document.getElementById('btnEditarTurma');
  if(btnEditarTurma) btnEditarTurma.style.display = _podeEditar ? 'inline-flex' : 'none';

  renderTheadAlunos(schemaDaTurmaSelecionada());
  alunosView = (turmaSelecionada.alunos || []).slice();
  renderAlunos(alunosView);

  document.getElementById("fAluno").value = "";
  document.getElementById("fAluno").oninput = () => {
    const q = norm(document.getElementById("fAluno").value);
    const filtrados = alunosView.filter(a => norm(nomeAtual(a)).includes(q));
    renderAlunos(filtrados);
  };

  renderResumoTurma(turmaSelecionada);

  // Ativa modo expandido
  const container = document.getElementById("container");
  if (container) {
    container.classList.remove("layout-normal");
    container.classList.add("layout-expandido");
  }

  // Destaca item selecionado na sidebar
  document.querySelectorAll("#listaTurmas .list-item").forEach(el => {
    el.classList.toggle("selected", el.dataset.turmaId === id);
  });
}

========================= */
function contarResultados(alunos) {
  const cont = {};
  for (const a of alunos) {
    const r = (a.resultado || "Não informado").trim();
    cont[r] = (cont[r] || 0) + 1;
  }
  return cont;
}

function renderResumoTurma(t) {
  const alunos = t.alunos || [];
  const cont = contarResultados(alunos);

  const linhas = [];
  linhas.push(`Turma: ${t.aba || "?"}`);
  linhas.push(`Ano: ${t.anoLetivo || "?"} | Turno: ${t.turno || "?"} | Série: ${t.serieTexto || "?"}`);
  linhas.push(`Alunos: ${alunos.length}`);
  linhas.push("");
  linhas.push("Resultados:");
  Object.keys(cont).sort().forEach(k => linhas.push(`- ${k}: ${cont[k]}`));

  document.getElementById("resumoTurma").textContent = linhas.join("\n");
}

/* =========================
   Aplicar filtros
========================= */
function aplicarFiltros() {
  const fAno = document.getElementById("fAno").value.trim();
  const fTurno = document.getElementById("fTurno").value.trim();
  const fSerie = norm(document.getElementById("fSerie").value);
  const fBusca = norm(document.getElementById("fBusca").value);

  let lista = turmas.slice();

  if (fAno) lista = lista.filter(t => String(t.anoLetivo || "").trim() === fAno);
  if (fTurno) lista = lista.filter(t => String(t.turno || "").trim() === fTurno);
  if (fSerie) lista = lista.filter(t => norm(t.serieTexto || "").includes(fSerie));

  if (fBusca) {
    lista = lista.filter(t => {
      const base =
        norm(t.aba || "") + " " +
        norm(t.origemArquivo || "") + " " +
        norm(t.serieTexto || "") + " " +
        norm(t.turno || "") + " " +
        norm(t.anoLetivo || "");
      if (base.includes(fBusca)) return true;
      return (t.alunos || []).some(a => norm(nomeAtual(a)).includes(fBusca));
    });
  }

  renderListaTurmas(ordenarTurmas(lista));
}

// Cabeçalho institucional (logo + nome + endereço + linha separadora),
// mesmo layout de pesquisa-ano-ativo. Retorna o Y onde o conteúdo pode
// começar. unit "pt" (não "mm") — igual ao resto do módulo de export.
function _desenharCabecalhoEscolaAta(doc, escola, titulo, pageWidth){
  const L = 28, R = pageWidth - 28;
  let y = 20;

  let logoW = 0;
  if (escola && escola.escudo) {
    try { const s = 48; doc.addImage(escola.escudo, "PNG", L, y, s, s); logoW = s + 10; } catch {}
  }

  const tx = L + logoW;
  if (escola && escola.nome) {
    doc.setFontSize(13); doc.setFont(undefined, "bold"); doc.setTextColor(11,63,191);
    doc.text(String(escola.nome).toUpperCase(), tx, y + 13);

    doc.setFont(undefined, "normal"); doc.setTextColor(60);
    let subY = y + 24;
    const partes = [];
    if (escola.endereco) partes.push(escola.endereco);
    const cidade = [escola.cidade, escola.uf].filter(Boolean).join("/");
    if (cidade) partes.push(cidade);
    if (escola.inep) partes.push(`INEP: ${escola.inep}`);
    if (escola.email) partes.push(`E-mail: ${escola.email}`);
    if (escola.telefone) partes.push(`Tel: ${escola.telefone}`);
    if (partes.length) {
      doc.setFontSize(8);
      const linha = doc.splitTextToSize(partes.join("  •  "), R - tx - 10);
      doc.text(linha, tx, subY);
      subY += linha.length * 10;
    }
    y = Math.max(y + 50, subY + 4);
  } else {
    y += (logoW ? 52 : 0);
  }

  doc.setDrawColor(11,63,191); doc.setLineWidth(1.2);
  doc.line(L, y, R, y);
  y += 8;

  doc.setFontSize(12); doc.setFont(undefined, "bold"); doc.setTextColor(20);
  doc.text(titulo, L, y + 9);
  doc.setFont(undefined, "normal"); doc.setTextColor(0);
  y += 20;

  return y;
}

// Largura de coluna: Nº fixo e estreito (aprovado como está). Nome é
// FLEXÍVEL — absorve o que sobrar depois de todas as outras colunas, pra a
// tabela sempre bater exatamente com as margens da linha azul do cabeçalho,
// em vez de sobrar espaço em branco à direita. Série e Resultado são
// calculados pelo texto real (cabeçalho/valores), então cada um usa só o
// espaço que precisa. Colunas de matéria: largura AINDA fixa em 44pt — não
// mexida agora de propósito, aguardando avaliação com o ID (key) no lugar
// do nome completo (label) antes de decidir se precisa encolher mais.
function _montarColumnStylesAta(doc, schema, colAtivas, alunos, larguraDisponivel){
  const styles = {};
  const larguras = [];
  let i = 0;

  styles[i] = { cellWidth: 26, halign: "center" }; larguras.push(26); i++; // Nº

  const nomeIdx = i; i++; // preenchido por último, com o espaço restante

  if (schema.serieAtiva) {
    doc.setFont(undefined, "bold"); doc.setFontSize(9);
    let maxTxt = doc.getTextWidth("Série");
    doc.setFont(undefined, "normal");
    for (const a of alunos) maxTxt = Math.max(maxTxt, doc.getTextWidth(String(a.serie ?? "")));
    const w = Math.ceil(maxTxt) + 12; // ~6pt de cada lado
    styles[i] = { cellWidth: w, halign: "center" }; larguras.push(w); i++;
  }

  for (const c of colAtivas) {
    const w = c.type === "texto" ? 80 : 44; // inalterado — ver comentário acima
    styles[i] = { cellWidth: w, halign: "center" }; larguras.push(w); i++;
  }

  if (schema.resultadoAtivo) {
    doc.setFont(undefined, "bold"); doc.setFontSize(9);
    const textW = doc.getTextWidth("Resultado");
    doc.setFont(undefined, "normal");
    const pad = 2; // exatamente os ~2pt de cada lado pedidos
    const w = Math.ceil(textW) + pad * 2;
    styles[i] = { cellWidth: w, halign: "center", cellPadding: { top:4, bottom:4, left:pad, right:pad } };
    larguras.push(w); i++;
  }

  const somaOutras = larguras.reduce((a,b) => a+b, 0);
  const MIN_NOME = 90; // piso pra schemas com muitas colunas não espremerem o nome a zero
  styles[nomeIdx] = { cellWidth: Math.max(MIN_NOME, larguraDisponivel - somaOutras), halign: "left" };

  return styles;
}

async function _exportarPDFDaTurmaInterno() {
  const { jsPDF } = window.jspdf;
  // Paisagem: tabelas de ata têm muitas colunas e sobra pouco espaço na
  // vertical — perder altura de página compensa mais do que ganhar largura.
  const doc = new jsPDF({ orientation: "l", unit: "pt", format: "a4" });
  const pageWidth = doc.internal.pageSize.getWidth();

  const escola = await carregarDadosEscola();

  const serieTxt = turmaSelecionada.serieTexto ||
    (turmaSelecionada.seriesTurma?.length ? formatarListaBonita(turmaSelecionada.seriesTurma) : "");
  const ano   = turmaSelecionada.anoLetivo || "";
  const turno = turmaSelecionada.turno || "";

  let y = _desenharCabecalhoEscolaAta(doc, escola, "ATA DE RESULTADOS FINAIS", pageWidth);

  doc.setFontSize(10);
  doc.text(`ANO: ${ano}`, 28, y);
  doc.text(`SÉRIE: ${serieTxt}`, 160, y);
  doc.text(`TURNO: ${turno}`, 320, y);
  y += 14;

  const alunos = turmaSelecionada.alunos || [];
  const schemaPdf = schemaDaTurmaSelecionada();
  const colAtivasPdf = getColunasAtivas(schemaPdf);

  const headPdf = ["Nº","Nome"];
  if (schemaPdf.serieAtiva) headPdf.push("Série");
  // ID da matéria (key), não o nome completo (label) — mesmo motivo da
  // tabela em tela: o label estourava a largura da coluna.
  colAtivasPdf.forEach(c => headPdf.push(c.key));
  if (schemaPdf.resultadoAtivo) headPdf.push("Resultado");

  doc.autoTable({
    startY: y,
    styles: { fontSize: 9, cellPadding: {top:4,bottom:4,left:5,right:5}, overflow: "linebreak", lineColor: [210,220,240], lineWidth: 0.3 },
    headStyles: { fillColor: [11,63,191], textColor: 255, fontStyle: "bold", fontSize: 9, halign: "center" },
    alternateRowStyles: { fillColor: [243,246,255] },
    bodyStyles: { textColor: [30,30,50] },
    columnStyles: _montarColumnStylesAta(doc, schemaPdf, colAtivasPdf, alunos, pageWidth - 28 - 28),
    margin: { left: 28, right: 28 },
    head: [headPdf],
    body: alunos.map((a,i)=>{
      const linha = [i+1, nomeAtual(a)];
      if (schemaPdf.serieAtiva) linha.push(a.serie);
      colAtivasPdf.forEach(c => linha.push(a[c.key]));
      if (schemaPdf.resultadoAtivo) linha.push(a.resultado);
      return linha;
    })
  });

  // Nome do arquivo pelo identificador da turma (série + ano + turno), não
  // mais por "aba" — em turmas criadas manualmente (não importadas de
  // planilha) esse campo guarda a ORIGEM do cadastro ("MANUAL"), não um nome,
  // e o arquivo saía "ata_MANUAL.pdf" para qualquer turma cadastrada assim.
  const idPartes = [serieTxt, ano, turno].filter(Boolean).join("_");
  const safe = String(idPartes || turmaSelecionada.aba || "turma")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // remove acentos
    .replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_");
  doc.save(`ATA_${safe}.pdf`);
}

async function carregar() {
  let falhaTurmas = false;
  try{
    await new Promise(res=>{
      if(window.Auth && window.Auth.getSession && window.Auth.getSession()) return res();
      document.addEventListener('auth:ready', res, {once:true});
    });

    await carregarCatalogoNomes();

    turmasTodas = (window.DB && window.DB.turmas && typeof window.DB.turmas.list === "function")
      ? await window.DB.turmas.list()
      : [];
  }catch(e){
    console.warn('[pesquisa-ata] Falha ao carregar turmas do Firestore:', e);
    turmasTodas = [];
    falhaTurmas = true; // distinto de "carregou certinho e não tem turma nenhuma"
  }

  recomputarTurmasBase();

  document.getElementById("dbInfo").textContent =
    `${turmas.length} turma(s) — clique em Pesquisar para exibir`;

  preencherFiltroAno(turmas);

  document.getElementById("listaTurmas").innerHTML =
    `<div class="list-item"><span class="muted">Clique em <b>🔍 Pesquisar</b> para carregar as turmas.</span></div>`;
  document.getElementById("detalhesVazio").style.display = "block";
  document.getElementById("detalhesBox").style.display = "none";

  document.getElementById("btnPesquisar").onclick = function(){
    _jaFoiPesquisado = true;
    aplicarFiltros();
  };

  document.getElementById("fAno").onchange    = function(){ if(_jaFoiPesquisado) aplicarFiltros(); };
  document.getElementById("fTurno").onchange  = function(){ if(_jaFoiPesquisado) aplicarFiltros(); };
  document.getElementById("fSerie").oninput   = function(){ if(_jaFoiPesquisado) aplicarFiltros(); };
  document.getElementById("fBusca").oninput   = function(){ if(_jaFoiPesquisado) aplicarFiltros(); };

  if (falhaTurmas) setMsg("Não foi possível carregar as turmas — recarregue a página.", "err");

  ajustarContrasteDestaque();
  Loading.esconder();
}

let _jaFoiPesquisado = false;
let _ordemAsc = false; // false = mais recente primeiro (padrão)

// Loading gerenciado por loading-overlay.js

document.addEventListener("DOMContentLoaded", carregar);
</script>



<!-- SCRIPT 5 — Pesquisa por aluno (bloco isolado) -->
<script>
(function(){
  function normNome(s){
    return String(s || "")
      .trim()
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, " ");
  }

  function escapeHtml(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  window.limparPesquisaAluno = function(){
    const q = document.getElementById("alunoQuery");
    const out = document.getElementById("alunoResultados");
    if (q) q.value = "";
    if (out) out.innerHTML = "";
  };

  window.pesquisarAluno = function(){
    const qEl = document.getElementById("alunoQuery");
    const parcialEl = document.getElementById("alunoParcial");
    const out = document.getElementById("alunoResultados");

    if (!qEl || !out) {
      setMsg("Erro: área de pesquisa do aluno não encontrada na página.", "err");
      return;
    }

    const termo = normNome(qEl.value);
    const parcial = !!(parcialEl && parcialEl.checked);

    if (!termo) { setMsg("Digite o nome do aluno.", "err"); return; }

    if (typeof window.obterTurmas !== "function") {
      setMsg("Erro: turmas ainda não carregadas.", "err");
      return;
    }

    const db = window.obterTurmas();
    const achados = [];

    for (const t of (db || [])){
      const alunos = Array.isArray(t?.alunos) ? t.alunos : [];
      for (const a of alunos){
        const nomeA = normNome(window.nomeAtual ? window.nomeAtual(a) : a?.nome);
        if (!nomeA) continue;
        const ok = parcial ? nomeA.includes(termo) : (nomeA === termo);
        if (!ok) continue;
        achados.push({
          aluno: window.nomeAtual ? window.nomeAtual(a) : (a?.nome || ""),
          ano: t?.anoLetivo || "",
          serie: a?.serie || t?.serieTexto || "",
          turno: t?.turno || "",
          id: t?.id || t?._id || t?.turmaId || ""
        });
      }
    }

    if (!achados.length){
      out.innerHTML = `<div class="aluno-not-found">
        Nenhuma ocorrência encontrada para <b>${escapeHtml(qEl.value)}</b>.
      </div>`;
      return;
    }

    achados.sort((x,y)=>{
      const ax = parseInt(String(x.ano||"0"),10) || 0;
      const ay = parseInt(String(y.ano||"0"),10) || 0;
      if (ax !== ay) return ax - ay;
      return String(x.serie||"").localeCompare(String(y.serie||""), "pt-BR");
    });

    out.innerHTML = achados.map(h => `
      <div class="aluno-result-row">
        <div class="aluno-result-info">
          <div><b>${escapeHtml(h.ano || "?")}</b> — ${escapeHtml(h.serie || "?")} — ${escapeHtml(h.turno || "?")} — <span style="font-weight:700;">${escapeHtml(h.aluno || "")}</span></div>
        </div>
        <div class="aluno-result-actions">
          <button class="btn ghost small" type="button" onclick="(window.selecionarTurma||function(){setMsg('Função Abrir não encontrada.','err');})('${h.id}')">Abrir</button>
        </div>
      </div>
    `).join("");
  };

  document.addEventListener("DOMContentLoaded", function(){
    const inp = document.getElementById("alunoQuery");
    if (!inp) return;
    inp.addEventListener("keydown", function(ev){
      if (ev.key === "Enter"){
        ev.preventDefault();
        if (typeof window.pesquisarAluno === "function") window.pesquisarAluno();
      }
    });
  });
})();

// Clique no título TURMAS → alterna ordem (recente/antigo)
document.getElementById("sidebarTitulo").addEventListener("click", () => {
  _ordemAsc = !_ordemAsc;
  const ind = document.getElementById("sortIndicator");
  if (ind) ind.textContent = _ordemAsc ? "↓" : "↑";
  if (_jaFoiPesquisado) aplicarFiltros();
});
</script>
