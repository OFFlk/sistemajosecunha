<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="../icon.png" type="image/png"/>

<!-- Tema antecipado (manter — evita flash de tema errado) -->
<script>
(function(){
  var saved = (localStorage.getItem('ui_theme_v1') || '').toLowerCase();
  var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<!-- Scripts globais -->
<script src="../loading-overlay.js"></script>
<script src="../auth.firebase.js"></script>
<script src="../db.firebase.js"></script>
<script src="../identidade-aluno.js"></script>
<script src="../theme-colors.js"></script>

<!-- Fonte -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Bibliotecas específicas desta página (geração de PDF) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<!-- CSS globais -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/components.css">

<!-- CSS específico desta página (só o que não está nos globais) -->
<style>
/* ===== Variáveis do sistema ===== */
/* --bg, --ink, --muted, --line, --chip-*, --mark-bg, --sub-color, --school-*
   NÃO ficam aqui: já existem em header.css. Redeclará-las neste <style>
   (carregado depois do header.css) sobrescrevia os valores globais e
   mudava a cor do chip da escola no header. */
:root{
  --card:         #ffffff;
  --text:         #1e1b4b;
  --border:       var(--brand-border, #ddd6fe);
  --shadow:       0 4px 20px rgba(0,0,0,0.06);
  --radius:       14px;
  --danger:       #b91c1c;
  --danger2:      #991b1b;
  --chip:         var(--brand-faded, #f5f3ff);
  --chipText:     var(--brand-text, #6d28d9);
  --field-bg:     #ffffff;
  --field-border: var(--brand-border, #ddd6fe);
}
html[data-theme="dark"]{
  --card:         #131c2e;
  --text:         #e2e8f0;
  --border:       #2a3a5c;
  --shadow:       0 4px 24px rgba(0,0,0,0.4);
  --chip:         var(--brand-faded-d, rgba(124,58,237,0.28));
  --chipText:     var(--brand-text-d, #c4b5fd);
  --field-bg:     #0a1426;
  --field-border: #1e2540;
}

/* ===== Layout desta página ===== */
.container{ max-width:1100px; margin:22px auto 48px; padding:0 18px; }
.top-actions{ display:flex; gap:10px; justify-content:flex-end; margin-bottom:14px; flex-wrap:wrap; }

/* ===== Botões (body) ===== */
.btn, a.btn, button.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card); color: var(--ink);
  cursor: pointer; font-weight: 700; font-size: 14px;
  font-family: 'Nunito', sans-serif;
  text-decoration: none; white-space: nowrap;
  transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
}
html[data-theme="dark"] .btn { background: var(--card); border-color: var(--border); color: var(--ink); }
/* btn-primary — especificidade reforçada para não ser sobrescrito pelo .btn base */
.btn.btn-primary,
a.btn.btn-primary,
button.btn-primary,
button.btn.btn-primary {
  background: var(--brand, #7c3aed);
  border-color: var(--brand, #7c3aed);
  color: #fff;
  box-shadow: 0 4px 14px rgba(0,0,0,0.15);
}
.btn.btn-primary:hover,
button.btn-primary:hover,
button.btn.btn-primary:hover {
  background: var(--brand-hover, #6d28d9);
  border-color: var(--brand-hover, #6d28d9);
  box-shadow: 0 4px 18px rgba(0,0,0,0.22);
}
html[data-theme="dark"] .btn.btn-primary,
html[data-theme="dark"] button.btn-primary,
html[data-theme="dark"] button.btn.btn-primary {
  background: var(--brand-d, #7c3aed);
  border-color: var(--brand-d, #7c3aed);
}
html[data-theme="dark"] .btn.btn-primary:hover,
html[data-theme="dark"] button.btn-primary:hover {
  background: var(--brand-hover-d, #6d28d9);
  border-color: var(--brand-hover-d, #6d28d9);
}
.btn-gray { background: var(--chip-bg); border-color: var(--chip-border); color: var(--chip-color); }
.btn-gray:hover { background: var(--brand-faded, #f5f3ff); border-color: var(--brand, #7c3aed); color: var(--brand-text, #6d28d9); }

/* Botão editar na tabela */
.btn-edit {
  padding: 5px 10px; font-size: 12px; border-radius: 8px; font-weight: 700;
  background: var(--chip-bg); border: 1px solid var(--chip-border); color: var(--chip-color);
  cursor: pointer; white-space: nowrap; font-family: 'Nunito', sans-serif;
}
.btn-edit:hover { background: var(--brand-faded, #f5f3ff); border-color: var(--brand, #7c3aed); }

/* Botões de ação de série (outline brand) */
.btn-serie {
  padding: 8px 12px; font-size: 13px; font-weight: 700; border-radius: 10px;
  background: transparent; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--brand, #7c3aed); color: var(--brand, #7c3aed);
  font-family: 'Nunito', sans-serif; transition: background 0.18s;
}
html[data-theme="dark"] .btn-serie { border-color: var(--brand-d, #7c3aed); color: var(--brand-d, #7c3aed); }
.btn-serie:hover { background: var(--brand-faded, #f5f3ff); }

/* ── Card de destaque na cor do usuário (mesmo mecanismo de gestão-atas /
   pesquisa-ata.html) — aplicado no card "Buscar aluno", equivalente ao
   card "Filtros" de pesquisa-ata.html ── */
.card.card-destaque {
  background: var(--btn-home-bg);
  border-color: var(--btn-home-border);
  --dest-fg: #ffffff;
  --dest-btn-bg: rgba(255,255,255,0.16);
  --dest-btn-bd: rgba(255,255,255,0.55);
  --dest-btn-hover: rgba(255,255,255,0.26);
}
html[data-theme="dark"] .card.card-destaque { background: var(--btn-home-bg); border-color: var(--btn-home-border); }
.card.card-destaque.contraste-claro {
  --dest-fg: #1e293b;
  --dest-btn-bg: rgba(15,23,42,0.08);
  --dest-btn-bd: rgba(15,23,42,0.35);
  --dest-btn-hover: rgba(15,23,42,0.14);
}
.card-destaque h2 { color: var(--dest-fg); }
.card-destaque .muted { color: color-mix(in srgb, var(--dest-fg) 75%, transparent); }
.card-destaque label { color: var(--dest-fg); }
.card-destaque .btn {
  background: var(--dest-btn-bg); border-color: var(--dest-btn-bd); color: var(--dest-fg);
}
.card-destaque .btn:hover:not(:disabled) { background: var(--dest-btn-hover); border-color: var(--dest-fg); color: var(--dest-fg); }
/* O sistema reforça .btn-primary com o seletor "button.btn.btn-primary"
   (tipo + 2 classes) especificamente pra não ser sobrescrito pelo .btn
   base — isso também vence ".card-destaque .btn" (só 2 classes, sem tipo).
   Por isso aqui entro com o MESMO reforço de tipo, mais a classe extra do
   card, ficando estritamente mais específico (não dependo de ordem no
   arquivo). Mesmo bug (botão "Pesquisar" ficando com a cor de marca padrão,
   ilegível sobre o card colorido) já visto e corrigido em pesquisa-ata.html. */
.card-destaque .btn.btn-primary,
.card-destaque button.btn.btn-primary {
  background: var(--dest-btn-bg); border-color: var(--dest-btn-bd); color: var(--dest-fg);
}
.card-destaque .btn.btn-primary:hover:not(:disabled),
.card-destaque button.btn.btn-primary:hover:not(:disabled) {
  background: var(--dest-btn-hover); border-color: var(--dest-fg); color: var(--dest-fg);
}
html[data-theme="dark"] .card-destaque .btn { background: var(--dest-btn-bg); border-color: var(--dest-btn-bd); color: var(--dest-fg); }
html[data-theme="dark"] .card-destaque .btn:hover:not(:disabled) { background: var(--dest-btn-hover); border-color: var(--dest-fg); color: var(--dest-fg); }
html[data-theme="dark"] .card-destaque .btn.btn-primary,
html[data-theme="dark"] .card-destaque button.btn.btn-primary {
  background: var(--dest-btn-bg); border-color: var(--dest-btn-bd); color: var(--dest-fg);
}
html[data-theme="dark"] .card-destaque .btn.btn-primary:hover:not(:disabled),
html[data-theme="dark"] .card-destaque button.btn.btn-primary:hover:not(:disabled) {
  background: var(--dest-btn-hover); border-color: var(--dest-fg); color: var(--dest-fg);
}

/* ===== Card ===== */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:16px;
}

/* ===== Formulário ===== */
.row{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:15px; margin-top:15px; }
@media(max-width:900px){ .row{grid-template-columns:1fr 1fr;} }
@media(max-width:540px){ .row{grid-template-columns:1fr;} }
.campo{ display:flex; flex-direction:column; min-width:0; }
label{ font-size:13px; font-weight:700; color:var(--ink); margin-bottom:6px; display:block; }
/* Esta página não tem nenhum <select> próprio — o único <select> do DOM é o
   do school-pill no header (fetch de header-component.html). Por isso o
   seletor aqui mira só em "input", nunca em "select", evitando reproduzir
   o vazamento que pegava o select do header no tema escuro. */
input {
  padding: 10px 12px; font-size: 14px; width: 100%;
  border: 1px solid var(--field-border); border-radius: 10px;
  background: var(--field-bg); color: var(--ink);
  outline: none; font-family: 'Nunito', sans-serif;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus { border-color: var(--brand, #7c3aed); box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }
html[data-theme="dark"] input {
  background: var(--field-bg); color: var(--ink); border-color: var(--field-border);
}
.form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-top:15px; }
.actions{ display:flex; gap:10px; margin-top:15px; flex-wrap:wrap; }

/* ===== Tabela ===== */
.table-wrap{ overflow-x:auto; padding-bottom:6px; border:1px solid var(--line); border-radius:14px; margin-top:14px; }
table{ width:max-content; min-width:100%; border-collapse:collapse; table-layout:fixed; font-size:12px; }
th, td{ border:1px solid var(--line); padding:6px; text-align:center; vertical-align:middle; }
th{ background:var(--chip-bg); font-weight:700; text-align:left; color:var(--muted); }
html[data-theme="dark"] table{ color:var(--ink); }
html[data-theme="dark"] th{ background:var(--chip-bg); color:var(--muted); border-color:var(--border); }
html[data-theme="dark"] td{ background:var(--field-bg); color:var(--ink); border-color:var(--border); }
html[data-theme="dark"] tbody tr:hover td{ background:var(--chip-bg); }
th.th-vertical{ width:34px; writing-mode:vertical-rl; transform:rotate(180deg); white-space:nowrap; padding:10px 4px; font-size:12px; line-height:1; }
th.th-num{ width:42px; }
th.th-nome{ width:220px; }
td.col-nome{ text-align:left; padding-left:8px; word-break:break-word; }
th.th-nota, td.col-nota{ width:42px; font-size:11px; }

.hidden{ display:none !important; }

/* ===== Complementos específicos: Histórico por Aluno ===== */
.split{display:grid; grid-template-columns: 1.15fr .85fr; gap:16px; align-items:stretch;}
@media (max-width: 980px){ .split{grid-template-columns:1fr;} }

.muted{color:var(--muted); font-size:13px;}
.pill{display:inline-block; padding:3px 8px; border-radius:999px; background:var(--chip-bg); font-size:12px; margin-left:8px; border:1px solid var(--chip-border); color:var(--chip-color);}
.list{border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--card);}
.item{display:grid; grid-template-columns: 1fr 220px; gap:10px; align-items:center; padding:12px; border-top:1px solid var(--border);}
.item:first-child{border-top:none;}
.item .title{font-weight:800; min-width:0; font-size:14px;}
.item .sub{color:var(--muted); font-size:13px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.item .right{display:flex; gap:8px; justify-content:flex-end; flex-wrap:nowrap; align-items:center;}
.item .right .btn{width:90px; padding:8px 0; justify-content:center; text-align:center;}
.details-title{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
.details-title h3{margin:0;}
.timeline{margin-top:10px; border-top:1px solid var(--border);}
.trow{display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); align-items:center;}
.tleft{min-width:0;}
.tleft b{display:block;}
.tleft .muted{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tright{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
.tright .btn{padding:8px 12px; font-size:13px;}
.hint{background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.28); padding:12px; border-radius:10px; font-size:13px; color:var(--ink);}
.badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid var(--border); background:var(--chip-bg); color:var(--chip-color);}
.badge.ok{background:rgba(22,163,74,.12); border-color:rgba(22,163,74,.25); color:#16a34a;}
.badge.bad{background:rgba(185,28,28,.12); border-color:rgba(185,28,28,.25); color:#b91c1c;}
.badge.star{background:rgba(245,158,11,.12); border-color:rgba(245,158,11,.25); color:#b45309;}
.badge.info{background:rgba(59,130,246,.12); border-color:rgba(59,130,246,.25); color:#2563eb;}
.badge.mut{background:rgba(148,163,184,.12); border-color:rgba(148,163,184,.25); color:var(--muted);}
html[data-theme="dark"] .badge.ok{ color:#4ade80; }
html[data-theme="dark"] .badge.bad{ color:#fca5a5; }
html[data-theme="dark"] .badge.star{ color:#fbbf24; }
html[data-theme="dark"] .badge.info{ color:#93c5fd; }

/* ===== Toast + modal de confirmação (ver guia-toasts.md) ===== */
@keyframes toastSubir {
  from { opacity: 0; transform: translateX(-50%) translateY(16px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,23,42,.55);
  display: none; align-items: center; justify-content: center;
  padding: 18px; z-index: 50;
}
.btn.ghost, .btn.secondary { background: var(--chip-bg); border-color: var(--chip-border); color: var(--chip-color); }
.btn.ghost:hover, .btn.secondary:hover { background: var(--brand-faded, #f5f3ff); border-color: var(--brand, #7c3aed); color: var(--brand-text, #6d28d9); }

/* ===== Dropdown de exportação (PDF / CSV) ===== */
.export-drop{
  display:none; flex-direction:column; position:absolute; right:0; top:calc(100% + 6px); z-index:200;
  background:var(--card); border:1.5px solid var(--border); border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.18); min-width:190px; padding:6px 0;
}
.export-drop .btn{
  width:100%; border-radius:0; border:none; justify-content:flex-start; padding:10px 16px; background:transparent;
}
/* ===== Ícone de dica (ⓘ) — tooltip por toque/clique, funciona igual em
   desktop e mobile (sem depender de hover). Texto mora inline, dentro do
   próprio .info-tip-bubble, junto de onde é usado. Bloco pensado pra ser
   copiado igual em outras páginas do módulo quando entrarem na fila. ===== */
.info-tip{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  width:16px; height:16px; margin-left:6px; border-radius:50%;
  border:1.5px solid currentColor; color:inherit; opacity:.72;
  font-size:11px; font-weight:700; font-style:italic; font-family:Georgia, "Times New Roman", serif;
  line-height:1; cursor:pointer; user-select:none; vertical-align:middle;
}
.info-tip:hover, .info-tip.open{ opacity:1; background:rgba(127,127,127,.18); }
.info-tip-bubble{
  display:none; position:absolute; z-index:60; left:0; top:calc(100% + 8px);
  width:min(260px, 70vw); padding:10px 12px; border-radius:10px;
  background:var(--card); border:1.5px solid var(--border); color:var(--text);
  box-shadow:0 8px 24px rgba(0,0,0,.18); font-size:13px; font-weight:400; line-height:1.4;
  white-space:normal; cursor:default;
}
.info-tip.open .info-tip-bubble{ display:block; }
</style>

<title>Histórico por Aluno</title>
</head>
<body>

<div id="header-placeholder"></div>

<div class="container">
<div class="card card-destaque">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;">
      <h2 style="margin:0;">Buscar aluno</h2>
      <a class="btn" href="pesquisa-ata.html">🔎 Pesquisar por turma</a>
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; margin-top:10px;">
      <div style="flex:1; min-width:200px;">
        <label>Nome do aluno
          <span class="info-tip" tabindex="0" onclick="event.stopPropagation(); document.querySelectorAll('.info-tip.open').forEach(o=>{ if(o!==this) o.classList.remove('open'); }); this.classList.toggle('open');">
            i
            <span class="info-tip-bubble">Caso não saiba exatamente o nome do aluno, pesquise-o na página anterior (pesquisa de atas) e volte aqui com o nome completo.</span>
          </span>
        </label>
        <input id="q" placeholder='Nome (começo) ou ID do aluno (ex: ALU-000123)' />
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding-bottom:2px;">
        <button class="btn btn-primary" type="button" onclick="buscar()">Pesquisar</button>
        <button class="btn btn-gray" type="button" onclick="limpar()">Limpar</button>
      </div>
    </div>
    <div class="muted" style="margin-top:10px;" id="dbInfo"></div>
  </div>

  <div class="split">
    <div class="card">
      <div class="details-title">
        <h3>Resultados</h3>
        <span class="muted" id="count"></span>
      </div>
      <div id="lista" class="list" style="margin-top:10px;">
        <div style="padding:12px;" class="hint">
          Digite um nome ou ID de aluno e clique em <b>Pesquisar</b>.
        </div>
      </div>
    </div>

    <div class="card">
      <div class="details-title">
        <h3>Detalhes do aluno</h3>
        <div style="position:relative;display:inline-block;" id="wrapExportHistorico">
          <button class="btn btn-primary" type="button" id="btnExportarSel" disabled>Exportar ▾</button>
          <div class="export-drop" id="dropExportHistorico">
            <button class="btn" type="button" id="btnExportarPdfSel">📄 Exportar PDF</button>
            <button class="btn" type="button" id="btnExportarCsvSel">📊 Exportar CSV</button>
          </div>
        </div>
      </div>
      <div id="detalhes" class="muted" style="margin-top:10px;">
        Selecione um aluno na lista para ver o histórico.
      </div>
    </div>
  </div>

  <!-- "Ver turma" inline — revelado ao clicar em "Ver turma" na timeline
       (ver abrirTurmaTabela). Renderiza o objeto `turma` que já está em
       memória (vindo de montarAlunoComOcorrencias), sem navegar pra
       outra página e sem leitura adicional. Só visualização: esta
       página não tem permissão de edição de turma (ver pendência de
       RBAC no handoff — cadastro-atas.html é gestor/admin-only). -->
  <div id="cardTurmaAberta" class="card" style="display:none; margin-top:16px;">
    <div class="details-title">
      <h3 id="turmaAbertaTitulo">Turma</h3>
      <button class="btn btn-gray" type="button" onclick="fecharTurmaAberta()">✕ Fechar</button>
    </div>
    <div class="muted" id="turmaAbertaMeta" style="margin-top:6px;"></div>
    <div class="muted" style="margin-top:4px;">Somente visualização — nada aqui é editado ou salvo.</div>
    <div class="table-scroll" style="margin-top:10px;">
      <table>
        <thead><tr id="theadTurmaAberta"></tr></thead>
        <tbody id="tbodyTurmaAberta"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 1. header-logic (sempre primeiro — monta header, tema, chip, auth guard) -->
<script src="../header-logic.js"></script>

<!-- Reaplica a cor de marca da escola (ThemeColors) — esta chamada existia no
     script de tema original e NÃO é coberta pelo header-logic.js. Sem ela,
     o chip da escola no header fica com a cor de fallback em vez da cor
     configurada para a escola. -->
<script>
(function(){
  function reaplicarCorMarca(){ if (window.ThemeColors) ThemeColors.apply(ThemeColors.get()); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', reaplicarCorMarca);
  else reaplicarCorMarca();
  document.addEventListener('auth:ready', reaplicarCorMarca);
})();
</script>

<!-- 2. Script específico da página (lógica de busca, detalhes e exportação PDF) -->
<script>
/* =========================
   Helpers / DB
========================= */
const $ = (id) => document.getElementById(id);

/* =========================
   Toasts padronizados (ver guia-toasts.md)
========================= */
function _showToast(msg, bg, shadow, duration){
  const existing = document.getElementById('_toastGlobal');
  if(existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = '_toastGlobal';
  toast.style.cssText =
    `position:fixed;bottom:28px;left:50%;transform:translateX(-50%);`+
    `display:flex;align-items:center;gap:12px;`+
    `background:${bg};color:#fff;font-family:'Nunito',sans-serif;`+

function setMsg(text, kind){
  const t = (text||"").toString();
  if(!t) return;
  if(kind === "err") _toastErro('⚠️ ' + t);
  else if(kind === "ok") _toastSucesso('✅ ' + t);
  else if(kind === "warn") _toastAviso('⚠️ ' + t);
  else if(kind === "loading") _toastCarregando('⏳ ' + t);
  else {
    console.warn('[toast] kind desconhecido:', JSON.stringify(kind), '— usando "aviso" (amarelo) como padrão seguro.');
    _toastAviso(t);
  }
}

// Card de destaque: decide texto claro/escuro pela luminância real da cor
// escolhida em perfil.html. Cálculo e o reajuste automático em troca de cor
// (evento "colorchange") agora vivem centralizados em theme-colors.js —
// ver ThemeColors.ajustarContraste() — não precisa mais duplicar a função
// nem registrar o listener aqui.

function normNome(s){
  return String(s || "")
    .trim()
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ");
}

function escapeHtml(s){
  return String(s||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

// Dados da escola (nome/endereço/escudo p/ cabeçalho do PDF) — carregados
// uma única vez no boot (1 leitura pontual, não é coleção) e guardados
// só em memória (variável do módulo), nunca em localStorage.
let _escolaCache = {};

function formatarListaBonita(arr){
  if (!arr || arr.length === 0) return "";
  if (arr.length === 1) return arr[0];
  if (arr.length === 2) return `${arr[0]} e ${arr[1]}`;
  return `${arr.slice(0, -1).join(", ")} e ${arr[arr.length - 1]}`;
}

function extrairAno(t){
  const a = String(t?.anoLetivo || "").trim();
  if (a) return a;
  const id = String(t?.id || "");
  const p = id.split("|");
  return (p[0] || "").trim();
}

function tituloTurma(t){
  const ano = extrairAno(t);
  const turno = String(t?.turno || "").trim();
  const serieTxt = String(t?.serieTexto || "").trim() || (Array.isArray(t?.seriesTurma) ? formatarListaBonita(t.seriesTurma) : "");
  const arq = String(t?.origemArquivo || t?.arquivo || "").trim();
  const base = `${serieTxt || "Série"} ${ano ? ano : ""}`.trim();
  const extras = [turno, arq ? `Arquivo: ${arq}` : ""].filter(Boolean).join(" • ");
  return { base, extras };
}

========================= */
let _alunoSelecionado = null; // aluno atualmente aberto no painel de detalhes

// Turmas podem ter um campo "id"/"turmaId" embutido no documento que nem
// sempre é igual ao _id real do Firestore (convenção legada já vista em
// gestão-atas.html: t.id || t.turmaId || t._id). Por isso, se a leitura
// direta pelo _id não achar nada, cai pra uma query filtrada (ainda
// pontual, não escaneia a coleção) pelos campos legados.
async function _buscarTurmaPorId(turmaId){
  const id = String(turmaId || "").trim();
  if (!id) return null;
  try{
    const porDocId = await window.DB.turmas.get(id);
    if (porDocId) return { ...porDocId, id: porDocId.id || porDocId._id };
  }catch(e){ console.warn('historico-aluno: turmas.get falhou', e); }
  try{
    let res = await window.DB.turmas.whereEquals('id', id, { limit: 1 });
    if (!res || !res.length) res = await window.DB.turmas.whereEquals('turmaId', id, { limit: 1 });
    if (res && res[0]) return { ...res[0], id: res[0].id || res[0]._id };
  }catch(e){ console.warn('historico-aluno: turmas.whereEquals falhou', e); }
  return null;
}

// Monta o mesmo formato de "aluno" que o resto do arquivo (render, PDF,
// CSV) já espera — só que buscando ao vivo, pontual, em vez de escanear
// turmasDB inteiro. Custo por busca: 1 query em matriculas (filtrada por
// alunoId) + 1 leitura por turma que esse aluno específico cursou.
async function montarAlunoComOcorrencias(candidato){
  const alunoId = String(candidato.alunoId || "").trim();
  const display = candidato.nome || alunoId;
  const nomeKey = normNome(display);

  const matriculas = await window.DB.matriculas.whereEquals('alunoId', alunoId);
  const turmaIds = Array.from(new Set(
    (matriculas || []).map(m => String(m?.turmaId || "").trim()).filter(Boolean)
  ));

  const turmas = (await Promise.all(turmaIds.map(_buscarTurmaPorId))).filter(Boolean);

  const ocorrencias = [];
  for (const t of turmas){
    const ano = extrairAno(t);
    const turno = String(t?.turno || "").trim();
    const serieTurma = String(t?.serieTexto || "").trim() || (Array.isArray(t?.seriesTurma) ? formatarListaBonita(t.seriesTurma) : "");
    const alunos = Array.isArray(t?.alunos) ? t.alunos : [];

    // mesmo fallback de 3 níveis usado na exportação: alunoId exato →
    // nome normalizado exato → nome normalizado "contém" (nomes legados
    // inconsistentes, sem alunoId gravado na linha da turma).
    const alvo = alunos.find(a => String(a?.alunoId||"").trim() === alunoId)
      || alunos.find(a => normNome(a?.nome) === nomeKey)
      || alunos.find(a => normNome(a?.nome).includes(nomeKey))
      || null;
    if (!alvo) continue; // matrícula aponta pra essa turma, mas a linha não foi encontrada

    const nomeRaw = String(alvo?.nome || "").trim();
    ocorrencias.push({
      turmaId: t.id,
      ano: ano || "",
      turno: turno || "",
      serie: String(alvo?.serie || "").trim() || serieTurma || "",
      resultado: String(alvo?.resultado || "Não informado"),
      nomeRaw,
      nomeKey: normNome(nomeRaw),
      alunoId,
      turma: t
    });
  }

  const anosNum = ocorrencias.map(o => parseInt(String(o.ano||"0"),10)).filter(n => !isNaN(n) && n>0);
  return {
    key: `ID:${alunoId}`,
    alunoId,
    nomeKey,
    display,
    ocorrencias,
    minAno: anosNum.length ? Math.min(...anosNum) : null,
    maxAno: anosNum.length ? Math.max(...anosNum) : null,
    qtd: ocorrencias.length
  };
}

// Regex bem permissiva pro padrão de alunoId usado no sistema (ex.: ALU-000123)
const _RE_ALUNO_ID = /^ALU-?\d+$/i;

async function buscar(){
  const termoRaw = $("q").value;
  const termo = termoRaw.trim();

  if (!termo){
    setMsg("Digite o nome ou ID do aluno.", "warn");
    return;
  }

  $("lista").innerHTML = `<div style="padding:12px;" class="hint">Buscando…</div>`;
  $("count").textContent = "";

  let candidatos = [];
  try{
    if (_RE_ALUNO_ID.test(termo)){
      const um = await window.Identidade.buscarAtasPorId(termo);
      candidatos = um ? [um] : [];
    } else {
      candidatos = await window.Identidade.buscarAtasPorNome(termo);
    }
  }catch(e){
    console.error('historico-aluno: falha na busca', e);
    $("lista").innerHTML = `<div style="padding:12px;" class="hint">Erro ao buscar. Tente de novo.</div>`;
    setMsg("Erro ao buscar aluno.", "err");
    return;
  }

  $("count").textContent = `${candidatos.length} resultado(s)`;

  if (!candidatos.length){
    $("lista").innerHTML = `<div style="padding:12px;" class="hint">Nenhum aluno encontrado para <b>${escapeHtml(termoRaw)}</b>.<br/>
      A busca por nome procura só pelo <b>começo</b> do nome (ex.: "maria" acha "Maria Silva", mas não acha por "silva" sozinho).</div>`;
    return;
  }

  $("lista").innerHTML = candidatos.map(a => {
    const idBadge = a.alunoId ? `<span class="pill">${escapeHtml(a.alunoId)}</span>` : ``;
    return `
      <div class="item" onclick="selecionarAluno('${escapeHtml(a.alunoId)}')">
        <div>
          <div class="title">${escapeHtml(a.nome)} ${idBadge}</div>
          <div class="sub">Clique para abrir o histórico</div>
        </div>
        <div class="right">
          <button class="btn btn-gray" type="button" onclick="event.stopPropagation(); selecionarAluno('${escapeHtml(a.alunoId)}')">Abrir</button>
        </div>
      </div>
    `;
  }).join("");

  // guarda os candidatos crus (nome/alunoId) pra montar o histórico só
  // quando o aluno for de fato selecionado — evita ler matriculas/turmas
  // de todo mundo que aparece na lista.
  window._candidatosBusca = new Map(candidatos.map(a => [a.alunoId, a]));
}




async function selecionarAluno(alunoId){
  const candidato = (window._candidatosBusca && window._candidatosBusca.get(alunoId))
    || { alunoId, nome: alunoId };

  $("detalhes").innerHTML = `<span class="muted">Carregando histórico…</span>`;
  $("btnExportarSel").disabled = true;
  fecharTurmaAberta();

  let aluno;
  try{
    aluno = await montarAlunoComOcorrencias(candidato);
  }catch(e){
    console.error('historico-aluno: falha ao montar histórico do aluno', e);
    $("detalhes").innerHTML = `<span class="muted">Erro ao carregar o histórico. Tente de novo.</span>`;
    setMsg("Erro ao carregar histórico do aluno.", "err");
    return;
  }

  _alunoSelecionado = aluno;
  $("btnExportarSel").disabled = false;

  if (!aluno.ocorrencias.length){
    $("detalhes").innerHTML = `
      <div style="font-size:18px; font-weight:900;">${escapeHtml(aluno.display)}</div>
      <div class="muted" style="margin-top:8px;">Nenhuma ocorrência em turmas de ata encontrada pra esse aluno.</div>
    `;
    return;
  }

  // ordena ocorrências por ano
  const occ = aluno.ocorrencias.slice().sort((x,y)=>{
    const ax = parseInt(String(x.ano||"0"),10) || 0;
    const ay = parseInt(String(y.ano||"0"),10) || 0;
    if (ax !== ay) return ax - ay;
    return String(x.serie||"").localeCompare(String(y.serie||""), "pt-BR");
  });

  const faixa = (aluno.minAno && aluno.maxAno) ? `${aluno.minAno}–${aluno.maxAno}` : "—";

  // monta timeline e inclui "lacunas" (ausência) quando fizer sentido (anos numéricos)
  const anos = occ.map(o => parseInt(String(o.ano||"0"),10)).filter(n => !isNaN(n) && n>0).sort((a,b)=>a-b);
  const lacunas = [];
  if (anos.length >= 2){
    let prev = anos[0];
    for (let i=1;i<anos.length;i++){
      const cur = anos[i];
      if (cur - prev > 1) lacunas.push([prev+1, cur-1]);
      prev = cur;
    }
  }

  // cria um set para saber quais anos existem
  const anosSet = new Set(anos);

  const rows = [];
  // percorre do menor ao maior ano para inserir lacunas no meio
  const minA = anos.length ? Math.min(...anos) : null;
  const maxA = anos.length ? Math.max(...anos) : null;

  if (minA && maxA){
    for (let a=minA; a<=maxA; a++){
      if (!anosSet.has(a)){
        // só cria blocos compactos (a..b)
        const l = lacunas.find(([x,y])=>a>=x && a<=y);
        if (l && a===l[0]) rows.push({ tipo:"ausencia", de:l[0], ate:l[1] });
        continue;
      }
      // adiciona todas ocorrências desse ano
      occ.filter(o => parseInt(String(o.ano||"0"),10)===a).forEach(o => rows.push({ tipo:"oc", o }));
    }
  } else {
    // sem anos numéricos, só lista
    occ.forEach(o => rows.push({ tipo:"oc", o }));
  }

  $("detalhes").innerHTML = `
    <div>
      <div style="font-size:18px; font-weight:900;">${escapeHtml(aluno.display)}</div>
      <div class="muted">Período: <b>${faixa}</b> • Registros: <b>${aluno.qtd}</b></div>
      <div class="timeline">
        ${rows.map(r => {
          if (r.tipo === "ausencia") return renderAusencia(r.de, r.ate);
          const o = r.o;
          const t = o.turma;
          const tt = tituloTurma(t);

          const badge = badgeResultado(o.resultado);
          const encontrado = (o.nomeRaw && normNome(o.nomeRaw) !== normNome(aluno.display))
            ? `<span class="pill">encontrado: ${escapeHtml(o.nomeRaw)}</span>`
            : ``;

          return `
            <div class="trow">
              <div class="tleft">
                <b>${escapeHtml(o.ano || "?")} — ${escapeHtml(o.serie || "?")} — ${escapeHtml(o.turno || "?")} ${badge}</b>
                <div class="muted">${escapeHtml(tt.base)}${tt.extras ? " • " + escapeHtml(tt.extras) : ""} ${encontrado}</div>
              </div>
              <div class="tright">
                <button class="btn btn-gray" type="button" onclick="abrirTurmaTabela('${escapeHtml(t.id)}')">Ver turma</button>
                <button class="btn btn-primary" type="button" onclick="exportarOcorrencia('${escapeHtml(t.id)}','${escapeHtml(aluno.alunoId)}')">Exportar ano</button>
              </div>
            </div>
          `;
        }).join("")}
      </div>
      <div class="muted" style="margin-top:10px;">
        “Ver turma” abre a tabela completa da turma aqui mesmo, sem sair desta página.
      </div>
    </div>
  `;
}


// Colunas da turma (schema real, com o mesmo fallback de 8 matérias já
// usado no resto do arquivo) — reaproveita mergeSchemaColumns passando
// uma "lista de ocorrências" de 1 item só, pra não duplicar a lógica de
// ler schemaSnapshot/fallback que já existe pra exportação.
function _colunasDaTurmaAberta(t){
  return mergeSchemaColumns([{ turma: t }]);
}

function fecharTurmaAberta(){
  const card = $("cardTurmaAberta");
  if (card) card.style.display = "none";
}

// "Ver turma": não navega (cadastro-turma.html não existe — era
// cadastro-turmas.html — e cadastro-atas.html, a página certa, é
// gestor/admin-only enquanto esta página é acessível a user comum).
// Em vez disso, abre um card na própria página com a tabela completa
// da turma, usando o `turma` que já está em memória em
// _alunoSelecionado.ocorrencias (zero leitura adicional). Só leitura:
// esta página não grava nada em turma nenhuma.
function abrirTurmaTabela(turmaId){
  const o = (_alunoSelecionado?.ocorrencias || []).find(x => String(x.turmaId) === String(turmaId));
  if (!o || !o.turma){
    setMsg("Não foi possível abrir essa turma — dados não encontrados em memória.", "err");
    return;
  }
  const t = o.turma;
  const schema = t.schemaSnapshot || null;
  const serieAtiva = schema ? (schema.serieAtiva !== false) : true;
  const resultadoAtivo = schema ? (schema.resultadoAtivo !== false) : true;
  const cols = _colunasDaTurmaAberta(t);
  const alunos = Array.isArray(t.alunos) ? t.alunos : [];

  const tt = tituloTurma(t);
  $("turmaAbertaTitulo").textContent = tt.base + (tt.extras ? " — " + tt.extras : "");
  $("turmaAbertaMeta").innerHTML =
    `ID: ${escapeHtml(t.id || turmaId)}` +
    (t.origemArquivo ? ` • Arquivo: ${escapeHtml(t.origemArquivo)}` : "") +
    ` • ${alunos.length} aluno(s)`;

  let headHtml = `<th>Nº</th><th>Nome</th>`;
  if (serieAtiva) headHtml += `<th>Série</th>`;
  cols.forEach(c => { headHtml += `<th>${escapeHtml(c.label || c.key)}</th>`; });
  if (resultadoAtivo) headHtml += `<th>Resultado</th>`;
  $("theadTurmaAberta").innerHTML = headHtml;

  // destaca a linha do aluno cujo histórico está aberto, mesmo critério
  // de match em 2 níveis usado em _construirHeadBodyHistorico (alunoId
  // exato, senão nome normalizado exato).
  const keyNome = o.nomeKey || normNome(o.nomeRaw);
  const tbody = $("tbodyTurmaAberta");
  tbody.innerHTML = "";
  alunos.forEach((a, idx) => {
    const isAlvo = (o.alunoId && String(a?.alunoId||"").trim() === String(o.alunoId||"").trim())
      || (keyNome && normNome(a?.nome) === keyNome);
    const tr = document.createElement("tr");
    if (isAlvo) tr.style.fontWeight = "800";
    let html = `<td>${idx+1}</td><td>${escapeHtml(a?.nome || "")}</td>`;
    if (serieAtiva) html += `<td>${escapeHtml(a?.serie || "")}</td>`;
    cols.forEach(c => { html += `<td>${escapeHtml(a?.[c.key] ?? "--")}</td>`; });
    if (resultadoAtivo) html += `<td>${escapeHtml(a?.resultado ?? "Não informado")}</td>`;
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });

  $("cardTurmaAberta").style.display = "block";
  $("cardTurmaAberta").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

   - Coluna "ANO" antes do Nº / Nome
   - Colunas são a UNIÃO dos schemas das turmas encontradas (faltantes viram "--")
========================= */
function exportarHistoricoSelecionado(){

function exportarOcorrencia(turmaId, alunoId){
  const aluno = _alunoSelecionado;
  if (!aluno || aluno.alunoId !== alunoId) return;

  const occ = aluno.ocorrencias.filter(o => o.turmaId === turmaId);
  if (!occ.length) { setMsg("Ocorrência não encontrada.", "warn"); return; }

  exportarHistoricoAlunoPDF(aluno, [occ[0]]);
}

function _ordenarOcorrenciasHistorico(aluno, somenteOcc){
  return (somenteOcc && somenteOcc.length) ? somenteOcc : aluno.ocorrencias.slice().sort((x,y)=>{
    const ax = parseInt(String(x.ano||"0"),10) || 0;
    const ay = parseInt(String(y.ano||"0"),10) || 0;
    if (ax !== ay) return ax - ay;
    return String(x.serie||"").localeCompare(String(y.serie||""), "pt-BR");
  });
}

// Monta nome de arquivo: [prefixo]_[aluno]_[DD-MM-AAAA].[ext] — mesmo padrão
// usado no restante do sistema (ver _buildFilename em pesquisa-ano-ativo.html)
function _nomeArquivoHistorico(prefixo, alunoDisplay, ext){
  const hoje = new Date();
  const d = String(hoje.getDate()).padStart(2,'0');
  const m = String(hoje.getMonth()+1).padStart(2,'0');
  const a = hoje.getFullYear();
  const safe = String(alunoDisplay||'aluno')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\w\d]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'').slice(0,40) || 'aluno';
  return `${prefixo}_${safe}_${d}-${m}-${a}.${ext}`;
}

// Cabeçalho institucional no estilo novo do sistema (logo + nome em azul +
// linha separadora + título do relatório) — mesma linguagem visual usada
// em pesquisa-ano-ativo.html (_desenharCabecalhoEscola), adaptada pra
// unidades em mm (esta página gera o PDF em "mm", não em "pt").
function desenharCabecalhoHistoricoNovo(doc, escola, tituloRelatorio, subtitulo){
  const pageW = doc.internal.pageSize.getWidth();
  const L = 12, R = pageW - 12;
  let y = 14;

  let logoW = 0;
  if (escola?.escudo){
    try { doc.addImage(escola.escudo, "PNG", L, y, 20, 20); logoW = 24; } catch {}
  }

  const tx = L + logoW;
  const nomeEscola = (escola?.nome || "Nome da Escola").toString();
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(11,63,191);
  doc.text(nomeEscola.toUpperCase(), tx, y+6);

  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(60);
  let subY = y+12;
  if (escola?.endereco){ doc.text(String(escola.endereco), tx, subY); subY += 5; }
  y = Math.max(y+22, subY+2);

  doc.setDrawColor(11,63,191); doc.setLineWidth(0.6);
  doc.line(L, y, R, y);
  y += 6;

  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(20);
  doc.text(tituloRelatorio, L, y);
  if (subtitulo){
    y += 5.5;
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(80);
    doc.text(subtitulo, L, y);
  }
  doc.setTextColor(0);
  return y + 8;
}

function mergeSchemaColumns(occList){
  // Retorna lista única de colunas (subjects) mantendo ordem de primeira aparição
  const seen = new Set();
  const out = [];
  const fallback = [
    { key:"port",  label:"port" },
    { key:"mat",   label:"mat" },
    { key:"hist",  label:"hist" },
    { key:"geo",   label:"geo" },
    { key:"cien",  label:"cien" },
    { key:"fis",   label:"fis" },
    { key:"arte",  label:"arte" },
    { key:"relig", label:"relig" },
  ];

  for (const o of occList){
    const t = o.turma;
    const schema = t?.schemaSnapshot || null;
    const cols = (schema && Array.isArray(schema.colunas))
      ? schema.colunas.filter(c => c && c.enabled !== false).map(c => ({ key: c.key, label: (c.label||c.key||"").toString() }))
      : fallback;

    for (const c of cols){
      const k = String(c.key || "").trim();
      if (!k) continue;
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ key: k, label: String(c.label || k).trim() });
    }
  }
  return out;
}

// Dados (head/body) compartilhados entre a exportação em PDF e em CSV —
// assim as duas sempre mostram exatamente as mesmas colunas/linhas.
function _construirHeadBodyHistorico(aluno, occList){
  // Determina se alguma turma desativa série/resultado; aqui a gente inclui por utilidade no histórico:
  // - Série: sempre (ajuda a leitura)
  // - Resultado final: inclui se existir em qualquer ocorrência
  let resultadoExiste = false;
  for (const o of occList){
    const t = o.turma;
    const schema = t?.schemaSnapshot || null;
    const resultadoAtivo = schema ? (schema.resultadoAtivo !== false) : true;
    if (resultadoAtivo) { resultadoExiste = true; break; }
  }

  const colsMaterias = mergeSchemaColumns(occList);

  const head = ["ANO", "Nº", "NOME DO ALUNO", "SÉRIE"]
    .concat(colsMaterias.map(c => (c.label || c.key || "").toString().toUpperCase()))
    .concat(resultadoExiste ? ["RESULTADO FINAL"] : []);

  // constrói as linhas (1 linha por ocorrência/ano)
  const body = occList.map(o => {
    const t = o.turma;
    const alunos = Array.isArray(t?.alunos) ? t.alunos : [];

    // match do aluno: 1) exato pela chave 2) contém (para casos de nomes inconsistentes)
    // tenta localizar o aluno dentro da turma:
    // 1) se existir alunoId, casa por alunoId
    // 2) senão, casa por nome normalizado (comportamento antigo)
    const keyNome = aluno.nomeKey || (String(aluno.key||"").startsWith("NM:") ? String(aluno.key).slice(3) : "");
    const alvo = alunos.find(a => aluno.alunoId && String(a?.alunoId||"").trim() === String(aluno.alunoId||"").trim())
      || alunos.find(a => keyNome && normNome(a?.nome) === keyNome)
      || alunos.find(a => keyNome && normNome(a?.nome).includes(keyNome))
      || null;
    const idx = alvo ? (alunos.indexOf(alvo) + 1) : "";

    const ano = String(o.ano || extrairAno(t) || "").trim();
    const nome = alvo?.nome ? String(alvo.nome) : aluno.display;
    const serie = String(alvo?.serie || o.serie || "").trim();

    const row = [ano, String(idx || ""), nome, serie];

    colsMaterias.forEach(c => {
      row.push(String(alvo?.[c.key] ?? "--"));
    });

    if (resultadoExiste){
      row.push(String(alvo?.resultado ?? "Não informado"));
    }

    return row;
  });

  return { head, body };
}

// Desenho da tabela no PDF — estilo novo do sistema (cabeçalho azul,
// linhas alternadas, fonte helvetica), mesma linguagem visual de
// _TABLE_STYLES em pesquisa-ano-ativo.html.
function _desenharTabelaHistoricoPDF(doc, head, body, startY){
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 10;
  const usableW = pageW - margin * 2;

  // larguras fixas para Ano/Nº/Nome/Série; resto divide igualmente
  const wAno = 18;
  const wNum = 10;
  const wNome = 70;
  const wSerie = 18;

  const fixed = wAno + wNum + wNome + wSerie;
  const restCols = Math.max(1, head.length - 4);
  const wRest = Math.max(8, (usableW - fixed) / restCols);

  const colStyles = {};
  colStyles[0] = { cellWidth: wAno, halign: "center" };
  colStyles[1] = { cellWidth: wNum, halign: "center" };
  colStyles[2] = { cellWidth: wNome, halign: "left" };
  colStyles[3] = { cellWidth: wSerie, halign: "center" };
  for (let c = 4; c < head.length; c++) colStyles[c] = { cellWidth: wRest, halign: "center" };

  doc.autoTable({
    startY,
    theme: "grid",
    tableWidth: usableW,
    margin: { left: margin, right: margin },
    head: [head],
    body,
    styles: { font: "helvetica", fontSize: 8.5, halign: "center", valign: "middle", lineColor: [210,220,240], lineWidth: 0.3 },
    headStyles: { fillColor: [11,63,191], textColor: 255, fontStyle: "bold" },
    alternateRowStyles: { fillColor: [243,246,255] },
    bodyStyles: { textColor: [30,30,50] },
    columnStyles: colStyles
  });
}

// Exportação em PDF — cabeçalho institucional + tabela, no estilo novo
// (equivalente ao "Exportar PDF" da lista de alunos em pesquisa-ano-ativo.html)
function exportarHistoricoAlunoPDF(aluno, somenteOcc=null){
  if (!window.jspdf || !window.jspdf.jsPDF || typeof window.jspdf.jsPDF !== "function"){
    setMsg("Falha ao carregar jsPDF. Verifique sua conexão.", "err");
    return;
  }

  const occ = _ordenarOcorrenciasHistorico(aluno, somenteOcc);
  if (!occ.length){ setMsg("Nenhuma ocorrência para exportar.", "warn"); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("l","mm","a4");
  const escola = _escolaCache;

  const startY = desenharCabecalhoHistoricoNovo(doc, escola, "ATA DE RESULTADOS FINAIS", `Histórico do aluno — ${aluno.display}`);
  const { head, body } = _construirHeadBodyHistorico(aluno, occ);
  _desenharTabelaHistoricoPDF(doc, head, body, startY);

  doc.save(_nomeArquivoHistorico("Historico", aluno.display, "pdf"));
  setMsg("PDF exportado com sucesso!", "ok");
}

// Exportação em CSV — puro, sem estilo (mesmo padrão de exportCsvCompleto
// em pesquisa-ano-ativo.html: aspas + ; + BOM UTF-8 pra abrir certo no Excel)
function exportarHistoricoCSV(aluno, somenteOcc=null){
  const occ = _ordenarOcorrenciasHistorico(aluno, somenteOcc);
  if (!occ.length){ setMsg("Nenhuma ocorrência para exportar.", "warn"); return; }

  const { head, body } = _construirHeadBodyHistorico(aluno, occ);
  const linhas = [head, ...body];
  const csv = linhas
    .map(cols => cols.map(v => `"${String(v||"").replace(/"/g,'""')}"`).join(";"))
    .join("\r\n");

  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = _nomeArquivoHistorico("Historico", aluno.display, "csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  setMsg("CSV exportado com sucesso!", "ok");
}


/* =========================
   Boot
========================= */
document.addEventListener("DOMContentLoaded", async () => {
  // Sem pré-carga: nada de ler coleções inteiras nem gravar em localStorage
  // no boot. Busca e histórico são 100% sob demanda (ver buscar() e
  // montarAlunoComOcorrencias()). Qualquer erro aqui não pode deixar a tela
  // de loading presa pra sempre — por isso o finally com Loading.esconder(),
  // mesmo padrão já usado no boot de cadastro-turmas.html.
  try{
    await new Promise(res=>{
      if(window.Auth && window.Auth.getSession && window.Auth.getSession()) return res();
      document.addEventListener('auth:ready', res, {once:true});
    });

    // Dados da escola (nome/endereço/escudo pro cabeçalho do PDF) — 1
    // leitura pontual, feita uma vez, guardada só em memória.
    try{ _escolaCache = (await window.DB.escola.get()) || {}; }
    catch(e){ console.warn('historico-aluno: falha ao carregar dados da escola', e); _escolaCache = {}; }

    const nomeEscola = (_escolaCache.displayName || _escolaCache.name || _escolaCache.nome || DB.getActiveSchoolId()).toString().trim();
    $("dbInfo").textContent = `Escola: ${nomeEscola} • busca em tempo real, sem cache local`;

    if (window.ThemeColors) ThemeColors.ajustarContraste();

    // Enter no input dispara busca
    $("q").addEventListener("keydown", (ev)=>{
      if (ev.key === "Enter"){ ev.preventDefault(); buscar(); }
    });

    // Ícone(s) de dica (ⓘ) — fecha qualquer um aberto ao clicar fora.
    // Mesmo padrão do dropdown "Exportar ▾" logo abaixo.
    document.addEventListener("click", ()=>{
      document.querySelectorAll(".info-tip.open").forEach(el => el.classList.remove("open"));
    });

    // Dropdown "Exportar ▾" (PDF / CSV) do painel de detalhes do aluno
    (function(){
      const btn  = $("btnExportarSel");
      const drop = $("dropExportHistorico");
      btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        drop.style.display = (drop.style.display === "flex") ? "none" : "flex";
      });
      document.addEventListener("click", ()=>{ drop.style.display = "none"; });
      drop.addEventListener("click", (e)=> e.stopPropagation());
      $("btnExportarPdfSel").addEventListener("click", ()=>{ drop.style.display = "none"; exportarHistoricoSelecionadoPDF(); });
      $("btnExportarCsvSel").addEventListener("click", ()=>{ drop.style.display = "none"; exportarHistoricoSelecionadoCSV(); });
    })();
  }catch(e){
    console.error('historico-aluno: erro ao inicializar a página', e);
    setMsg('Erro ao carregar a página. Recarregue e tente de novo.', 'err');
  }finally{
    // Sempre esconde a tela de loading, mesmo se o boot falhar.
    Loading.esconder();
  }
});
</script>
