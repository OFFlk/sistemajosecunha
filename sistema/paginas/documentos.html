<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="../icon.png" type="image/png"/>

<!-- Tema antecipado (manter — evita flash de tema errado) -->
<script>
(function(){
  var saved = (localStorage.getItem('ui_theme_v1') || '').toLowerCase();
  var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<!-- Scripts globais -->
<script src="../auth.firebase.js"></script>
<script src="../theme-colors.js"></script>

<!-- Fonte -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- CSS globais -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/components.css">

<!-- CSS de família desta página (hub de cards) -->
<link rel="stylesheet" href="/css/hub.css">

<!-- CSS específico desta página (só o que não está nos globais) -->
<style>
  /* ── tooltip para cards bloqueados (posicionamento via JS/fixed) ── */
  .card[data-tooltip] {
    position: relative;
  }
  /* grid 1 linha x 2 colunas (módulo com uma única página ativa) */
  .grid-atas.grid-docs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 700px) { .grid-atas.grid-docs { grid-template-columns: 1fr; } }
</style>

<title>Documentos • Menu</title>
</head>
<body>

<div id="header-placeholder"></div>

<div class="container">
  <div class="l-section">
    <div class="l-slabel">// relatórios</div>
    <div class="l-sline"></div>
  </div>
  <div class="grid-atas grid-docs">

    <a class="card" href="/paginas/historico_auto.html">
      <span class="card-badge">Admin/Gestor</span>
      <div class="card-icon">👤</div>
      <div class="card-title">Histórico por aluno</div>
      <div class="card-footer">
        <div class="card-desc">Pesquise um aluno e exporte um PDF com todos os anos encontrados no banco.</div>
      </div>
    </a>

    <div class="card disabled" data-tooltip="Em desenvolvimento">
      <span class="card-badge">Em breve</span>
      <div class="card-icon">📋</div>
      <div class="card-title">Ata da turma</div>
      <div class="card-footer">
        <div class="card-desc">Abra uma turma pela pesquisa e exporte o PDF individual ou em lote.</div>
      </div>
    </div>

  </div>
</div>



<!-- 1. header-logic (sempre primeiro — monta header, tema, chip, auth guard) -->
<script src="../header-logic.js"></script>

<!-- 2. Script específico da página (tooltip dos cards bloqueados) -->
<script>
(function(){
  /* ── tooltip flutuante via position:fixed ──────────────────────────────
     Motivo: cards disabled têm opacity < 1; qualquer filho herda essa
     opacidade, tornando o tooltip invisível. Com position:fixed o elemento
     sai do stacking context do card e é renderizado no topo da página.
  ──────────────────────────────────────────────────────────────────────── */

  var bubble = null; /* único tooltip reutilizado */

  function getBrandColor(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    /* Lê direto do ThemeColors.palettes para garantir o valor correto,
       independente do timing do getComputedStyle */
    const key     = (window.ThemeColors && window.ThemeColors.get) ? window.ThemeColors.get() : 'violet';
    const palette = (window.ThemeColors && window.ThemeColors.palettes && window.ThemeColors.palettes[key])
                    || { '--brand': '#7c3aed', '--brand-d': '#7c3aed' };
    const color = dark
      ? (palette['--brand-d'] || '#7c3aed')
      : (palette['--brand']   || '#7c3aed');
    return { color, dark };
  }

  /* Aplica apenas as propriedades visuais — nunca toca em opacity nem transform,
     para não interferir na animação de entrada/saída do tooltip */
  function stylesBubble(b){
    const { color, dark } = getBrandColor();
    b.style.background  = color;
    const fg = getComputedStyle(document.documentElement).getPropertyValue('--brand-fg').trim();
    b.style.color       = fg || (dark ? '#f0f0f8' : '#ffffff');
  }

  function initBubble(b){
    b.style.cssText = [
      'position:fixed',
      'z-index:9999',
      'pointer-events:none',
      'opacity:0',
      'transition:opacity 0.15s ease, transform 0.15s ease',
      'transform:translateX(-50%) translateY(4px)',
      'font-size:12px',
      'font-family:inherit',
      'font-weight:700',
      'letter-spacing:0.04em',
      'text-transform:uppercase',
      'white-space:nowrap',
      'padding:5px 12px',
      'border-radius:6px',
    ].join(';');
    stylesBubble(b); /* aplica cor inicial */
  }

  function ensureBubble(){
    if(bubble) return bubble;
    bubble = document.createElement('span');
    initBubble(bubble);
    document.body.appendChild(bubble);
    return bubble;
  }

  function positionBubble(card){
    const rect = card.getBoundingClientRect();
    bubble.style.left = (rect.left + rect.width / 2) + 'px';
    bubble.style.top  = (rect.top - 8) + 'px'; /* 8px acima do topo do card */
    bubble.style.transform = 'translateX(-50%) translateY(-100%)';
  }

  function showTooltip(e){
    const card = e.currentTarget;
    const b = ensureBubble();
    b.textContent = card.getAttribute('data-tooltip');
    stylesBubble(b);       /* só cor — não toca opacity nem transform */
    positionBubble(card);
    /* força um frame antes de mostrar, garantindo que a transição CSS anime */
    requestAnimationFrame(function(){
      b.style.opacity   = '1';
      b.style.transform = 'translateX(-50%) translateY(-100%)';
    });
  }

  function hideTooltip(){
    if(bubble) bubble.style.opacity = '0';
  }

  function initCards(){
    document.querySelectorAll('.card[data-tooltip]').forEach(function(card){
      card.addEventListener('mouseenter', showTooltip);
      card.addEventListener('mouseleave', hideTooltip);
    });
  }

  /* Reaplica cor quando tema ou paleta mudam (tooltip pode estar visível) */
  function onThemeChange(){
    if(bubble && bubble.style.opacity === '1'){
      stylesBubble(bubble);
    }
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initCards);
  else initCards();

  new MutationObserver(onThemeChange)
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('colorchange', onThemeChange);
})();
</script>

</body>
</html>
