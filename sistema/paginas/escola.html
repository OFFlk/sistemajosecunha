<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="../icon.png" type="image/png"/>

<!-- Tema antecipado (evita flash de tema errado) -->
<script>
(function(){
  const saved = (localStorage.getItem('ui_theme_v1') || '').toLowerCase();
  document.documentElement.setAttribute('data-theme', (saved === 'dark' || saved === 'light') ? saved : 'light');
})();
</script>

<!-- Scripts globais -->
<script src="../loading-overlay.js"></script>
<script src="../auth.firebase.js"></script>
<script src="../db.firebase.js"></script>
<script src="../theme-colors.js"></script>

<!-- Fonte -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- CSS globais (ordem fixa: base → header → components) -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/components.css">
<!-- CSS específico desta página (módulo) — pendente de limpeza, ver relatório -->
<link rel="stylesheet" href="/css/escola_form.css">

<title>Informações da Escola</title>
<style>
/* ── Só o que é DESTA página: layout e componentes próprios ── */

/* layout */
.mb-16{ margin-bottom:16px; }

/* campos desabilitados (guarda de role): mantém o hover para o balão "Sem acesso" funcionar */
[data-tooltip]:disabled{ pointer-events:auto; }
input[type="file"]:disabled{ cursor:not-allowed; }

/* pré-visualização do escudo: clicável (abre o lightbox) */
#escudoPreview{ cursor:pointer; }

/* balão "Sem acesso" nos controles desabilitados (criado por JS; posição dinâmica via style.left/top) */
.sem-acesso-bubble{
  position:fixed; z-index:9999; pointer-events:none;
  opacity:0; transition:opacity .15s ease;
  transform:translateX(-50%) translateY(-100%);
  padding:5px 12px; border-radius:6px;
  font-size:12px; font-weight:700; font-family:inherit;
  letter-spacing:.04em; text-transform:uppercase; white-space:nowrap;
  background:var(--ui-brand); color:var(--ui-brand-fg);
}
.sem-acesso-bubble.show{ opacity:1; }

/* lightbox do escudo */
.lightbox{
  position:fixed; inset:0; z-index:9998;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.82); cursor:zoom-out;
}
.lightbox img{
  max-width:90vw; max-height:90vh; border-radius:10px;
  box-shadow:0 8px 40px rgba(0,0,0,.6); user-select:none;
}
</style>
</head>
<body>

<div id="header-placeholder"></div>

<main class="wrap">
  <div class="card">

    <h2 class="section-title">Dados Escolares</h2>

    <div class="form">

      <div class="field">
        <label for="nomeEscola">Nome da escola <span class="req">*</span>
          <span class="info-tip" tabindex="0" onclick="event.stopPropagation(); event.preventDefault(); document.querySelectorAll('.info-tip.open').forEach(o=>{ if(o!==this) o.classList.remove('open'); }); this.classList.toggle('open');">
            i
            <span class="info-tip-bubble wide">Informe o nome completo da escola. Esse nome será exibido nas exportações de listas, documentos, fichas e demais exportações em todo o sistema.</span>
          </span>
        </label>
        <input type="text" id="nomeEscola" required>
      </div>

      <div class="field">
        <label for="enderecoEscola">Endereço <span class="req">*</span>
          <span class="info-tip" tabindex="0" onclick="event.stopPropagation(); event.preventDefault(); document.querySelectorAll('.info-tip.open').forEach(o=>{ if(o!==this) o.classList.remove('open'); }); this.classList.toggle('open');">
            i
            <span class="info-tip-bubble">Especifique rua, povoado, bairro, número etc. O que informar aqui fica a critério do gestor.</span>
          </span>
        </label>
        <input type="text" id="enderecoEscola" required>
      </div>

      <div class="field">
        <label for="cidadeEscola">Município/Cidade</label>
        <input type="text" id="cidadeEscola" placeholder="Ex.: Valente" required>
      </div>

      <div class="field">
        <label for="ufEscola">UF</label>
        <select id="ufEscola" required>
          <option value=""></option>
          <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option>
          <option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option>
          <option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
          <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option><option value="PR">PR</option>
          <option value="PE">PE</option><option value="PI">PI</option><option value="RJ">RJ</option><option value="RN">RN</option>
          <option value="RS">RS</option><option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
          <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
        </select>
      </div>

      <div class="field">
        <label for="inepEscola">Código INEP
          <span class="info-tip" tabindex="0" onclick="event.stopPropagation(); event.preventDefault(); document.querySelectorAll('.info-tip.open').forEach(o=>{ if(o!==this) o.classList.remove('open'); }); this.classList.toggle('open');">
            i
            <span class="info-tip-bubble">Código de identificação da escola, gerado pelo INEP. Se você não souber o INEP da sua escola, consulte no <a href="https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/inep-data/catalogo-de-escolas" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">site oficial do INEP</a>.</span>
          </span>
        </label>
        <input type="text" id="inepEscola" inputmode="numeric" maxlength="8" placeholder="Ex.: 12345678" required oninput="this.value=(this.value||'').replace(/\D+/g,'').slice(0,8)" pattern="\d{8}">
      </div>

      <div class="field">
        <label for="escudoArquivo">Escudo da escola
          <span class="info-tip" tabindex="0" onclick="event.stopPropagation(); event.preventDefault(); document.querySelectorAll('.info-tip.open').forEach(o=>{ if(o!==this) o.classList.remove('open'); }); this.classList.toggle('open');">
            i
            <span class="info-tip-bubble wide">Prefira imagens PNG sem fundo (transparente). Mesmo que os documentos exportados tenham fundo branco, outras páginas do sistema usam tons mais escuros, e um escudo com fundo visível pode destoar dessa identidade visual.</span>
          </span>
        </label>
        <input type="file" id="escudoArquivo" accept="image/*" onchange="previewEscudo(event)">
        <div class="preview">
          <img id="escudoPreview" alt="Escudo da escola" hidden onclick="abrirLightbox()" title="Clique para ampliar">
        </div>
      </div>

    </div>

    <div class="acoes">
      <button class="btn primary" type="button" onclick="salvarDados()">Salvar</button>
    </div>

  </div>
</main>

<!-- header-logic: monta header, tema, chip e auth guard -->
<script src="../header-logic.js"></script>

<!-- Guardas: (1) não-admin não edita; (2) admin sem escola ativa não cadastra nada -->
<script>
// Detecção única do guia (18.3): 'ADMIN' é só o marcador de "Todas as escolas", não uma escola
function _semEscola(){
  const sid = (window.Auth && Auth.getActiveSchoolId) ? Auth.getActiveSchoolId() : '';
  return !sid || String(sid).trim().toUpperCase() === 'ADMIN';
}

// Bloqueia campos e salvar; o aviso é informação necessária (.aviso-warn), não toast
function _bloquearPagina(textoAviso, idAviso, textoBalao) {
  // 1. Desabilita todos os campos e o botão salvar
  document.querySelectorAll('input, select, button, textarea').forEach(function (el) {
    el.disabled = true;
  });

  // 2. Balão nos dois controles de ação: input[type=file] e botão salvar
  document.querySelectorAll('input[type="file"], button.primary').forEach(function (el) {
    el.setAttribute('data-tooltip', textoBalao);
  });

  // 3. Aviso abaixo do título
  var titulo = document.querySelector('main .card h2');
  if (titulo && !(idAviso && document.getElementById(idAviso))) {
    var aviso = document.createElement('div');
    if (idAviso) aviso.id = idAviso;
    aviso.className = 'aviso-warn mb-16';
    aviso.textContent = textoAviso;
    titulo.insertAdjacentElement('afterend', aviso);
  }

  // 4. Garante que salvarDados() não execute mesmo se chamado por outro meio
  window.salvarDados = function () {
    console.warn('Acesso negado: página bloqueada (sem permissão ou sem escola ativa).');
  };

  // 5. Inicializa o balão após adicionar data-tooltip dinamicamente
  if (typeof initTooltipCards === 'function') initTooltipCards();
}

document.addEventListener('auth:ready', function () {
  var session = window.Auth && typeof Auth.getSession === 'function' ? Auth.getSession() : null;
  var role = session ? String(session.role || '').trim().toLowerCase() : '';

  // Não-admin: só leitura
  if (role !== 'admin') {
    _bloquearPagina('🔒 Somente administradores podem editar as informações da escola.', '', 'Sem acesso');
    return;
  }

  // Admin global sem escola escolhida: nada de escola pode ser cadastrado aqui
  if (_semEscola()) {
    _bloquearPagina('ℹ️ Escolha uma escola no topo da página para cadastrar os dados da escola.', 'avisoSemEscola', 'Escolha uma escola');
  }
});
</script>

<!-- Lightbox do escudo -->
<div id="lightbox" class="lightbox" hidden onclick="fecharLightbox()">
  <img id="lightboxImg" alt="Escudo da escola ampliado">
</div>

<script>
// ── Toasts (visual em components.css: .toast .toast-ok|err|warn|loading) ──
const _TOAST = {
  ok:      { cls:'toast-ok',      ms:2500 },
  err:     { cls:'toast-err',     ms:4500 },
  warn:    { cls:'toast-warn',    ms:4000 },
  loading: { cls:'toast-loading', ms:0 },       // 0 = sem expirar: fecha quando a operação termina
};
function _showToast(msg, tipo){
  const existing = document.getElementById('_toastGlobal');
  if(existing) existing.remove();
  const cfg = _TOAST[tipo] || _TOAST.warn;
  const toast = document.createElement('div');
  toast.id = '_toastGlobal';
  toast.className = 'toast ' + cfg.cls;
  toast.setAttribute('role', tipo === 'err' ? 'alert' : 'status');
  const span = document.createElement('span');
  span.className = 'toast-msg';
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'toast-close';
  btn.textContent = '✕';
  btn.setAttribute('aria-label','Fechar aviso');
  btn.onclick = () => toast.remove();
  toast.append(span, btn);
  document.body.appendChild(toast);
  if(cfg.ms) setTimeout(() => { if(toast.isConnected) toast.remove(); }, cfg.ms);
}
// só remove o "carregando": nunca apaga um sucesso/erro/aviso que apareceu no meio do caminho
function _toastLimpar(){
  const t = document.getElementById('_toastGlobal');
  if(t && t.classList.contains('toast-loading')) t.remove();
}
function _toastSucesso(m){ _showToast(m,'ok'); }
function _toastErro(m){ _showToast(m,'err'); }
function _toastAviso(m){ _showToast(m,'warn'); }
function _toastCarregando(m){ _showToast(m,'loading'); }

// Ponto de entrada único: setMsg(texto, kind) — ok | warn | loading | err
function setMsg(text, kind){
  const t = (text||"").toString();
  if(!t) return;
  if(kind === "err") _toastErro('⚠️ ' + t);
  else if(kind === "ok") _toastSucesso('✅ ' + t);
  else if(kind === "warn") _toastAviso('⚠️ ' + t);
  else if(kind === "loading") _toastCarregando('⏳ ' + t);
  else { console.warn('[toast] kind desconhecido:', JSON.stringify(kind)); _toastAviso(t); }
}

// Rede de segurança: promise sem catch com "carregando" aberto vira erro (não fica preso)
window.addEventListener('unhandledrejection', () => {
  const t = document.getElementById('_toastGlobal');
  if(t && t.classList.contains('toast-loading')) _toastErro('⚠️ Não foi possível concluir a operação.');
});

// Ícone(s) de dica (ⓘ) — fecha qualquer um aberto ao clicar fora.
document.addEventListener("click", function () {
  document.querySelectorAll(".info-tip.open").forEach(function (el) { el.classList.remove("open"); });
});

// Lightbox do escudo
function abrirLightbox() {
  var src = document.getElementById('escudoPreview').src;
  if (!src) return;
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').hidden = false;
  document.addEventListener('keydown', _lbKey);
}
function fecharLightbox() {
  document.getElementById('lightbox').hidden = true;
  document.removeEventListener('keydown', _lbKey);
}
function _lbKey(e) { if (e.key === 'Escape') fecharLightbox(); }
</script>

<!-- Lógica específica desta página -->
<script>
let escudoBase64 = null;

// schoolId e chave da escola gerenciados por Auth.getActiveSchoolId() via auth.firebase.js

function previewEscudo(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    escudoBase64 = reader.result; // data:image/...;base64,...
    const img = document.getElementById('escudoPreview');
    if(img){
      img.src = escudoBase64;
      img.hidden = false;
    }
  };
  reader.readAsDataURL(file);
}

async function salvarDados() {
  const nomeEl = document.getElementById('nomeEscola');
  const endEl  = document.getElementById('enderecoEscola');
  if (!nomeEl?.value?.trim() || !endEl?.value?.trim()) {
    setMsg('Preencha os campos obrigatórios.', 'err');
    return;
  }

  const cidadeEl = document.getElementById('cidadeEscola');
  const ufEl     = document.getElementById('ufEscola');
  const inepEl   = document.getElementById('inepEscola');

  const cidade = (cidadeEl?.value || '').trim();
  const uf = (ufEl?.value || '').toString().toUpperCase().slice(0,2);
  const inep = (inepEl?.value || '').replace(/\D+/g,'').slice(0,8);

  const dadosEscola = {
    nome: nomeEl.value.trim(),
    endereco: endEl.value.trim(),

    // usados no Histórico (com aliases para compatibilidade)
    cidade,
    municipio: cidade,
    uf,
    UF: uf,
    inep,
    codigoInep: inep,

    escudo: escudoBase64
  };

  // Salva no Firestore via DB.escola.save(); o "carregando" é substituído em todos os caminhos
  setMsg('Salvando…', 'loading');
  try {
    await DB.escola.save(dadosEscola);
    // Mantém também no localStorage como cache local (usado por historico_auto)
    try {
      const key = Auth.getActiveSchoolId
        ? `schools:${Auth.getActiveSchoolId()}:dadosEscola`
        : 'dadosEscola';
      localStorage.setItem(key, JSON.stringify(dadosEscola));
    } catch {}
    setMsg('Dados salvos com sucesso!', 'ok');     // substitui o azul
  } catch (err) {
    console.error('salvarDados:', err);
    setMsg('Erro ao salvar. Tente novamente.', 'err');   // substitui o azul
  }
}

function preencherFormEscola(escola) {
  const nomeEl   = document.getElementById('nomeEscola');
  const endEl    = document.getElementById('enderecoEscola');
  const cidadeEl = document.getElementById('cidadeEscola');
  const ufEl     = document.getElementById('ufEscola');
  const inepEl   = document.getElementById('inepEscola');

  if(nomeEl)   nomeEl.value   = escola.nome || '';
  if(endEl)    endEl.value    = escola.endereco || '';
  if(cidadeEl) cidadeEl.value = escola.cidade || escola.municipio || '';
  if(ufEl)     ufEl.value     = (escola.uf || escola.UF || escola.estado || '').toString().toUpperCase().slice(0,2);
  if(inepEl)   inepEl.value   = (escola.inep || escola.codigoInep || '').toString().replace(/\D+/g,'').slice(0,8);

  if(escola.escudo) {
    escudoBase64 = escola.escudo;
    const img = document.getElementById('escudoPreview');
    if(img){ img.src = escudoBase64; img.hidden = false; }
  }

  // INEP: somente números, máx 8 dígitos
  const inepEl2 = document.getElementById('inepEscola');
  if(inepEl2 && !inepEl2.__masked) {
    inepEl2.__masked = true;
    inepEl2.addEventListener('input', () => {
      inepEl2.value = (inepEl2.value || '').replace(/\D+/g,'').slice(0,8);
    });
  }
}

// Espera o Auth ficar pronto antes de ler o banco
function _authPronto(){
  return new Promise((resolve) => {
    if(window.Auth && Auth.getSession && Auth.getSession()) return resolve();   // sessão em cache
    if(window.Auth && Auth.onReady) return Auth.onReady(resolve);
    document.addEventListener('auth:ready', () => resolve(), { once: true });
  });
}

// Boot: tenta carregar do Firestore; cache do localStorage para UX rápida
async function init() {
  try {
    await _authPronto();

    // Sem escola ativa (admin em "Todas as escolas"): não carrega nada, o formulário fica vazio.
    // Sem toast de falha nem "nenhuma escola cadastrada": seriam enganosos (guia 18.3).
    if (_semEscola()) return;

    // 1. Cache do localStorage imediatamente
    try {
      const schoolId = window.Auth?.getActiveSchoolId?.() || '';
      const key = schoolId ? `schools:${schoolId}:dadosEscola` : 'dadosEscola';
      const cached = localStorage.getItem(key);
      if (cached) preencherFormEscola(JSON.parse(cached));
    } catch {}

    // 2. Dados frescos do Firestore
    try {
      const escola = await DB.escola.get();
      if (escola && Object.keys(escola).length) {
        preencherFormEscola(escola);
      }
    } catch(e) {
      console.warn('Erro ao carregar dados da escola do Firestore:', e);
    }
  } finally {
    // esconde o overlay mesmo se algo falhar (sem isso: loading infinito)
    try{ Loading.esconder(); }catch(_){}
  }
}
init().catch((e) => { console.error('init:', e); setMsg('Erro ao carregar a página.', 'err'); });

// Garante INEP numérico mesmo quando ainda não existe dados salvos
(function(){
  const el = document.getElementById('inepEscola');
  if(!el) return;
  el.addEventListener('input', () => {
    el.value = (el.value || '').replace(/\D+/g,'').slice(0,8);
  });
})();
</script>

<!-- Balão "Sem acesso" (hover nos controles desabilitados) -->
<script>
(function () {
  var bubble = null;

  function ensureBubble() {
    if (bubble) return bubble;
    bubble = document.createElement('span');
    bubble.className = 'sem-acesso-bubble';
    document.body.appendChild(bubble);
    return bubble;
  }

  function showTooltip(e) {
    var el = e.currentTarget;
    var b  = ensureBubble();
    var rect = el.getBoundingClientRect();
    b.textContent = el.getAttribute('data-tooltip');
    b.style.left = (rect.left + rect.width / 2) + 'px';
    b.style.top  = (rect.top - 8) + 'px';
    b.classList.add('show');
  }

  function hideTooltip() {
    if (bubble) bubble.classList.remove('show');
  }

  window.initTooltipCards = function () {
    document.querySelectorAll('[data-tooltip]').forEach(function (el) {
      if (el._tooltipBound) return;
      el._tooltipBound = true;
      el.addEventListener('mouseenter', showTooltip);
      el.addEventListener('mouseleave', hideTooltip);
    });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', window.initTooltipCards);
  } else {
    window.initTooltipCards();
  }
})();
</script>
