<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="../icon.png" type="image/png"/>

<script>
(function(){
  var saved = (localStorage.getItem('ui_theme_v1') || '').toLowerCase();
  var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<!-- Firebase / Auth / DB -->
<script src="../auth.firebase.js"></script>
<script src="../db.firebase.js"></script>
<script src="../theme-colors.js"></script>
<!-- Sem loading-overlay.js de propósito: nesta página ele travava carregando pra sempre. -->

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pesquisa.css">

<style>
:root {
  --card-bg:             #ffffff;
  --card-border:         var(--brand-border, #ddd6fe);
  --field-bg:            #ffffff;
  --field-border:        var(--brand-border, #ddd6fe);
  --shadow:              0 4px 20px rgba(0,0,0,0.06);
  --danger:              #b91c1c;
  --chip-neutral-bg:     #f3f4f6;
  --chip-neutral-border: #d1d5db;
  --chip-neutral-color:  #4b5563;
}
html[data-theme="dark"] {
  --card-bg:             #131c2e;
  --card-border:         #2a3a5c;
  --field-bg:            #0a1426;
  --field-border:        #1e2540;
  --shadow:              0 4px 24px rgba(0,0,0,0.4);
  --chip-neutral-bg:     rgba(148,163,184,0.15);
  --chip-neutral-border: rgba(148,163,184,0.3);
  --chip-neutral-color:  #cbd5e1;
}

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 10px; padding: 8px 14px;
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px;
  border: 1.5px solid transparent; cursor: pointer;
  transition: background 0.18s, border-color 0.18s, color 0.18s, box-shadow 0.18s, opacity 0.18s;
  white-space: nowrap;
}
.btn:active { opacity: 0.85; }
.btn:not(.primary):not(.ghost):not(.secondary):not(.danger) {
  background: var(--chip-bg); border-color: var(--card-border); color: var(--chip-color);
}
.btn:not(.primary):not(.ghost):not(.secondary):not(.danger):hover {
  background: var(--brand-faded); border-color: var(--brand-hover); color: var(--brand-text);
}
html[data-theme="dark"] .btn:not(.primary):not(.ghost):not(.secondary):not(.danger) {
  background: rgba(148,163,184,0.10); border-color: rgba(148,163,184,0.25); color: #cbd5e1;
}
html[data-theme="dark"] .btn.primary { background: var(--brand-d); border-color: var(--brand-d); color: #fff; }
.btn.ghost       { background: var(--chip-bg); border-color: var(--card-border); color: var(--chip-color); }
.btn.ghost:hover { background: var(--brand-faded); border-color: var(--brand-hover); color: var(--brand-text); }
.btn.secondary       { background: var(--chip-bg); border-color: var(--card-border); color: var(--chip-color); }
.btn.secondary:hover { background: var(--brand-faded); border-color: var(--brand-hover); color: var(--brand-text); }
.btn.danger          { background: rgba(185,28,28,0.10); border-color: rgba(185,28,28,0.30); color: #b91c1c; }
.btn.danger:hover    { background: rgba(185,28,28,0.18); border-color: rgba(185,28,28,0.55); }
.btn.small { padding: 6px 11px; font-size: 12px; }

#sidebarTitulo { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
#sidebarTitulo:hover { opacity: 0.75; }
#sortIndicator { font-size: 11px; opacity: 0.6; }

.layout-expandido #card-esquerda .list-item .item-meta { display: none !important; }

#container.split.layout-normal { align-items: stretch; }
#container.split.layout-normal #card-esquerda,
#container.split.layout-normal #card-direita { align-self: stretch; }

#card-esquerda .list-item:not(.selected):hover {
  background: color-mix(in srgb, var(--primary) 8%, transparent);
  cursor: pointer;
}

.aluno-search-checkbox {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; user-select: none;
}
.aluno-search-checkbox input { cursor: pointer; accent-color: var(--brand); }

/* Lista simples de alunos no detalhe da turma */
.aluno-item{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); font-size:13px; }
.aluno-item:last-child{ border-bottom:none; }
.aluno-item .aluno-num{ color:var(--muted); font-size:12px; width:24px; text-align:right; flex-shrink:0; }
.aluno-item .aluno-nome{ flex:1; }

.status-msg{ font-size:13px; margin-top:8px; min-height:18px; }
.status-msg.ok{ color:#16a34a; }
.status-msg.err{ color:#dc2626; }
.hidden{ display:none !important; }
</style>

<title>Pesquisa de Notas Trimestrais</title>
</head>

<body>

<div id="header-placeholder"></div>

<div class="wrap">

  <!-- Filtros -->
  <div class="card">
    <p class="section-title">Filtros</p>
    <div class="filters">
      <div class="field">
        <label>Ano letivo</label>
        <select id="fAno"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label>Série</label>
        <input id="fSerie" type="text" placeholder="Ex: 5º ano">
      </div>
      <div class="field">
        <label>Busca geral</label>
        <input id="fBusca" type="text" placeholder="Procura por turma ou aluno...">
      </div>
    </div>
    <div class="filter-actions">
      <button class="btn primary" id="btnPesquisar" type="button">🔍 Pesquisar</button>
      <span class="muted">Ou pesquise vazio para ver todos os registros.</span>
    </div>
    <div class="muted" style="margin-top:10px;">
      Banco: <b id="dbInfo">carregando...</b>
    </div>
  </div>

  <!-- Pesquisa por aluno -->
  <div class="card">
    <p class="section-title">Pesquisa por aluno</p>
    <div class="aluno-search-row">
      <div class="field">
        <label>Nome do aluno</label>
        <input id="alunoQuery" type="text" placeholder="Ex: José da Silva">
      </div>
      <div class="aluno-search-actions">
        <label class="aluno-search-checkbox">
          <input type="checkbox" id="alunoParcial" checked>
          Buscar por parte do nome
        </label>
        <button class="btn primary" type="button" onclick="pesquisarAluno()">Pesquisar</button>
        <button class="btn secondary" type="button" onclick="limparPesquisaAluno()">Limpar</button>
      </div>
    </div>
    <div id="alunoResultados"></div>
  </div>

  <!-- Split: registros + detalhes -->
  <div id="container" class="split layout-normal">

    <div id="card-esquerda" class="card">
      <p class="section-title" id="sidebarTitulo" title="Clique para ordenar">TURMAS <span id="sortIndicator">↑</span></p>
      <div id="listaRegistros" class="list">
        <div class="list-item"><span class="muted">Nenhum registro carregado.</span></div>
      </div>
    </div>

    <div id="card-direita" class="card">
      <p class="section-title">Detalhes</p>

      <div id="detalhesVazio" class="muted">Selecione uma turma na lista para ver os alunos.</div>

      <div id="detalhesBox" style="display:none;">
        <div class="muted" id="detalhesMeta"></div>

        <div class="detalhe-actions">
          <input id="fAluno" type="text" placeholder="Filtrar aluno por nome...">
          <a class="btn" id="btnEditarNotas" href="#">✏️ Editar turma</a>
          <button class="btn danger small" type="button" onclick="excluirTurmaSelecionada()">🗑️ Excluir turma</button>
          <button class="btn secondary small" type="button" onclick="fecharRegistro()" style="margin-left:auto;">✕ Fechar</button>
        </div>

        <div class="summary" id="resumoTurma"></div>

        <ul class="list" id="listaAlunos" style="margin-top:10px;"></ul>

      </div><!-- /detalhesBox -->
    </div><!-- /card-direita -->

  </div><!-- /split -->

</div><!-- /wrap -->

<script src="../header-logic.js"></script>

<script>
const $ = (id) => document.getElementById(id);
function normStr(v){ return String(v ?? "").trim(); }
function norm(v) {
  return String(v ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

/* =========================
   Acesso à coleção notasTrimestrais (Firestore, definida em db.firebase.js)
========================= */
function getNotasCollection() {
  if (!window.DB || !window.DB.notasTrimestrais) {
    throw new Error("window.DB.notasTrimestrais não existe. Confirme se a linha foi adicionada em db.firebase.js.");
  }
  return window.DB.notasTrimestrais;
}

/* =========================
   Estado
========================= */
let registros = [];       // todos os docs de notasTrimestrais
let registroSelecionado = null;
let alunosView = [];
let _jaFoiPesquisado = false;
let _ordemAsc = false;

/* =========================
   Filtros / listagem
========================= */
function preencherFiltroAno(lista) {
  const sel = $("fAno");
  const anos = Array.from(new Set(lista.map(r => String(r.ano || "").trim()).filter(Boolean)))
    .sort((a,b)=>b.localeCompare(a,'pt-BR'));
  const atual = sel.value;
  sel.innerHTML = `<option value="">Todos</option>` + anos.map(a => `<option value="${a}">${a}</option>`).join("");
  sel.value = anos.includes(atual) ? atual : "";
}

function ordenarRegistros(lista) {
  return lista.slice().sort((a, b) => {
    const anoA = String(a.ano || ''), anoB = String(b.ano || '');
    const cmp = _ordemAsc ? anoA.localeCompare(anoB,'pt-BR') : anoB.localeCompare(anoA,'pt-BR');
    if (cmp !== 0) return cmp;
    return String(a.turmaNome||'').localeCompare(String(b.turmaNome||''), 'pt-BR');
  });
}

function renderListaRegistros(lista) {
  const box = $("listaRegistros");
  box.innerHTML = "";
  if (!lista.length) {
    box.innerHTML = `<div class="list-item"><span class="muted">Nenhum registro encontrado com os filtros.</span></div>`;
    return;
  }
  lista.forEach(r => {
    const div = document.createElement("div");
    div.className = "list-item";
    div.dataset.id = r._id;
    div.addEventListener("click", () => selecionarRegistro(r._id));

    const anoTxt = r.ano ? String(r.ano) : "?";
    const qtdAlunos = (r.alunos?.length ?? 0) + " aluno(s)";

    div.innerHTML = `
      <div class="left">
        <div><b>${r.turmaNome || "Turma sem nome"}</b></div>
        <div class="badges-row">
          <span class="badge">${anoTxt}</span>
          <span class="badge badge-serie">${r.serie || "?"}</span>
        </div>
        <div class="muted item-meta">${qtdAlunos}</div>
      </div>
      <div class="right" onclick="event.stopPropagation()">
        <button class="btn primary small" type="button" onclick="selecionarRegistro('${r._id}')">Abrir</button>
      </div>
    `;
    box.appendChild(div);
  });
}

function aplicarFiltros() {
  const fAno = normStr($("fAno").value);
  const fSerie = norm($("fSerie").value);
  const fBusca = norm($("fBusca").value);

  let lista = registros.slice();
  if (fAno) lista = lista.filter(r => String(r.ano || "").trim() === fAno);
  if (fSerie) lista = lista.filter(r => norm(r.serie || "").includes(fSerie));
  if (fBusca) {
    lista = lista.filter(r => {
      const base = norm(r.turmaNome||"") + " " + norm(r.serie||"") + " " + norm(r.ano||"");
      if (base.includes(fBusca)) return true;
      return (r.alunos||[]).some(a => norm(a.nome).includes(fBusca));
    });
  }
  renderListaRegistros(ordenarRegistros(lista));
}

/* =========================
   Selecionar / fechar registro
========================= */
function selecionarRegistro(id) {
  registroSelecionado = registros.find(r => r._id === id) || null;

  $("detalhesVazio").style.display = registroSelecionado ? "none" : "block";
  $("detalhesBox").style.display = registroSelecionado ? "block" : "none";
  if (!registroSelecionado) return;

  $("detalhesMeta").innerHTML =
    `<b>${registroSelecionado.turmaNome || "Turma"}</b><br>` +
    `Ano: <b>${registroSelecionado.ano || "?"}</b> · Série: <b>${registroSelecionado.serie || "?"}</b>`;

  $("btnEditarNotas").href = `notas-trimestrais.html?edit=${encodeURIComponent(registroSelecionado._id)}`;
  alunosView = (registroSelecionado.alunos || []).slice()
    .sort((a,b) => String(a.nome||"").localeCompare(String(b.nome||""), "pt-BR"));

  renderListaAlunos(alunosView);
  renderResumoTurma(registroSelecionado);

  $("fAluno").value = "";
  $("fAluno").oninput = () => {
    const q = norm($("fAluno").value);
    renderListaAlunos(alunosView.filter(a => norm(a.nome).includes(q)));
  };

  const container = $("container");
  container.classList.remove("layout-normal");
  container.classList.add("layout-expandido");

  document.querySelectorAll("#listaRegistros .list-item").forEach(el => {
    el.classList.toggle("selected", el.dataset.id === id);
  });
}

function fecharRegistro() {
  registroSelecionado = null;
  $("detalhesVazio").style.display = "block";
  $("detalhesBox").style.display = "none";

  const container = $("container");
  container.classList.remove("layout-expandido");
  container.classList.add("layout-normal");

  document.querySelectorAll("#listaRegistros .list-item").forEach(el => el.classList.remove("selected"));
}

async function excluirTurmaSelecionada() {
  if (!registroSelecionado) return;
  const nome = registroSelecionado.turmaNome || "esta turma";
  const qtdAlunos = (registroSelecionado.alunos || []).length;

  const confirmado = confirm(
    `Excluir "${nome}" (${registroSelecionado.ano || "?"}) e TODOS os ${qtdAlunos} aluno(s) dela?\n\n` +
    `Essa ação não pode ser desfeita.`
  );
  if (!confirmado) return;

  try {
    await getNotasCollection().remove(registroSelecionado._id);
    registros = registros.filter(r => r._id !== registroSelecionado._id);
    fecharRegistro();
    if (_jaFoiPesquisado) aplicarFiltros();
    $("dbInfo").textContent = `${registros.length} turma(s) — clique em Pesquisar para exibir`;
  } catch (e) {
    console.error(e);
    alert("❌ Erro ao excluir: " + (e.message || e));
  }
}

/* =========================
   Lista de alunos da turma (sem notas — pesquisa é só pra achar/identificar)
========================= */
function renderListaAlunos(lista) {
  const box = $("listaAlunos");
  if (!lista.length) {
    box.innerHTML = `<li class="aluno-item"><span class="muted">Nenhum aluno encontrado.</span></li>`;
    return;
  }
  box.innerHTML = lista.map((a, i) => `
    <li class="aluno-item">
      <span class="aluno-num">${i+1}.</span>
      <span class="aluno-nome">${a.nome || "(sem nome)"}</span>
    </li>
  `).join("");
}

function renderResumoTurma(r) {
  const alunos = r.alunos || [];
  $("resumoTurma").textContent = `${alunos.length} aluno(s) cadastrado(s) nesta turma.`;
}

/* =========================
   Pesquisa por aluno
========================= */
function limparPesquisaAluno(){
  $("alunoQuery").value = "";
  $("alunoResultados").innerHTML = "";
}
function escapeHtml(s){
  return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function pesquisarAluno(){
  const termo = norm($("alunoQuery").value);
  const parcial = $("alunoParcial").checked;
  const out = $("alunoResultados");
  if (!termo) { alert("Digite o nome do aluno."); return; }

  const achados = [];
  for (const r of registros) {
    for (const a of (r.alunos||[])) {
      const nomeA = norm(a?.nome);
      if (!nomeA) continue;
      const ok = parcial ? nomeA.includes(termo) : nomeA === termo;
      if (!ok) continue;
      achados.push({ aluno: a.nome, ano: r.ano||"", serie: r.serie||a.serie||"", id: r._id, turma: r.turmaNome||"" });
    }
  }
  if (!achados.length) {
    out.innerHTML = `<div class="aluno-not-found">Nenhuma ocorrência encontrada para <b>${escapeHtml($("alunoQuery").value)}</b>.</div>`;
    return;
  }
  achados.sort((x,y)=>{
    const ax = parseInt(x.ano,10)||0, ay = parseInt(y.ano,10)||0;
    if (ax!==ay) return ax-ay;
    return String(x.serie).localeCompare(String(y.serie),"pt-BR");
  });
  out.innerHTML = achados.map(h => `
    <div class="aluno-result-row">
      <div class="aluno-result-info">
        <div><b>${escapeHtml(h.ano||"?")}</b> — ${escapeHtml(h.serie||"?")} — ${escapeHtml(h.turma)} — <span style="font-weight:700;">${escapeHtml(h.aluno)}</span></div>
      </div>
      <div class="aluno-result-actions">
        <button class="btn ghost small" type="button" onclick="selecionarRegistro('${h.id}')">Abrir</button>
      </div>
    </div>
  `).join("");
}
document.addEventListener("DOMContentLoaded", () => {
  $("alunoQuery").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); pesquisarAluno(); }
  });
});

/* =========================
   Boot
========================= */
async function carregar() {

  await new Promise(res=>{
    if (window.Auth && window.Auth.getSession && window.Auth.getSession()) return res();
    document.addEventListener('auth:ready', res, { once:true });
  });

  try {
    registros = await getNotasCollection().list();
  } catch (e) {
    console.error(e);
    $("dbInfo").textContent = "erro ao carregar (" + (e.message || e) + ")";
    return;
  }

  $("dbInfo").textContent = `${registros.length} turma(s) — clique em Pesquisar para exibir`;
  preencherFiltroAno(registros);

  $("listaRegistros").innerHTML = `<div class="list-item"><span class="muted">Clique em <b>🔍 Pesquisar</b> para carregar as turmas.</span></div>`;
  $("detalhesVazio").style.display = "block";
  $("detalhesBox").style.display = "none";

  $("btnPesquisar").onclick = () => { _jaFoiPesquisado = true; aplicarFiltros(); };
  $("fAno").onchange   = () => { if (_jaFoiPesquisado) aplicarFiltros(); };
  $("fSerie").oninput  = () => { if (_jaFoiPesquisado) aplicarFiltros(); };
  $("fBusca").oninput  = () => { if (_jaFoiPesquisado) aplicarFiltros(); };

  $("sidebarTitulo").addEventListener("click", () => {
    _ordemAsc = !_ordemAsc;
    $("sortIndicator").textContent = _ordemAsc ? "↓" : "↑";
    if (_jaFoiPesquisado) aplicarFiltros();
  });
}
document.addEventListener("DOMContentLoaded", carregar);
</script>

</body>
</html>
