<div class="l-bar"></div>

<header class="app-header">
  <div class="app-header-inner">
    <div class="brand">
      <div class="mark">EJC</div>
      <div>
        <div class="brand-title">
          Sistema Escolar
          <span class="v-badge">v3</span>
        </div>
        <div class="brand-sub">// gestão escolar interna</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="header-context" id="headerContext"></div>

      <a class="btn-back" id="headerBtnBack" href="#" onclick="history.back();return false;" title="Voltar" aria-label="Voltar">
        <span class="b-icon">←</span><span class="b-label">Voltar</span>
      </a>

      <a class="btn-home" id="headerBtnHome" href="/index.html" title="Início" aria-label="Início">
        <span class="b-icon">🏠</span><span class="b-label">Início</span>
      </a>

      <button class="theme-toggle" id="themeToggle" type="button">
        <span id="themeIcon">🌙</span><span id="themeText">Escuro</span>
      </button>
      <button class="theme-toggle-compact" id="themeToggleCompact" type="button" title="Alternar tema">
        <span id="themeIconCompact">🌙</span>
      </button>

      <!-- ≤768px: abre o painel com escola, usuário e tema (o painel é o #headerContext, via CSS) -->
      <button class="menu-toggle" id="headerMenuBtn" type="button" title="Menu" aria-label="Menu"
              aria-haspopup="true" aria-expanded="false" aria-controls="headerContext">
        <span aria-hidden="true">☰</span>
      </button>
    </div>
  </div>
</header>
