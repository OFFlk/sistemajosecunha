/* Sigla desta página: pr (nenhuma variável própria é necessária). */

/* ── Layout ── */
.wrap { max-width: 720px; margin: 0 auto; padding: 44px 28px 52px; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 18px; }
.wrap > .card { --card-pad-y: 24px; --card-pad-x: 28px; --card-gap: 0; }   /* o espaço entre cards é o gap do .wrap */
.wrap > .card > .section-title { margin: 0 0 20px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.reauth { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.reauth .field { margin-bottom: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ── Seletor de cor (card recolhível: cabeçalho com pré-visualização) ── */
.cor-preview { display: flex; align-items: center; gap: 6px; }
.cor-swatch { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ui-border); flex-shrink: 0; }
.cor-label { font-size: 12px; font-weight: 700; color: var(--ui-muted); }
.color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding-top: 4px; }
.color-option { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; border-radius: 12px; padding: 10px 6px; border: 2px solid transparent; background: transparent; font-family: inherit; transition: border-color 0.18s, background 0.18s; }
.color-option:hover { background: var(--ui-chip-bg); }
.color-option.active { border-color: var(--ui-brand); background: var(--ui-chip-bg); }
.color-swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--ui-border); transition: transform 0.15s; }
.color-option:hover .color-swatch { transform: scale(1.08); }
.color-option.active .color-swatch { transform: scale(1.12); }
.color-label { font-size: 10px; font-weight: 700; color: var(--ui-muted); text-align: center; line-height: 1.2; }
.color-option.active .color-label { color: var(--ui-brand-text); }

/* ── Foto de perfil (bloco próprio da página, sobre o card de destaque) ── */
.avatar-section { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.avatar-ring { width: 80px; height: 80px; border-radius: 999px; border: 3px solid var(--dest-btn-bd); background: var(--ui-cell-bg); display: grid; place-items: center; font-size: 32px; overflow: hidden; flex: 0 0 auto; position: relative; cursor: pointer; transition: border-color 0.2s; }
.avatar-ring:hover { border-color: var(--dest-fg); }
.avatar-ring img { width: 100%; height: 100%; object-fit: cover; border-radius: 999px; }
.avatar-ring .avatar-overlay { position: absolute; inset: 0; border-radius: 999px; background: rgba(0,0,0,0.45); display: grid; place-items: center; opacity: 0; transition: opacity 0.2s; color: #fff; font-size: 14px; font-weight: 800; }
.avatar-ring:hover .avatar-overlay { opacity: 1; }
.avatar-info { flex: 1; min-width: 180px; }
.upload-progress { height: 4px; border-radius: 999px; background: var(--dest-btn-bd); overflow: hidden; margin-top: 8px; }
.upload-bar { height: 100%; background: var(--dest-fg); width: 0%; transition: width 0.3s; }
</style>

<!-- SCRIPT — Helpers padrão do sistema (toast, modal de confirmação, ⓘ, card recolhível) -->
<script>
// ── Toasts (visual em components.css: .toast .toast-ok|err|warn|loading) ──
const _TOAST = {
  ok:      { cls:'toast-ok',      ms:2500 },
  err:     { cls:'toast-err',     ms:4500 },
  warn:    { cls:'toast-warn',    ms:4000 },
  loading: { cls:'toast-loading', ms:0 },
};
function _showToast(msg, tipo){
  const existing = document.getElementById('_toastGlobal');
  if(existing) existing.remove();
  const cfg = _TOAST[tipo] || _TOAST.warn;
  const toast = document.createElement('div');
  toast.id = '_toastGlobal';
  toast.className = 'toast ' + cfg.cls;
  toast.setAttribute('role', tipo === 'err' ? 'alert' : 'status');
  const span = document.createElement('span');
  span.className = 'toast-msg';
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'toast-close';
  btn.textContent = '✕';
  btn.setAttribute('aria-label','Fechar aviso');
  btn.onclick = () => toast.remove();
  toast.append(span, btn);
  document.body.appendChild(toast);
  if(cfg.ms) setTimeout(() => { if(toast.isConnected) toast.remove(); }, cfg.ms);
}
function _toastLimpar(){
  const t = document.getElementById('_toastGlobal');
  if(t && t.classList.contains('toast-loading')) t.remove();
}
function _toastSucesso(m){ _showToast(m,'ok'); }
function _toastErro(m){ _showToast(m,'err'); }
function _toastAviso(m){ _showToast(m,'warn'); }
function _toastCarregando(m){ _showToast(m,'loading'); }

function setMsg(text, kind){
  const t = (text||"").toString();
  if(!t) return;
  if(kind === "err") _toastErro('⚠️ ' + t);
  else if(kind === "ok") _toastSucesso('✅ ' + t);
  else if(kind === "warn") _toastAviso('⚠️ ' + t);
  else if(kind === "loading") _toastCarregando('⏳ ' + t);
  else { console.warn('[toast] kind desconhecido:', JSON.stringify(kind)); _toastAviso(t); }
}

// ── Modal de confirmação (substitui confirm()) ──
function _escHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function _confirmModal({ titulo, corpo, corDestaque, textoConfirmar, textoCancelar, digitar }){
  return new Promise((resolve) => {
    const perigo = corDestaque === 'danger';
    const positivo = corDestaque === 'ok';
    const variante = perigo ? ' perigo' : positivo ? ' ok' : '';
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop open';
    backdrop.innerHTML =
      `<div class="cm-box" role="${perigo ? 'alertdialog' : 'dialog'}" aria-modal="true">`+
        `<h3 class="cm-titulo${variante}">${_escHtml(titulo || 'Confirmar ação')}</h3>`+
        `<p class="cm-corpo">${corpo || ''}</p>`+
        (digitar ? `<input type="text" class="cm-input" id="_confirmModalInput" autocomplete="off" placeholder="${_escHtml(digitar)}">` : '')+
        `<div class="cm-acoes">`+
          `<button type="button" class="btn secondary" id="_confirmModalCancelar">${_escHtml(textoCancelar || 'Cancelar')}</button>`+
          `<button type="button" class="cm-ok${variante}" id="_confirmModalOk"${digitar ? ' disabled' : ''}>${_escHtml(textoConfirmar || 'Continuar')}</button>`+
        `</div>`+
      `</div>`;
    document.body.appendChild(backdrop);
    const ok = backdrop.querySelector('#_confirmModalOk');
    const cancelar = backdrop.querySelector('#_confirmModalCancelar');
    const input = backdrop.querySelector('#_confirmModalInput');
    function fechar(r){ document.removeEventListener('keydown', onKey, true); backdrop.remove(); resolve(r); }
    function onKey(ev){ if(ev.key === 'Escape'){ ev.stopPropagation(); fechar(false); } }
    document.addEventListener('keydown', onKey, true);
    ok.addEventListener('click', () => fechar(true));
    cancelar.addEventListener('click', () => fechar(false));
    backdrop.addEventListener('click', (ev) => { if(ev.target === backdrop) fechar(false); });
    if(input) input.addEventListener('input', () => { ok.disabled = (input.value !== digitar); });
    cancelar.focus();
  });
}

// ── Tooltip ⓘ: clique fora fecha ──
document.addEventListener("click", ()=>{
  document.querySelectorAll(".info-tip.open").forEach(el => el.classList.remove("open"));
});

// ── Card recolhível ──
function toggleSec(id){
  const body = document.getElementById(id);
  const tog  = document.getElementById('tog' + id.charAt(0).toUpperCase() + id.slice(1));
  if(!body) return;
  const col = body.classList.toggle('collapsed');
  if(tog){ tog.classList.toggle('collapsed', col); tog.setAttribute('aria-expanded', String(!col)); }
  const hdr = body.previousElementSibling;
  if(hdr) hdr.classList.toggle('fechada', col);
}
// Aberto: só a seta recolhe. Fechado: o cabeçalho inteiro abre.
function secHeaderClick(id, ev){
  const body = document.getElementById(id);
  if(!body) return;
  const fechado = body.classList.contains('collapsed');
  if(fechado || (ev && ev.target && ev.target.closest && ev.target.closest('.sec-toggle'))) toggleSec(id);
}
</script>

<!-- SCRIPT — Seletor de cor (exclusivo desta página) -->
<script>
(function(){
  function corDaPaleta(palette){ return (palette && palette['--brand']) || 'var(--ui-brand)'; }

  function updateHeader(key) {
    const palette = window.ThemeColors && ThemeColors.palettes[key];
    if (!palette) return;
    const swatch = document.getElementById('colorActiveSwatch');
    const label  = document.getElementById('colorActiveLabel');
    if (swatch) swatch.style.background = corDaPaleta(palette);   // valor dinâmico: pode ficar inline
    if (label)  label.textContent = palette.label;
  }

  function buildColorGrid(){
    const grid = document.getElementById('colorGrid');
    if (!grid || !window.ThemeColors) return;

    const current = ThemeColors.get();
    grid.innerHTML = '';

    Object.entries(ThemeColors.palettes).forEach(([key, palette]) => {
      const opt = document.createElement('button');
      opt.type = 'button';
      opt.className = 'color-option' + (key === current ? ' active' : '');
      opt.dataset.key = key;
      opt.innerHTML = `
        <div class="color-swatch" style="background:${corDaPaleta(palette)};"></div>
        <div class="color-label">${_escHtml(palette.label)}</div>
      `;
      opt.addEventListener('click', function(){
        ThemeColors.apply(key);
        grid.querySelectorAll('.color-option').forEach(el => el.classList.remove('active'));
        opt.classList.add('active');
        updateHeader(key);
        setMsg('Cor "' + palette.label + '" aplicada!', 'ok');
      });
      grid.appendChild(opt);
    });

    updateHeader(current);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', buildColorGrid);
  } else {
    buildColorGrid();
  }
})();
</script>

<!-- SCRIPT — Lógica do perfil (exclusiva desta página) -->
<script>
(function(){
  const $ = (id) => document.getElementById(id);

  function getFirebaseUser(){
    return window.Auth && window.Auth.auth ? window.Auth.auth.currentUser : null;
  }

  // Espera o Auth terminar de iniciar (Firebase carregado, perfil lido, usuário restaurado).
  // Aqui NÃO basta getSession(): ele responde do cache antes de Auth.db e auth.currentUser existirem.
  // O limite de tempo evita loading infinito se o Firebase não carregar.
  function _authPronto(ms){
    return new Promise((resolve, reject) => {
      if(!window.Auth || !Auth.onReady) return reject(new Error('Auth indisponível.'));
      const t = setTimeout(() => reject(new Error('Tempo esgotado ao iniciar a sessão.')), ms || 15000);
      Auth.onReady(() => { clearTimeout(t); resolve(); });
    });
  }

  // Mensagens amigáveis para os códigos de erro do Firebase Auth
  function _erroAuth(e){
    switch(e && e.code){
      case 'auth/wrong-password':
      case 'auth/invalid-credential':
      case 'auth/invalid-login-credentials': return 'Senha atual incorreta.';
      case 'auth/too-many-requests':         return 'Muitas tentativas. Aguarde um pouco e tente de novo.';
      case 'auth/email-already-in-use':      return 'Este email já está em uso.';
      case 'auth/invalid-email':             return 'Email inválido.';
      case 'auth/weak-password':             return 'Senha muito fraca. Use ao menos 6 caracteres.';
      case 'auth/requires-recent-login':     return 'Por segurança, saia e entre de novo antes de fazer essa alteração.';
      case 'auth/network-request-failed':    return 'Sem conexão. Verifique a internet e tente de novo.';
      default: return 'Erro: ' + ((e && e.message) || e);
    }
  }

  // Conta que entra só com Google não tem senha para trocar nem para confirmar
  function _temSenha(u){
    return (u.providerData || []).some(p => p.providerId === 'password');
  }
  const MSG_SEM_SENHA = 'Sua conta entra com o Google: o email e a senha são gerenciados por lá.';

  // Depois de salvar, recarrega a sessão para o chip do header refletir nome/foto novos.
  // (refreshSession já dispara auth:sessionChanged; o dispatch só entra se ela falhar.)
  async function _atualizarSessao(){
    try{ await Auth.refreshSession(); }
    catch(e){
      console.warn('perfil: refreshSession', e);
      document.dispatchEvent(new Event('auth:sessionChanged'));
    }
  }

  async function compressImage(file, maxSize, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(e){
        const img = new Image();
        img.onerror = reject;
        img.onload = function(){
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if(w > h){ if(w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; } }
          else      { if(h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; } }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';            // JPEG não tem transparência: sem isso o PNG transparente ficava preto
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality || 0.82));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Desenha o círculo da foto (imagem ou emoji) + overlay "Trocar"
  const ring = $('avatarRing');
  function montarAnel(src){
    ring.textContent = '';
    if(src){
      const img = document.createElement('img');
      img.alt = 'Foto de perfil';
      img.onerror = () => montarAnel(null);
      img.src = src;
      ring.appendChild(img);
    } else {
      const emoji = document.createElement('span');
      emoji.id = 'avatarEmoji';
      emoji.textContent = '👤';
      ring.appendChild(emoji);
    }
    const ov = document.createElement('div');
    ov.className = 'avatar-overlay';
    ov.textContent = '📷 Trocar';
    ring.appendChild(ov);
  }

  async function loadProfile(){
    const u = getFirebaseUser();
    if(!u) return;                         // sem login: o auth guard do header redireciona
    const s = Auth.getSession() || {};
    // O nome vem da sessão (users/{uid}.name): contas criadas pelo admin não têm displayName no Firebase Auth
    $('inputName').value  = s.displayName || u.displayName || '';
    $('inputEmail').value = u.email || '';
    try{
      // Lê o documento só para saber se há foto SALVA (a sessão também cai na foto do Google)
      const snap = await Auth.db.collection('users').doc(u.uid).get();
      const photoURL = snap.exists ? (snap.data().photoURL || null) : null;
      if(photoURL){
        montarAnel(photoURL);
        $('btnRemoveAvatar').hidden = false;
      }
    } catch(e){ console.warn('perfil: erro ao carregar avatar', e); }
  }

  async function reauth(password){
    const u = getFirebaseUser();
    const cred = firebase.auth.EmailAuthProvider.credential(u.email, password);
    await u.reauthenticateWithCredential(cred);
  }

  // Avatar
  const avatarInput = $('avatarInput');
  $('btnPickAvatar').addEventListener('click', () => avatarInput.click());
  ring.addEventListener('click', () => avatarInput.click());

  avatarInput.addEventListener('change', async function(){
    const file = this.files[0];
    if(!file) return;
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)){ setMsg('Formato não aceito. Use JPG, PNG ou WEBP.','err'); this.value = ''; return; }
    if(file.size > 5 * 1024 * 1024){ setMsg('Arquivo muito grande. Máximo: 5 MB.','err'); this.value = ''; return; }
    const u = getFirebaseUser();
    if(!u){ setMsg('Usuário não autenticado.','err'); this.value = ''; return; }
    const progress = $('uploadProgress');
    const bar = $('uploadBar');
    progress.hidden = false; bar.style.width = '10%';
    try{
      const base64 = await compressImage(file, 160, 0.82);
      bar.style.width = '50%';
      await Auth.updateProfile({ photoURL: base64 });     // Firestore + sessão em cache
      bar.style.width = '100%';
      montarAnel(base64);
      $('btnRemoveAvatar').hidden = false;
      setMsg('Foto atualizada com sucesso!','ok');
      await _atualizarSessao();
    } catch(e){
      console.error('perfil: atualizar foto', e);
      setMsg('Erro: '+(e.message||e),'err');
    } finally {
      progress.hidden = true;
      this.value = '';
    }
  });

  $('btnRemoveAvatar').addEventListener('click', async function(){
    const sim = await _confirmModal({
      titulo: 'Remover foto de perfil?',
      corpo: 'A foto atual será removida do seu perfil.',
      corDestaque: 'danger',
      textoConfirmar: 'Remover'
    });
    if(!sim) return;
    if(!getFirebaseUser()) return;
    this.disabled = true;
    try{
      await Auth.updateProfile({ photoURL: null });
      montarAnel(null);
      this.hidden = true;
      setMsg('Foto removida.','ok');
      await _atualizarSessao();            // antes a sessão ficava com a foto antiga até recarregar a página
    } catch(e){
      console.error('perfil: remover foto', e);
      setMsg('Erro ao remover: '+(e.message||e),'err');
    } finally {
      this.disabled = false;
    }
  });

  // Nome
  $('btnSaveName').addEventListener('click', async function(){
    const name = $('inputName').value.trim();
    if(!name){ setMsg('Informe um nome.','err'); return; }
    const u = getFirebaseUser();
    if(!u){ setMsg('Usuário não autenticado.','err'); return; }
    const atual = ((Auth.getSession() || {}).displayName || u.displayName || '').trim();
    if(name === atual){ setMsg('O nome não foi alterado.','warn'); return; }
    this.disabled = true;
    try{
      await Auth.updateProfile({ name });                  // Firestore (fonte do nome) + sessão
      await u.updateProfile({ displayName: name });        // Firebase Auth
      setMsg('Nome atualizado!','ok');
      await _atualizarSessao();            // antes o chip do header ficava com o nome antigo
    } catch(e){
      console.error('perfil: salvar nome', e);
      setMsg('Erro: '+(e.message||e),'err');
    } finally {
      this.disabled = false;
    }
  });

  // Email
  $('inputEmail').addEventListener('focus', function(){
    $('reauthEmailBox').hidden = false;
  });
  $('btnSaveEmail').addEventListener('click', async function(){
    const u = getFirebaseUser();
    if(!u){ setMsg('Usuário não autenticado.','err'); return; }
    if(!_temSenha(u)){ setMsg(MSG_SEM_SENHA,'warn'); return; }
    const email = $('inputEmail').value.trim().toLowerCase();
    const pass  = $('reauthPassEmail').value;
    if(!email){ setMsg('Informe um email.','err'); return; }
    if(email === (u.email || '').toLowerCase()){ setMsg('Esse já é o seu email atual.','warn'); return; }
    if(!pass){ setMsg('Confirme sua senha atual antes de trocar o email.','err'); return; }
    this.disabled = true;
    try{
      await reauth(pass);
      await u.verifyBeforeUpdateEmail(email);
      setMsg('Link de verificação enviado para '+email+'. Após confirmar, o email será atualizado.','ok');
      $('reauthPassEmail').value = '';
      $('inputEmail').value = u.email || '';
      $('reauthEmailBox').hidden = true;
    } catch(e){
      console.error('perfil: salvar email', e);
      setMsg(_erroAuth(e),'err');
    } finally {
      this.disabled = false;
    }
  });

  // Senha
  $('inputPassNew').addEventListener('focus', function(){
    $('reauthPassBox').hidden = false;
  });
  $('btnSavePass').addEventListener('click', async function(){
    const u = getFirebaseUser();
    if(!u){ setMsg('Usuário não autenticado.','err'); return; }
    if(!_temSenha(u)){ setMsg(MSG_SEM_SENHA,'warn'); return; }
    const current = $('reauthPassCurrent').value;
    const newPass = $('inputPassNew').value;
    const confirmacao = $('inputPassConfirm').value;
    if(!current){ setMsg('Informe sua senha atual.','err'); return; }
    if(newPass.length < 6){ setMsg('A nova senha deve ter pelo menos 6 caracteres.','err'); return; }
    if(newPass !== confirmacao){ setMsg('As senhas não coincidem.','err'); return; }
    if(newPass === current){ setMsg('A nova senha deve ser diferente da atual.','err'); return; }
    this.disabled = true;
    try{
      await reauth(current);
      await u.updatePassword(newPass);
      setMsg('Senha alterada com sucesso!','ok');
      $('reauthPassCurrent').value = '';
      $('inputPassNew').value = '';
      $('inputPassConfirm').value = '';
      $('reauthPassBox').hidden = true;
    } catch(e){
      console.error('perfil: alterar senha', e);
      setMsg(_erroAuth(e),'err');
    } finally {
      this.disabled = false;
    }
  });

  // Boot (seção 18.1): o finally esconde o overlay e ajusta o contraste mesmo se algo falhar
  async function init(){
    try{
      await _authPronto();
      await loadProfile();
    } finally {
      try{ if(window.ThemeColors && typeof ThemeColors.ajustarContraste === 'function') ThemeColors.ajustarContraste(); }
      catch(e){ console.warn('ajustarContraste:', e); }
      try{ Loading.esconder(); }catch(_){}
    }
  }
  init().catch((e) => { console.error('init:', e); setMsg('Erro ao carregar a página.', 'err'); });
})();
</script>

</body>
</html>
